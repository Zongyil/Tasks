function getTodayString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function parseTime(timeStr) {
    if(!timeStr) return 0;
    let [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
}

function escapeTaskTimerHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);
}

function createTaskStatusContext(_cachedMapping, _cachedLists) {
    const mapping = _cachedMapping || JSON.parse(localStorage.getItem('alpha_task_mapping') || '{}');
    const lists = _cachedLists || JSON.parse(localStorage.getItem('taskhub_lists') || '[]');
    const now = new Date();
    return {
        mapping,
        listById: new Map(lists.map(list => [list.id, list])),
        today: getTodayString(),
        nowMins: now.getHours() * 60 + now.getMinutes()
    };
}

function getTaskStatus(task, _cachedMapping, _cachedLists, _statusContext) {
    const context = _statusContext || createTaskStatusContext(_cachedMapping, _cachedLists);
    const alpha_task_mapping = context.mapping;
    
    let mappedListIds = alpha_task_mapping[task.id];
    let listIds = Array.isArray(mappedListIds)
        ? mappedListIds
        : (mappedListIds ? [mappedListIds] : ['default']);
    listIds = [...new Set(listIds.filter(Boolean))];
    if (!listIds.length) listIds = ['default'];
    let deadline = '无截止日期';
    let listName = '默认';
    let listIcon = '';

    const listMeta = listIds.map((listId, index) => {
        const matchedList = context.listById.get(listId);
        const name = matchedList?.name || (listId === 'default' ? '默认' : `表单 ${index + 1}`);
        let icon = matchedList?.emoji || matchedList?.icon || matchedList?.symbol || '';
        if (!icon) {
            const emojiMatch = name.match(/\p{Extended_Pictographic}/u);
            icon = emojiMatch ? emojiMatch[0] : (listId === 'default' || name === '默认' ? '📁' : '');
        }
        return { id: listId, name, icon, deadline: matchedList?.deadline || '无截止日期' };
    });

    let list = context.listById.get(listIds[0]);
    if (list) {
        deadline = list.deadline || '无截止日期';
        listName = list.name || '默认';
        listIcon = list.emoji || list.icon || list.symbol || '';
    } else if (listMeta[0]) {
        deadline = listMeta[0].deadline;
        listName = listMeta[0].name;
        listIcon = listMeta[0].icon;
    }

    if (!listIcon) {
        const emojiMatch = listName.match(/\p{Extended_Pictographic}/u);
        listIcon = emojiMatch ? emojiMatch[0] : (listName === '默认' ? '📁' : '');
    }

    const today = context.today;
    const nowMins = context.nowMins;

    let state = {
        label: '未指定', class: 'badge-other', isCurrent: false,
        listName: listName, listIcon: listIcon, listMeta: listMeta
    };

    if (task.start && task.end) {
        let sMins = parseTime(task.start);
        let eMins = parseTime(task.end);
        
        if (deadline !== '无截止日期' && deadline < today) {
            state.label = '超时'; state.class = 'badge-expired';
        } else if (deadline !== '无截止日期' && deadline > today) {
            state.label = '未开始'; state.class = 'badge-unfinished';
        } else {
            if (nowMins >= sMins && nowMins <= eMins) {
                state.label = '进行中'; state.class = 'badge-progress'; state.isCurrent = true;
            } else if (nowMins > eMins) {
                state.label = '超时'; state.class = 'badge-expired';
            } else {
                state.label = '未开始'; state.class = 'badge-unfinished';
            }
        }
    } else {
        if (deadline !== '无截止日期' && deadline < today) {
            state.label = '超时'; state.class = 'badge-expired';
        } else if (deadline !== '无截止日期' && deadline > today) {
            state.label = '未开始'; state.class = 'badge-unfinished';
        } else {
            state.label = '未指定'; state.class = 'badge-other';
        }
    }
    const statusVisual = {
        'badge-other': {
            className: 'status-unspecified',
            icon: 'circle-slash',
            svg: '<circle cx="12" cy="12" r="10"/><path d="m9 15 6-6"/>'
        },
        'badge-expired': {
            className: 'status-overdue',
            icon: 'clock-alert',
            svg: '<path d="M12 6v6l4 2"/><path d="M16 21.16a10 10 0 1 1 5-13.516"/><path d="M20 11.5v6"/><path d="M20 21.5v.01"/>'
        },
        'badge-progress': {
            className: 'status-progress',
            icon: 'clock-check',
            svg: '<path d="M12 6v6l4 2"/><path d="M16 21.16a10 10 0 1 1 5-13.516"/><path d="m17 18 2 2 4-4"/>'
        },
        'badge-unfinished': {
            className: 'status-not-started',
            icon: 'clock-fading',
            svg: '<path d="M12 2a10 10 0 0 1 7.38 16.75"/><path d="M12 6v6l4 2"/><path d="M2.5 12a9.5 9.5 0 0 1 .42-2.8"/><path d="M4.05 6.14A10 10 0 0 1 6.2 4.15"/><path d="M8.4 2.68A10 10 0 0 1 12 2"/>'
        }
    }[state.class];

    state.statusClass = statusVisual.className;
    state.statusIcon = statusVisual.icon;
    state.statusSvg = statusVisual.svg;
    return state;
}

const hubRenderedCards = new Map();
let hubEmptyMarkup = null;

function commitHubTaskCards(cards, emptyMarkup = '') {
    if (!cards.length) {
        if (hubEmptyMarkup === emptyMarkup && hubTaskList.childElementCount) return false;
        hubTaskList.innerHTML = emptyMarkup;
        hubRenderedCards.clear();
        hubEmptyMarkup = emptyMarkup;
        return true;
    }
    hubEmptyMarkup = null;
    let changed = false;
    const nextCards = new Map();
    let cursor = hubTaskList.firstElementChild;
    for (const { key, html } of cards) {
        const previous = hubRenderedCards.get(key);
        let node;
        if (previous && previous.html === html && previous.node.parentNode === hubTaskList) {
            node = previous.node;
        } else {
            const template = document.createElement('template');
            template.innerHTML = html;
            node = template.content.firstElementChild;
        }
        if (node !== cursor) {
            hubTaskList.insertBefore(node, cursor);
            changed = true;
        } else {
            cursor = cursor.nextElementSibling;
        }
        nextCards.set(key, { node, html });
    }
    // Nodes before cursor now exactly match the requested order.
    while (cursor) {
        const next = cursor.nextElementSibling;
        cursor.remove();
        cursor = next;
        changed = true;
    }
    hubRenderedCards.clear();
    nextCards.forEach((value, key) => hubRenderedCards.set(key, value));
    return changed;
}

function renderHubTasks() {
    let thData = [];
    try { thData = JSON.parse(localStorage.getItem(TASKHUB_KEY) || "[]"); } catch(e) {}
    
    const uncompletedTasks = thData.filter(t => !t.isCompleted);
    const cachedMapping = JSON.parse(localStorage.getItem('alpha_task_mapping') || '{}');
    const cachedLists = JSON.parse(localStorage.getItem('taskhub_lists') || '[]');
    const statusContext = createTaskStatusContext(cachedMapping, cachedLists);

    if (uncompletedTasks.length === 0) {
        const emptyChanged = commitHubTaskCards([], `
            <div class="empty-state" style="animation: alphaCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;">
                <div class="icon"><img src="./icons/Bubbles.png" alt="bubbles" style="width: 75px; height: 75px; object-fit: contain; vertical-align: middle; opacity: 0.85;"></div>
                <div class="title">暂无同步待办</div>
                <div class="desc">前往 TaskHub 规划你的一天吧</div>
            </div>`);
        if (!emptyChanged) return;
        invalidateYellowContactCache();
        scheduleHubPostRender();
        return;
    }

    const renderedCards = [];
    const seenTaskIds = new Set();
    uncompletedTasks.forEach((task, index) => {
        let status = getTaskStatus(task, cachedMapping, cachedLists, statusContext);
        let activeClass = (currentHubTaskId === task.id) ? 'active-select' : '';
        const listMeta = Array.isArray(status.listMeta) && status.listMeta.length
            ? status.listMeta
            : [{ name: status.listName, icon: status.listIcon }];
        const safeListNames = listMeta.map(item => escapeTaskTimerHtml(item.name));
        const listCount = listMeta.length;
        const safeListLabel = listCount > 1
            ? `${safeListNames[0]} <span style="font-weight: 500; opacity: 0.75; letter-spacing: 0.5px;">等 ${listCount} 个表单</span>`
            : safeListNames[0];
        const safeListTooltip = `表单: ${safeListNames.join('、')}`;
        const emojiItems = listMeta
            .map(item => escapeTaskTimerHtml(item.icon))
            .filter(Boolean)
            .slice(0, 5);
        const formIconHtml = emojiItems.length
            ? `<span class="timer-task-form-emojis" aria-hidden="true">${emojiItems.map((icon, iconIndex) => {
                const underlay = iconIndex > 0
                    ? `<span class="timer-task-form-emoji-underlay"><span>${emojiItems[iconIndex - 1]}</span></span>`
                    : '';
                return `<span class="timer-task-form-emoji">${underlay}<span class="timer-task-form-emoji-glyph">${icon}</span></span>`;
            }).join('')}</span>`
            : `<span class="timer-task-form-emojis" aria-hidden="true"><span class="timer-task-form-emoji"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg></span></span>`;
        const safeTaskName = escapeTaskTimerHtml(task.name);
        
        let durationValue = task.duration || null;
        if (!durationValue && task.start && task.end) {
            durationValue = parseTime(task.end) - parseTime(task.start);
            if (durationValue <= 0) durationValue += 1440;
        }
        
        let subjectArray = Array.isArray(task.subject) ? task.subject : (task.subject ? [task.subject] : []);
        if (!subjectArray.length) subjectArray = ['未分类'];
        let subjectTags = subjectArray.map(cat => {
            const hex = getSubjectColor(cat);
            return `<div class="glass-tag" style="background: linear-gradient(135deg, ${hex}80, ${hex}20); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 6px 12px ${hex}60, inset 0 1.5px 2px rgba(255, 255, 255, 0.95), inset 0 -1.5px 3px ${hex}40;">${escapeTaskTimerHtml(cat)}</div>`;
        }).join("");
        
        const priority = task.priority === 'High' ? 'High' : (task.priority === 'Low' ? 'Low' : 'Medium');
        const priorityMeta = {
            High: {
                label: '高', className: 'priority-high', icon: 'zap',
                svg: '<path d="M4 14a1 1 0 0 1-.78-1.63l9-11A.5.5 0 0 1 13 1.7l-1.76 6.32A1 1 0 0 0 12.2 9.3h7.6a1 1 0 0 1 .78 1.63l-9 11a.5.5 0 0 1-.87-.33l1.76-6.32A1 1 0 0 0 11.5 14z"/>'
            },
            Medium: {
                label: '中', className: 'priority-medium', icon: 'send-horizontal',
                svg: '<path d="m3 3 3 9-3 9 19-9Z"/><path d="M6 12h16"/>'
            },
            Low: {
                label: '低', className: 'priority-low', icon: 'circle-dashed',
                svg: '<path d="M12 2a10 10 0 0 1 10 10" stroke-dasharray="4 4"/><path d="M12 22a10 10 0 0 1-10-10" stroke-dasharray="4 4"/><path d="M12 2a10 10 0 0 0-10 10" stroke-dasharray="4 4"/><path d="M12 22a10 10 0 0 0 10-10" stroke-dasharray="4 4"/>'
            }
        }[priority];

        const cardHtml = `
            <div class="task-card-wrap" style="animation-delay: ${index * 0.06}s;">
                <div class="task-card ${activeClass}" id="hub-card-${task.id}" data-task-id="${task.id}">
                    <div class="timer-task-corner-light" aria-hidden="true"></div>
                    <div class="timer-task-main">
                        <div class="timer-task-header">
                            <div class="timer-task-title marquee-container">
                                <span>${safeTaskName}</span>
                            </div>
                            <div class="timer-task-status ${status.statusClass}" title="${escapeTaskTimerHtml(status.label)}" aria-label="任务状态: ${escapeTaskTimerHtml(status.label)}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-${status.statusIcon}" aria-hidden="true">${status.statusSvg}</svg>
                                <span>${escapeTaskTimerHtml(status.label)}</span>
                            </div>
                        </div>

                        <div class="timer-task-info">
                            <div class="timer-task-priority task-importance-row" data-priority="${priority}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pin" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3.5V2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1.5"/><path d="M16 3.5a2 2 0 0 1 1.5 3.3L15 10.3v2.2l1.3 1.3a1 1 0 0 1-.7 1.7H8.4a1 1 0 0 1-.7-1.7L9 12.5v-2.2L6.5 6.8A2 2 0 0 1 8 3.5Z"/></svg>
                                <span class="task-priority-label">${priorityMeta.label}</span>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-${priorityMeta.icon} task-priority-icon ${priorityMeta.className}" aria-label="${priorityMeta.label}优先级">${priorityMeta.svg}</svg>
                            </div>

                            <div class="timer-task-secondary-row">
                                <div class="timer-task-info-row">
                                    <div class="timer-task-info-item">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                        ${task.start && task.end ? `<span class="timer-task-value">${task.start}<span class="faded-slash">~</span>${task.end}</span>` : '<span class="timer-task-value" style="font-size: 15px;">待定</span>'}
                                    </div>
                                    <div class="timer-task-info-item">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-timer" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>
                                        ${durationValue ? `<span class="timer-task-value">${durationValue}<span class="timer-task-duration-unit">分钟</span></span>` : '<span class="timer-task-value" style="font-size: 15px;">待定</span>'}
                                    </div>
                                </div>

                                <div class="timer-task-corner-meta">
                                    <div class="timer-task-folder" title="${safeListTooltip}">
                                        ${formIconHtml}
                                        <span>${safeListLabel}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="timer-task-subjects">${subjectTags}</div>
                    </div>
                </div>
            </div>
        `;
        // Use occurrence keys so even legacy duplicate IDs retain every card.
        const idKey = String(task.id);
        let key = idKey;
        while (seenTaskIds.has(key)) key += '\u0000';
        seenTaskIds.add(key);
        renderedCards.push({ key, html: cardHtml });
    });

    if (!commitHubTaskCards(renderedCards)) return;
    invalidateYellowContactCache();
    scheduleHubPostRender();
}

window.selectHubTask = function(taskId) {
    let thData = JSON.parse(localStorage.getItem(TASKHUB_KEY) || "[]");
    const task = thData.find(t => t.id === taskId);
    if(!task) return;
    
    if (currentHubTaskId === taskId) {
        currentHubTaskId = null;
        const activeCard = document.querySelector('.task-card.active-select');
        if (activeCard) activeCard.classList.remove('active-select');
        taskNameInput.value = '';
        customCategoryInput.value = '';
        clearSubjectSelection();
        targetMinutesInput.value = '25';
        
        document.getElementById('splitCount').value = '';
        checkSplitStatus(); 
        return;
    }
    const previouslySelectedCard = currentHubTaskId
        ? document.getElementById(`hub-card-${currentHubTaskId}`)
        : document.querySelector('.task-card.active-select');
    currentHubTaskId = task.id;
    taskNameInput.value = task.name;

    if (previouslySelectedCard) previouslySelectedCard.classList.remove('active-select');
    const targetCard = document.getElementById(`hub-card-${taskId}`);
    if (targetCard) {
        targetCard.classList.add('active-select');
    }

    clearSubjectSelection();
    customCategoryInput.value = '';
    
    let unmatched = [];
    task.subject.forEach(sub => {
        let cb = _subjectCheckboxByValue.get(sub);
        if(cb) cb.checked = true;
        else unmatched.push(sub);
    });
    if (unmatched.length > 0) customCategoryInput.value = unmatched.join('+');

    if (task.start && task.end) {
        document.getElementById('modeDown').checked = true;
        isCountdown = true;
        durationField.classList.remove('hidden', 'closing');
        
        let startMins = parseTime(task.start);
        let endMins = parseTime(task.end);
        let duration = endMins - startMins;
        if(duration <= 0) duration += 1440; 
        
        targetMinutesInput.value = duration;
    } else {

hubTaskList.addEventListener('pointerdown', (event) => {
    if (event.pointerType === 'mouse' && event.button !== 0) return;

    const card = event.target.closest('.task-card');
    if (!card || !hubTaskList.contains(card)) return;

    _pressingCard = card;
    _pressingTaskId = card.dataset.taskId || null;
    card.classList.add('is-pressing');
});

hubTaskList.addEventListener('pointerout', (event) => {
    const card = event.target.closest('.task-card');
    if (!card || !card.classList.contains('is-pressing') || card.contains(event.relatedTarget)) {
        return;
    }
    // 鼠标按住但已移出卡片: 取消按压, 不触发选中
    card.classList.remove('is-pressing');
    if (_pressingCard === card) {
        _pressingCard = null;
        _pressingTaskId = null;
    }
});

const finishPressAndSelect = (event) => {
    // 绝大多数 pointerup 来自输入框、按钮或空白区域；没有卡片按压时直接返回。
    if (!_pressingCard) return;

    // 取得松手时命中的卡片
    const releasedCard = event.target ? event.target.closest('.task-card') : null;

    // 如果在同一张卡片上松手, 原子性地完成: 移除 is-pressing → 添加选中 + 弹跳
    if (_pressingCard && releasedCard === _pressingCard && _pressingTaskId) {
        _pressingCard.classList.remove('is-pressing');
        selectHubTask(_pressingTaskId);
    } else {
        // 不在同一张卡片上松手, 仅清除按压状态
        if (_pressingCard) _pressingCard.classList.remove('is-pressing');
    }

    _pressingCard = null;
    _pressingTaskId = null;
};

   [04.5. TASKHUB HEARTBEAT & REAL-TIME SYNC ENGINE]

(function initTaskTimerSyncEngine() {
    window.__alphaLastTaskHubSign = localStorage.getItem(TASKHUB_KEY);
    window.__alphaLastTaskHubListsSign = localStorage.getItem('taskhub_lists');
    window.__alphaLastTaskMappingSign = localStorage.getItem('alpha_task_mapping');
    window.__alphaLastTimerSyncActionSign = localStorage.getItem('tasktimer_sync_action');

    function alphaAutoSyncEngine() {
        if (document.hidden) return; // 标签页后台运行时挂起轮询, 极大降低 CPU/内存消耗

        const currentHubSign = localStorage.getItem(TASKHUB_KEY);
        const currentListsSign = localStorage.getItem('taskhub_lists');
        const currentMappingSign = localStorage.getItem('alpha_task_mapping');
        const currentActionSign = localStorage.getItem('tasktimer_sync_action');

        let shouldRefresh = false;

        if (currentHubSign !== window.__alphaLastTaskHubSign ||
            currentListsSign !== window.__alphaLastTaskHubListsSign ||
            currentMappingSign !== window.__alphaLastTaskMappingSign) {
            
            window.__alphaLastTaskHubSign = currentHubSign;
            window.__alphaLastTaskHubListsSign = currentListsSign;
            window.__alphaLastTaskMappingSign = currentMappingSign;
            shouldRefresh = true;
        }

        if (currentActionSign !== window.__alphaLastTimerSyncActionSign) {
            window.__alphaLastTimerSyncActionSign = currentActionSign;
            if (currentActionSign) {
                try {
                    const actionObj = JSON.parse(currentActionSign);
                    if (actionObj && actionObj.action === 'FORCE_STOP') {
                        if (currentHubTaskId === actionObj.taskId) {
                            if (typeof isRunning !== 'undefined' && !isRunning) {
                                selectHubTask(actionObj.taskId);
                            }
                        }
                    }
                } catch(e) {}
            }
            shouldRefresh = true;
        }

        if (shouldRefresh) {
            try {
                // 如果当前选中的 TaskHub 任务在 TaskHub 中被删除或标记完成, 及时清除选中状态与输入框
                if (currentHubTaskId && typeof isRunning !== 'undefined' && !isRunning) {
                    let thData = JSON.parse(currentHubSign || "[]");
                    let stillExists = thData.some(t => t.id === currentHubTaskId && !t.isCompleted);
                    if (!stillExists) {
                        currentHubTaskId = null;
                        if (taskNameInput) taskNameInput.value = '';
                        if (customCategoryInput) customCategoryInput.value = '';
                        clearSubjectSelection();
                        if (targetMinutesInput) targetMinutesInput.value = '25';
                        const splitEl = document.getElementById('splitCount');
                        if (splitEl) splitEl.value = '';
                        if (typeof checkSplitStatus === 'function') checkSplitStatus();
                    }
                }
                if (typeof renderHubTasks === 'function') {
                    renderHubTasks();
                }
            } catch (err) {
                console.error("TaskTimer 跨标签心跳掉帧, 已自动拦截安全降级", err);
            }
        }
    }

    // 轨道 1: 同源广播监听 (跨标签页/窗口修改时即刻触发)
    window.addEventListener('storage', (e) => {
        if (e.key === TASKHUB_KEY || e.key === 'taskhub_lists' || e.key === 'alpha_task_mapping' || e.key === 'tasktimer_sync_action') {
            alphaAutoSyncEngine();
        }
    });

    // 轨道 2: 视窗焦点与可见性唤醒
    window.addEventListener('focus', alphaAutoSyncEngine);
    let alphaSyncIntervalId = 0;
    let isTabSleeping = false;

    function configureAlphaSyncFallback() {
        if (alphaSyncIntervalId) {
            clearInterval(alphaSyncIntervalId);
            alphaSyncIntervalId = 0;
        }

        // 仅 file:// 需要轮询兜底, HTTP/HTTPS 依靠 storage、focus 与可见性事件
        if (location.protocol === 'file:' && !document.hidden && !isTabSleeping) {
            alphaSyncIntervalId = setInterval(alphaAutoSyncEngine, 4000);
        }
    }

    window.addEventListener('AlphaSleep', () => {
        isTabSleeping = true;
        configureAlphaSyncFallback();
    });

    window.addEventListener('AlphaWake', () => {
        isTabSleeping = false;
        alphaAutoSyncEngine();
        configureAlphaSyncFallback();
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !isTabSleeping) alphaAutoSyncEngine();
        configureAlphaSyncFallback();
    });

    // 轨道 3: 仅为本地 file:// 协议启用 4 秒心跳兜底
    configureAlphaSyncFallback();
})();

   [06. LAYOUT RESIZER & FORM INTERACTIONS]
   ========================================================================== */
(function initResizer() {
    const resizer = document.getElementById('glassResizer');
    const layout = document.getElementById('setupLayout');
    if (!resizer || !layout) return;

    resizer.addEventListener('pointerdown', (e) => {
        e.preventDefault(); 
        layout.classList.add('resizing-active');
        resizer.classList.add('dragging');
        resizer.setPointerCapture(e.pointerId);

        const rect = layout.getBoundingClientRect();
        const minWidth = 320;
        let latestClientX = e.clientX;
        let resizeFrame = 0;

        const applyResize = () => {
            resizeFrame = 0;
            let newX = latestClientX - rect.left;

            if (newX < minWidth) newX = minWidth;
            if (newX > rect.width - minWidth) newX = rect.width - minWidth;

            const leftRatio = newX / rect.width;
            const rightRatio = 1 - leftRatio;

            layout.style.setProperty('--left-ratio', `${leftRatio}fr`);
            layout.style.setProperty('--right-ratio', `${rightRatio}fr`);
        };

        const onMove = (moveEvent) => {
            latestClientX = moveEvent.clientX;
            if (!resizeFrame) resizeFrame = requestAnimationFrame(applyResize);
        };

        const onUp = (upEvent) => {
            latestClientX = upEvent.clientX;
            if (resizeFrame) cancelAnimationFrame(resizeFrame);
            applyResize();
            layout.classList.remove('resizing-active');
            resizer.classList.remove('dragging');
            resizer.releasePointerCapture(e.pointerId);

            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
    });
})();

function switchTimerView(targetView, updateDom, onComplete) {
    const isReduceMotion = (typeof localStorage !== 'undefined' && localStorage.getItem('alpha_reduce_motion') === 'true') ||
        (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    
    if (window.isStandalonePipMode || isReduceMotion || typeof document.startViewTransition !== 'function') {
        updateDom();
        if (typeof onComplete === 'function') onComplete();
        return;
    }

    try {
        const transition = document.startViewTransition(() => {
            updateDom();
        });
        if (transition && transition.finished) {
            transition.finished.finally(() => {
                if (typeof onComplete === 'function') onComplete();
            });
        } else {
            if (typeof onComplete === 'function') onComplete();
        }
    } catch (_) {
        updateDom();
        if (typeof onComplete === 'function') onComplete();
    }
}

        <div style="margin-top: 16px; padding: 12px; background: rgba(227, 96, 93, 0.08); border-radius: var(--radius-element); border: 1px solid rgba(227, 96, 93, 0.3); box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.30);">
            <span id="overtimeDisplay" style="color: var(--monet-danger-text); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums;">已超时 ${m} 分 ${s} 秒</span>
        </div>
    `;

    customAlert(baseMsg + overtimeHtml, "专注完成", "Congratulations", () => {
        stopAlarm();
        if (overtimeInterval) {
            clearInterval(overtimeInterval);
            overtimeInterval = null;
        }
    });

    overtimeInterval = setInterval(() => {
        if (timerTargetEndTime) {
            overtimeSeconds = Math.max(0, Math.floor((Date.now() - timerTargetEndTime) / 1000));
        } else {
            overtimeSeconds++;
        }
        const display = document.getElementById('overtimeDisplay');
        if (display) {
            const curM = Math.floor(overtimeSeconds / 60);
            const curS = overtimeSeconds % 60;
            display.textContent = `已超时 ${curM} 分 ${curS} 秒`;
        }
    }, 1000);
}

// Resume the existing frame chain only when it has actually stopped.
// Wall-clock timestamps remain authoritative; animation cadence is unchanged.
function ensureTimerFrame() {
    if (isRunning && !animationFrameId && typeof window.alphaUpdateFrame === 'function') {
        animationFrameId = reqFrame(window.alphaUpdateFrame);
    }
}

function syncTimerState() {
    const now = Date.now();
    const circumference = 892;

    if (!isRunning) {
        if (isFinishedTriggered && timerTargetEndTime) {
            overtimeSeconds = Math.max(0, Math.floor((now - timerTargetEndTime) / 1000));
            const display = document.getElementById('overtimeDisplay');
            if (display) {
                const m = Math.floor(overtimeSeconds / 60);
                const s = overtimeSeconds % 60;
                display.textContent = `已超时 ${m} 分 ${s} 秒`;
            }
        }
        return;
    }

    if (isCountdown) {
        if (timerTargetEndTime && now >= timerTargetEndTime) {
            triggerCountdownFinished();
            return;
        }

        if (timerTargetEndTime) {
            currentTimerMs = timerTargetEndTime - now;
            secondsElapsed = Math.ceil(currentTimerMs / 1000);
            renderTimerDigits(secondsElapsed);
            const ratio = currentTimerMs / totalTargetMs;
            const offset = circumference - (circumference * ratio);
            setTimerRingOffset(offset);
            timerCircleWrapEl.classList.toggle('danger-ring', currentTimerMs <= 10000);
        }
    } else {
        if (timerSessionStart) {
            currentTimerMs = timerBaseElapsedMs + (now - timerSessionStart);
            secondsElapsed = Math.floor(currentTimerMs / 1000);
            renderTimerDigits(secondsElapsed);
            const msPart = currentTimerMs % 1000;
            const centisecond = Math.floor(msPart / 10);
            msDisplayEl.textContent = `.${String(centisecond).padStart(2, '0')} ms`;

            const loopMs = currentTimerMs % 60000;
            let offset;
            if (currentTimerMs >= 60000 && loopMs < 500) {
                const progress = loopMs / 500;
                const ease = 1 - Math.pow(1 - progress, 3);
                offset = circumference * ease;
            } else {
                const ratio = loopMs / 60000;
                offset = circumference - (circumference * ratio);
            }
            setTimerRingOffset(offset);
        }
    }

    // 唤醒或解锁后重新连接 60fps 渲染循环
    ensureTimerFrame();
}
window.alphaResumeTimer = syncTimerState;

function onPageBackground() {
    // 当窗口隐藏或锁屏时，暂停前端高刷 rAF 渲染，避免后台持续计算与绘制消耗 CPU
    if (animationFrameId) {
        cancelFrame(animationFrameId);
        animationFrameId = null;
    }
    // 确保倒计时具有精准的高精度后台闹铃定时器
    if (isRunning && isCountdown && timerTargetEndTime) {
        if (targetEndTimeout) clearTimeout(targetEndTimeout);
        const rem = Math.max(0, timerTargetEndTime - Date.now());
        targetEndTimeout = setTimeout(() => {
            triggerCountdownFinished();
        }, rem);
    }
}

function startTimer() {
    isRunning = true;
    safePauseBtn.innerHTML = TIMER_PAUSE_SVG;
    safePauseBtn.classList.remove('is-paused');
    safePauseBtn.title = "暂停";
    safePauseBtn.setAttribute('aria-label', "暂停");
    timeDisplayEl.classList.remove('timer-paused-blink');

    lastFrameTime = Date.now();
    const circumference = 892;
    let lastRenderedSeconds = -1;
    let lastRenderedCentisecond = -1;
    let dangerState = timerCircleWrapEl.classList.contains('danger-ring');

    if (isCountdown) {
        if (!timerTargetEndTime || timerRemainingMs !== null) {
            timerTargetEndTime = Date.now() + (timerRemainingMs !== null ? timerRemainingMs : (currentTimerMs || totalTargetMs));
            timerRemainingMs = null;
        }
        if (targetEndTimeout) clearTimeout(targetEndTimeout);
        const remainingToAlarm = Math.max(0, timerTargetEndTime - Date.now());
        targetEndTimeout = setTimeout(() => {
            triggerCountdownFinished();
        }, remainingToAlarm);
    } else {
        if (!timerSessionStart) {
            timerSessionStart = Date.now();
        }
    }

    if (window.alphaBackgroundTimer) clearInterval(window.alphaBackgroundTimer);
    window.alphaBackgroundTimer = null;

    // 低频心跳监控器（500ms），在遮挡、最小化或锁屏唤醒时检测时间漂移或倒计时完成
    // Count-up has no alarm deadline to monitor; it recovers from timestamps.
    // Keep the original 500 ms fallback for countdown alarms.
    if (isCountdown) window.alphaBackgroundTimer = setInterval(() => {
        if (!isRunning) {
            if (window.alphaBackgroundTimer) {
                clearInterval(window.alphaBackgroundTimer);
                window.alphaBackgroundTimer = null;
            }
            return;
        }
        if (isCountdown) {
            if (timerTargetEndTime && Date.now() >= timerTargetEndTime) {
                triggerCountdownFinished();
            }
        }
    }, 500);

    function updateFrame() {
        animationFrameId = null;
        if (!isRunning) return;
        const now = Date.now();

        if (isCountdown) {
            if (now >= timerTargetEndTime) {
                currentTimerMs = 0;
                secondsElapsed = 0;
                overtimeSeconds = Math.max(0, Math.floor((now - timerTargetEndTime) / 1000));
                triggerCountdownFinished();
                return;
            }

            currentTimerMs = timerTargetEndTime - now;
            secondsElapsed = Math.ceil(currentTimerMs / 1000);
            if (secondsElapsed !== lastRenderedSeconds) {
                renderTimerDigits(secondsElapsed);
                lastRenderedSeconds = secondsElapsed;
            }

            const ratio = currentTimerMs / totalTargetMs;
            const offset = circumference - (circumference * ratio);
            setTimerRingOffset(offset);

            const nextDangerState = currentTimerMs <= 10000;
            if (nextDangerState !== dangerState) {
                dangerState = nextDangerState;
                timerCircleWrapEl.classList.toggle('danger-ring', dangerState);
            }
        } else {
            currentTimerMs = timerBaseElapsedMs + (now - timerSessionStart);
            secondsElapsed = Math.floor(currentTimerMs / 1000);
            
            if (secondsElapsed !== lastRenderedSeconds) {
                renderTimerDigits(secondsElapsed);
                lastRenderedSeconds = secondsElapsed;
            }

            const msPart = currentTimerMs % 1000;
            const centisecond = Math.floor(msPart / 10);
            if (centisecond !== lastRenderedCentisecond) {
                lastRenderedCentisecond = centisecond;
                msDisplayEl.textContent = `.${String(centisecond).padStart(2, '0')} ms`;
            }

            const loopMs = currentTimerMs % 60000;
            let offset;
            if (currentTimerMs >= 60000 && loopMs < 500) {
                const progress = loopMs / 500;
                const ease = 1 - Math.pow(1 - progress, 3);
                offset = circumference * ease;
            } else {
                const ratio = loopMs / 60000;
                offset = circumference - (circumference * ratio);
            }

            setTimerRingOffset(offset);
        }
        ensureTimerFrame();
    }
    
    window.alphaUpdateFrame = updateFrame;
    if (animationFrameId) cancelFrame(animationFrameId);
    animationFrameId = null;
    ensureTimerFrame();
}

safePauseBtn.onclick = () => {
    if (isRunning) {
        isRunning = false;
        if (targetEndTimeout) {
            clearTimeout(targetEndTimeout);
            targetEndTimeout = null;
        }
        cancelFrame(animationFrameId);
        animationFrameId = null;
        if (window.alphaBackgroundTimer) {
            clearInterval(window.alphaBackgroundTimer);
            window.alphaBackgroundTimer = null;
        }

        const now = Date.now();
        if (isCountdown) {
            if (timerTargetEndTime) {
                timerRemainingMs = Math.max(0, timerTargetEndTime - now);
                currentTimerMs = timerRemainingMs;
                secondsElapsed = Math.ceil(timerRemainingMs / 1000);
            }
            timerTargetEndTime = null;
        } else {
            if (timerSessionStart) {
                timerBaseElapsedMs += (now - timerSessionStart);
                currentTimerMs = timerBaseElapsedMs;
                secondsElapsed = Math.floor(timerBaseElapsedMs / 1000);
            }
            timerSessionStart = null;
        }

        safePauseBtn.innerHTML = TIMER_PLAY_SVG;
        safePauseBtn.classList.add('is-paused');
        safePauseBtn.title = "继续";
        safePauseBtn.setAttribute('aria-label', "继续");
        timeDisplayEl.classList.add('timer-paused-blink');
    } else {
        startTimer();
    }
};

safeFinishBtn.onclick = () => {
    isRunning = false; 
    timeDisplayEl.classList.remove('timer-paused-blink');
    safePauseBtn.classList.remove('is-paused');
    safePauseBtn.innerHTML = TIMER_PAUSE_SVG;
    safePauseBtn.title = "暂停";
    safePauseBtn.setAttribute('aria-label', "暂停");
    if (targetEndTimeout) {
        clearTimeout(targetEndTimeout);
        targetEndTimeout = null;
    }
    if (window.alphaBackgroundTimer) {
        clearInterval(window.alphaBackgroundTimer);
        window.alphaBackgroundTimer = null;
    }
    stopAlarm();
    cancelFrame(animationFrameId);
    animationFrameId = null;

    if (overtimeInterval) {
        clearInterval(overtimeInterval);
        overtimeInterval = null;
    }
    
    if (window.opener && !window.opener.closed) window.opener.focus();
    if (window.alphaPipWindow) {
        window.alphaPipWindow.close();
        window.alphaPipWindow = null;
    }
    const topAPI = window.electronAPI || window.parent?.electronAPI || window.top?.electronAPI;
    if (topAPI && topAPI.bringMainToFront) {
        setTimeout(() => topAPI.bringMainToFront(), 10);
    }
    window.focus();

    const realEndTime = new Date();
    const now = Date.now();
    let actualSeconds = 0;
    if (isCountdown) {
        if (timerTargetEndTime && now >= timerTargetEndTime) {
            overtimeSeconds = Math.max(0, Math.floor((now - timerTargetEndTime) / 1000));
            secondsElapsed = 0;
        } else if (timerTargetEndTime) {
            const rem = Math.max(0, timerTargetEndTime - now);
            secondsElapsed = Math.ceil(rem / 1000);
            overtimeSeconds = 0;
        }
        actualSeconds = (targetSeconds - secondsElapsed + overtimeSeconds);
    } else {
        if (timerSessionStart) {
            currentTimerMs = timerBaseElapsedMs + (now - timerSessionStart);
        } else {
            currentTimerMs = timerBaseElapsedMs;
        }
        secondsElapsed = Math.floor(currentTimerMs / 1000);
        actualSeconds = secondsElapsed;
    }
    let actualMinutes = Math.max(1, Math.round(actualSeconds / 60));

    let baseName = document.getElementById('taskName').value.trim() || "未命名专注任务";
    const splitVal = Math.floor(Number(document.getElementById('splitCount').value));
    const isSplit = !document.getElementById('splitCount').disabled && splitVal > 1;

    let recordName = baseName;
    if (isSplit) recordName = `${baseName} - 1`; 

    const taskData = {
        id: currentHubTaskId || window.crypto?.randomUUID?.() || String(Date.now()),
        createdAt: Date.now(),
        date: getTodayString(),
        name: recordName,
        category: getSelectedCategories(),
        duration: actualMinutes,
        start: formatHM(realStartTime),
        end: formatHM(realEndTime),
        remark: isSplit ? "任务拆分 (1阶段) - 通过 TaskTimer 记录" : "通过 TaskTimer 记录"
    };

    let allData = {};
    try { allData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { allData = {}; }

    if (!allData[taskData.date]) allData[taskData.date] = [];
    allData[taskData.date].push(taskData);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));

    let crossHubMsg = "";
    try {
        let thData = JSON.parse(localStorage.getItem(TASKHUB_KEY) || "[]");
        let mappingData = JSON.parse(localStorage.getItem('alpha_task_mapping') || '{}');
        let thChanged = false;

        let originalListId = 'default';
        let originalPriority = 'Medium';
        let originalStart = '', originalEnd = '';

        if (currentHubTaskId) {
            let targetTask = thData.find(t => t.id === currentHubTaskId);
            if (targetTask) {
                targetTask.isCompleted = true;
                originalPriority = targetTask.priority || 'Medium';
                originalStart = targetTask.start || '';
                originalEnd = targetTask.end || '';
                thChanged = true;
                crossHubMsg = "<br><span style='color: var(--monet-text); font-weight:800;'>TaskHub 中的原计划已自动划去</span>";
            }
            if (mappingData[currentHubTaskId]) {
                originalListId = mappingData[currentHubTaskId][0];
            }
        }

        if (isSplit) {
            for (let i = 2; i <= splitVal; i++) {
                let newId = "split_" + Date.now() + "_" + i + "_" + Math.floor(Math.random() * 1000);
                let newTask = {
                    id: newId,
                    name: `${baseName} - ${i}`,
                    subject: getSelectedCategories(),
                    priority: originalPriority,
                    start: originalStart,
                    end: originalEnd,
                    remark: "由 TaskTimer 自动拆分生成",
                    isCompleted: false
                };
                thData.push(newTask);
                mappingData[newId] = [originalListId]; 
            }
            const newMappingStr = JSON.stringify(mappingData);
            localStorage.setItem('alpha_task_mapping', newMappingStr);
            if (typeof window.__alphaLastTaskMappingSign !== 'undefined') window.__alphaLastTaskMappingSign = newMappingStr;
            thChanged = true;
            crossHubMsg += `<br><span style='color: var(--monet-text); font-weight:800;'>已在 TaskHub 生成剩余 ${splitVal - 1} 个阶段任务</span>`;
        }

        if (thChanged) {
            const newThStr = JSON.stringify(thData);
            localStorage.setItem(TASKHUB_KEY, newThStr);
            if (typeof window.__alphaLastTaskHubSign !== 'undefined') window.__alphaLastTaskHubSign = newThStr;
        }
    } catch(e) { console.error("同步至 TaskHub 失败", e); }

    document.getElementById('taskName').value = '';
    document.getElementById('customCategory').value = '';
    document.getElementById('splitCount').value = ''; 
    checkSplitStatus();
    clearSubjectSelection();
    currentHubTaskId = null;

    switchTimerView('setup', () => {
        timerPanelEl.classList.add('hidden');
        document.getElementById('setupLayout').classList.remove('hidden');
    }, () => {
        customAlert(`共专注 ${actualMinutes} 分钟, 已自动同步至 TaskFlow${crossHubMsg}`, '记录成功', 'Congratulations', () => {
            if (window.isStandalonePipMode) {
                window.close();
            }
        });
    });
    renderHubTasks();
};

const scrollAnimMap = new WeakMap();
const returnAnimMap = new WeakMap();
const marqueeDistanceCache = new Map();

function getMarqueeShiftDistance(span, text) {
    const font = window.getComputedStyle(span).font;
    const cacheKey = `${font}\u0000${text}`;
    const cached = marqueeDistanceCache.get(cacheKey);
    if (cached !== undefined) return cached;

    const measureSpan = document.createElement('span');
    measureSpan.style.visibility = 'hidden';
    measureSpan.style.position = 'absolute';
    measureSpan.style.whiteSpace = 'nowrap';
    measureSpan.style.font = font;
    measureSpan.textContent = text;
    document.body.appendChild(measureSpan);
    const width = measureSpan.getBoundingClientRect().width;
    measureSpan.remove();

    if (marqueeDistanceCache.size >= 256) marqueeDistanceCache.clear();
    marqueeDistanceCache.set(cacheKey, width);
    return width;
}

if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => marqueeDistanceCache.clear()).catch(() => {});
}

function updateMarqueeOverflowState(container) {
    if (!container || container.classList.contains('is-scrolling') || container.classList.contains('is-returning')) return false;
    const span = container.querySelector('span');
    if (!span) return false;

    if (span.dataset.origText && span.textContent !== span.dataset.origText) {
        span.textContent = span.dataset.origText;
    }

    /* Measure against the resting layout. The overflow class extends the mask
       into the card inset, so leaving it applied during measurement could make
       borderline titles alternate between the two states. */
    container.classList.remove('is-overflowing');
    const isOverflowing = span.scrollWidth > container.clientWidth + 2;
    container.classList.toggle('is-overflowing', isOverflowing);
    return isOverflowing;
}

function refreshMarqueeOverflowState() {
    const measurements = [];
    document.querySelectorAll('.marquee-container').forEach(container => {
        if (container.classList.contains('is-scrolling') || container.classList.contains('is-returning')) return;
        const span = container.querySelector('span');
        if (!span) return;
        if (span.dataset.origText && span.textContent !== span.dataset.origText) {
            span.textContent = span.dataset.origText;
        }
        container.classList.remove('is-overflowing');
        measurements.push({ container, span });
    });

    const results = measurements.map(({ container, span }) => ({
        container,
        isOverflowing: span.scrollWidth > container.clientWidth + 2
    }));
    results.forEach(({ container, isOverflowing }) => {
        container.classList.toggle('is-overflowing', isOverflowing);
    });
}

let hubPostRenderFrame = 0;
function scheduleHubPostRender() {
    if (hubPostRenderFrame) cancelAnimationFrame(hubPostRenderFrame);
    hubPostRenderFrame = requestAnimationFrame(() => {

document.addEventListener('mouseover', function(e) {
    const container = e.target.closest('.marquee-container');
    if (!container) return;
    const span = container.querySelector('span');
    if (!span) return;

    if (container.classList.contains('is-scrolling')) return;

    /* Re-entering while the title is returning used to be ignored. Because the
       pointer was already inside afterwards, no second mouseover was fired and
       scrolling could appear to fail at random. Cancel that return cleanly and
       start a fresh overflow check immediately. */
    if (container.classList.contains('is-returning')) {
        const activeReturn = returnAnimMap.get(span);
        if (activeReturn) activeReturn.cancel();
        returnAnimMap.delete(span);
        container.classList.remove('is-returning', 'is-resting');
        span.style.transform = 'translateX(0px)';
        if (span.dataset.origText) span.textContent = span.dataset.origText;
    }

    if (!span.dataset.origText) span.dataset.origText = span.textContent;
    span.textContent = span.dataset.origText;

    if (updateMarqueeOverflowState(container)) {
        container.classList.remove('is-returning', 'is-resting');
        container.classList.add('is-scrolling');

        const existingReturn = returnAnimMap.get(span);
        if (existingReturn) existingReturn.cancel();

        const gapText = '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0'; 
        const shiftDist = getMarqueeShiftDistance(span, span.dataset.origText + gapText);

        span.textContent = span.dataset.origText + gapText + span.dataset.origText;

        const speed = 35; 
        const tOut = shiftDist * speed; 
        const tPause = 800; 
        const totalT = tPause + tOut; 

        const anim = span.animate([
            { transform: 'translateX(0px)', offset: 0 },
            { transform: 'translateX(0px)', offset: tPause / totalT },
            { transform: `translateX(-${shiftDist}px)`, offset: 1 }
        ], {
            duration: totalT,
            iterations: Infinity,
            easing: 'linear'
        });

        scrollAnimMap.set(span, anim);
    }
});

let marqueeResizeFrame = null;
window.addEventListener('resize', () => {

document.addEventListener('mouseout', function(e) {
    const container = e.target.closest('.marquee-container');
    if (!container) return;
    if (e.relatedTarget && container.contains(e.relatedTarget)) return;

    const span = container.querySelector('span');
    if (!span) return;

    if (container.classList.contains('is-scrolling')) {
        const anim = scrollAnimMap.get(span);
        let currentX = 0;

        if (anim) {
            const currentTransform = window.getComputedStyle(span).transform;
            if (currentTransform !== 'none') {
                const match = currentTransform.match(/matrix\((.+)\)/);
                if (match) currentX = parseFloat(match[1].split(', ')[4]);
            }
            anim.cancel();
            scrollAnimMap.delete(span);
        }

        container.classList.remove('is-scrolling');
        container.classList.add('is-returning');

        const returnAnim = span.animate([
            { transform: `translateX(${currentX}px)` },
            { transform: 'translateX(0px)' }
        ], {
            duration: 500, 
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)' 
        });
        
        returnAnim.onfinish = () => { 
            span.style.transform = 'translateX(0px)'; 
            if (span.dataset.origText) span.textContent = span.dataset.origText; 
            container.classList.remove('is-returning');
            returnAnimMap.delete(span);
            
            container.classList.add('is-resting');
            setTimeout(() => container.classList.remove('is-resting'), 300); 
        };

        returnAnim.oncancel = () => {
            returnAnimMap.delete(span);
        };
        
        returnAnimMap.set(span, returnAnim);
    }
});

let isFastScrolling = false;
let scrollTimer = null;
let scrollFramePending = false;
let scrollEndDeadline = 0;

function finishScrollWhenQuiet() {
    const remaining = scrollEndDeadline - performance.now();

            sphere.removeEventListener('pointermove', onSphereMove);
            sphere.removeEventListener('pointerup', onSphereUp);
            sphere.removeEventListener('pointercancel', onSphereCancel);
            try { sphere.releasePointerCapture(upEvent.pointerId); } catch (_) {}
            sphere.classList.remove('is-dragging');

            if (!isSphereDragging) {
                modal.classList.remove('hidden');
            }
        };

        const onSphereCancel = (cancelEvent) => {
            if (sphereMoveFrame) {
                cancelAnimationFrame(sphereMoveFrame);
                sphereMoveFrame = 0;
            }
            sphere.removeEventListener('pointermove', onSphereMove);
            sphere.removeEventListener('pointerup', onSphereUp);
            sphere.removeEventListener('pointercancel', onSphereCancel);
            try { sphere.releasePointerCapture(cancelEvent.pointerId); } catch (_) {}
            sphere.classList.remove('is-dragging');
        };

        sphere.addEventListener('pointerdown', (e) => {
            isSphereDragging = false;
            sphereStartX = e.clientX;
            sphereStartY = e.clientY;
            latestSphereX = e.clientX;
            latestSphereY = e.clientY;

            const rect = sphere.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            try { sphere.setPointerCapture(e.pointerId); } catch (_) {}

            sphere.addEventListener('pointermove', onSphereMove);
            sphere.addEventListener('pointerup', onSphereUp);
            sphere.addEventListener('pointercancel', onSphereCancel);
        });
    }

    function initToggleDrag(toggleEl, radios, slider) {
        if (!toggleEl || !radios || !radios.length || !slider) return;

        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let originIndex = 0;
        let currentOffsetPx = 0;
        let slotWidth = 0;
        let pointerId = null;
        let suppressClickUntil = 0;
        let settleTimer = null;
        let lastMoveX = 0;
        let lastMoveTime = 0;
        let smoothedSpeed = 0;
        let clickMorphAnimation = null;
        let latestPointerX = 0;
        let latestPointerY = 0;
        let dragMoveFrame = 0;

        const totalCount = radios.length;
        const SNAP_TRANSITION = 'transform .34s cubic-bezier(.22, 1, .36, 1), scale .22s cubic-bezier(.22, 1, .36, 1), border-radius .22s ease, filter .22s ease';

        function getActiveIndex() {
            const idx = radios.findIndex(r => r.checked);
            return idx >= 0 ? idx : 0;
        }

        function getSlotWidth() {
            const firstLabel = toggleEl.querySelector('label[for]');
            return firstLabel ? firstLabel.getBoundingClientRect().width : slider.getBoundingClientRect().width;
        }

        function clearInlineMotion() {
            slider.style.transition = '';
            slider.style.transform = '';
            slider.style.scale = '';
            slider.style.transformOrigin = '';
            slider.style.borderRadius = '';
            slider.style.filter = '';
        }

        function settleAt(index) {
            clearTimeout(settleTimer);
            const targetOffset = index * slotWidth;
            slider.style.transition = SNAP_TRANSITION;
            /* Preserve the original centre-based deformation while sliding. */
            slider.style.transformOrigin = 'center center';
            requestAnimationFrame(() => {
                slider.style.transform = `translate3d(${targetOffset}px, 0, 0)`;
                slider.style.scale = '1 1';
                slider.style.borderRadius = 'calc(var(--radius-element) - 6px)';
                slider.style.filter = 'brightness(1) saturate(1)';
            });
            settleTimer = setTimeout(clearInlineMotion, 390);
        }

        function applyToggleDragMove() {
            dragMoveFrame = 0;
            if (pointerId === null) return;

            const deltaX = latestPointerX - startX;
            const deltaY = latestPointerY - startY;

            if (!isDragging && Math.abs(deltaX) > 5 && Math.abs(deltaX) > Math.abs(deltaY)) {
                isDragging = true;
                toggleEl.classList.add('is-dragging');
                try { toggleEl.setPointerCapture(pointerId); } catch(err) {}

                slider.classList.remove('is-sliding-right', 'is-sliding-left');
                slider.style.transition = 'none';
                slider.style.transformOrigin = 'center center';
            }

            if (!isDragging) return;

            const offset = originIndex * slotWidth + deltaX;
            const minOffset = 0;
            const maxOffset = (totalCount - 1) * slotWidth;
            currentOffsetPx = Math.max(minOffset, Math.min(maxOffset, offset));

            const now = performance.now();
            const elapsed = Math.max(1, now - lastMoveTime);
            const instantSpeed = Math.abs(latestPointerX - lastMoveX) / elapsed;
            const normalizedSpeed = Math.min(1, instantSpeed / 1.15);
            smoothedSpeed += (normalizedSpeed - smoothedSpeed) * 0.42;
            const distanceFactor = Math.min(1, Math.abs(deltaX) / Math.max(1, slotWidth));
            const sizeFactor = Math.min(1, 100 / Math.max(100, slotWidth));
            const deformation = (0.025 + smoothedSpeed * 0.055 + distanceFactor * 0.018) * sizeFactor;

            slider.style.transform = `translate3d(${currentOffsetPx}px, 0, 0)`;
            slider.style.scale = `${(1 + deformation).toFixed(3)} ${(1 - deformation * 0.78).toFixed(3)}`;
            slider.style.borderRadius = `${Math.max(14, 20 - deformation * 45).toFixed(1)}px`;
            slider.style.filter = `brightness(${(1.015 + smoothedSpeed * 0.025).toFixed(3)}) saturate(${(1.025 + smoothedSpeed * 0.045).toFixed(3)})`;

            lastMoveX = latestPointerX;
            lastMoveTime = now;
        }

        toggleEl.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;
            if (clickMorphAnimation) {
                clickMorphAnimation.cancel();
                clickMorphAnimation = null;
            }
            originIndex = getActiveIndex();
            slotWidth = getSlotWidth();
            startX = e.clientX;
            startY = e.clientY;
            currentOffsetPx = originIndex * slotWidth;
            isDragging = false;
            pointerId = e.pointerId;
            lastMoveX = e.clientX;
            lastMoveTime = performance.now();
            smoothedSpeed = 0;
            latestPointerX = e.clientX;
            latestPointerY = e.clientY;
        });

        toggleEl.addEventListener('pointermove', (e) => {
            if (pointerId === null || e.pointerId !== pointerId) return;
            latestPointerX = e.clientX;
            latestPointerY = e.clientY;
            const pendingDeltaX = e.clientX - startX;
            const pendingDeltaY = e.clientY - startY;
            if (isDragging || (Math.abs(pendingDeltaX) > 5 && Math.abs(pendingDeltaX) > Math.abs(pendingDeltaY))) {

        });

        const handlePointerEnd = (e) => {
            if (pointerId === null || e.pointerId !== pointerId) return;

            latestPointerX = e.clientX;
            latestPointerY = e.clientY;
            if (dragMoveFrame) cancelAnimationFrame(dragMoveFrame);
            applyToggleDragMove();
            
            const wasDragging = isDragging;
            const currentPtr = pointerId;
            pointerId = null;

            if (wasDragging) {
                try {
                    toggleEl.releasePointerCapture(currentPtr);
                } catch(err) {}
                toggleEl.classList.remove('is-dragging');
                isDragging = false;
                suppressClickUntil = Date.now() + 300;

                const rawTarget = currentOffsetPx / slotWidth;
                let targetIndex = Math.round(rawTarget);
                targetIndex = Math.max(0, Math.min(totalCount - 1, targetIndex));

                if (targetIndex !== originIndex) {
                    radios[targetIndex].checked = true;
                    radios[targetIndex].dispatchEvent(new Event('change', { bubbles: true }));
                }
                settleAt(targetIndex);
            } else {
                clearInlineMotion();
            }
        };

        toggleEl.addEventListener('pointerup', handlePointerEnd);
        toggleEl.addEventListener('pointercancel', handlePointerEnd);

        toggleEl.addEventListener('click', (e) => {
            if (Date.now() < suppressClickUntil) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }

            const label = e.target.closest && e.target.closest('label[for]');
            if (!label) return;
            e.preventDefault();

            const targetRadio = document.getElementById(label.htmlFor);
            const targetIndex = radios.indexOf(targetRadio);
            const fromIndex = getActiveIndex();
            if (targetIndex < 0) return;

            if (clickMorphAnimation) clickMorphAnimation.cancel();
            clearTimeout(settleTimer);
            clearInlineMotion();

            slotWidth = getSlotWidth();
            const fromOffset = fromIndex * slotWidth;
            const targetOffset = targetIndex * slotWidth;
            const direction = Math.sign(targetIndex - fromIndex);
            const travel = targetOffset - fromOffset;
            const overshoot = direction * Math.min(1.8, slotWidth * 0.023);
            const recoil = direction * Math.min(0.55, slotWidth * 0.007);

            if (targetIndex !== fromIndex) {
                targetRadio.checked = true;
                targetRadio.dispatchEvent(new Event('change', { bubbles: true }));
            }

            if (typeof slider.animate === 'function') {
                /* The checked state changes before WAAPI starts. Keep the
                   existing travel animation centred on the slider itself. */
                slider.style.transformOrigin = 'center center';
                // Keep the TaskFlow character while scaling deformation down
                // automatically for this wider two-option control.
                const sizeFactor = Math.min(1, 90 / Math.max(90, slotWidth));
                const frame = (x, y) => `${(1 + (x - 1) * sizeFactor).toFixed(3)} ${(1 + (y - 1) * sizeFactor).toFixed(3)}`;
                const movingRight = direction >= 0;
                const keyframes = movingRight ? [
                    { transform: `translate3d(${fromOffset}px, 0, 0)`, scale: '1 1', offset: 0 },
                    { transform: `translate3d(${fromOffset + travel * 0.48}px, 0, 0)`, scale: frame(1.030, 0.980), offset: 0.25 },
                    { transform: `translate3d(${targetOffset + overshoot}px, 0, 0)`, scale: frame(1.008, 0.992), offset: 0.65 },
                    { transform: `translate3d(${targetOffset - recoil}px, 0, 0)`, scale: frame(0.995, 1.006), offset: 0.82 },
                    { transform: `translate3d(${targetOffset}px, 0, 0)`, scale: '1 1', offset: 1 }
                ] : [
                    { transform: `translate3d(${fromOffset}px, 0, 0)`, scale: '1 1', offset: 0 },
                    { transform: `translate3d(${fromOffset + travel * 0.42}px, 0, 0)`, scale: frame(1.115, 0.930), offset: 0.18 },
                    { transform: `translate3d(${targetOffset + overshoot}px, 0, 0)`, scale: frame(1.055, 0.965), offset: 0.46 },
                    { transform: `translate3d(${targetOffset - recoil}px, 0, 0)`, scale: frame(0.990, 1.010), offset: 0.72 },
                    { transform: `translate3d(${targetOffset}px, 0, 0)`, scale: '1 1', offset: 1 }
                ];

                clickMorphAnimation = slider.animate(keyframes, { duration: 420, easing: 'ease' });
                clickMorphAnimation.addEventListener('finish', () => {
                    slider.style.transformOrigin = '';
                    clickMorphAnimation = null;
                }, { once: true });
            }
        }, true);
    }

    const timerToggleEl = document.querySelector('.view-toggle');
    const timerRadios = Array.from(document.querySelectorAll('input[name="timerMode"]'));
    const timerSlider = document.querySelector('.toggle-slider');

    if (timerToggleEl && timerRadios.length && timerSlider) {
        initToggleDrag(timerToggleEl, timerRadios, timerSlider);
    }

    document.querySelectorAll('a[href^="./"]').forEach(link => {
        link.addEventListener('click', (e) => {
            const targetUrl = link.getAttribute('href');
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            const targetPath = targetUrl.replace('./', '');
            if (currentPath === targetPath) return;
            e.preventDefault();
            const appContainer = document.querySelector('.setup-layout');
            if (appContainer) {
                appContainer.classList.add('page-transition-leave');

            }
        });

    document.querySelectorAll('a[href*="Home.html"]').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const href = a.getAttribute('href');
            sessionStorage.setItem('nav_from_home', 'true');

            pageTargets.forEach(el => el.classList.add('page-transition-leave', 'page-leave-to-home'));
            setTimeout(() => { window.location.href = href; }, 400);
        });

    let switcherState = 'closed';
    const switcherOverlay = document.getElementById('appSwitcherOverlay');
    const switcherTrack = document.getElementById('dynamicSwitcherTrack');
    const miniIcons = Array.from(switcherTrack.querySelectorAll('.mini-app-icon'));
    const logoTrigger = document.getElementById('logoTrigger');

    let isDraggingSwitcher = false;
    let startDragX = 0;
    let startTrackX = 0;
    const iconSpacing = 68; // 48 + 20
    let BASE_X = 0;
    let trackX = 0;
    let trackY = 0;
    let startDragY = 0;
    let startTrackY = 0;

    let currentIndex = 0; 
    let currentPath = window.location.pathname.split('/').pop() || 'index.html';
    miniIcons.forEach((icon, i) => {
        const href = icon.getAttribute('data-href');

        }
    });

    const pageIndex = currentIndex;
    currentPath = miniIcons[pageIndex].getAttribute('data-href').replace('./', '');
    let BASE_Y = 0;
    let openFrame = 0;
    let dragFrame = 0;
    let dragPointerId = null;
    let navigationStarted = false;
    let suppressPointerClick = false;

    // Border widths stay constant: interpolating them moves the PNG containing block.
    const handoffProperties = ['box-shadow', 'border-top-color',
        'border-right-color', 'border-bottom-color', 'border-left-color'];
    const scalePixels = (value, ratio) => value.replace(/(-?\d*\.?\d+)px/g,
        (_, number) => `${Number(number) * ratio}px`);

    function alignTrackToLogo() {
        const rect = logoTrigger.getBoundingClientRect();
        switcherTrack.style.transition = 'none';
        switcherTrack.style.left = '0px';
        switcherTrack.style.top = '0px';
        switcherTrack.style.setProperty('--track-x', '0px');
        switcherTrack.style.setProperty('--track-y', '0px');
        const trackRect = switcherTrack.getBoundingClientRect();
        const unitX = trackRect.width / (switcherTrack.offsetWidth || trackRect.width) || 1;
        const unitY = trackRect.height / (switcherTrack.offsetHeight || trackRect.height) || 1;
        BASE_X = (rect.left + rect.width / 2 - trackRect.left) / unitX - 24;
        BASE_Y = (rect.top + rect.height / 2 - trackRect.top) / unitY - 24;
        trackX = BASE_X - currentIndex * iconSpacing;
        trackY = BASE_Y;
    }

    function transferGlow(from, to) {
        if (window.AlphaInputGlow?.transferElement) {
            window.AlphaInputGlow.transferElement(from, to);
        }
    }

    function restoreLogo() {
        if (!logoTrigger) return;
        transferGlow(miniIcons[pageIndex], logoTrigger);
        ['transition', 'transform', '--lq-hover-ty', '--lq-hover-scale', '--lq-tx',
            '--lq-ty', '--lq-scale', '--lq-sx', '--lq-sy', '--lq-rot'].forEach(
                property => logoTrigger.style.removeProperty(property));
        logoTrigger.style.visibility = 'visible';
        logoTrigger.style.opacity = '1';
        logoTrigger.style.pointerEvents = 'auto';
    }

    function setIconUnfoldPositions(open) {
        miniIcons.forEach((icon, i) => {
            const distFromAnchor = Math.abs(i - pageIndex);
            if (open) {
                const delay = distFromAnchor * 26;
                icon.style.transitionDelay = `${delay}ms`;
                icon.style.setProperty('--unfold-x', '0px');
                icon.style.setProperty('--unfold-scale', '1');
                icon.style.opacity = '1';
                icon.style.visibility = 'visible';
            } else {
                const foldOffset = -(i - currentIndex) * iconSpacing;
                const delay = distFromAnchor * 18;
                icon.style.transitionDelay = `${delay}ms`;
                icon.style.setProperty('--unfold-x', `${foldOffset}px`);
                if (i !== currentIndex) {
                    icon.style.setProperty('--unfold-scale', '0.85');
                    icon.style.opacity = '0';
                } else {
                    icon.style.setProperty('--unfold-scale', '1');
                    icon.style.opacity = '1';
                }
            }
        });
    }

    setIconUnfoldPositions(false);

    let closeTimeoutTimer = null;
    let openRecoilTimer = null;

    window.openAppSwitcher = function() {
        if (switcherState === 'opened') return;
        const wasVisible = switcherTrack.classList.contains('open');
        switcherState = 'opened';
        window.__switcherState = 'opened';
        navigationStarted = false;
        currentIndex = pageIndex;
        switcherTrack.style.pointerEvents = '';
        switcherOverlay.style.pointerEvents = '';
        switcherOverlay.style.removeProperty('background');
        switcherOverlay.style.removeProperty('background-color');
        switcherOverlay.style.removeProperty('backdrop-filter');
        switcherOverlay.style.removeProperty('-webkit-backdrop-filter');
        switcherOverlay.style.removeProperty('transition');
        miniIcons.forEach(icon => {
            icon.classList.remove('is-folding-back');
            icon.style.removeProperty('transform');
        });
        if (openFrame) { cancelAnimationFrame(openFrame); openFrame = 0; }
        if (closeTimeoutTimer) {
            clearTimeout(closeTimeoutTimer);
            closeTimeoutTimer = null;
        }
        if (openRecoilTimer) {
            clearTimeout(openRecoilTimer);
            openRecoilTimer = null;
        }

        if (wasVisible) {
            switcherOverlay.classList.add('open');
            updateTrackPosition(true);
            setIconUnfoldPositions(true);
            return;
        }

        // 零延迟瞬时几何接力 (0ms 极速响应)
        const anchorIcon = miniIcons[pageIndex];
        const sourceImage = logoTrigger.querySelector('img');
        const targetImage = anchorIcon.querySelector('img');
        const sourceStyle = getComputedStyle(logoTrigger);
        const sourceImageStyle = getComputedStyle(sourceImage);
        const ratio = 48 / 56;
        const handoffStyles = handoffProperties.map(property =>
            [property, scalePixels(sourceStyle.getPropertyValue(property), ratio)]);
        const sourceFilter = scalePixels(sourceImageStyle.filter, ratio);

        switcherTrack.classList.add('is-preparing');
        anchorIcon.classList.add('is-launch-origin');
        handoffStyles.forEach(([property, value]) => anchorIcon.style.setProperty(property, value, 'important'));
        targetImage.style.setProperty('filter', sourceFilter, 'important');
        alignTrackToLogo();
        updateTrackPosition(false);
        setIconUnfoldPositions(false);
        transferGlow(logoTrigger, anchorIcon);

        logoTrigger.style.visibility = 'hidden';
        logoTrigger.style.opacity = '0';
        logoTrigger.style.pointerEvents = 'none';
        switcherOverlay.classList.add('open');
        switcherTrack.classList.add('open');
        switcherTrack.classList.remove('is-preparing');

        // 首帧直接发起涟漪交错物理展开
        openFrame = requestAnimationFrame(() => {
            openFrame = 0;
            if (switcherState !== 'opened') return;
            updateTrackPosition(true);
            setIconUnfoldPositions(true);
            anchorIcon.classList.remove('is-launch-origin');
            handoffProperties.forEach(property => anchorIcon.style.removeProperty(property));
            anchorIcon.style.removeProperty('border-color');
            anchorIcon.style.removeProperty('box-shadow');
            targetImage.style.removeProperty('filter');
        });
    };

    window.closeAppSwitcher = function() {
        if (switcherState === 'closed') return;
        switcherState = 'closed';
        window.__switcherState = 'closed';
        switcherOverlay.classList.remove('open');
        if (openFrame) { cancelAnimationFrame(openFrame); openFrame = 0; }
        if (openRecoilTimer) { clearTimeout(openRecoilTimer); openRecoilTimer = null; }
        if (closeTimeoutTimer) { clearTimeout(closeTimeoutTimer); closeTimeoutTimer = null; }

        if (!switcherTrack.classList.contains('open')) { restoreLogo(); return; }
        currentIndex = pageIndex;
        trackX = BASE_X - currentIndex * iconSpacing;
        trackY = BASE_Y;
        switcherTrack.style.pointerEvents = 'none';
        switcherTrack.style.removeProperty('background');
        switcherOverlay.style.removeProperty('background');
        switcherOverlay.style.removeProperty('background-color');
        switcherOverlay.style.removeProperty('backdrop-filter');
        switcherOverlay.style.removeProperty('-webkit-backdrop-filter');
        updateTrackPosition(true);
        setIconUnfoldPositions(false);
        const anchorIcon = miniIcons[pageIndex];
        anchorIcon.classList.remove('is-anchor', 'is-launch-origin');
        anchorIcon.classList.add('is-folding-back');
        handoffProperties.forEach(property => anchorIcon.style.removeProperty(property));
        anchorIcon.style.removeProperty('border-color');
        anchorIcon.style.removeProperty('box-shadow');
        anchorIcon.querySelector('img').style.removeProperty('filter');

        closeTimeoutTimer = setTimeout(() => {
            closeTimeoutTimer = null;
            if (switcherState !== 'closed') return;
            switcherTrack.classList.remove('open');
            anchorIcon.classList.remove('is-folding-back');
            restoreLogo();
        }, 280);

    switcherOverlay.addEventListener('click', closeAppSwitcher);

    function updateTrackPosition(animate = false) {
        if (animate) {
            switcherTrack.style.transition = 'transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease, visibility 0s 0s';
        } else {
            switcherTrack.style.transition = 'none';
        }
        
        switcherTrack.style.setProperty('--track-x', `${trackX}px`);
        switcherTrack.style.setProperty('--track-y', `${trackY}px`);
        
        miniIcons.forEach((icon, i) => {
            if (animate) {
                icon.style.transition = '--ig-anchor 0.3s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), background 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1)';
            } else {
                icon.style.transition = 'none';
                icon.style.transitionDelay = '0s';
            }
            
            const iconCenterRelative = 24 + i * iconSpacing;
            const dist = Math.abs((trackX + iconCenterRelative) - (BASE_X + 24));
            
            let scale = 1.0;
            if (dist < iconSpacing) {
                const factor = 1 - (dist / iconSpacing);
                scale = 1.0 + ((56 / 48) - 1.0) * factor;
            }
            
            icon.style.setProperty('--icon-scale', scale);
            
            if (dist < 10) {
                icon.classList.add('is-anchor');
            } else {
                icon.classList.remove('is-anchor');
            }
        });

    // Tap & Click Switcher Navigation Logic with smooth slide & natural scale
    let switchPageTimeout = null;

    function switchToAppByIndex(targetIndex) {
        if (switcherState !== 'opened' || navigationStarted) return;
        if (targetIndex < 0 || targetIndex >= miniIcons.length) return;
        if (targetIndex === currentIndex) {
            // 点击当前已激活的 App: 优雅回折收起切换器
            closeAppSwitcher();
            return;
        }

        if (switchPageTimeout) {
            clearTimeout(switchPageTimeout);
            switchPageTimeout = null;
        }

        // 平滑滑动轨道, 伴随自然放大动画将点击的 App 图标移至锚点焦点位置
        currentIndex = targetIndex;
        trackX = BASE_X - currentIndex * iconSpacing;
        updateTrackPosition(true);

        // 待滑动与自然放大动画舒展完成后, 无缝衔接切页离开过渡动效
        switcherTrack.style.pointerEvents = 'none';
        switcherOverlay.style.pointerEvents = 'none';
        
        switchPageTimeout = setTimeout(() => {
            checkSwitchPage();
        }, 360);
    }

    miniIcons.forEach((icon, i) => {
        icon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (switcherState !== 'opened' || (e.detail !== 0 && suppressPointerClick)) return;
            switchToAppByIndex(i);

    // Drag & Tap Logic with 2D elastic vertical recoil (下沉归位)
    switcherTrack.addEventListener('pointerdown', (e) => {
        if (switcherState !== 'opened' || navigationStarted || isDraggingSwitcher || e.button !== 0) return;
        isDraggingSwitcher = true;
        suppressPointerClick = false;
        dragPointerId = e.pointerId;
        startDragX = e.clientX;
        startDragY = e.clientY;

        startTrackY = trackY;

        if (!isDraggingSwitcher || e.pointerId !== dragPointerId) return;

        const deltaY = e.clientY - startDragY;
        
        trackX = startTrackX + deltaX;
        
        const minTrackX = BASE_X - (miniIcons.length - 1) * iconSpacing;
        const maxTrackX = BASE_X;
        
        if (trackX > maxTrackX) {
            trackX = maxTrackX + (trackX - maxTrackX) * 0.3;
        } else if (trackX < minTrackX) {
