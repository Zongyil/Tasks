      background: radial-gradient(ellipse at top left, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.25) 100%) !important;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.3), inset 1px 2px 4px rgba(255, 255, 255, 0.8), inset -1px -2px 4px rgba(0, 0, 0, 0.05) !important;
  }
  .secondary:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.4) 100%) !important;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.4), inset 1px 2px 6px rgba(255, 255, 255, 0.9), inset -1px -2px 4px rgba(0, 0, 0, 0.05) !important;
  }
</style>
</head>
            <body>
                <div id="flexSafeZone">
                    <div id="animationWrapper"></div>
                </div>
            </body>
            </html>
        `);
        pipDoc.close();

        const animWrapper = pipDoc.getElementById('animationWrapper');
        if (animWrapper) {
            pipDoc.adoptNode(timerPanel);
            animWrapper.appendChild(timerPanel);
            timerPanel.style.display = 'block';
        }

        const resizeViewport = () => {
            if (pip.closed) return;
            const vw = pip.innerWidth;
            const vh = pip.innerHeight;
            const fluidScale = Math.min(vw / winW, vh / winH);
            if(animWrapper) animWrapper.style.transform = `scale(${fluidScale})`;
        };
        
        if (animWrapper) {
            animWrapper.addEventListener('animationend', () => {
                animWrapper.style.animation = 'none';
                resizeViewport();
            });
        }

        pip.addEventListener('resize', resizeViewport);
        
        const pipDragHandle = pipDoc.getElementById('timerDragHandle');
        if (pipDragHandle) {
            let isPipDragging = false;
            let pipOffsetX = 0;
            let pipOffsetY = 0;

            const getSafeElectronAPI = () => {
                if (window.electronAPI) return window.electronAPI;
                try { 
                    if (window.top && window.top.electronAPI) return window.top.electronAPI; 
                } catch(err) {}
                return null;
            };

            pipDragHandle.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return; 
                pip.focus();
                isPipDragging = true;
                pipOffsetX = e.screenX - pip.screenX;
                pipOffsetY = e.screenY - pip.screenY;
                pipDragHandle.setPointerCapture(e.pointerId);
                
                const api = getSafeElectronAPI();
                if (api && api.startPipDrag) api.startPipDrag();
            });

            let dragAnimationFrame = null;

            pipDragHandle.addEventListener('pointermove', (e) => {
                if (isPipDragging && !pip.closed) {
                    const targetX = e.screenX - pipOffsetX;
                    const targetY = e.screenY - pipOffsetY;

                    if (dragAnimationFrame) pip.cancelAnimationFrame(dragAnimationFrame);

                    dragAnimationFrame = pip.requestAnimationFrame(() => {
                        const api = getSafeElectronAPI();
                        if (api && api.movePipWindow) {
                            api.movePipWindow(targetX, targetY);
                        } else {
                            pip.moveTo(targetX, targetY);
                        }
                    });
                }
            });

            pipDragHandle.addEventListener('pointerup', (e) => {
                isPipDragging = false;
                try { pipDragHandle.releasePointerCapture(e.pointerId); } catch(err) {}
                
                const api = getSafeElectronAPI();
                if (api && api.stopPipDrag) api.stopPipDrag();
                
                if (hasMovedAway && isWithinDockRange) {
                    clearInterval(pipMonitor);
                    pip.close();
                }
            });

            pipDragHandle.addEventListener('pointercancel', () => {
                isPipDragging = false;
                const api = getSafeElectronAPI();
                if (api && api.stopPipDrag) api.stopPipDrag();
            });
        }

        let hasMovedAway = false;
        let pipOpenedAt = Date.now();
        let isWithinDockRange = false;

        const triggerDockClose = () => {
            if (hasMovedAway && isWithinDockRange) {
                clearInterval(pipMonitor);
                pip.close();
            }
        };
        pip.addEventListener('mouseup', triggerDockClose);
        pip.addEventListener('pointerup', triggerDockClose);

        pip.addEventListener('beforeunload', () => {
            window.alphaPipWindow = null;
            clearInterval(pipMonitor);
        });

        let pipMonitor = setInterval(() => {
            if (pip.closed) {
                clearInterval(pipMonitor);
                return;
            }

            if (Date.now() - pipOpenedAt < 800) return;

            const targetCoords = getAbsoluteScreenCoords(dockStation);
            const targetX = targetCoords.x + 5;
            const targetY = targetCoords.y - 1;

            const currentX = pip.screenX;
            const currentY = pip.screenY;

            const deltaX = Math.abs(currentX - targetX);
            const deltaY = Math.abs(currentY - targetY);

            if (!hasMovedAway) {
                if (deltaX > 40 || deltaY > 40) {
                    hasMovedAway = true;
                } else {
                    return;
                }
            }

            const isYAligned = deltaY < 50;
            const isXAligned = (currentX + pip.innerWidth > targetX - 30) && (currentX < targetX + baseW + 30);
            isWithinDockRange = isYAligned && isXAligned;

            if (isWithinDockRange) {
                dockStation.style.borderColor = 'rgba(157, 210, 255, 0.95)';
                dockStation.style.background = 'rgba(157, 210, 255, 0.18)';
                dockStation.style.boxShadow = '0 0 25px rgba(157, 210, 255, 0.35), inset 0 0 15px rgba(157, 210, 255, 0.2)';
                dockStation.style.transform = 'scale(1.01)';
                if (pipDoc.body) pipDoc.body.style.opacity = '0.45';
            } else {
                dockStation.style.borderColor = 'rgba(157, 210, 255, 0.4)';
                dockStation.style.background = 'rgba(255, 255, 255, 0.03)';
                dockStation.style.boxShadow = 'none';
                dockStation.style.transform = 'scale(1)';
                if (pipDoc.body) pipDoc.body.style.opacity = '1';
            }
        }, 100);

        const restorePanel = () => {
            if (timerPanel.parentNode !== dockStation.parentNode) {
                document.adoptNode(timerPanel);
                dockStation.parentNode.insertBefore(timerPanel, dockStation);
                dockStation.style.display = 'none';

                const restoredTooltips = timerPanel.querySelectorAll('[data-pip-title], [data-pip-tooltip]');
                restoredTooltips.forEach(el => {
                    if (el.dataset.pipTitle) el.setAttribute('title', el.dataset.pipTitle);
                    if (el.dataset.pipTooltip) el.setAttribute('data-tooltip', el.dataset.pipTooltip);
                    delete el.dataset.pipTitle;
                    delete el.dataset.pipTooltip;
                });

                timerPanel.style.transition = 'none';
                timerPanel.style.transform = 'scale(0.88)';
                timerPanel.style.opacity = '0';
                timerPanel.style.display = 'block';

                void timerPanel.offsetWidth;

                timerPanel.style.transition = 'transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease';
                timerPanel.style.transform = 'scale(1)';
                timerPanel.style.opacity = '1';

                window.alphaPipWindow = null;

                const topAPI = window.electronAPI || window.parent?.electronAPI || window.top?.electronAPI;
                if (topAPI && topAPI.bringMainToFront) {
                    topAPI.bringMainToFront();
                }

                setTimeout(() => { timerPanel.style.transition = ''; }, 480);
                if (window.alphaResumeTimer) window.alphaResumeTimer();
            }
        };

        pip.addEventListener('beforeunload', restorePanel);
        pip.addEventListener('unload', restorePanel);
    }

    if (timerDragHandle) {
        let parentDragging = false;
        let pStartX = 0, pStartY = 0;

        timerDragHandle.style.cursor = 'grab';

        timerDragHandle.addEventListener('pointerdown', (e) => {
            if (window.alphaPipWindow && !window.alphaPipWindow.closed) return;
            if (e.button !== 0) return;
            cachedAbsoluteCoords = getAbsoluteScreenCoords(timerPanel);
            parentDragging = true;
            pStartX = e.clientX;
            pStartY = e.clientY;

            timerPanel.style.transition = 'transform 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
            timerPanel.style.transform = 'scale(0.92)';
            timerDragHandle.setPointerCapture(e.pointerId);
        });

        timerDragHandle.addEventListener('pointermove', (e) => {
            if (window.alphaPipWindow && !window.alphaPipWindow.closed) return;
            if (!parentDragging) return;
            const dist = Math.hypot(e.clientX - pStartX, e.clientY - pStartY);
            if (dist > 15) {
                parentDragging = false;
                timerDragHandle.releasePointerCapture(e.pointerId);
                openElectronPip();
            }
        });

        timerDragHandle.addEventListener('pointerup', (e) => {
            if (window.alphaPipWindow && !window.alphaPipWindow.closed) return;
            if (!parentDragging) return;
            parentDragging = false;
            timerPanel.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            timerPanel.style.transform = 'scale(1)';
            setTimeout(() => { timerPanel.style.transition = ''; }, 400);
            try { timerDragHandle.releasePointerCapture(e.pointerId); } catch(err) {}
        });

        timerDragHandle.addEventListener('pointercancel', () => {
            if (window.alphaPipWindow && !window.alphaPipWindow.closed) return;
            parentDragging = false;
        });
    }
})();

/* ==========================================================================
   [09. MARQUEE TEXT ENGINE & SCROLL OPTIMIZATION]
   ========================================================================== */
const scrollAnimMap = new WeakMap();
const returnAnimMap = new WeakMap();

document.addEventListener('mouseover', function(e) {
    const container = e.target.closest('.marquee-container');
    if (!container) return;
    const span = container.querySelector('span');
    if (!span) return;

    if (container.classList.contains('is-scrolling') || container.classList.contains('is-returning')) return;

    if (!span.dataset.origText) span.dataset.origText = span.textContent;
    span.textContent = span.dataset.origText;

    if (span.scrollWidth > span.clientWidth + 2) {
        container.classList.remove('is-returning', 'is-resting');
        container.classList.add('is-scrolling');

        const existingReturn = returnAnimMap.get(span);
        if (existingReturn) existingReturn.cancel();

        const measureSpan = document.createElement('span');
        measureSpan.style.visibility = 'hidden';
        measureSpan.style.position = 'absolute';
        measureSpan.style.whiteSpace = 'nowrap';
        measureSpan.style.font = window.getComputedStyle(span).font;
        const gapText = '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0'; 
        measureSpan.textContent = span.dataset.origText + gapText;
        document.body.appendChild(measureSpan);
        const shiftDist = measureSpan.getBoundingClientRect().width;
        document.body.removeChild(measureSpan);

        span.textContent = span.dataset.origText + gapText + span.dataset.origText;

        span.animate([
            { opacity: 0.4, filter: 'blur(3px)' },
            { opacity: 1, filter: 'blur(0)' }
        ], { duration: 350, easing: 'ease-out' });

        const speed = 35; 
        const tOut = shiftDist * speed; 
        const tPause = 800; 
        const totalT = tPause + tOut; 

        const anim = span.animate([
            { transform: 'translateX(0px)', offset: 0 },
            { transform: 'translateX(0px)', offset: tPause / totalT },
            { transform: `translateX(-${shiftDist}px)`, offset: 1 }
        ], {
            duration: totalT,
            iterations: Infinity,
            easing: 'linear'
        });

        scrollAnimMap.set(span, anim);
    }
});

document.addEventListener('mouseout', function(e) {
    const container = e.target.closest('.marquee-container');
    if (!container) return;
    if (e.relatedTarget && container.contains(e.relatedTarget)) return;

    const span = container.querySelector('span');
    if (!span) return;

    if (container.classList.contains('is-scrolling')) {
        const anim = scrollAnimMap.get(span);
        let currentX = 0;

        if (anim) {
            const currentTransform = window.getComputedStyle(span).transform;
            if (currentTransform !== 'none') {
                const match = currentTransform.match(/matrix\((.+)\)/);
                if (match) currentX = parseFloat(match[1].split(', ')[4]);
            }
            anim.cancel();
            scrollAnimMap.delete(span);
        }

        container.classList.remove('is-scrolling');
        container.classList.add('is-returning');

        const returnAnim = span.animate([
            { transform: `translateX(${currentX}px)` },
            { transform: 'translateX(0px)' }
        ], {
            duration: 500, 
            easing: 'cubic-bezier(0.22, 1, 0.36, 1)' 
        });
        
        returnAnim.onfinish = () => { 
            span.style.transform = 'translateX(0px)'; 
            span.animate([
                { opacity: 0.3, filter: 'blur(4px)' },
                { opacity: 1, filter: 'blur(0)' }
            ], { duration: 350, easing: 'ease-out' });

            if (span.dataset.origText) span.textContent = span.dataset.origText; 
            container.classList.remove('is-returning');
            
            container.classList.add('is-resting');
            setTimeout(() => container.classList.remove('is-resting'), 300); 
        };
        
        returnAnimMap.set(span, returnAnim);
    }
});

let isFastScrolling = false;
let scrollTimer = null;
let scrollFramePending = false;

function handleScrollEvent() {
    if (!isFastScrolling) {
        if (!scrollFramePending) {
            scrollFramePending = true;
            requestAnimationFrame(() => {
                isFastScrolling = true;
                document.body.classList.add('scrolling');
                scrollFramePending = false;
            });
        }
    }
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
        isFastScrolling = false;
        document.body.classList.remove('scrolling');
    }, 120);
}

/* ==========================================================================
   [10. APP SWITCHER & PAGE NAVIGATION ENGINE]
   ========================================================================== */
window.addEventListener('DOMContentLoaded', () => {
    resetScrollPosition();
    renderHubTasks();
    checkAutoStart();

    document.querySelectorAll('.hub-scroll-zone').forEach(el => {
        el.addEventListener('scroll', handleScrollEvent, { passive: true });
        el.addEventListener('touchmove', handleScrollEvent, { passive: true });
        el.addEventListener('wheel', handleScrollEvent, { passive: true });
    });

    const sphere = document.getElementById('glassSphere');
    const modal = document.getElementById('sphereModal');
    if (sphere && modal) {
        let sphereStartX, sphereStartY, initialLeft, initialTop;
        let isSphereDragging = false;

        sphere.addEventListener('pointerdown', (e) => {
            isSphereDragging = false;
            sphereStartX = e.clientX;
            sphereStartY = e.clientY;
            
            const rect = sphere.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            sphere.setPointerCapture(e.pointerId);
            
            const onSphereMove = (moveEvent) => {
                const deltaX = moveEvent.clientX - sphereStartX;
                const deltaY = moveEvent.clientY - sphereStartY;
                
                if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
                    isSphereDragging = true;
                    sphere.style.right = 'auto'; 
                    sphere.style.bottom = 'auto';
                    
                    let newLeft = Math.max(0, Math.min(initialLeft + deltaX, window.innerWidth - 64));
                    let newTop = Math.max(0, Math.min(initialTop + deltaY, window.innerHeight - 64));
                    
                    sphere.style.left = newLeft + 'px';
                    sphere.style.top = newTop + 'px';
                }
            };
            
            const onSphereUp = (upEvent) => {
                sphere.removeEventListener('pointermove', onSphereMove);
                sphere.removeEventListener('pointerup', onSphereUp);
                sphere.releasePointerCapture(e.pointerId);
                
                if (!isSphereDragging) {
                    modal.classList.remove('hidden');
                }
            };
            
            sphere.addEventListener('pointermove', onSphereMove);
            sphere.addEventListener('pointerup', onSphereUp);
        });
    }

    let timerSliderTimeout;
    const timerRadios = Array.from(document.querySelectorAll('input[name="timerMode"]'));
    let currentTimerIndex = timerRadios.findIndex(radio => radio.checked);
    if (currentTimerIndex === -1) currentTimerIndex = 0;

    timerRadios.forEach((radio, index) => {
        radio.addEventListener('change', () => {
            const slider = document.querySelector('.toggle-slider');
            if (!slider) return;

            clearTimeout(timerSliderTimeout);
            const isMovingRight = index > currentTimerIndex;
            currentTimerIndex = index;

            slider.classList.remove("is-sliding-right", "is-sliding-left");
            void slider.offsetWidth; 

            if (isMovingRight) {
                slider.classList.add("is-sliding-right");
            } else {
                slider.classList.add("is-sliding-left");
            }

            timerSliderTimeout = setTimeout(() => {
                slider.classList.remove("is-sliding-right", "is-sliding-left");
            }, 430);
        });
    });

    document.querySelectorAll('a[href^="./"]').forEach(link => {
        link.addEventListener('click', (e) => {
            const targetUrl = link.getAttribute('href');
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            const targetPath = targetUrl.replace('./', '');
            if (currentPath === targetPath) return;
            e.preventDefault();
            const appContainer = document.querySelector('.setup-layout');
            if (appContainer) {
                appContainer.classList.add('page-transition-leave');
                setTimeout(() => { window.location.href = targetUrl; }, 400);
            } else {
                window.location.href = targetUrl;
            }
        });
    });

    document.querySelectorAll('a[href*="Home.html"]').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const href = a.getAttribute('href');
            sessionStorage.setItem('nav_from_home', 'true');
            const pageTargets = document.querySelectorAll('.sidebar, .panel, .main, #setupPanel, #hubPanel, #timerPanel, .glass-resizer-bar');
            pageTargets.forEach(el => el.classList.add('page-transition-leave', 'page-leave-to-home'));
            setTimeout(() => { window.location.href = href; }, 400);
        });
    });

    let switcherState = 'closed';
    const switcherOverlay = document.getElementById('appSwitcherOverlay');
    const switcherTrack = document.getElementById('dynamicSwitcherTrack');
    const miniIcons = Array.from(switcherTrack.querySelectorAll('.mini-app-icon'));
    const logoTrigger = document.getElementById('logoTrigger');

    let isDraggingSwitcher = false;
    let startDragX = 0;
    let startTrackX = 0;
    const iconSpacing = 68; 
    let BASE_X = 0;
    let trackX = 0;

    let currentIndex = 0; 
    let currentPath = window.location.pathname.split('/').pop() || 'index.html';
    miniIcons.forEach((icon, i) => {
        const href = icon.getAttribute('data-href');
        if (href && href.includes(currentPath.replace('.html', ''))) {
            currentIndex = i;
        }
    });

    function setIconUnfoldPositions(open) {
        miniIcons.forEach((icon, i) => {
            if (open) {
                icon.style.setProperty('--unfold-x', '0px');
                icon.style.opacity = '1';
            } else {
                const foldOffset = -(i - currentIndex) * iconSpacing;
                icon.style.setProperty('--unfold-x', `${foldOffset}px`);
                if (i !== currentIndex) {
                    icon.style.opacity = '0';
                } else {
                    icon.style.opacity = '1';
                }
            }
        });
    }

    setIconUnfoldPositions(false);
    let closeTimeoutTimer = null;

    window.openAppSwitcher = function() {
        if (switcherState === 'opened') return;
        switcherState = 'opened';
        window.__switcherState = 'opened';
        
        document.body.classList.add('app-switcher-open');
        document.documentElement.classList.add('app-switcher-open');
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
        
        if (closeTimeoutTimer) {
            clearTimeout(closeTimeoutTimer);
            closeTimeoutTimer = null;
        }

        if (logoTrigger) {
            logoTrigger.style.setProperty('transition', 'none', 'important');
            logoTrigger.style.transform = 'none';
            void logoTrigger.offsetWidth;
        }

        const triggerRect = logoTrigger.getBoundingClientRect();
        const targetCenterX = triggerRect.left + triggerRect.width / 2;
        const targetCenterY = triggerRect.top + triggerRect.height / 2;
        
        switcherTrack.style.top = `${targetCenterY - 24}px`;
        switcherTrack.style.left = `0px`; 
        
        BASE_X = targetCenterX - 24; 
        trackX = BASE_X - currentIndex * iconSpacing;
        
        if (logoTrigger) {
            logoTrigger.style.visibility = 'hidden';
            logoTrigger.style.opacity = '0';
            logoTrigger.style.pointerEvents = 'none';
        }

        updateTrackPosition(false);
        setIconUnfoldPositions(false);
        void switcherTrack.offsetWidth;
        
        switcherOverlay.classList.add('open');
        switcherTrack.classList.add('open');
        
        requestAnimationFrame(() => {
            updateTrackPosition(true);
            setIconUnfoldPositions(true);
        });
    };

    window.closeAppSwitcher = function() {
        if (switcherState === 'closed') return;
        switcherState = 'closed';
        window.__switcherState = 'closed';
        
        document.body.classList.remove('app-switcher-open');
        document.documentElement.classList.remove('app-switcher-open');
        document.body.style.overflow = '';
        document.documentElement.style.overflow = '';
        
        switcherOverlay.classList.remove('open');
        setIconUnfoldPositions(false);

        const anchorIcon = miniIcons[currentIndex];
        if (anchorIcon) {
            anchorIcon.classList.remove('is-anchor');
            anchorIcon.classList.add('is-folding-back');
        }

        if (closeTimeoutTimer) clearTimeout(closeTimeoutTimer);

        closeTimeoutTimer = setTimeout(() => {
            if (switcherState === 'closed') {
                switcherTrack.classList.remove('open');
                if (anchorIcon) {
                    anchorIcon.classList.remove('is-folding-back');
                }
                if (logoTrigger) {
                    logoTrigger.style.setProperty('transition', 'none', 'important');
                    logoTrigger.style.transform = 'none';
                    logoTrigger.style.visibility = 'visible';
                    logoTrigger.style.opacity = '1';
                    logoTrigger.style.pointerEvents = 'auto';
                    void logoTrigger.offsetWidth;
                    requestAnimationFrame(() => {
                        if (logoTrigger) {
                            logoTrigger.style.removeProperty('transition');
                            logoTrigger.style.removeProperty('transform');
                        }
                    });
                }
            }
        }, 450);
    };

    switcherOverlay.addEventListener('click', closeAppSwitcher);

    function preventSwitcherScroll(e) {
        if (switcherState === 'opened') {
            if (e.cancelable) {
                e.preventDefault();
            }
        }
    }

    function preventSwitcherKeyScroll(e) {
        if (switcherState === 'opened') {
            const scrollKeys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Space', ' ', 'Home', 'End'];
            if (scrollKeys.includes(e.key) || scrollKeys.includes(e.code)) {
                const tag = document.activeElement ? document.activeElement.tagName : '';
                if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                    e.preventDefault();
                }
            }
            if (e.key === 'Escape' || e.code === 'Escape') {
                closeAppSwitcher();
            }
        }
    }

    window.addEventListener('wheel', preventSwitcherScroll, { passive: false });
    window.addEventListener('touchmove', preventSwitcherScroll, { passive: false });
    window.addEventListener('keydown', preventSwitcherKeyScroll, { passive: false });

    function updateTrackPosition(animate = false) {
        if (animate) {
            switcherTrack.style.transition = 'opacity 0.4s ease, visibility 0s 0s';
        } else {
            switcherTrack.style.transition = 'none';
        }
        
        switcherTrack.style.setProperty('--track-x', `${trackX}px`);
        
        miniIcons.forEach((icon, i) => {
            if (animate) {
                icon.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease';
            } else {
                icon.style.transition = 'transform 0s, background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, opacity 0.4s ease';
            }
            
            const iconCenterRelative = 24 + i * iconSpacing;
            const dist = Math.abs((trackX + iconCenterRelative) - (BASE_X + 24));
            
            let scale = 1.0;
            if (dist < iconSpacing) {
                const factor = 1 - (dist / iconSpacing);
                scale = 1.0 + ((56 / 48) - 1.0) * factor;
            }
            
            icon.style.setProperty('--icon-scale', scale);
            
            if (dist < 10) {
                icon.classList.add('is-anchor');
            } else {
                icon.classList.remove('is-anchor');
            }
        });
    }

    switcherTrack.addEventListener('pointerdown', (e) => {
        isDraggingSwitcher = true;
        startDragX = e.clientX;
        startTrackX = trackX;
        switcherTrack.setPointerCapture(e.pointerId);
    });

    switcherTrack.addEventListener('pointermove', (e) => {
        if (!isDraggingSwitcher) return;
        const deltaX = e.clientX - startDragX;
        trackX = startTrackX + deltaX;
        
        const minTrackX = BASE_X - (miniIcons.length - 1) * iconSpacing;
        const maxTrackX = BASE_X;
        
        if (trackX > maxTrackX) {
            trackX = maxTrackX + (trackX - maxTrackX) * 0.3;
        } else if (trackX < minTrackX) {
            trackX = minTrackX + (trackX - minTrackX) * 0.3;
        }
        
        updateTrackPosition(false);
    });

    switcherTrack.addEventListener('pointerup', (e) => {
        if (!isDraggingSwitcher) return;
        isDraggingSwitcher = false;
        switcherTrack.releasePointerCapture(e.pointerId);
        
        const deltaX = e.clientX - startDragX;
        if (Math.abs(deltaX) < 5) return;
        snapToClosest();
    });

    switcherTrack.addEventListener('pointercancel', () => {
        if (!isDraggingSwitcher) return;
        isDraggingSwitcher = false;
        snapToClosest();
    });

    function snapToClosest() {
        let closestIndex = Math.round((BASE_X - trackX) / iconSpacing);
        closestIndex = Math.max(0, Math.min(miniIcons.length - 1, closestIndex));
        
        currentIndex = closestIndex;
        trackX = BASE_X - currentIndex * iconSpacing;
        updateTrackPosition(true);
        checkSwitchPage();
    }
    
    function checkSwitchPage() {
        const icon = miniIcons[currentIndex];
        const href = icon.getAttribute('data-href');
        if (!href) return;
        
        const targetPath = href.replace('./', '');
        if (currentPath !== targetPath) {
            switcherTrack.style.pointerEvents = 'none';
            switcherOverlay.style.pointerEvents = 'none';
            
            const isToHome = targetPath.toLowerCase().includes('home.html');
            if (isToHome) {
                sessionStorage.setItem('nav_from_home', 'true');
            }

            setTimeout(() => {
                miniIcons.forEach((ic, idx) => {
                    if (idx !== currentIndex) {
                        ic.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                        ic.style.opacity = '0';
                        ic.style.transform = `translateX(${-(idx - currentIndex) * iconSpacing}px) scale(0.8)`;
                    } else {
                        setTimeout(() => {
                            ic.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                            ic.style.opacity = '0';
                            ic.style.transform = 'scale(1.1)';
                        }, 200);
                    }
                });

                switcherOverlay.style.transition = 'background 0.6s ease, backdrop-filter 0.6s ease';
                switcherOverlay.style.background = 'rgba(246, 248, 250, 0.9)';
                switcherOverlay.style.backdropFilter = 'blur(40px) saturate(100%)';
                switcherOverlay.style.webkitBackdropFilter = 'blur(40px) saturate(100%)';

                const animTargets = document.querySelectorAll('.sidebar, .panel, .main, #setupPanel, #hubPanel, #timerPanel, .glass-resizer-bar, .page-anim-target');

                animTargets.forEach(el => {
                    if (isToHome) {
                        el.classList.add('page-transition-leave', 'page-leave-to-home');
                    } else {
                        el.classList.add('page-transition-leave');
                    }
                });
                
                setTimeout(() => window.location.href = href, 600);
            }, 50);
        }
    }

    miniIcons.forEach((icon, i) => {
        icon.addEventListener('click', (e) => {
            if (isDraggingSwitcher && Math.abs(trackX - startTrackX) > 5) {
                e.preventDefault();
                return;
            }
            
            if (currentIndex === i) {
                closeAppSwitcher();
                return;
            }
            
            currentIndex = i;
            trackX = BASE_X - currentIndex * iconSpacing;
            updateTrackPosition(true);
            checkSwitchPage();
        });
    });
});

document.addEventListener('dblclick', (e) => {
    const timerPanelEl = document.getElementById('timerPanel');
    const pipModal = document.getElementById('sphereModal');
    
    if (!timerPanelEl.classList.contains('hidden') && 
        (pipModal ? pipModal.classList.contains('hidden') : true)) {
        
        if (!timerPanelEl.contains(e.target)) {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn('ALPHA 全屏请求被拒绝:', err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            e.preventDefault();
            window.getSelection().removeAllRanges();
        }
    }
});

function updateYellowBackgroundContact() {
    const targetCards = document.querySelectorAll('.task-card, #hubTaskList .task-card');
    const yellowElements = document.querySelectorAll('.alpha-ambient-bg .sunbeam, .alpha-ambient-bg .orb-3');
    if (!targetCards.length || !yellowElements.length) return;

    const yellowRects = Array.from(yellowElements).map(el => el.getBoundingClientRect());

    targetCards.forEach(card => {
        const cardRect = card.getBoundingClientRect();
        if (cardRect.width === 0 || cardRect.height === 0) return;

        const isContact = yellowRects.some(yellowRect => {
            return !(
                cardRect.right <= yellowRect.left ||
                cardRect.left >= yellowRect.right ||
                cardRect.bottom <= yellowRect.top ||
                cardRect.top >= yellowRect.bottom
            );
        });

        card.classList.toggle('yellow-contact', isContact);
    });
}

window.updateYellowBackgroundContact = updateYellowBackgroundContact;

var _yellowRAF = 0;
function scheduleYellowUpdate() {
    if (_yellowRAF) return;
    _yellowRAF = requestAnimationFrame(function() {
        _yellowRAF = 0;
        updateYellowBackgroundContact();
    });
}
var _yellowResizeTimer = 0;
function scheduleYellowResize() {
    clearTimeout(_yellowResizeTimer);
    _yellowResizeTimer = setTimeout(updateYellowBackgroundContact, 200);
}
window.addEventListener('scroll', scheduleYellowUpdate, { passive: true, capture: true });
window.addEventListener('resize', scheduleYellowResize, { passive: true });
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateYellowBackgroundContact);
} else {
    updateYellowBackgroundContact();
}

document.addEventListener('visibilitychange', () => {
    document.querySelector('.alpha-ambient-bg')
        ?.classList.toggle('is-paused', document.hidden);
});
</script>
