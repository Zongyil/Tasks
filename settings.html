<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="preload" href="./fonts/OPPO Sans 4.0.ttf" as="font" type="font/truetype" crossorigin>
    <meta charset="UTF-8">
    <title>设置</title>
    <script src="./assets/liquid-glass.js"></script>
    <script src="./assets/card-glow.js"></script>
    <script src="./assets/input-glow.js"></script>
    <script src="./assets/switch-drag.js"></script>
    <script src="./assets/scroll-bounce.js"></script>
    <script src="./assets/reduce-motion.js"></script>
    <style>
@font-face {
  font-family: 'OPPO Sans 4.0';
  src: url('local-font://OPPO%20Sans%204.0.ttf') format('truetype'),
       url('./fonts/OPPO Sans 4.0.ttf') format('truetype');
  font-weight: 1 999;
  font-style: normal;
  font-display: block;
}

        ::selection { background-color: #d4ebff; color: #0f172a; }
        ::-moz-selection { background-color: #9DD2FF; color: #0f172a; }

        /* ==========================================
           1. 核心变量与圆角体系 (Concentric Radius System)
           ========================================== */
        :root {
            --text: #0f172a; 
            --sub: #64748b;
            --monet-blue: #9DD2FF;
            --monet-text: #2F354F;
            --theme-hue: 210; /* 默认主题色相 */
            --monet-blue-xglass: #bad1e5;
            
            --glass: rgba(255, 255, 255, 0.18);
            --glass-border: rgba(255, 255, 255, 0.46);
            
            --shadow-lg: 0 24px 64px rgba(15,23,42,.06);
            --shadow-md: 0 16px 40px rgba(15,23,42,.05);
            
            --spacing-main: 32px;   
            --spacing-card: 24px;   
            --spacing-inside: 16px; 
            
            --radius-panel: 32px;   /* L1 */
            --radius-card: 24px;    /* L2 */
            --radius-element: 16px; /* L3 */
            --radius-sub: 13px;
            --radius-sm: 10px;      /* L4 */

            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'OPPO Sans 4.0', -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            outline: none !important; 
            user-select: none;
            -webkit-user-select: none;
        }

        html { 
            user-select: none;
            -webkit-user-select: none;
        }

        input, textarea, select, [contenteditable="true"], [contenteditable] {
            user-select: text !important;
            -webkit-user-select: text !important;
        }

        ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
        
        body { min-height: 100vh;
            margin: 0;
            padding: 32px; 
            color: var(--text);
            color-scheme: light;
            /* 1. 将底色剥离到 body, 作为最安全的托底, 防止动画穿帮 */
            background-color: #f6f8fa; 
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            scrollbar-width: none; -ms-overflow-style: none;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 2. 赋予流光容器生命 - 恢复原版清冷灰蓝底色 */
        .alpha-ambient-bg { position: fixed;
            inset: 0;
            z-index: -3;
            overflow: hidden;
            background-color: #f4f8fc; /* 恢复你原版极其微弱的冷灰蓝底色 */
            opacity: 0.97;
            pointer-events: none;
            contain: layout paint;
            isolation: isolate;
        }
        .alpha-bg-snapshot {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.22s ease-out;
        }
        .alpha-ambient-bg.is-bg-frozen .ambient-motion-stage {
            visibility: hidden !important;
        }


        /* ================== 环境光合成优化版 ================== */
        .ambient-motion-stage {
            position: absolute;
            pointer-events: none;
            will-change: transform, opacity;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        .stage-sunbeam {
            top: -10%; right: -5%; width: 35vw; height: 80vh;
            transform-origin: top right;
            animation: none;
        }

        .stage-orb-1 {
            top: -15%; right: -15%; width: 68vw; height: 58vw;
            animation: none;
        }

        .stage-orb-2 {
            bottom: -20%; left: -20%; width: 76vw; height: 64vw;
            animation: none;
        }

        .stage-orb-3 {
            top: 20%; left: 30%; width: 58vw; height: 48vw;
            animation: none;
        }

        body.enable-bg-motion .stage-sunbeam,
        html.enable-bg-motion .stage-sunbeam {
            animation: sunbeam-pulse 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.enable-bg-motion .stage-orb-1,
        html.enable-bg-motion .stage-orb-1 {
            animation: orb-drift-1 18s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.enable-bg-motion .stage-orb-2,
        html.enable-bg-motion .stage-orb-2 {
            animation: orb-drift-2 22s infinite alternate-reverse cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.enable-bg-motion .stage-orb-3,
        html.enable-bg-motion .stage-orb-3 {
            animation: orb-drift-3 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sunbeam {
            position: absolute; inset: 0;
            /* 暖色明暗波带 */
            background:
                radial-gradient(ellipse 102% 17% at 82% 10%, rgba(255, 245, 210, 0.32) 0 17%, rgba(255, 245, 210, 0.07) 43%, transparent 70%),
                radial-gradient(ellipse 94% 16% at 69% 27%, rgba(255, 235, 190, 0.05) 0 15%, rgba(255, 235, 190, 0.25) 33%, rgba(255, 235, 190, 0.05) 53%, transparent 73%),
                radial-gradient(ellipse 110% 18% at 84% 44%, rgba(255, 245, 210, 0.27) 0 16%, rgba(255, 245, 210, 0.06) 42%, transparent 72%),
                radial-gradient(ellipse 96% 16% at 66% 61%, rgba(255, 235, 190, 0.04) 0 14%, rgba(255, 235, 190, 0.22) 34%, rgba(255, 235, 190, 0.04) 55%, transparent 75%),
                radial-gradient(ellipse 104% 19% at 86% 77%, rgba(255, 245, 210, 0.22) 0 17%, rgba(255, 245, 210, 0.05) 44%, transparent 74%);
            filter: blur(16px);
        }
        .orb { 
            position: absolute;
            inset: 0;
            border-radius: 46% 54% 52% 48% / 42% 48% 52% 58%;
            /* 适度收窄模糊, 让波带可被隐约察觉, 但仍保持烟雾般柔软 */
            filter: blur(17px);
            opacity: 0.84;
        }
        /* 每个光团只重复自己的原色；五条主波带与一层薄雾底光交错 */
        .orb-1 { background:
            radial-gradient(ellipse 104% 17% at 72% 12%, rgba(157, 210, 255, 0.40) 0 16%, rgba(157, 210, 255, 0.07) 43%, transparent 69%),
            radial-gradient(ellipse 92% 16% at 50% 30%, rgba(157, 210, 255, 0.05) 0 14%, rgba(157, 210, 255, 0.34) 32%, rgba(157, 210, 255, 0.05) 53%, transparent 72%),
            radial-gradient(ellipse 108% 18% at 74% 47%, rgba(157, 210, 255, 0.35) 0 16%, rgba(157, 210, 255, 0.06) 43%, transparent 71%),
            radial-gradient(ellipse 96% 16% at 48% 64%, rgba(157, 210, 255, 0.04) 0 14%, rgba(157, 210, 255, 0.30) 33%, rgba(157, 210, 255, 0.05) 54%, transparent 73%),
            radial-gradient(ellipse 102% 18% at 69% 81%, rgba(157, 210, 255, 0.31) 0 16%, rgba(157, 210, 255, 0.05) 44%, transparent 72%),
            radial-gradient(ellipse at 59% 48%, rgba(157, 210, 255, 0.10) 0%, transparent 82%);
            }
        .orb-2 { background:
            radial-gradient(ellipse 106% 17% at 31% 12%, rgba(220, 210, 255, 0.36) 0 16%, rgba(220, 210, 255, 0.06) 43%, transparent 70%),
            radial-gradient(ellipse 94% 16% at 57% 30%, rgba(220, 210, 255, 0.04) 0 14%, rgba(220, 210, 255, 0.32) 32%, rgba(220, 210, 255, 0.05) 53%, transparent 72%),
            radial-gradient(ellipse 110% 18% at 35% 47%, rgba(220, 210, 255, 0.32) 0 16%, rgba(220, 210, 255, 0.05) 43%, transparent 71%),
            radial-gradient(ellipse 98% 16% at 60% 64%, rgba(220, 210, 255, 0.04) 0 14%, rgba(220, 210, 255, 0.28) 33%, rgba(220, 210, 255, 0.04) 54%, transparent 73%),
            radial-gradient(ellipse 104% 18% at 38% 81%, rgba(220, 210, 255, 0.28) 0 16%, rgba(220, 210, 255, 0.05) 44%, transparent 72%),
            radial-gradient(ellipse at 46% 50%, rgba(220, 210, 255, 0.10) 0%, transparent 83%);
            }
        .orb-3 { background:
            radial-gradient(ellipse 102% 17% at 65% 12%, rgba(255, 230, 190, 0.35) 0 16%, rgba(255, 230, 190, 0.06) 43%, transparent 69%),
            radial-gradient(ellipse 92% 16% at 42% 30%, rgba(255, 230, 190, 0.04) 0 14%, rgba(255, 230, 190, 0.30) 32%, rgba(255, 230, 190, 0.04) 53%, transparent 72%),
            radial-gradient(ellipse 108% 18% at 68% 47%, rgba(255, 230, 190, 0.30) 0 16%, rgba(255, 230, 190, 0.05) 43%, transparent 71%),
            radial-gradient(ellipse 96% 16% at 41% 64%, rgba(255, 230, 190, 0.04) 0 14%, rgba(255, 230, 190, 0.26) 33%, rgba(255, 230, 190, 0.04) 54%, transparent 73%),
            radial-gradient(ellipse 102% 18% at 66% 81%, rgba(255, 230, 190, 0.27) 0 16%, rgba(255, 230, 190, 0.05) 44%, transparent 72%),
            radial-gradient(ellipse at 53% 49%, rgba(255, 230, 190, 0.09) 0%, transparent 82%);
            }

        /* 错落有致的非线性运动轨迹 (加入了 translate3d 强制触发 GPU 渲染防静止) */
        @keyframes orb-drift-1 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-15vw, 12vh, 0) scale(1.15); }
        }
        @keyframes orb-drift-2 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(12vw, -12vh, 0) scale(0.95); }
        }
        @keyframes orb-drift-3 {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(-10vw, -15vh, 0) scale(1.2); }
        }
        @keyframes sunbeam-pulse {
            0% { transform: rotate(0deg) scale(1) translate3d(0, 0, 0); opacity: 0.5; }
            100% { transform: rotate(-3deg) scale(1.02) translate3d(-1vw, 1vh, 0); opacity: 1; }
        }

        .alpha-ambient-bg.is-paused .ambient-motion-stage,
        body.scrolling .alpha-ambient-bg .ambient-motion-stage,
        body.pause-bg-motion .alpha-ambient-bg .ambient-motion-stage,
        html.pause-bg-motion .alpha-ambient-bg .ambient-motion-stage {
            animation-play-state: paused !important;
        }

        /* Glass Reflection - 液态高光微折射层 (保持静止) */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1; 
            pointer-events: none;
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.05) 0%,
                    rgba(255, 255, 255, 0.01) 25%,
                    transparent 50%,
                    transparent 75%,
                    rgba(255, 255, 255, 0.03) 100%
                );
        }

        /* ==========================================
           3. 设置中心主面板 (Liquid Panel)
           ========================================== */
        .settings-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-main);
        }

        .panel {
            background: var(--glass); 

            border-top: 1.5px solid var(--glass-border);
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);

            backdrop-filter: blur(40px) saturate(130%); 
            -webkit-backdrop-filter: blur(40px) saturate(130%);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.18),
                0 18px 52px rgba(255, 255, 255, 0.22),
                0 24px 64px rgba(15, 23, 42, 0.045),
                inset 0 2px 7px rgba(255, 255, 255, 0.48),
                inset 0 1px 1px rgba(255, 255, 255, 0.92),
                inset 1.5px 0 2px rgba(255, 255, 255, 0.12) !important;
            border-radius: var(--radius-panel); 
            padding: var(--spacing-main);
            z-index: 10;
        }

        /* ==========================================
           标题行与返回按钮
           ========================================== */
        .header-row { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
        .header-text { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            gap: 8px; 
        }
        .header-title { 
            font-size: 26px; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            margin-bottom: 0; 
            color: #0f172a; 
            line-height: 1; 
        }
        .header-sub { 
            font-size: 14px; 
            font-weight: 500; 
            color: var(--sub); 
            margin-bottom: 0; 
            line-height: 1; 
        }
        
        .back-btn {
            width: 44px; height: 44px; padding: 0; 
            border-radius: var(--radius-element); 
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(40px) saturate(130%);
            -webkit-backdrop-filter: blur(40px) saturate(130%);
            box-shadow: 0 4px 12px rgba(15,23,42,0.04), inset 0 2px 4px rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center;
            color: #475569; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }
        .back-btn:hover { 
            background: rgba(255, 255, 255, 0.85); transform: translateX(-2px) scale(1.05); 
            color: #0f172a; box-shadow: 0 8px 24px rgba(15,23,42,0.06), inset 0 2px 4px rgba(255,255,255,1);
        }
        .back-btn:active {
            box-shadow: 0 4px 12px rgba(15,23,42,0.04), inset 0 1px 2px rgba(255,255,255,0.8);
        }
        .group-title { font-size: 16px; font-weight: 800; color: #475569; margin: 32px 0 16px 8px; letter-spacing: 0.5px; }

        /* ==========================================
           4. 卡片容器与交互项目 (Cards & Items)
           ========================================== */
        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.20) 100%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(40px) saturate(130%);
            -webkit-backdrop-filter: blur(40px) saturate(130%);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04), inset 0 2px 4px rgba(255, 255, 255, 1), inset 0 -1px 2px rgba(255, 255, 255, 0.10);
            border-radius: var(--radius-card);
            padding: 8px; /* 内部用 padding 包裹列表项 */
            transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }

        /* 账户卡片专属 Hover 与轻量回弹动效 */
        .account-card {
            padding: var(--spacing-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            will-change: transform;
            transform-origin: center center;
            transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
        }
        .account-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08), inset 0 2px 4px rgba(255, 255, 255, 1);
        }
        .account-card:active {
            transform: translateY(0) scale(0.985) !important;
            transition: transform 0.06s ease-out !important;
        }

        @keyframes accountCardBounce {
            0% { transform: translateY(0) scale(0.985); }
            50% { transform: translateY(-2px) scale(1.006); }
            100% { transform: translateY(-2px) scale(1); }
        }

        .account-card.anim-bounce {
            animation: accountCardBounce 0.28s cubic-bezier(0.34, 1.25, 0.64, 1) forwards !important;
        }
        .account-info { display: flex; align-items: center; gap: 16px; }
        .avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.40), 0 4px 12px rgba(15,23,42,0.1); border: 2px solid #fff; }
        .acc-name { font-size: 18px; font-weight: 800; color: #0f172a; }
        .acc-email { font-size: 13px; font-weight: 500; color: var(--sub); margin-top: 4px; }
        .chevron { 
            color: #94a3b8; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transition: transform 0.3s var(--ease), color 0.3s var(--ease); 
        }
        .account-card:hover .chevron { transform: translateX(4px); color: #0f172a; }

        /* 通用设置列表项 */
        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px;
            border-radius: var(--radius-element);
            transition: background 0.3s var(--ease);
        }
        .setting-item:hover { background: rgba(255, 255, 255, 0.30); }
        .setting-text h3 { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .setting-text p { font-size: 13px; font-weight: 500; color: #64748b; line-height: 1.5; }

        /* ==========================================
           5. 完美复现: 物理阻尼开关 (Alpha Switch)
           ========================================== */
        .switch-wrap { display: inline-flex; align-items: center; cursor: pointer; }
        .switch-wrap input { display: none; }
        
        .alpha-switch {
            position: relative;
            display: inline-block;
            width: 36px;         /* 整体缩窄 */     
            height: 22px;        /* 整体变矮 */
            border-radius: 99px;
            background-color: rgba(150, 155, 165, 0.32); 
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.22), inset 0 -1px 2px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            flex-shrink: 0;      
            cursor: pointer;
        }

        /* 轨道动画: 速率翻倍至 0.5s */
        input:checked + .alpha-switch {
            animation: alpha-bg-on .32s cubic-bezier(.22,1,.36,1) forwards;
        }

        input:not(:checked) + .alpha-switch {
            animation: alpha-bg-off .32s cubic-bezier(.22,1,.36,1) forwards;
        }

        /* 滑块 Knob: 等比缩小, 维持完美圆角 */
        .alpha-switch::after {
            content:'';
            position:absolute;
            box-sizing: border-box;

            left:3px;
            top:50%;

            width:16px;
            height:16px;

            border-radius:999px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.7) 100%);
            border: 1px solid rgba(255, 255, 255, 0.9);

            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 1),
                inset 0 -1px 2px rgba(0, 0, 0, 0.08),
                0 2px 5px rgba(0, 0, 0, 0.15);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            transform:
                translate(0,-50%);
        }

        /* 开启与关闭: 触发 0.5s 高速物理形变 */
        input:checked + .alpha-switch::after {
            animation: alpha-slide-on .32s forwards;
        }

        input:not(:checked) + .alpha-switch::after {
            animation: alpha-slide-off .32s forwards;
        }

        /* =======================================
        衬底变色引擎: 维持 1/2 处渐变融合逻辑
        ======================================= */
        @keyframes alpha-bg-on {
            0%, 50% {
                background-color: rgba(186, 190, 199, 0.12);
                border-color: rgba(255, 255, 255, 0.2);
                box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.19), inset 0 -1px 2px rgba(255, 255, 255, 0.12);
            }
            100% {
                background-color: rgba(109, 182, 255, 0.19);
                border-color: rgba(255, 255, 255, 0.75);
                box-shadow: 0 0 14px rgba(239, 250, 255, 0.55), 0 2px 8px rgba(160, 220, 255, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            }
        }

        @keyframes alpha-bg-off {
            0%, 50% {
                background-color: rgba(109, 182, 255, 0.19);
                border-color: rgba(255, 255, 255, 0.75);
                box-shadow: 0 0 14px rgba(239, 250, 255, 0.55), 0 2px 8px rgba(160, 220, 255, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.5);
            }
            100% {
                background-color: rgba(186, 190, 199, 0.12);
                border-color: rgba(255, 255, 255, 0.2);
                box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.19), inset 0 -1px 2px rgba(255, 255, 255, 0.12);
            }
        }

        /* =======================================
        动效骨架 (根据新尺寸重算形变体积与行程)
        ======================================= */
        @keyframes alpha-slide-on {
            0% {
                width: 16px;
                height: 16px;
                transform:translate(0,-50%);
                animation-timing-function: cubic-bezier(0.25, 1.00, 0.75, 1.00);
            }
            5% { 
                /* Anticipation (蓄力): 略微变宽 */
                width: 18px;
                height: 14px;
                transform:translate(-.5px,-50%);
                animation-timing-function: cubic-bezier(0.25, 0.00, 0.75, 0.00);
            }
            50% { 
                /* Motion (冲刺): 高速形变为药丸状 */
                width: 24px;
                height: 10px;
                transform:translate(3px,-50%); /* 完美居中 */
                animation-timing-function: cubic-bezier(0.25, 1.00, 0.75, 1.00);
            }
            80% { 
                /* Overshoot (撞击右壁): 瞬间纵向挤压 */
                width: 14px;
                height: 18px;
                transform:translate(15px,-50%);
                animation-timing-function: ease-out; /* 引导 80%->100% 恰好耗时 0.1s 的极速回弹 */
            }
            100% { 
                /* Settle (归位): 恢复完美圆形 */
                width: 16px;
                height: 16px;
                transform:translate(14px,-50%); /* 【重算行程】完美停止在 14px 处 */
            }
        }

        @keyframes alpha-slide-off {
            0% {
                width: 16px;
                height: 16px;
                transform:translate(14px,-50%);
                animation-timing-function: cubic-bezier(0.25, 1.00, 0.75, 1.00);
            }
            5% { 
                /* Anticipation (向右蓄力) */
                width: 18px;
                height: 14px;
                transform:translate(14.5px,-50%);
                animation-timing-function: cubic-bezier(0.25, 0.00, 0.75, 0.00);
            }
            50% { 
                /* Motion (向左冲刺药丸态) */
                width: 24px;
                height: 10px;
                transform:translate(3px,-50%);
                animation-timing-function: cubic-bezier(0.25, 1.00, 0.75, 1.00);
            }
            80% { 
                /* Overshoot (撞击左壁) */
                width: 14px;
                height: 18px;
                transform:translate(-1px,-50%);
                animation-timing-function: ease-out;
            }
            100% {
                width: 16px;
                height: 16px;

        .preview-board::before {

        }

        .clock-digit-slot {
            position: relative;
            overflow: visible; /* 允许上下退出时的文字和发光溢出边界 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem; 
            font-weight: 700;
            width: 0.65em;  /* 预留物理空间, 防止 absolute 后父容器塌陷 */
            height: 1.2em;
        }

        /* 核心: 文字本身剥离实体颜色, 注入光泽与反光 */
        .clock-time-node {
            position: absolute; left: 0; top: 0;

            display: flex; justify-content: center; align-items: center;

            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent; 
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.20);

(function initCardStacking() {
    var _stackingRAF = 0;
    function updateStacking() {
        document.querySelectorAll('.task-list, .side-list, .card-group, .task-container, .sidebar, .panel, main, section, div').forEach(container => {
            const children = Array.from(container.children).filter(el =>

            );
            if (children.length > 0) {
                const total = children.length;
                children.forEach((child, index) => {
                    child.style.setProperty('--card-z', total - index);
                });
            }
        });
    }
    function scheduleStacking() {
        if (_stackingRAF) return;
        _stackingRAF = requestAnimationFrame(function() {
            _stackingRAF = 0;
            updateStacking();
        });
    }
    const observer = new MutationObserver(scheduleStacking);
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            updateStacking();
            if (document.body) {
                observer.observe(document.body, { childList: true, subtree: true });
            }
        });
    } else {
        updateStacking();
        if (document.body) {
            observer.observe(document.body, { childList: true, subtree: true });
        }
    }
})();

<script>
(function alphaZoomGuard() {
    var zt = 0;
    var isScaling = false;
    var sharedCanvas = null;

    function ensureSnapshotOverlay(bgEl) {
        var snap = bgEl.querySelector('.alpha-bg-snapshot');
        if (!snap) {
            snap = document.createElement('div');
            snap.className = 'alpha-bg-snapshot';
            bgEl.insertBefore(snap, bgEl.firstChild);
        }
        return snap;
    }

    function captureBlurredBgPNG(bgEl, onDone) {
        try {
            var bw = window.innerWidth;
            var bh = window.innerHeight;
            var w = Math.floor(bw / 2);
            var h = Math.floor(bh / 2);

            if (!sharedCanvas) {
                sharedCanvas = document.createElement('canvas');
            }
            sharedCanvas.width = w;
            sharedCanvas.height = h;
            var ctx = sharedCanvas.getContext('2d');

            // Clone background element
            var clone = bgEl.cloneNode(true);
            var oldSnap = clone.querySelector('.alpha-bg-snapshot');
            if (oldSnap) oldSnap.remove();

            // Inline the computed positional and transform styles of dynamic stages
            var stages = bgEl.querySelectorAll('.ambient-motion-stage');
            var cloneStages = clone.querySelectorAll('.ambient-motion-stage');
            stages.forEach(function(origStage, idx) {
                if (cloneStages[idx]) {
                    var cs = window.getComputedStyle(origStage);
                    cloneStages[idx].style.width = cs.width;
                    cloneStages[idx].style.height = cs.height;
                    cloneStages[idx].style.top = cs.top;
                    cloneStages[idx].style.left = cs.left;
                    cloneStages[idx].style.transform = cs.transform;
                    cloneStages[idx].style.opacity = cs.opacity;
                    cloneStages[idx].style.animation = 'none';
                    cloneStages[idx].style.visibility = 'visible';
                }
            });

            // Inline the computed styles of child elements (gradients, filters, opacity)
            var origChildren = bgEl.querySelectorAll('.orb, .sunbeam');
            var cloneChildren = clone.querySelectorAll('.orb, .sunbeam');
            origChildren.forEach(function(origChild, idx) {
                if (cloneChildren[idx]) {
                    var cs = window.getComputedStyle(origChild);
                    cloneChildren[idx].style.background = cs.background;
                    cloneChildren[idx].style.filter = cs.filter;
                    cloneChildren[idx].style.opacity = cs.opacity;
                }
            });

            // SVG string layout structure with absolute pixel inline variables
            var svgString = '<svg xmlns="http://www.w3.org/2000/svg" width="' + bw + '" height="' + bh + '">' +
              '<defs>' +
                '<style>' +
                  '.alpha-ambient-bg { position: absolute; inset: 0; background-color: #f4f8fc; opacity: 0.97; overflow: hidden; }' +
                  '.ambient-motion-stage { position: absolute; pointer-events: none; }' +
                  '.orb, .sunbeam { position: absolute; inset: 0; }' +
                '</style>' +
              '</defs>' +
              '<foreignObject width="100%" height="100%">' +
                '<div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;padding:0;overflow:hidden;">' +
                  clone.outerHTML +
                '</div>' +
              '</foreignObject>' +
            '</svg>';

            var img = new Image();
            var svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            var blobUrl = URL.createObjectURL(svgBlob);

            img.onload = function() {
                ctx.drawImage(img, 0, 0, w, h);
                URL.revokeObjectURL(blobUrl);
                try {
                    var dataUrl = sharedCanvas.toDataURL('image/png');
                    if (onDone) onDone(dataUrl);
                } catch(e) {}
            };
            img.onerror = function() {
                URL.revokeObjectURL(blobUrl);
            };
            img.src = blobUrl;
        } catch (e) {
            // Safe fallback
        }
    }

    function onZoomStart() {
        var bgEl = document.querySelector('.alpha-ambient-bg');
        if (!isScaling) {
            isScaling = true;
            if (!document.body.classList.contains('is-zoom-scaling')) {
                document.body.classList.add('is-zoom-scaling');
            }
            if (bgEl) {
                var snap = ensureSnapshotOverlay(bgEl);
                captureBlurredBgPNG(bgEl, function(pngUrl) {
                    if (pngUrl && isScaling) {
                        snap.style.backgroundImage = 'url("' + pngUrl + '")';
                        snap.style.opacity = '1';
                        bgEl.classList.add('is-bg-frozen');
                    }
                });
            }
        }

        clearTimeout(zt);
        zt = setTimeout(onZoomEnd, 220);
    }

    function onZoomEnd() {
        isScaling = false;
        document.body.classList.remove('is-zoom-scaling');
        var bgEl = document.querySelector('.alpha-ambient-bg');
        if (bgEl) {
            bgEl.classList.remove('is-bg-frozen');
            var snap = bgEl.querySelector('.alpha-bg-snapshot');
            if (snap) {
                snap.style.opacity = '0';
                snap.style.backgroundImage = 'none';
            }
        }
    }

    window.addEventListener('wheel', function(e) { if (e.ctrlKey) onZoomStart(); }, { passive: true });
    window.addEventListener('gesturestart', onZoomStart, { passive: true });
    window.addEventListener('gesturechange', onZoomStart, { passive: true });
    window.addEventListener('resize', onZoomStart, { passive: true });
})();
</script>

    function runIOSBlurTransition(oldBgStr, newUrl, parentEl) {
        if (!parentEl) return;

        const container = document.createElement('div');
        container.style = `position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; border-radius:inherit;`;
        
        const oldLayer = document.createElement('div');

        const newLayer = document.createElement('div');
        newLayer.style = `position:absolute; inset:0; background:url("${newUrl}") center/cover no-repeat; opacity:0; filter:blur(40px); transform:scale(1.08); transition:opacity 0.6s ease, filter 0.6s ease, transform 0.8s cubic-bezier(0.22,1,0.36,1); z-index:2;`;

        container.appendChild(oldLayer); container.appendChild(newLayer);
        parentEl.insertBefore(container, parentEl.firstChild);

        const originalIsolation = parentEl.style.isolation || '';
        parentEl.style.isolation = 'isolate';
        
        // 动画期间暂时清空父级原有背景, 由 container 接管展示
        parentEl.style.backgroundImage = 'none';

        requestAnimationFrame(() => {

    // 亮度检测: 深色壁纸判定为 dark-wp
    let dataWorkerInstance = null;
    let workerTaskId = 0;
    const workerPromises = new Map();

    function executeMainThreadDataAction(action, payload) {
      if (action === 'calc_luminance') {
        const { pixels } = payload;
        if (!pixels || pixels.length === 0) return { isDark: false, luminance: 255 };
        let totalLuminance = 0;
        const count = pixels.length / 4;
        for (let i = 0; i < pixels.length; i += 4) {
          totalLuminance += (0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2]);
        }
        const avgLuminance = totalLuminance / count;
        return { isDark: avgLuminance < 160, luminance: avgLuminance };
      }
      return { isDark: false, luminance: 255 };
    }

    function getDataWorker() {
      if (!dataWorkerInstance && window.location.protocol !== 'file:' && typeof Worker !== 'undefined') {
        try {
          dataWorkerInstance = new Worker('data_worker.js');
          dataWorkerInstance.onmessage = function(e) {
            const { taskId, success, result, error } = e.data;
            if (workerPromises.has(taskId)) {
              const { resolve, reject, timeoutId } = workerPromises.get(taskId);
              clearTimeout(timeoutId);
              workerPromises.delete(taskId);
              if (success) resolve(result);
              else reject(new Error(error));
            }
          };
          dataWorkerInstance.onerror = function(err) {
            console.warn('DataWorker 异常, 回退主线程:', err);
            for (const [taskId, { resolve, timeoutId, action, payload }] of workerPromises.entries()) {
              clearTimeout(timeoutId);
              try { resolve(executeMainThreadDataAction(action, payload)); } catch(e) {}
            }
            workerPromises.clear();
          };
        } catch (e) {
          dataWorkerInstance = null;
        }
      }
      return dataWorkerInstance;
    }

    function runWebWorker(worker, action, payload = {}) {
      return new Promise((resolve, reject) => {
        if (window.location.protocol === 'file:' || !worker || typeof Worker === 'undefined') {
          try {
            resolve(executeMainThreadDataAction(action, payload));
          } catch(err) {
            reject(err);
          }
          return;
        }

        const taskId = ++workerTaskId;
        const timeoutId = setTimeout(() => {
          if (workerPromises.has(taskId)) {
            workerPromises.delete(taskId);
            try { resolve(executeMainThreadDataAction(action, payload)); } catch(e) { reject(e); }
          }
        }, 1500);

        workerPromises.set(taskId, {
          resolve: (val) => { clearTimeout(timeoutId); resolve(val); },
          reject: (err) => {
            clearTimeout(timeoutId);
            try { resolve(executeMainThreadDataAction(action, payload)); } catch(e) { reject(e); }
          },
          timeoutId,
          action,
          payload
        });

        try {
          worker.postMessage({ taskId, action, payload });
        } catch (postErr) {
          clearTimeout(timeoutId);
          workerPromises.delete(taskId);
          try { resolve(executeMainThreadDataAction(action, payload)); } catch(e) { reject(e); }
        }
      });
    }

            const ctx = canvas.getContext('2d');
            canvas.width = 40; canvas.height = 40;
            ctx.drawImage(img, 0, 0, 40, 40);
            const data = ctx.getImageData(0, 0, 40, 40).data;
            try {
                const { luminance } = await runWebWorker(getDataWorker(), 'calc_luminance', { pixels: data });
                const isDark = luminance < 160;
                if (isDark) {
                    previewBoard.classList.add('dark-wp');
                    document.body.classList.add('dark-wp');
                } else {
                    previewBoard.classList.remove('dark-wp');
                    document.body.classList.remove('dark-wp');

                    updateToastStackPositions();
                    if (typeof ensureToastDepthMonitor === 'function') {

            }
        };
        img.src = imageSrc;

    // 独立状态树, 只处理 settings 的 prev 插槽
    let prevDigitsState = {
        'prev-slot-h1': '', 'prev-slot-h2': '',
        'prev-slot-m1': '', 'prev-slot-m2': ''
    };

    function updateSettingsClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        
        // 映射到新的插槽 ID 体系
        const timeMappings = [
            { id: 'prev-slot-h1', val: h[0], typeClass: 'hour-node' },
            { id: 'prev-slot-h2', val: h[1], typeClass: 'hour-node' },
            { id: 'prev-slot-m1', val: m[0], typeClass: 'minute-node' },
            { id: 'prev-slot-m2', val: m[1], typeClass: 'minute-node' }
        ];

        const isReduceMotion = (typeof localStorage !== 'undefined' && localStorage.getItem('alpha_reduce_motion') === 'true');

        timeMappings.forEach(item => {
            if (prevDigitsState[item.id] !== item.val) {
                const slot = document.getElementById(item.id);
                if (!slot) return;
                
                // 减弱动态效果开启时：新数字直接替换，旧数字瞬间消失，0ms 瞬切
                if (isReduceMotion) {
                    slot.innerHTML = '';
                    const newNode = document.createElement('div');
                    newNode.textContent = item.val;
                    newNode.className = `clock-time-node ${item.typeClass}${item.val === '1' ? ' digit-1' : ''}`;
                    slot.appendChild(newNode);
                    prevDigitsState[item.id] = item.val;
                    return;
                }

                const isInitialRender = prevDigitsState[item.id] === '';

                // 1. 旧数字离场: 模糊上升消散
                if (!isInitialRender) {
                    const oldNodes = slot.querySelectorAll('.clock-time-node');
                    oldNodes.forEach(node => {
                        node.classList.remove('clock-enter-active', 'clock-enter');
                        node.classList.add('clock-exit');
                        // 600ms 后从物理层销毁
                        setTimeout(() => node.remove(), 600);
                    });
                }

                // 2. 新数字进场
                const newNode = document.createElement('div');
                newNode.textContent = item.val;
                newNode.className = `clock-time-node ${item.typeClass}${item.val === '1' ? ' digit-1' : ''}`;
                
                if (isInitialRender) {
                    newNode.classList.add('clock-enter-active');
                    slot.appendChild(newNode);
                } else {
                    newNode.classList.add('clock-enter');
                    slot.appendChild(newNode);
                    
                    requestAnimationFrame(function() {
                        newNode.classList.remove('clock-enter');
                        newNode.classList.add('clock-enter-active');
                    });
                }
                
                prevDigitsState[item.id] = item.val;
            }
        });
    }

    let currentVersionInfo = { version: "Unknown", description: "" };

    function updateVersionUI() {
        const verText = document.getElementById('currentVersionText');
        if (verText && currentVersionInfo.version && currentVersionInfo.version !== "Unknown") {
            const desc = currentVersionInfo.description ? ` ${currentVersionInfo.description}` : '';
            verText.textContent = `当前版本: v${currentVersionInfo.version}${desc}`;

    async function loadVersion() {
        const applyVersion = (data) => {
            if (data && data.version) {
                currentVersionInfo = data;
                updateVersionUI();
                return true;
            }
            return false;
        };

        // 策略 0 (最优): 通过 Electron IPC 安全通道读取 (绕过 file:// 协议 CORS 限制)
        try {
            const api = (window.electronAPI) || (window.parent && window.parent.electronAPI);
            if (api && api.readVersionJson) {
                const data = await api.readVersionJson();
                if (applyVersion(data)) return;
            }
        } catch (e) {
            console.warn("Electron IPC 读取 version.json 失败:", e);
        }

        // 策略 1: XHR 读取 (不能加 ?_t= 等 query 参数, 否则在 file:// 协议下会导致 ERR_FILE_NOT_FOUND)
        const tryXHR = (url) => new Promise((resolve) => {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onload = function() {
                    if (xhr.status === 200 || xhr.status === 0) {
                        try {
                            const parsed = JSON.parse(xhr.responseText);
                            resolve(parsed);
                            return;
                        } catch (err) {}
                    }
                    resolve(null);
                };
                xhr.onerror = function() { resolve(null); };
                xhr.send();
            } catch (e) {
                resolve(null);
            }
        });

        // 1.1 相对路径 XHR
        let res = await tryXHR('version.json');
        if (applyVersion(res)) return;

        // 1.2 ./ 相对路径 XHR
        res = await tryXHR('./version.json');
        if (applyVersion(res)) return;

        // 1.3 基于 location.href 绝对路径 XHR
        try {
            const absoluteUrl = window.location.href.replace(/settings\.html.*$/, 'version.json');
            res = await tryXHR(absoluteUrl);
            if (applyVersion(res)) return;
        } catch(e) {}

        // 策略 2: Electron 环境底层 Node.js fs 读取
        try {
            const req = (window.require || (window.parent && window.parent.require));
            if (req) {
                const fs = req('fs');
                const path = req('path');
                let cleanPath = decodeURIComponent(window.location.pathname);
                if (cleanPath.startsWith('/') && cleanPath.includes(':')) {
                    cleanPath = cleanPath.substring(1);
                }
                const dir = cleanPath.substring(0, cleanPath.lastIndexOf('/'));
                const versionFilePath = path.join(dir, 'version.json');
                
                if (fs && fs.existsSync && fs.existsSync(versionFilePath)) {
                    const content = fs.readFileSync(versionFilePath, 'utf8');
                    if (applyVersion(JSON.parse(content))) return;
                }
                
                if (process && process.cwd) {
                    const cwdVersionPath = path.join(process.cwd(), 'version.json');
                    if (fs.existsSync(cwdVersionPath)) {
                        const content = fs.readFileSync(cwdVersionPath, 'utf8');
                        if (applyVersion(JSON.parse(content))) return;
                    }
                }
            }
        } catch (e) {
            console.warn("Node fs 读取失败:", e);
        }

        // 策略 3: Standard fetch API
        try {
            const response = await fetch('version.json');
            if (response.ok) {
                const data = await response.json();
                if (applyVersion(data)) return;
            }
        } catch (e) {}
    }
    
    // 初始化加载版本
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadVersion);
    } else {
        loadVersion();
    }

let toastDepthCheckTimer = null;

function parseRgbaColor(str) {
    if (!str || str === 'transparent' || str === 'inherit') return null;
    const match = str.match(/rgba?\(\s*(\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\s*\)/);
    if (match) {
        return {
            r: parseInt(match[1], 10),
            g: parseInt(match[2], 10),
            b: parseInt(match[3], 10),
            a: match[4] !== undefined ? parseFloat(match[4]) : 1.0
        };
    }
    return null;
}

function detectToastUnderlyingDepth(toastEl) {
    if (!toastEl || !toastEl.isConnected) return false;
    const rect = toastEl.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return false;

    // 取 Toast 弹出位置的横向多点（左 25%、中 50%、右 75%）进行下层采样
    const samplePoints = [
        { x: rect.left + rect.width * 0.25, y: rect.top + rect.height * 0.5 },
        { x: rect.left + rect.width * 0.5, y: rect.top + rect.height * 0.5 },
        { x: rect.left + rect.width * 0.75, y: rect.top + rect.height * 0.5 }
    ];

    let darkCount = 0;
    let sampleCount = 0;

    for (const pt of samplePoints) {
        const x = Math.max(0, Math.min(window.innerWidth - 1, pt.x));
        const y = Math.max(0, Math.min(window.innerHeight - 1, pt.y));

        const elements = (document.elementsFromPoint ? document.elementsFromPoint(x, y) : []) || [];
        let pointIsDark = false;
        let foundOpaque = false;

        for (const el of elements) {
            if (!el || el === toastEl || toastEl.contains(el) || el.id === 'globalToastContainer' || el.classList.contains('toast-container')) {
                continue;
            }

            // 1. 如果下层元素本身处于深色模式/深色壁纸容器中
            if (el.closest && el.closest('.dark-wp, .dark-mode, .is-dark-bg, .dark-theme, [data-theme="dark"]')) {
                pointIsDark = true;
                foundOpaque = true;
                break;
            }

            const win = el.ownerDocument ? el.ownerDocument.defaultView : window;
            const style = win.getComputedStyle(el);
            const bg = parseRgbaColor(style.backgroundColor);

            // 2. 分析下层元素的实际背景色亮度
            if (bg && bg.a > 0.15) {
                const rEff = bg.r * bg.a + 255 * (1 - bg.a);
                const gEff = bg.g * bg.a + 255 * (1 - bg.a);
                const bEff = bg.b * bg.a + 255 * (1 - bg.a);
                const luma = 0.299 * rEff + 0.587 * gEff + 0.114 * bEff;
                if (luma < 160) {
                    pointIsDark = true;
                }
                foundOpaque = true;
                break;
            }

            // 3. 分析文字与背景反差（浅色高亮文字一般代表深色卡片/背景）
            const fg = parseRgbaColor(style.color);
            if (fg && fg.a > 0.6) {
                const fgLuma = 0.299 * fg.r + 0.587 * fg.g + 0.114 * fg.b;
                if (fgLuma > 215 && (style.backgroundImage !== 'none' || bg)) {
                    pointIsDark = true;
                    foundOpaque = true;
                    break;
                }
            }
        }

        // 4. 若未命中具体卡片，则回退到当前 body/页面整体壁纸深度判断
        if (!foundOpaque) {
            if (document.body.classList.contains('dark-wp') || document.body.classList.contains('dark-mode')) {
                pointIsDark = true;
            }
        }

        if (pointIsDark) darkCount++;
        sampleCount++;
    }

    return sampleCount > 0 && (darkCount >= Math.ceil(sampleCount / 2));
}

function checkAllActiveToastDepths() {
    if (!activeToastStack || activeToastStack.length === 0) {
        if (toastDepthCheckTimer) {
            clearInterval(toastDepthCheckTimer);
            toastDepthCheckTimer = null;
        }
        return;
    }

    activeToastStack.forEach(item => {
        if (!item || !item.el) return;
        const isDeep = detectToastUnderlyingDepth(item.el);
        if (isDeep) {
            item.el.classList.add('deep-bg');
        } else {
            item.el.classList.remove('deep-bg');
        }
    });

    updateToastStackPositions();
}

function ensureToastDepthMonitor() {
    if (document.hidden) return;
    if (!toastDepthCheckTimer) {
        // 每隔 1.2 秒进行一次实时下层深度轮询
        toastDepthCheckTimer = setInterval(checkAllActiveToastDepths, 1200);
    }
    // 异步微任务中执行单次首检，避免同步重入
    Promise.resolve().then(checkAllActiveToastDepths);
}

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (toastDepthCheckTimer) {
            clearInterval(toastDepthCheckTimer);
            toastDepthCheckTimer = null;
        }
    } else if (activeToastStack.length > 0) {
        ensureToastDepthMonitor();
    }
});

window.addEventListener('AlphaSleep', () => {
    if (toastDepthCheckTimer) {
        clearInterval(toastDepthCheckTimer);
        toastDepthCheckTimer = null;
    }
});

window.addEventListener('AlphaWake', () => {
    if (activeToastStack.length > 0) {
        ensureToastDepthMonitor();
    }
});

function updateToastStackPositions() {
    const total = activeToastStack.length;
    const isDeepBg = document.body.classList.contains('dark-wp') || 
                     document.body.classList.contains('dark-mode') || 
                     document.body.classList.contains('is-dark-bg');
    activeToastStack.forEach((item, index) => {
        const depth = total - 1 - index; // 0 = 最新(最前景), 1 = 次新, 2 = 较早
        const el = item.el;
        if (!el || el.classList.contains('dismiss')) return;

        // 视觉纵深体系:
        // 最新 (depth 0): 稍微下沉 (index * 14px), 放大 (scale 1.04)
        // 较早 (depth 1, 2...): scale 逐渐变小, 保持容器 opacity: 1 (由毛玻璃与折射自然呈现透叠), 确保 Chromium 正确渲染多层 Backdrop Filter
        const scale = Math.max(0.86, 1.04 - depth * 0.06);
        const translateY = index * 14;
        const zIndex = 10005 + index;

        el.style.zIndex = zIndex;
        el.style.transform = `translateX(-50%) translateY(${translateY}px) scale(${scale})`;
        if (isDeepBg || el.classList.contains('deep-bg')) {
            if (depth === 0) {
                el.style.boxShadow = '0 16px 36px rgba(15, 23, 42, 0.16), inset 0 1px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 2px rgba(0, 0, 0, 0.03)';
            } else {
                el.style.boxShadow = '0 8px 20px rgba(15, 23, 42, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.95)';
            }
        } else {
            if (depth === 0) {
                el.style.boxShadow = '0 16px 40px rgba(15, 23, 42, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 2px 3px 10px rgba(255, 255, 255, 0.35), inset -2px -3px 10px rgba(0, 0, 0, 0.03), inset 4px 6px 20px rgba(255, 255, 255, 0.18)';
            } else {
                el.style.boxShadow = '0 8px 24px rgba(15, 23, 42, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 2px 3px 6px rgba(255, 255, 255, 0.25)';
            }
        }
    });
}
    function showGlobalToast(msg, color = "var(--monet-text, var(--text))", duration = 3000) {
        const container = getOrCreateToastContainer();
        
        if (activeToastStack.length >= 4) {
            const oldest = activeToastStack.shift();
            if (oldest && oldest.el) {
                oldest.el.classList.add('dismiss');
                clearTimeout(oldest.timer);
                setTimeout(() => { if (oldest.el.parentNode) oldest.el.parentNode.removeChild(oldest.el); }, 420);
            }
        }
        
        const toast = document.createElement('div');
        toast.className = 'toast-notification';
        toast.innerHTML = formatToastMsg(msg);
        if (color) toast.style.color = color;
        container.appendChild(toast);
        
        void toast.offsetWidth;
        toast.classList.add('show');
        
        const toastItem = {
            el: toast,
            timer: null
        };
        activeToastStack.push(toastItem);
        updateToastStackPositions();
        
        if (duration > 0) {
            toastItem.timer = setTimeout(() => {
                toast.classList.add('dismiss');
                const idx = activeToastStack.indexOf(toastItem);
                if (idx !== -1) {
                    activeToastStack.splice(idx, 1);
                }
                updateToastStackPositions();
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 420);
            }, duration);
        }
        return toast;
    }

    function showPersistentToast(msg, color = "var(--monet-text, var(--text))") {
        if (persistentToastItem && persistentToastItem.el && persistentToastItem.el.parentNode) {
            persistentToastItem.el.innerHTML = formatToastMsg(msg);
            if (color) persistentToastItem.el.style.color = color;
            return;
        }
        const toast = showGlobalToast(msg, color, 0);
        persistentToastItem = activeToastStack.find(item => item.el === toast);
    }

    function hideGlobalToast() {
        if (persistentToastItem) {
            const idx = activeToastStack.indexOf(persistentToastItem);
            if (idx !== -1) activeToastStack.splice(idx, 1);
            persistentToastItem.el.classList.add('dismiss');
            setTimeout(() => {
                if (persistentToastItem && persistentToastItem.el && persistentToastItem.el.parentNode) {
                    persistentToastItem.el.parentNode.removeChild(persistentToastItem.el);
                }
                persistentToastItem = null;
            }, 350);
            updateToastStackPositions();
        }
    }

    function formatSpeed(bytesPerSecond) {
        if (!bytesPerSecond) return '0 KB/s';
        if (bytesPerSecond > 1024 * 1024) {
            return (bytesPerSecond / (1024 * 1024)).toFixed(1) + ' MB/s';
        }
        return (bytesPerSecond / 1024).toFixed(0) + ' KB/s';
    }

    function customAlert(msg, title = "提示", icon = "Done") {
        let dialog = document.getElementById('customDialog');
        if (!dialog) {
            dialog = document.createElement('div');
            dialog.id = 'customDialog';
            dialog.className = 'sphere-modal hidden';
            dialog.innerHTML = `
                <div class="modal-content" style="width: 360px; text-align: center;">
                    <div id="dialogIcon" style="min-height: 60px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;"></div>
                    <h3 id="dialogTitle" style="margin-bottom: 12px; color: #0f172a; font-size: 20px;"></h3>
                    <div id="dialogMessage" style="color: #64748b; font-size: 15px; line-height: 1.6; margin-bottom: 24px;"></div>
                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <button class="secondary" id="dialogCancelBtn" style="flex: 1;" onclick="document.getElementById('customDialog').classList.add('hidden')">取消</button>
                        <button class="primary" id="dialogConfirmBtn" style="flex: 1;">确认</button>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);
        }

        document.getElementById('dialogIcon').innerHTML = formatDialogIcon(icon);
        document.getElementById('dialogTitle').textContent = title;
        document.getElementById('dialogMessage').innerHTML = msg;
        document.getElementById('dialogCancelBtn').style.display = 'none';
        
        const confirmBtn = document.getElementById('dialogConfirmBtn');
        confirmBtn.textContent = "确定"; 
        confirmBtn.className = "primary";
        
        window.dialogConfirmCallback = () => { 
            dialog.classList.add('hidden'); 
            window.dialogConfirmCallback = null; 
        };
        
        const newConfirmBtn = confirmBtn.cloneNode(true);
        confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
        newConfirmBtn.addEventListener('click', () => {
            if(window.dialogConfirmCallback) window.dialogConfirmCallback();
        });

        dialog.classList.remove('hidden');
    }

    function compareVersions(v1, v2) {
        const p1 = v1.replace(/^v/, '').split('.').map(Number);
        const p2 = v2.replace(/^v/, '').split('.').map(Number);
        for (let i = 0; i < Math.max(p1.length, p2.length); i++) {
            const num1 = p1[i] || 0;
            const num2 = p2[i] || 0;
            if (num1 > num2) return 1;
            if (num1 < num2) return -1;
        }
        return 0;
    }

    let isUpdateDownloadedLocal = false;
    let isDownloadingUpdate = false;

    // 绑定 Electron IPC 自动更新事件监听
    function initUpdateListeners() {
        const api = (window.electronAPI) || (window.parent && window.parent.electronAPI);
        if (!api) return;

        if (api.onUpdaterProgress) {
            api.onUpdaterProgress((data) => {
                isDownloadingUpdate = true;
                const pct = Math.round(data.percent || 0);
                const spd = formatSpeed(data.bytesPerSecond);
                showPersistentToast(`⏬ 正在静默下载更新差异包... ${pct}% (${spd})`, "var(--monet-text)");
            });
        }

        if (api.onUpdaterStatus) {
            api.onUpdaterStatus((data) => {
                if (data.status === 'downloaded') {
                    isUpdateDownloadedLocal = true;
                    isDownloadingUpdate = false;
                    showGlobalToast("✨ 更新差异包下载完成！请重启完成更新", "var(--monet-text)", 4000);
                    
                    const btn = document.getElementById('checkUpdateBtn');
                    if (btn) {
                        btn.textContent = "重启并更新";
                        btn.onclick = () => {
                            if (api.quitAndInstallUpdate) api.quitAndInstallUpdate();
                        };
                    }
                } else if (data.status === 'error') {
                    isDownloadingUpdate = false;
                    showGlobalToast(`❌ 自动更新失败: ${data.error || '网络异常'}`, "var(--monet-text)");
                }
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initUpdateListeners);
    } else {
        initUpdateListeners();
    }

    async function checkUpdate() {
        const btn = document.getElementById('checkUpdateBtn');
        const api = (window.electronAPI) || (window.parent && window.parent.electronAPI);

        // 1. 如果更新已经下载完成但用户未重启: 无需重复下载, 弹出 custom alarm 提示重启
        if (isUpdateDownloadedLocal) {
            customAlert(
                "新版本已下载<br><br>点击「立即重启」以应用更新",
                "更新就绪",
                "Rocket"
            );
            const cancelBtn = document.getElementById('dialogCancelBtn');
            if (cancelBtn) {
                cancelBtn.style.display = 'block';
                cancelBtn.textContent = "稍后";
            }
            const confirmBtn = document.getElementById('dialogConfirmBtn');
            if (confirmBtn) {
                confirmBtn.textContent = "立即重启";
            }
            window.dialogConfirmCallback = () => {
                document.getElementById('customDialog').classList.add('hidden');
                window.dialogConfirmCallback = null;
                if (api && api.quitAndInstallUpdate) {
                    api.quitAndInstallUpdate();
                }
            };
            return;
        }

        if (isDownloadingUpdate) {
            showGlobalToast("⏬ 更新差异包正在后台静默下载中...", "var(--monet-text)");
            return;
        }

        if (btn) btn.disabled = true;

        if (!currentVersionInfo.version || currentVersionInfo.version === "Unknown") {
            await loadVersion();
        }
        
        try {
            // 首先尝试通过 electronAPI IPC 检查 autoUpdater 内部状态
            if (api && api.checkForUpdate) {
                const ipcRes = await api.checkForUpdate();
                if (ipcRes && ipcRes.status === 'downloaded') {
                    isUpdateDownloadedLocal = true;
                    if (btn) btn.disabled = false;
                    checkUpdate(); // 重新触发已下载分支
                    return;
                }
            }

            if (!navigator.onLine) {
                showGlobalToast("❌ 网络未连接, 无法检查更新", "var(--monet-text)");
                if (btn) btn.disabled = false;
                return;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            const response = await fetch('https://api.github.com/repos/Zongyil/Tasks/releases/latest', {
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            
            if (!response.ok) {
                throw new Error("Failed to fetch release info");
            }
            
            const release = await response.json();
            const latestVersion = release.tag_name;
            
            if (!currentVersionInfo.version || currentVersionInfo.version === "Unknown") {
                showGlobalToast("❌ 无法获取当前版本信息", "var(--monet-text)");
                if (btn) btn.disabled = false;
                return;
            }

            const cmp = compareVersions(latestVersion, currentVersionInfo.version);
            
            if (cmp > 0) {
                // 发现新版本
                customAlert(
                    `${currentVersionInfo.version} → ${latestVersion}. 点击「更新」按钮开始更新`, 
                    "发现更新", 
                    "Rocket"
                );
                
                const cancelBtn = document.getElementById('dialogCancelBtn');
                if (cancelBtn) {
                    cancelBtn.style.display = 'block';
                    cancelBtn.textContent = "稍后";
                }
                const confirmBtn = document.getElementById('dialogConfirmBtn');
                if (confirmBtn) {
                    confirmBtn.textContent = "更新";
                    confirmBtn.className = "primary";
                }

                window.dialogConfirmCallback = async () => {
                    document.getElementById('customDialog').classList.add('hidden');
                    window.dialogConfirmCallback = null;
                    
                    showPersistentToast("⏬ 已启动静默更新, 正在下载差异包...", "var(--monet-text)");

                    if (api && api.startDownloadUpdate) {
                        try {
                            const res = await api.startDownloadUpdate();
                            if (res && res.status === 'downloaded') {
                                isUpdateDownloadedLocal = true;
                                showGlobalToast("✨ 更新差异包已存在, 请重启完成更新", "var(--monet-text)");
                            }
                        } catch (err) {
                            console.error("启动差分更新失败:", err);
                            showGlobalToast("❌ 启动差分更新失败", "var(--monet-text)");
                        }
                    } else if (window.parent && window.parent.require) {
                        try {
                            const { shell } = window.parent.require('electron');
                            shell.openExternal(release.html_url);
                        } catch (err) {
                            window.open(release.html_url, '_blank');
                        }
                    } else {
                        window.open(release.html_url, '_blank');
                    }
                };
            } else if (cmp < 0) {
                showGlobalToast("🚀 当前正在使用超前版本", "var(--monet-text)");
            } else {
                showGlobalToast("✨ 当前已是最新版本", "var(--monet-text)");
            }
            
        } catch (e) {
            console.error("检查更新失败:", e);
            if (e.name === 'AbortError') {
                showGlobalToast("❌ 检查更新超时, 请重试", "var(--monet-text)");
            } else if (!navigator.onLine) {
                showGlobalToast("❌ 网络未连接, 检查更新失败", "var(--monet-text)");
            } else {
                showGlobalToast("❌ 检查更新失败, 请重试", "var(--monet-text)");
            }
        } finally {
            if (btn) btn.disabled = false;
        }
    }

    // ======= 自适应节能与性能降载联动引擎 (Adaptive Activity & Power Throttler) =======
    (function initPerformanceThrottle() {
        let isSleeping = false;
        let isIdle = false;
        let idleTimer = null;
        const IDLE_TIMEOUT_MS = 2500;

        function applyVisualFreeze(freeze) {
            const docEl = document.documentElement;
            const bodyEl = document.body;
            if (!docEl) return;
            if (freeze) {
                docEl.classList.add('pause-bg-motion', 'pause-clock-breath');
                if (bodyEl) bodyEl.classList.add('pause-bg-motion', 'pause-clock-breath');
            } else {
                docEl.classList.remove('pause-bg-motion', 'pause-clock-breath');
                if (bodyEl) bodyEl.classList.remove('pause-bg-motion', 'pause-clock-breath');
            }
        }

        function onUserActive() {
            if (isSleeping) return;
            if (isIdle) {
                isIdle = false;
                applyVisualFreeze(false);
            }
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                isIdle = true;
                applyVisualFreeze(true);
            }, IDLE_TIMEOUT_MS);
        }

        function onSleep() {
            isSleeping = true;
            document.documentElement.classList.add('alpha-sleep');
            if (idleTimer) {
                clearTimeout(idleTimer);
                idleTimer = null;
            }
            applyVisualFreeze(true);
            try {
                if (window.AlphaCardGlow && typeof window.AlphaCardGlow.sleep === 'function') {
                    window.AlphaCardGlow.sleep(document);
                }
                if (window.AlphaInputGlow && typeof window.AlphaInputGlow.sleep === 'function') {
                    window.AlphaInputGlow.sleep(document);
                }
                if (window.AlphaLiquidGlass && typeof window.AlphaLiquidGlass.releaseAll === 'function') {
                    window.AlphaLiquidGlass.releaseAll();
                }
            } catch (_) {}
        }

        function onWake() {
            isSleeping = false;
            isIdle = false;
            document.documentElement.classList.remove('alpha-sleep');
            applyVisualFreeze(false);
            try {
                if (window.AlphaCardGlow && typeof window.AlphaCardGlow.wake === 'function') {
                    window.AlphaCardGlow.wake(document);
                }
                if (window.AlphaInputGlow && typeof window.AlphaInputGlow.wake === 'function') {
                    window.AlphaInputGlow.wake(document);
                }
            } catch (_) {}
            onUserActive();
        }

        const activityEvents = ['pointermove', 'pointerdown', 'keydown', 'scroll', 'wheel', 'touchstart'];
        activityEvents.forEach(evt => {
            window.addEventListener(evt, onUserActive, { passive: true, capture: true });
        });

        window.addEventListener('AlphaSleep', onSleep);
        window.addEventListener('AlphaWake', onWake);
        window.addEventListener('focus', onUserActive);
        window.addEventListener('blur', () => {
            if (idleTimer) {
                clearTimeout(idleTimer);
                idleTimer = null;
            }
            isIdle = true;
            applyVisualFreeze(true);
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) onSleep();
            else onWake();
        });

        onUserActive();

        function applyThrottle(throttle) {
            if (!throttle) return;
            if (throttle.pauseBgMotion || throttle.pauseClockBreath) {
                applyVisualFreeze(true);
            } else if (!isIdle && !isSleeping) {
                applyVisualFreeze(false);
            }
        }

        window.addEventListener('AlphaPerformanceThrottle', (e) => applyThrottle(e.detail));
        const api = window.electronAPI || window.top?.electronAPI || window.parent?.electronAPI;
        if (api && typeof api.onPerformanceThrottleChanged === 'function') {
            api.onPerformanceThrottleChanged(applyThrottle);
        }
        if (api && typeof api.getPerformanceThrottleState === 'function') {
            api.getPerformanceThrottleState().then(applyThrottle).catch(() => {});
        }
    })();

    // 禁止通过 F11 快捷键切换全屏
    window.addEventListener('keydown', (e) => {
        if (e.key === 'F11' || e.keyCode === 122 || e.code === 'F11') {
            e.preventDefault();
            e.stopPropagation();
        }
    }, true);
    </script>
