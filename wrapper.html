<!DOCTYPE html>
<html class="wrapper-html" id="wrapperHtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: local-font:; frame-src 'self' data: blob:; child-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <script src="./assets/liquid-glass.js"></script>
  <script src="./assets/input-glow.js"></script>
  <script src="./assets/scroll-bounce.js"></script>
  <script src="./assets/reduce-motion.js"></script>
  <style>

    *, *::before, *::after { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, select, [contenteditable="true"], [contenteditable] {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    :root {
      --tab-width: 180px;
      --radius-sm: 8px;
    }

    @font-face { 
      font-family: 'OPPO Sans 4.0'; 
      src: url('./fonts/OPPO Sans 4.0.ttf') format('truetype'); 
      font-weight: 1 999; 
    }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
      font-family: "OPPO Sans 4.0", "Segoe UI Variable", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ========== 标题栏 (Liquid Glass Tabs Container) ========== */
    #title-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: transparent;
      -webkit-app-region: drag;
      display: flex; align-items: center;
      padding-left: 12px;
      padding-right: 192px; 
      z-index: 9999995;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      /* 截断进入下方 iframe 的标签页阴影，顶部及左右阴影保持完整展开 */
      clip-path: inset(-100px -100px 0px -100px);
      -webkit-clip-path: inset(-100px -100px 0px -100px);
    }

    /*
     * Electron 会把 -webkit-app-region:drag 单独交给原生窗口命中测试。
     * 标签排序期间暂时关闭这一原生区域，避免它与指针捕获及 backdrop
     * 合成竞争；拖拽结束后由 JS 自动恢复。
     */
    #title-bar.tab-drag-active {
      -webkit-app-region: no-drag !important;
    }



    .app-icon {
      width: 18px; height: 19px;
      margin-right: 14px;
      -webkit-app-region: no-drag;
      pointer-events: auto;
      cursor: pointer;
      flex-shrink: 0;
    }

    .title-text {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      -webkit-app-region: drag;
      user-select: none;
      white-space: nowrap;
      max-width: 0;
      margin-right: 0;
      letter-spacing: -0.2px;
      overflow: hidden;
      opacity: 0;
      transform: translate3d(-10px, 0, 0) scale(0.92);
      transform-origin: left center;
      pointer-events: none;
      transition: opacity 0.22s ease,
                  transform 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  max-width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-right 0.36s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tabs-wrapper {
      display: flex; align-items: center;
      flex: 0 0 auto; 
      width: var(--alpha-tabs-wrapper-width, auto);
      min-width: 0; max-width: calc(100vw - 256px);
      height: 52px;
      margin: -4px -14px;
      padding: 0;
      overflow: hidden;
      opacity: 1;
      transform: none;
      transform-origin: left center;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease,
                  transform 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  max-width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  -webkit-mask-image 0.2s ease,
                  mask-image 0.2s ease;
    }

    /* 单页模式：标签组收拢淡出，同时让 Tasks 标题从左侧自然浮现。 */
    #title-bar.single-page-mode .title-text {
      max-width: 96px;
      margin-right: 14px;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    #title-bar.single-page-mode .tabs-wrapper {
      width: 0 !important;
      max-width: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      opacity: 0;
      transform: translate3d(-10px, 0, 0) scale(0.94);
      pointer-events: none;
    }

    /* 高阶拟态边缘渐隐遮罩引擎 */
    .tabs-wrapper.mask-both { -webkit-mask-image: linear-gradient(to right, transparent 0%, black 24px, black calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, transparent 0%, black 24px, black calc(100% - 24px), transparent 100%); }
    .tabs-wrapper.mask-right { -webkit-mask-image: linear-gradient(to right, black 0%, black calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, black 0%, black calc(100% - 24px), transparent 100%); }
    .tabs-wrapper.mask-left { -webkit-mask-image: linear-gradient(to right, transparent 0%, black 24px, black 100%); mask-image: linear-gradient(to right, transparent 0%, black 24px, black 100%); }
    .tabs-wrapper.mask-none { -webkit-mask-image: none; mask-image: none; }

    /* 滑动容器 */
    .tabs-container {
      position: relative;
      display: flex; align-items: center; 
      overflow-x: auto; overflow-y: hidden;
      height: 100%;
      /*
       * 阴影缓冲区必须位于真正执行 overflow 裁切的滚动层内部。
       * 外层用等量负 margin 抵消，因此标签和加号的位置、间距均不改变；
       * 但首尾标签（包括 active 的 scale）现在有空间完整绘制阴影。
       */
      padding: 4px 14px;
      margin: 0;
      -webkit-app-region: no-drag;
      scroll-behavior: smooth;
    }
    .tabs-container::-webkit-scrollbar { display: none; }

/* --- 标签卡片基础样式 --- */
    .tab {
      display: flex; align-items: center; justify-content: space-between; 
      height: 32px; padding: 0 10px 0 14px; margin-right: 6px; 
      border-radius: 8px; font-size: 13px;
      cursor: pointer; position: relative;
      /* 放弃 flex-basis, 转用 width 承接 CSS 变量, 激活平滑过渡 */
      flex: 0 0 auto;
      width: var(--alpha-tab-width, 120px);
      min-width: 120px;
      max-width: 240px;
      
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease, font-weight 0.3s ease,
                  transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  min-width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  max-width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                  margin 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                  opacity 0.4s ease;
      transform-origin: center;
      /* 静止标签不强制创建 3D 合成层；缩放视觉保持不变。 */
      transform: scale(1); 
      touch-action: none;
      -webkit-app-region: no-drag;
    }

    /* 单标签页或单页模式：允许在选中的标签页及标题栏非功能区上拖拽窗口 */
    #title-bar.single-tab-mode .tab.active,
    #title-bar.single-page-mode .tab {
      -webkit-app-region: drag !important;
    }

    #title-bar.single-tab-mode .tabs-container {
      -webkit-app-region: drag;
    }

    /* 保证功能按键始终响应交互 */
    .app-icon,
    .add-tab-btn,
    .more-btn,
    .tab-close {
      -webkit-app-region: no-drag !important;
      pointer-events: auto !important;
    }

    /* 拖动层保留在标签组的同一容器中，供局部渲染副本精确对齐。 */
    .tab.dragging,
    .tab.active.dragging,
    .tab.inactive.dragging {
      position: absolute !important;
      z-index: 99999999 !important;
      margin-right: 0 !important;
      cursor: grabbing;
      transition: none !important;
      opacity: 1 !important;
      contain: none !important;
      will-change: transform !important;
      isolation: isolate;
      overflow: hidden !important;
      pointer-events: auto;
      -webkit-app-region: no-drag !important;
      transform: translate3d(var(--alpha-tab-drag-x, 0px), 0, 0) scale(1.05) !important;
      /*
       * 方案 2：表层清空所有白雾，直出 100% 纯净高斯模糊底色
       */
      background: transparent !important;
      /*
       * 拖拽态不再依赖 backdrop-filter。Electron 的透明/Mica 窗口会把
       * 拖拽元素提升到独立 RenderSurface，背景取样链可能因此被截断。
       * 真正的高斯模糊由下方 .tab-drag-filter-strip 对小型 DOM 副本执行。
       */
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-top: 1.2px solid rgba(255, 255, 255, 0.75) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.55) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.25) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 3px 8px rgba(15, 23, 42, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.40) !important;
    }

    /*
     * 纯模糊底色方案（方案 2）：
     * 1. 底层（.tab-drag-filter-layer）：100% 实色纯白衬底遮蔽原生清晰文字；
     * 2. 核心（.tab-drag-filter-strip）：100% 原汁原味纯正高斯模糊（无额外白雾滤镜）；
     * 3. 顶层（.tab-title / .tab-close）：标签文本与图标。
     */
    .tab-drag-filter-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      /*
       * 实色遮蔽基底：100% 阻断原生文字透光
       */
      background: #ffffff !important;
      opacity: 1 !important;
    }

    .tab-drag-filter-layer::after {
      display: none !important;
    }

    .tab-drag-filter-strip {
      position: absolute !important;
      z-index: 1;
      display: flex !important;
      align-items: center !important;
      height: 52px !important;
      margin: 0 !important;
      padding: 4px 14px !important;
      overflow: visible !important;
      transform: scale(var(--alpha-drag-filter-inverse-scale, 0.952381));
      transform-origin: left top;
      /* 纯粹高斯模糊处理，零滤镜调色失真，真实还原下方色彩与光斑 */
      filter: blur(14px) saturate(100%) contrast(100%) brightness(1.0) !important;
      opacity: 1;
      pointer-events: none !important;
      contain: paint;
      will-change: transform, opacity;
      transition: opacity 180ms cubic-bezier(0.2, 0, 0.2, 1);
    }

    .tab-drag-filter-strip .tab {
      transition: none !important;
      animation: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      pointer-events: none !important;
    }

    .tab.dragging > .tab-title,
    .tab.dragging > .tab-close {
      position: relative;
      z-index: 3;
    }

    /*
     * 拖拽进行期间，非拖拽标签暂时关闭自身的 backdrop-filter，
     * 避免 Chromium Skia 在同一 RenderPass 树中因嵌套 backdrop-filter 阻断模糊采样。
     * 这样拖拽中的标签可以 100% 完整捕获并高斯模糊下方所有标签的实体卡片与文字。
     */
    #title-bar.tab-drag-active .tab:not(.dragging) {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    .tab.dragging .tab-close { pointer-events: none; }

    .tab-drag-placeholder {
      flex: 0 0 auto;
      height: 32px;
      margin-right: 6px;
      border-radius: 8px;
      pointer-events: none;
    }

    /* 选中状态 (高亮纯白发光态) */
    .tab.active {
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.45) 100%);
      backdrop-filter: blur(40px) saturate(140%) brightness(1.05); -webkit-backdrop-filter: blur(40px) saturate(140%) brightness(1.05);
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.85);
      border-right: 1px solid rgba(255, 255, 255, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.10), 0 2px 6px rgba(15, 23, 42, 0.06), inset 0 0 0 1px rgba(255, 255, 255, 0.12), inset 2px 3px 10px rgba(255, 255, 255, 0.45), inset -2px -3px 10px rgba(0, 0, 0, 0.03), inset 4px 6px 20px rgba(255, 255, 255, 0.20);
      font-weight: 700; color: #0f172a; z-index: 2;
      transform: scale(1.03) !important; /* 物理级充气浮现感 */
    }

    /* 未选中状态 (幽灵玻璃态) */
    .tab.inactive {
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.18) 100%);
      backdrop-filter: blur(24px) saturate(130%); -webkit-backdrop-filter: blur(24px) saturate(130%);
      border-top: 1px solid rgba(255, 255, 255, 0.7);
      border-left: 1px solid rgba(255, 255, 255, 0.55);
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      font-weight: 600; color: #334155; z-index: 1;
      transform: scale(0.97); /* 空间退后感 */
    }
    .tab.inactive:hover {
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%);
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.08), 0 1px 4px rgba(15, 23, 42, 0.04), inset 0 2px 4px rgba(255, 255, 255, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.75);
      border-left: 1px solid rgba(255, 255, 255, 0.6);
      transform: scale(1.0);
    }
    .tab.inactive:active {
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.3) 100%);
      transform: scale(0.98);
      border-top: 1.5px solid rgba(255, 255, 255, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.75);
    }

    /* 丝滑入场与退场动画类 (必须放在最后以覆盖 active/inactive 状态) */
    .tab.entering, .tab.closing {
      width: 0 !important; min-width: 0 !important; max-width: 0 !important;
      padding-left: 0 !important; padding-right: 0 !important;
      margin-right: 0 !important; opacity: 0 !important; border-width: 0 !important;
    }
    /* 微调初始物理形态, 配合已有的布局阻尼曲线与视觉回弹曲线, 达成完美的液态充气感 */
    .tab.entering { transform: translateY(14px) scale(0.72) !important; }
    .tab.closing  { transform: translateY(-10px) scale(0.85) !important; }

    .tab-title {
      flex: 1 1 auto; text-align: left; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-right: 8px;
    }

    .tab-close {
      flex: 0 0 18px; 
      display: flex; justify-content: center; align-items: center;
      width: 18px; height: 18px; border-radius: 5px;
      color: #64748b;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
      transform: translate3d(0, 0, 0) scale(1);
    }
    .tab-close:hover { background: rgba(255, 255, 255, 0.6); color: #0f172a; transform: translate3d(0, 0, 0) scale(1.1); }
    .tab-close:active { transform: translate3d(0, 0, 0) scale(0.82); background: rgba(255, 255, 255, 0.75); }

    /* 加号按键动态置顶 */
    .add-tab-btn {
      /* 未满时贴着左边容器跑, 满了时推到最右侧钉死 */
      flex: 0 0 auto; 
      margin-left: 8px; /* 留出一点空隙, 让渐隐卡片与加号有呼吸感 */
      position: relative; z-index: 10;
      display: flex; justify-content: center; align-items: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%);
      backdrop-filter: blur(40px) saturate(130%); -webkit-backdrop-filter: blur(40px) saturate(130%);
      border-top: 1px solid rgba(255, 255, 255, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.65);
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      color: #0f172a; cursor: pointer;
      transition: background 0.2s,
                  box-shadow 0.2s,
                  border-color 0.2s,
                  transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-left 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease;
      -webkit-app-region: no-drag;
      transform-origin: center;
      transform: translate3d(0, 0, 0) scale(1);
    }
    .add-tab-btn:hover { 
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.25) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08), inset 0 2px 4px rgba(255, 255, 255, 0.5); 
      transform: translate3d(0, 0, 0) scale(1.08);
    }
    .add-tab-btn:active { 
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
      transform: translate3d(0, 0, 0) scale(0.90); 
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05), inset 0 2px 5px rgba(255, 255, 255, 0.6);
      border-top: 1.5px solid rgba(255, 255, 255, 1);
      border-left: 1px solid rgba(255, 255, 255, 0.9);
    }

    #title-bar.tabs-saturated .tabs-wrapper {
      flex: 0 1 auto;
    }
    #title-bar.tabs-saturated .add-tab-btn {
      position: relative;
      margin-left: 8px;
    }

    #title-bar.single-page-mode .add-tab-btn {
      width: 0;
      margin-left: 0;
      opacity: 0;
      transform: translate3d(-8px, 0, 0) scale(0.75);
      border-width: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .more-btn {
      position: absolute; right: 138px; top: 0;
      width: 46px; height: 44px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; color: #0f172a;
      -webkit-app-region: no-drag;
      transition: background 0.12s ease, color 0.12s ease;
      z-index: 10;
    }
    .more-btn:hover { background: rgba(0, 0, 0, 0.07); }
    .more-btn:active { background: rgba(0, 0, 0, 0.12); }

    /* ========== 内容容器 ========== */
    #iframe-container {
      position: absolute; top: 44px; left: 0; width: 100vw; height: calc(100vh - 44px);
      z-index: 1;
      background: transparent;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0px);
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), filter 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    #iframe-container.entering {
      opacity: 0;
      transform: translateY(45px) scale(0.96);
      filter: blur(16px);
    }
    
    .content-frame {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: none; 
      visibility: hidden; opacity: 0; pointer-events: none;
      background: transparent;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0px);
      will-change: auto;
      /* 混合过渡: 位移使用高阶视差阻尼曲线, 透明度保持自然流畅 */
      transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.42s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.42s;
      contain: layout paint size;
    }
    .content-frame.enter-right { transform: translate3d(40px, 0, 0) scale(0.97); opacity: 0; filter: blur(16px); }
    .content-frame.enter-left  { transform: translate3d(-40px, 0, 0) scale(0.97); opacity: 0; filter: blur(16px); }
    
    .content-frame.exit-left   { transform: translate3d(-40px, 0, 0) scale(0.97); opacity: 0; filter: blur(16px); }
    .content-frame.exit-right  { transform: translate3d(40px, 0, 0) scale(0.97); opacity: 0; filter: blur(16px); }
    
    .content-frame.active { 
      visibility: visible; opacity: 1; pointer-events: auto;
      z-index: 2; 
      transform: translate3d(0, 0, 0) scale(1); /* 回归舞台中央 */
      filter: blur(0px);
    }
    
    .content-frame.stationary {
      transform: translate3d(0, 0, 0) scale(1) !important;
      filter: blur(0px) !important;

    /*
     * 已有标签页之间的统一切换动画。
     *
     * View Transition 会由 Chromium 为切换前后的 #iframe-container 各生成一张
     * 临时合成快照。模糊、位移和透明度只作用于快照，不会在动画的每一帧重新
     * 栅格化完整 iframe；动画完成后浏览器会自动释放两张快照。
     * 标题栏不参与快照，因此标签状态和拖拽/关闭逻辑保持原样。
     */
    html.alpha-tab-snapshot-capable {
      view-transition-name: none;
    }

    html.alpha-tab-snapshot-capable #iframe-container {
      view-transition-name: alpha-tab-content;
    }

    html.alpha-tab-snapshot-running #iframe-container,
    html.alpha-tab-snapshot-running .content-frame {
      transition: none !important;
    }

    ::view-transition-group(alpha-tab-content) {
      animation-duration: 360ms;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      overflow: clip;
    }

    ::view-transition-image-pair(alpha-tab-content) {
      isolation: isolate;
    }

    ::view-transition-old(alpha-tab-content),
    ::view-transition-new(alpha-tab-content) {
      animation-duration: 360ms;
      animation-fill-mode: both;
      backface-visibility: hidden;
      mix-blend-mode: normal;
    }

    html.alpha-tab-switch-right::view-transition-old(alpha-tab-content) {
      animation-name: alpha-tab-snapshot-exit-left;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.alpha-tab-switch-right::view-transition-new(alpha-tab-content) {
      animation-name: alpha-tab-snapshot-enter-right;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.alpha-tab-switch-left::view-transition-old(alpha-tab-content) {
      animation-name: alpha-tab-snapshot-exit-right;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.alpha-tab-switch-left::view-transition-new(alpha-tab-content) {
      animation-name: alpha-tab-snapshot-enter-left;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);

    }

      45%  { opacity: 0.72; filter: blur(2px); }
      100% { opacity: 0; transform: translate3d(36px, 0, 0) scale(0.985); filter: blur(6px); }
    }

    @keyframes alpha-tab-snapshot-enter-right {

      55%  { opacity: 0.88; filter: blur(1.5px); }

    }

    @keyframes alpha-tab-snapshot-enter-left {

      55%  { opacity: 0.88; filter: blur(1.5px); }

    .content-frame.enter-left,
    .content-frame.exit-left,

    /*
     * 全屏 iframe 上的 filter:blur 会让 Chromium 为整张页面建立并反复
     * 栅格化离屏纹理。在浏览器标签页中尚可接受，但在 Electron 的透明/
     * Mica 窗口中代价会显著放大。Electron 仅保留 transform + opacity，
     * 网页端仍沿用原有视觉。
     */
    .electron-runtime #iframe-container {
      filter: none !important;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }

    .electron-runtime::view-transition-old(alpha-tab-content),
    .electron-runtime::view-transition-new(alpha-tab-content) {
      filter: none !important;
    }

    .electron-runtime #iframe-container.entering,
    .electron-runtime .content-frame,
    .electron-runtime .content-frame.enter-right,
    .electron-runtime .content-frame.enter-left,
    .electron-runtime .content-frame.exit-left,
    .electron-runtime .content-frame.exit-right,
    .electron-runtime .content-frame.active,
    .electron-runtime .content-frame.stationary {
      filter: none !important;
    }

    .electron-runtime .content-frame {
      transition: opacity 0.26s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 0.30s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.30s !important;
    }

    .electron-runtime .content-frame.frame-transitioning,
    .electron-runtime .content-frame.enter-right,
    .electron-runtime .content-frame.enter-left,
    .electron-runtime .content-frame.exit-left,
    .electron-runtime .content-frame.exit-right {
      will-change: transform, opacity;
    }

    /* 仅供不支持 View Transition 的旧版 Chromium 使用。模糊半径保持轻量，

    html.alpha-tab-live-fallback-running .content-frame {
      transition: opacity 0.30s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 0.34s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.34s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.34s !important;
    }

    html.alpha-tab-live-fallback-running .content-frame.enter-right,
    html.alpha-tab-live-fallback-running .content-frame.enter-left,
    html.alpha-tab-live-fallback-running .content-frame.exit-left,
    html.alpha-tab-live-fallback-running .content-frame.exit-right {
      filter: blur(6px) !important;
    }

    html.alpha-tab-live-fallback-running .content-frame.active {
      filter: blur(0) !important;
    }

    /* 标题栏面积很小，保留真实毛玻璃；适当降低采样半径以减少 GPU 带宽。 */

    .electron-runtime .tab.active.dragging,

    }

  <script>
    const IS_ELECTRON_RUNTIME = !!window.electronAPI || /Electron\//i.test(navigator.userAgent);
    const FRAME_TRANSITION_TIMEOUT = IS_ELECTRON_RUNTIME ? 340 : 460;
    const SUPPORTS_TAB_SNAPSHOT_TRANSITION = typeof document.startViewTransition === 'function';
    document.documentElement.classList.toggle('electron-runtime', IS_ELECTRON_RUNTIME);
    document.documentElement.classList.toggle('alpha-tab-snapshot-capable', SUPPORTS_TAB_SNAPSHOT_TRANSITION);

    let tabVisibilityRafId = null;
    let trackedVisibleTabId = null;

    function ensureTabVisible(tab, trackingStartTime = null) {
        const wrapper = tabsContainer;
        if (!wrapper || !tab) return;

        // 1. 获取目标标签的真实数据层索引
        const tabId = tab.getAttribute('data-id');
        const index = tabs.findIndex(t => t.id === tabId);
        if (index === -1) {
          if (trackingStartTime !== null) {
            tabVisibilityRafId = null;
            trackedVisibleTabId = null;
          }
          return;
        }

        // 2. 获取动态计算的标准标签宽度 (使用 JS 缓存, 避免 getComputedStyle 导致的强制重排)
        const expectedWidth = currentTabWidth;
        
        // 3. 核心物理空间常数
        const GAP = 6;            
        // 与 .tabs-container 的水平内边距保持一致；它只用于阴影缓冲，
        // 外层负 margin 已抵消其布局占位。
        const PADDING_LEFT = 14;
        const MARGIN = 24;        

        // 4. 纯数学推算最终物理归宿坐标
        const finalLeft = PADDING_LEFT + index * (expectedWidth + GAP);
        const finalRight = finalLeft + expectedWidth;

        // 5. 获取当前视口状态
        const scrollLeft = wrapper.scrollLeft;
        // 使用最大可用物理宽度进行碰撞预测，彻底消除在弹性膨胀期间因宽度误判而导致的抽搐
        const maxWrapperWidth = window.innerWidth - 276;
        const effectiveWrapperWidth = Math.max(tabsContainerWidth || wrapper.clientWidth, maxWrapperWidth);
        
        const visibleLeft = scrollLeft;
        const visibleRight = scrollLeft + effectiveWrapperWidth;

        let targetLeft = null;

        // 6. 边缘碰撞检测
        if (finalLeft < visibleLeft + MARGIN) {
            targetLeft = Math.max(0, finalLeft - MARGIN);
        } else if (finalRight > visibleRight - MARGIN) {
            targetLeft = finalRight - effectiveWrapperWidth + MARGIN;
        }

        // 7. 是否处于高频追踪状态
        const isTracking = trackingStartTime !== null;

        if (targetLeft !== null && Math.abs(targetLeft - scrollLeft) > 0.5) {
            if (isTracking) {

                // Chromium 版本仍会继承平滑行为，连续 400ms 重启滚动动画会明显掉帧。
                // 直接赋值可让跟踪帧即时贴合，普通点击仍保留原有 smooth 动画。
                wrapper.scrollLeft = targetLeft;
            } else {
                wrapper.scrollTo({ left: targetLeft, behavior: 'smooth' });

            if (elapsed < 400 && tab.isConnected && tab.getAttribute('data-id') === trackedVisibleTabId) {

            } else {
                tabVisibilityRafId = null;
                trackedVisibleTabId = null;
            }
        }

    let activeTabId = null;
    const tabElementMap = new Map();

    const tabDataMap = new Map();
    const knownFrameSources = new WeakSet();
    let splashReadyNotified = false;

    // 缓存常用 DOM 元素（此时已解析完成, 可直接获取）

    const tabsWrapper = document.getElementById('tabsWrapper');
    const iframeContainer = document.getElementById('iframe-container');
    const addTabBtn = document.getElementById('addTabBtn');
    const titleBarElement = document.getElementById('title-bar');

    const MIN_TAB_WIDTH = 120;

    let lastSaturatedState = null;

    let activeFrameCache = null;
    const frameExitJobs = new WeakMap();
    const frameActivationJobs = new WeakMap();
    const titleUpdateTimers = new Map();
    const titleUpdateGenerations = new Map();
    const tabCloseTimers = new Map();

    function cancelFrameActivation(frame) {
      const job = frame && frameActivationJobs.get(frame);
      if (!job) return;
      cancelAnimationFrame(job.rafId);
      if (job.timerId !== null) clearTimeout(job.timerId);
      frame.removeEventListener('transitionend', job.onTransitionEnd);
      frame.classList.remove('frame-transitioning');
      frameActivationJobs.delete(frame);
    }

    function scheduleFrameActivation(frame, tabId, isHomeTransition) {
      cancelFrameActivation(frame);
      let finalized = false;
      const finalize = (event) => {
        if (finalized) return;
        if (event && event.target !== frame) return;

        cancelFrameExit(frame);

          } else {
            if (docEl) docEl.classList.remove('pause-clock-breath');
            if (bodyEl) bodyEl.classList.remove('pause-clock-breath');
          }

            if (bodyEl) bodyEl.classList.add('pause-bg-motion');

      let nextDelay = 150;

        const { iframe, init } = probe;
        if (!iframe.isConnected || !tabDataMap.has(tabId) || now >= probe.deadline) {

        }

        nextDelay = Math.min(nextDelay, delay);

    function watchFrameReady(tabId, iframe, init) {
      const now = performance.now();

        iframe,
        init,
        attempt: 0,
        nextAt: now,
        deadline: now + 10000

    // ResizeObserver 缓存容器尺寸, 避免 scroll 事件中强制回流
    let tabsContainerWidth = 0;

    // ================= 标签拖拽排序（与新增/删除动画完全解耦） =================
    let tabDragState = null;
    let suppressTabClickUntil = 0;
    let tabDragMoveRaf = null;
    let pendingTabDragX = 0;
    const tabFlipAnimations = new WeakMap();
    const TAB_DRAG_SCALE = 1.05;

    function stripSnapshotIdentity(root) {

      if (!state.dragFilterLayer) return;

      if (!strips.length) return;

       * 不在 pointermove 中调用 getBoundingClientRect()。拖拽标签的 scale 与

      const draggedScreenLeft = state.initialLeft + deltaX - ((TAB_DRAG_SCALE - 1) * state.layoutWidth / 2);

        state.dragFilterLayer.appendChild(strip);

    function handleInstanceData(data) {
      if (!data || typeof data !== 'object') return;

      // ======= TDA 文件关联处理 =======
      if (typeof data.tdaFile === 'string' && data.tdaFile.length <= 4096) {
        const accountPage = KNOWN_PAGES['account.html'];
        const existingTab = tabs.find(t => t.url && t.url.toLowerCase().includes(accountPage.url.toLowerCase()));
        if (existingTab) {
          switchTab(existingTab.id);
        } else {
          createNewTab(accountPage.url, accountPage.title);
        }

        if (window.electronAPI && window.electronAPI.readTdaFile) {
          window.electronAPI.readTdaFile(data.tdaFile).then((result) => {
            if (result && result.success && typeof result.content === 'string' && result.content.length <= 5 * 1024 * 1024) {
              const sendToAccount = () => {
                const accountTab = tabs.find(t => t.url && t.url.toLowerCase().includes('account.html'));
                if (accountTab) {
                  const frame = iframeMap.get(accountTab.id);
                  if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage({ type: 'tda-file-content', content: result.content }, '*');
                    return true;
                  }
                }
                return false;
              };
              if (!sendToAccount()) {
                setTimeout(() => { if (!sendToAccount()) setTimeout(sendToAccount, 1500); }, 800);
              }
            }
          }).catch(() => {});
        }
        return;
      }

      let pageTarget = null;
      if (data.url) {
        pageTarget = parseTargetFromUrl(data.url);
      }
      if (!pageTarget && Array.isArray(data.commandLine)) {
        for (const arg of data.commandLine) {
          pageTarget = parseTargetFromUrl(arg);
          if (pageTarget) break;
        }
      }

      if (pageTarget) {
        const existingTab = tabs.find(t => t.url && t.url.toLowerCase().includes(pageTarget.url.toLowerCase()));
        if (existingTab) {
          switchTab(existingTab.id);
        } else {
          createNewTab(pageTarget.url, pageTarget.title);
        }
      }

      // 仅转发已经解析并允许的页面，不把命令行、文件路径等敏感输入广播给子页面。
      const safeInstanceData = pageTarget ? { url: pageTarget.url } : {};
      window.dispatchEvent(new CustomEvent('second-instance-data', { detail: safeInstanceData }));
      const activeFrame = iframeMap.get(activeTabId);
      if (activeFrame && activeFrame.contentWindow) {
        try {
          activeFrame.contentWindow.postMessage({ type: 'second-instance-data', data: safeInstanceData }, '*');
        } catch(_) {}
      }
    }

    if (window.electronAPI) {
      if (window.electronAPI.onSecondInstance) {
        window.electronAPI.onSecondInstance((data) => {
          handleInstanceData(data);
        });
      }
      if (window.electronAPI.getInitialInstanceData) {
        window.electronAPI.getInitialInstanceData().then((initialData) => {
          if (initialData && (initialData.url || initialData.tdaFile)) {
            handleInstanceData(initialData);
          }
        }).catch(() => {});
      }
      if (typeof window.electronAPI.onPerformanceThrottleChanged === 'function') {
        window.electronAPI.onPerformanceThrottleChanged((throttleData) => {
          syncThrottleStateToAllFrames(throttleData);
        });
      }
      if (typeof window.electronAPI.getPerformanceThrottleState === 'function') {
        window.electronAPI.getPerformanceThrottleState().then((throttleData) => {
          if (throttleData) syncThrottleStateToAllFrames(throttleData);
        }).catch(() => {});
      }
    }

    // ======= 超链接新标签页/单页模式动态行为引擎 =======
    // 设置页消息和 storage 事件可能携带 boolean 或字符串；统一为 boolean，
    // 并忽略同一状态的重复通知，避免标题栏动画被反复重启而抖动。
    let appliedOpenNewTab = null;
    function normalizeOpenNewTab(value) {
      return value !== false && value !== 'false' && value !== 0 && value !== '0';
    }

    function applyNavBehavior(openNewTab) {
      openNewTab = normalizeOpenNewTab(openNewTab);
      if (appliedOpenNewTab === openNewTab) return;
      appliedOpenNewTab = openNewTab;

      const titleBar = document.getElementById('title-bar');
      const titleText = document.getElementById('titleText');
      const tabsWrapper = document.getElementById('tabsWrapper');
      const addTabBtn = document.getElementById('addTabBtn');

      window.ALPHA.config.linkMode = openNewTab ? 'new' : 'current';
      if (titleBar) titleBar.classList.toggle('single-page-mode', !openNewTab);
      updateTitleBarDragState();

      if (!openNewTab) {
        if (tabs.length > 1) {
          const tabsToClose = tabs.filter(t => t.id !== activeTabId).map(t => t.id);
          tabsToClose.forEach(id => closeTab(id, true));
          updateTabWidths();
        }

        if (window.electronAPI && typeof window.electronAPI.setBackgroundMaterial === 'function') {
          window.electronAPI.setBackgroundMaterial('mica');
        }
      } else {
        updateTabWidths();
        requestOverlayUpdate();

        if (window.electronAPI && typeof window.electronAPI.setBackgroundMaterial === 'function') {
          window.electronAPI.setBackgroundMaterial('tabbed');
        }
      }
    }

    function isKnownFrameSource(source) {
      return !!source && knownFrameSources.has(source);
    }

    window.addEventListener('message', (e) => {
      if (!isKnownFrameSource(e.source) || !e.data || typeof e.data !== 'object') return;

      // 将子标签发出的配置变更广播给所有其他标签页
      for (const frame of iframeMap.values()) {
        try {
          if (frame.contentWindow && frame.contentWindow !== e.source) {
            frame.contentWindow.postMessage(e.data, '*');
          }
        } catch (_) {}
      }

      if (e.data && e.data.type === 'alpha_open_new_tab') {
        applyNavBehavior(e.data.value);
      }
      if (e.data && e.data.type === 'alpha_auto_start') {
        if (typeof e.data.value === 'boolean' && window.electronAPI && window.electronAPI.setAutoStart) {
          window.electronAPI.setAutoStart(e.data.value);
        }
      }
      if (e.data && e.data.type === 'alpha_exit_on_close') {
        if (typeof e.data.value === 'boolean' && window.electronAPI && window.electronAPI.setCloseToTray) {
          window.electronAPI.setCloseToTray(!e.data.value);
        }
      }
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'alpha_open_new_tab') {
        applyNavBehavior(e.newValue);
      }
    });

    // 初始化时同步设置给主进程
    if (window.electronAPI && window.electronAPI.setCloseToTray) {
      const exitOnClose = localStorage.getItem('alpha_exit_on_close') !== 'false'; // default true
      window.electronAPI.setCloseToTray(!exitOnClose);
    }
    if (window.electronAPI && window.electronAPI.getAutoStart) {
      window.electronAPI.getAutoStart().then((enabled) => {
        localStorage.setItem('alpha_auto_start', !!enabled);
      });
    }
    if (window.electronAPI && window.electronAPI.onAutoStartChanged) {
      window.electronAPI.onAutoStartChanged((enabled) => {
        localStorage.setItem('alpha_auto_start', !!enabled);
        for (const frame of iframeMap.values()) {
          try {
            if (frame.contentWindow) {
              frame.contentWindow.postMessage({ type: 'alpha_auto_start', value: !!enabled }, '*');
            }
          } catch (_) {}
        }
      });
    }

    // ======= 原生窗口控件深浅色自适应联动 =======
    const darkThemeMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function syncNativeTitleBarTheme(isDark) {
      if (typeof isDark !== 'boolean') {
        isDark = darkThemeMediaQuery.matches;
      }
      if (window.electronAPI && typeof window.electronAPI.setTitleBarOverlay === 'function') {
        window.electronAPI.setTitleBarOverlay({
          color: 'rgba(0, 0, 0, 0)',
          symbolColor: isDark ? '#f3f3f3' : '#0f172a',
          height: 44
        });
      }
    }
    darkThemeMediaQuery.addEventListener('change', (e) => syncNativeTitleBarTheme(e.matches));
    if (window.electronAPI && typeof window.electronAPI.onNativeThemeUpdated === 'function') {
      window.electronAPI.onNativeThemeUpdated((data) => {
        syncNativeTitleBarTheme(data?.shouldUseDarkColors);
      });
    }
    syncNativeTitleBarTheme();

    // 为 wrapper 本身也注入追踪引擎
    bindAlphaTooltipTree(document);

    window.addEventListener('DOMContentLoaded', () => {
      const openNewTab = localStorage.getItem('alpha_open_new_tab');
      applyNavBehavior(openNewTab);

      const titleBar = document.getElementById('title-bar');
      const iframeContainer = document.getElementById('iframe-container');

      createNewTab('Home.html', '主页');
      if (tabsContainer) {
        tabsContainerWidth = tabsContainer.clientWidth;
      }
      requestOverlayUpdate();

      // 预留 1.8 秒, 确保在加载飞快的情况下, 用户依然能欣赏到 Logo 的光影交错
      setTimeout(() => {
          const splashFrame = document.getElementById('splashFrame');
          if(splashFrame) {
              // 给启动屏发送退场指令（Logo 开始像水一样晕染溶解并向下沉没）
              try {
                splashFrame.contentWindow.postMessage('start-exit', '*');
              } catch (_) {}
              
              // 同时, 主界面伴随弹性阻尼动画「浮出水面」
              if (titleBar) {
                titleBar.style.opacity = '1';
                titleBar.style.transform = 'translateY(0)';
              }

              if (iframeContainer) {
                iframeContainer.classList.remove('entering');
              }

              // 在内部 Logo 逐渐沉淀的过程中, 让整个启动页 iframe 进行平滑淡出, 以完美透出浮现完毕的主界面
              setTimeout(() => {
                  if (splashFrame) {
                    splashFrame.style.opacity = '0';
                    splashFrame.style.pointerEvents = 'none';
                    // 给 1.0s 的优雅退场时间, 动画彻底完结后销毁 iframe 释放内存
                    setTimeout(() => {
                      if (splashFrame && splashFrame.parentNode) {
                        splashFrame.remove();
                      }
                    }, 1000);
                  }
              }, 400); // 400ms 后启动 iframe 整体淡出, 与内部沉淀动画形成华丽的重叠视差
          }
      }, 1800);

      // 开屏动画退场与首屏渲染完全稳定后，启动后台智能错峰空闲预热
      setTimeout(() => {
        PrewarmPool.startIdlePrewarm();
      }, 2600);
    });
    const menu = document.getElementById('controlsMenu');
    const appIconBtn = document.getElementById('appIconBtn');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const settingsBtn = document.getElementById('settingsBtn');

    addTabBtn?.addEventListener('click', () => window.ALPHA.navigate('Home.html', 'new'));
    settingsBtn?.addEventListener('click', () => window.ALPHA.navigate('settings.html', 'new'));
    appIconBtn?.addEventListener('error', () => { appIconBtn.style.opacity = '0'; }, { once: true });
    menu?.addEventListener('click', (event) => {
      const item = event.target.closest('[data-action]');
      if (item && menu.contains(item)) executeAction(item.dataset.action);
    });

    let isWindowMaximizedState = false;

    function updateMaximizeMenuItem(isMaximized) {
        isWindowMaximizedState = !!isMaximized;
        const iconContainer = document.getElementById('menuIconMaximize');
        const labelSpan = document.getElementById('menuLabelMaximize');
        const maximizeItem = document.getElementById('menuItemMaximize');

        if (isWindowMaximizedState) {
            if (labelSpan) labelSpan.textContent = '还原';
            if (maximizeItem) maximizeItem.dataset.action = '还原';
            if (iconContainer) {
                iconContainer.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                `;
            }
        } else {
            if (labelSpan) labelSpan.textContent = '最大化';
            if (maximizeItem) maximizeItem.dataset.action = '最大化';
            if (iconContainer) {
                iconContainer.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                    </svg>
                `;
            }
        }
    }

    function checkAndUpdateMaximizeState() {
        if (window.electronAPI && typeof window.electronAPI.isMaximized === 'function') {
            window.electronAPI.isMaximized().then((maximized) => {
                updateMaximizeMenuItem(maximized);
            }).catch(() => {});
        }
    }

    let _isControlsMenuClosing = false;

    function toggleMenu(show) {
        if (!menu) return;
        const willShow = (show !== undefined) ? show : !menu.classList.contains('show');
        if (willShow) {
            _isControlsMenuClosing = false;
            checkAndUpdateMaximizeState();
            if (appIconBtn) {
                const rect = appIconBtn.getBoundingClientRect();
                menu.style.left = `${rect.left}px`;
                menu.style.top = `${rect.bottom + 12}px`;
            }
            menu.classList.remove('hiding');
            menu.classList.remove('show');
            void menu.offsetWidth; // 触发回流重排，重置进场动画基准
            requestAnimationFrame(() => {
                menu.classList.add('show');
            });
            if (menuBackdrop) menuBackdrop.classList.add('show');
        } else {
            if (_isControlsMenuClosing || !menu.classList.contains('show')) return;
            _isControlsMenuClosing = true;
            menu.classList.remove('show');
            menu.classList.add('hiding');
            if (menuBackdrop) menuBackdrop.classList.remove('show');
            setTimeout(() => {
                menu.classList.remove('hiding');
                _isControlsMenuClosing = false;
            }, 90);
        }
    }

    let _lastIconClickTime = 0;

    if (appIconBtn) {
      const handleAppIconClick = (e) => {
          e.stopPropagation();
          const now = Date.now();
          if (now - _lastIconClickTime > 0 && now - _lastIconClickTime < 400) {
              // 400ms 内连续点击两次：判定为双击，直接退出
              _lastIconClickTime = 0;
              toggleMenu(false);
              executeAction('退出');
              return;
          }
          _lastIconClickTime = now;
          toggleMenu();
      };

      appIconBtn.addEventListener('click', handleAppIconClick);
      appIconBtn.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          _lastIconClickTime = 0;
          toggleMenu(false);
          executeAction('退出');
      });
    }

    if (menuBackdrop) {
      const handleBackdropClose = (e) => {
          if (appIconBtn) {
              const rect = appIconBtn.getBoundingClientRect();
              if (e.clientX >= rect.left && e.clientX <= rect.right &&
                  e.clientY >= rect.top && e.clientY <= rect.bottom) {
                  return;
              }
          }
          e.stopPropagation();
          toggleMenu(false);
      };
      menuBackdrop.addEventListener('pointerdown', handleBackdropClose);
      menuBackdrop.addEventListener('mousedown', handleBackdropClose);
      menuBackdrop.addEventListener('click', handleBackdropClose);
    }

    // 全局捕获指针按下事件，点击空白或外部元素时关闭菜单
    document.addEventListener('pointerdown', (e) => {
        if (menu && menu.classList.contains('show')) {
            if (!menu.contains(e.target) && (!appIconBtn || !appIconBtn.contains(e.target))) {
                toggleMenu(false);
            }
        }
    }, true);
    document.addEventListener('mousedown', (e) => {
        if (menu && menu.classList.contains('show')) {
            if (!menu.contains(e.target) && (!appIconBtn || !appIconBtn.contains(e.target))) {
                toggleMenu(false);
            }
        }
    }, true);

    window.addEventListener('blur', () => {
        toggleMenu(false);
    });

    function executeAction(actionName) {
        console.log("执行动作:", actionName);
        toggleMenu(false);
        setTimeout(() => {
            if (actionName === '退出') {
                if (window.electronAPI && typeof window.electronAPI.close === 'function') {
                    window.electronAPI.close();
                } else if (window.electronAPI && typeof window.electronAPI.closeWindow === 'function') {
                    window.electronAPI.closeWindow();
                } else {
                    try { window.close(); } catch(_) {}
                }
            } else if (actionName === '最大化' || actionName === '还原') {
                if (window.electronAPI && typeof window.electronAPI.maximize === 'function') {
                    window.electronAPI.maximize();
                } else if (window.electronAPI && typeof window.electronAPI.maximizeWindow === 'function') {
                    window.electronAPI.maximizeWindow();
                }
            } else if (actionName === '最小化') {
                if (window.electronAPI && typeof window.electronAPI.minimize === 'function') {
                    window.electronAPI.minimize();
                } else if (window.electronAPI && typeof window.electronAPI.minimizeWindow === 'function') {
                    window.electronAPI.minimizeWindow();
                }
            }
        }, 60);
    }

    if (window.electronAPI && typeof window.electronAPI.onMaximizeChanged === 'function') {
        window.electronAPI.onMaximizeChanged((isMaximized) => {
            updateMaximizeMenuItem(isMaximized);
        });
    }
    checkAndUpdateMaximizeState();
  </script>
</body>
</html>
