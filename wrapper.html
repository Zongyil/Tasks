<!DOCTYPE html>
<html class="wrapper-html" id="wrapperHtml">
<head>
  <meta charset="utf-8" />
  <title>主页 - Tasks</title>
  <link rel="preload" href="./fonts/OPPO Sans 4.0.ttf" as="font" type="font/truetype" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: local-font:; frame-src 'self' data: blob:; child-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'" />
  <script src="./assets/liquid-glass.js"></script>
  <script src="./assets/input-glow.js"></script>
  <script src="./assets/scroll-bounce.js"></script>
  <script src="./assets/reduce-motion.js"></script>
  <style>

    *, *::before, *::after { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea, select, [contenteditable="true"], [contenteditable] {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    :root {
      --tab-width: 180px;
      --radius-sm: 8px;
    }

    @font-face { 
      font-family: 'OPPO Sans 4.0'; 
      src: url('local-font://OPPO%20Sans%204.0.ttf') format('truetype'),
           url('./fonts/OPPO Sans 4.0.ttf') format('truetype'); 
      font-weight: 1 999; 
      font-style: normal;
      font-display: block;
    }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
      font-family: "OPPO Sans 4.0", "Segoe UI Variable", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ========== 标题栏 (Liquid Glass Tabs Container) ========== */
    #title-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px;
      background: transparent;
      -webkit-app-region: drag;
      display: flex; align-items: center;
      padding-left: 12px;
      padding-right: 192px; 
      z-index: 9999995;
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      /* 截断进入下方 iframe 的标签页阴影，顶部及左右阴影保持完整展开 */
      clip-path: inset(-100px -100px 0px -100px);
      -webkit-clip-path: inset(-100px -100px 0px -100px);
    }

    /*
     * Electron 会把 -webkit-app-region:drag 单独交给原生窗口命中测试。
     * 标签排序期间暂时关闭这一原生区域，避免它与指针捕获及 backdrop
     * 合成竞争；拖拽结束后由 JS 自动恢复。
     */
    #title-bar.tab-drag-active {
      -webkit-app-region: no-drag !important;
    }



    .app-icon {
      width: 18px; height: 19px;
      margin-right: 14px;
      -webkit-app-region: no-drag;
      pointer-events: auto;
      cursor: pointer;
      flex-shrink: 0;
    }

    .title-text {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      -webkit-app-region: drag;
      user-select: none;
      white-space: nowrap;
      max-width: 0;
      margin-right: 0;
      letter-spacing: -0.2px;
      overflow: hidden;
      opacity: 0;
      transform: translate3d(-10px, 0, 0) scale(0.92);
      transform-origin: left center;
      pointer-events: none;
      transition: opacity 0.22s ease,
                  transform 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  max-width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-right 0.36s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tabs-wrapper {
      display: flex; align-items: center;
      flex: 0 0 auto; 
      width: var(--alpha-tabs-wrapper-width, auto);
      min-width: 0; max-width: calc(100vw - 256px);
      height: 52px;
      margin: -4px -14px;
      padding: 0;
      overflow: hidden;
      opacity: 1;
      transform: none;
      transform-origin: left center;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease,
                  transform 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  max-width 0.36s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 单页模式：标签组收拢淡出，同时让 Tasks 标题从左侧自然浮现。 */
    #title-bar.single-page-mode .title-text {
      max-width: 96px;
      margin-right: 14px;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    #title-bar.single-page-mode .tabs-wrapper {
      width: 0 !important;
      max-width: 0 !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      opacity: 0;
      transform: translate3d(-10px, 0, 0) scale(0.94);
      pointer-events: none;
    }

    /* 高阶拟态边缘渐隐遮罩引擎 */
    .tabs-wrapper.mask-both { -webkit-mask-image: linear-gradient(to right, transparent 0%, black 24px, black calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, transparent 0%, black 24px, black calc(100% - 24px), transparent 100%); }
    .tabs-wrapper.mask-right { -webkit-mask-image: linear-gradient(to right, black 0%, black calc(100% - 24px), transparent 100%); mask-image: linear-gradient(to right, black 0%, black calc(100% - 24px), transparent 100%); }
    .tabs-wrapper.mask-left { -webkit-mask-image: linear-gradient(to right, transparent 0%, black 24px, black 100%); mask-image: linear-gradient(to right, transparent 0%, black 24px, black 100%); }
    .tabs-wrapper.mask-none { -webkit-mask-image: none; mask-image: none; }

    /* 滑动容器 */
    .tabs-container {
      position: relative;
      display: flex; align-items: center; 
      overflow-x: auto; overflow-y: hidden;
      height: 100%;
      /*
       * 阴影缓冲区必须位于真正执行 overflow 裁切的滚动层内部。
       * 外层用等量负 margin 抵消，因此标签和加号的位置、间距均不改变；
       * 但首尾标签（包括 active 的 scale）现在有空间完整绘制阴影。
       */
      padding: 4px 14px;
      margin: 0;
      -webkit-app-region: no-drag;
      scroll-behavior: smooth;
    }
    .tabs-container::-webkit-scrollbar { display: none; }

/* --- 标签卡片基础样式 --- */
    .tab {
      display: flex; align-items: center; justify-content: space-between; 
      height: 32px; padding: 0 10px 0 14px; margin-right: 6px; 
      border-radius: 8px; font-size: 13px;
      cursor: pointer; position: relative;
      flex: 0 0 auto;
      width: var(--alpha-tab-width, 120px);
      min-width: 120px;
      max-width: 240px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.15) 100%);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
      border-top: 1px solid rgba(255, 255, 255, 0.7);
      border-left: 1px solid rgba(255, 255, 255, 0.55);
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      
      /* 独立过渡属性：避免在渐变 background 上产生浏览器插值闪白 */
      transition: border-color 0.24s ease, box-shadow 0.24s ease, color 0.22s ease, font-weight 0.22s ease, filter 0.24s ease,
                  transform 0.32s cubic-bezier(0.34, 1.45, 0.64, 1),
                  width 0.32s cubic-bezier(0.2, 0.9, 0.3, 1),
                  min-width 0.32s cubic-bezier(0.2, 0.9, 0.3, 1),
                  max-width 0.32s cubic-bezier(0.2, 0.9, 0.3, 1),
                  padding 0.32s cubic-bezier(0.2, 0.9, 0.3, 1), 
                  margin 0.32s cubic-bezier(0.2, 0.9, 0.3, 1), 
                  opacity 0.20s cubic-bezier(0.2, 0, 0, 1);
      transform-origin: center;
      transform: scale(1); 
      touch-action: none;
      -webkit-app-region: no-drag;
    }

    /* 核心高光平滑淡入淡出层（柔和通透质感，杜绝过度白光） */
    .tab::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.48) 0%, rgba(255, 255, 255, 0.22) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.24s cubic-bezier(0.2, 0, 0, 1);
    }
    .tab.active::before {
      opacity: 1;
    }
    .tab.inactive:hover::before {
      opacity: 0.35;
    }
    .tab.dragging::before {
      opacity: 0 !important;
    }

    /* 单标签页或单页模式：允许在选中的标签页及标题栏非功能区上拖拽窗口 */
    #title-bar.single-tab-mode .tab.active,
    #title-bar.single-page-mode .tab {
      -webkit-app-region: drag !important;
    }

    #title-bar.single-tab-mode .tabs-container {
      -webkit-app-region: drag;
    }

    /* 保证功能按键始终响应交互 */
    .app-icon,
    .add-tab-btn,
    .more-btn,
    .tab-close {
      -webkit-app-region: no-drag !important;
      pointer-events: auto !important;
    }

    /* 拖动层保留在标签组的同一容器中，供局部渲染副本精确对齐。 */
    .tab.dragging,
    .tab.active.dragging,
    .tab.inactive.dragging {
      position: absolute !important;
      z-index: 99999999 !important;
      margin-right: 0 !important;
      cursor: grabbing;
      /* 位移跟手保持瞬时响应，仅对阴影/边框/滤镜做平滑过渡，避免突兀变亮但不造成透明闪烁 */
      transition: border-color 0.26s ease,
                  box-shadow 0.26s ease,
                  filter 0.26s ease,
                  backdrop-filter 0.26s ease,
                  -webkit-backdrop-filter 0.26s ease !important;
      opacity: 1 !important;
      contain: none !important;
      will-change: transform !important;
      isolation: isolate;
      overflow: hidden !important;
      pointer-events: auto;
      -webkit-app-region: no-drag !important;
      transform: translate3d(var(--alpha-tab-drag-x, 0px), 0, 0) scale(1.05) !important;
      /*
       * 方案 2：表层清空所有白雾，直出 100% 纯净高斯模糊底色
       * 背景保持原梯度，由上层白底淡入实现顺滑提亮，避免透明闪烁 Mica
       */
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-top: 1.2px solid rgba(255, 255, 255, 0.75) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.55) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.25) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18), 0 3px 8px rgba(15, 23, 42, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.40) !important;
      filter: brightness(1.06) saturate(1.05) !important;
    }

    /*
     * 纯模糊底色方案（方案 2）：
     * 1. 底层（.tab-drag-filter-layer）：100% 实色纯白衬底遮蔽原生清晰文字；
     * 2. 核心（.tab-drag-filter-strip）：100% 原汁原味纯正高斯模糊（无额外白雾滤镜）；
     * 3. 顶层（.tab-title / .tab-close）：标签文本与图标。
     */
    .tab-drag-filter-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
      /*
       * 实色遮蔽基底：由透明淡入纯白实现顺滑提亮，底层保留原标签梯度避免闪烁 Mica
       */
      background: rgba(255, 255, 255, 0) !important;
      opacity: 1 !important;
      transition: background 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tab.dragging .tab-drag-filter-layer {
      background: #ffffff !important;
    }

    .tab-drag-filter-layer::after {
      display: none !important;
    }

    .tab-drag-filter-strip {
      position: absolute !important;
      z-index: 1;
      display: flex !important;
      align-items: center !important;
      height: 52px !important;
      margin: 0 !important;
      padding: 4px 14px !important;
      overflow: visible !important;
      transform: scale(var(--alpha-drag-filter-inverse-scale, 0.952381));
      transform-origin: left top;
      /* 纯粹高斯模糊处理，零滤镜调色失真，真实还原下方色彩与光斑 */
      filter: blur(14px) saturate(100%) contrast(100%) brightness(1.0) !important;
      opacity: 1;
      pointer-events: none !important;
      contain: paint;
      will-change: transform, opacity;
      transition: opacity 180ms cubic-bezier(0.2, 0, 0.2, 1);
    }

    .tab-drag-filter-strip .tab {
      transition: none !important;
      animation: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      pointer-events: none !important;
    }

    .tab.dragging > .tab-title,
    .tab.dragging > .tab-close {
      position: relative;
      z-index: 3;
    }

    /* 拖拽期间保持所有标签 backdrop-filter 稳定恒定，避免造成全栏闪没 */

    .tab.dragging .tab-close { pointer-events: none; }

    .tab-drag-placeholder {
      flex: 0 0 auto;
      height: 32px;
      margin-right: 6px;
      border-radius: 8px;
      pointer-events: none;
    }

    /* 选中状态 (自然清透发光态) */
    .tab.active {
      border-top: 1.5px solid rgba(255, 255, 255, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.85);
      border-right: 1px solid rgba(255, 255, 255, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.15), inset 1.5px 2px 6px rgba(255, 255, 255, 0.30), inset -1px -1px 4px rgba(0, 0, 0, 0.02);
      font-weight: 700; color: #0f172a; z-index: 2;
      transform: scale(1.03) !important;
    }

    /* 未选中状态 (幽灵玻璃态) */
    .tab.inactive {
      border-top: 1px solid rgba(255, 255, 255, 0.7);
      border-left: 1px solid rgba(255, 255, 255, 0.55);
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      font-weight: 600; color: #334155; z-index: 1;
      transform: scale(0.97);
    }
    .tab.inactive:hover {
      box-shadow: 0 5px 16px rgba(15, 23, 42, 0.08), 0 1px 4px rgba(15, 23, 42, 0.04), inset 0 2px 4px rgba(255, 255, 255, 0.35);
      border-top: 1px solid rgba(255, 255, 255, 0.75);
      border-left: 1px solid rgba(255, 255, 255, 0.6);
      transform: scale(1.0);
    }
    .tab.inactive:active {
      transform: scale(0.98);
      border-top: 1.5px solid rgba(255, 255, 255, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.75);
    }

    /* 丝滑入场与退场动画类 (必须放在最后以覆盖 active/inactive 状态) */
    .tab.entering, .tab.closing {
      width: 0 !important; min-width: 0 !important; max-width: 0 !important;
      padding-left: 0 !important; padding-right: 0 !important;
      margin-right: 0 !important; opacity: 0 !important; border-width: 0 !important;
    }
    /* 微调初始物理形态, 配合已有的布局阻尼曲线与视觉回弹曲线, 达成完美的液态充气感 */
    .tab.entering { transform: translateY(8px) scale(0.82) !important; filter: brightness(1.25) saturate(1.1) !important; }
    .tab.closing  { transform: translateY(-8px) scale(0.86) !important; }

    .tab-title {
      position: relative;
      z-index: 1;
      flex: 1 1 auto; text-align: left; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-right: 8px;
    }

    .tab-close {
      position: relative;
      z-index: 1;
      flex: 0 0 18px; 
      display: flex; justify-content: center; align-items: center;
      width: 18px; height: 18px; border-radius: 5px;
      color: #64748b;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center center;
      transform: translateZ(0) scale(1);
      will-change: transform;
      backface-visibility: hidden;
    }
    .tab-close:hover { background: rgba(255, 255, 255, 0.6); color: #0f172a; transform: translateZ(0) scale(1.1); }
    .tab-close:active { transform: translateZ(0) scale(0.82); background: rgba(255, 255, 255, 0.75); }
    /* 防止鼠标在叉号上时父级 .tab 的 hover 缩放导致叉号视觉上浮 1px */
    .tab.inactive:has(.tab-close:hover) {
      transform: scale(0.97);
    }
    .tab.active:has(.tab-close:hover) {
      transform: scale(1.03) !important;
    }

    /* 加号按键动态置顶 */
    .add-tab-btn {
      /* 未满时贴着左边容器跑, 满了时推到最右侧钉死 */
      flex: 0 0 auto; 
      margin-left: 8px; /* 留出一点空隙, 让渐隐卡片与加号有呼吸感 */
      position: relative; z-index: 10;
      display: flex; justify-content: center; align-items: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%);
      backdrop-filter: blur(40px) saturate(130%); -webkit-backdrop-filter: blur(40px) saturate(130%);
      border-top: 1px solid rgba(255, 255, 255, 0.85);
      border-left: 1px solid rgba(255, 255, 255, 0.65);
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      color: #0f172a; cursor: pointer;
      transition: background 0.2s,
                  box-shadow 0.2s,
                  border-color 0.2s,
                  transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  margin-left 0.36s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.2s ease;
      -webkit-app-region: no-drag;
      transform-origin: center;
      transform: translate3d(0, 0, 0) scale(1);
    }
    .add-tab-btn:hover { 
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.25) 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08), inset 0 2px 4px rgba(255, 255, 255, 0.5); 
      transform: translate3d(0, 0, 0) scale(1.08);
    }
    .add-tab-btn:active { 
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.4) 100%);
      transform: translate3d(0, 0, 0) scale(0.90); 
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05), inset 0 2px 5px rgba(255, 255, 255, 0.6);
      border-top: 1.5px solid rgba(255, 255, 255, 1);
      border-left: 1px solid rgba(255, 255, 255, 0.9);
    }

    #title-bar.tabs-saturated .tabs-wrapper {
      flex: 0 1 auto;
    }
    #title-bar.tabs-saturated .add-tab-btn {
      position: relative;
      margin-left: 8px;
    }

    #title-bar.single-page-mode .add-tab-btn {
      width: 0;
      margin-left: 0;
      opacity: 0;
      transform: translate3d(-8px, 0, 0) scale(0.75);
      border-width: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .more-btn {
      position: absolute; right: 138px; top: 0;
      width: 46px; height: 44px;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer; color: #0f172a;
      -webkit-app-region: no-drag;
      transition: background 0.12s ease, color 0.12s ease;
      z-index: 10;
    }
    .more-btn:hover { background: rgba(0, 0, 0, 0.07); }
    .more-btn:active { background: rgba(0, 0, 0, 0.12); }

    /* ========== 内容容器 ========== */
    #iframe-container {
      position: absolute; top: 44px; left: 0; width: 100vw; height: calc(100vh - 44px);
      z-index: 1;
      background: transparent;
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      filter: blur(0px);
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), transform 1.5s cubic-bezier(0.16, 1, 0.3, 1), filter 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    #iframe-container.entering {
      opacity: 0;
      transform: translateY(45px) scale(0.96);
      filter: blur(16px);
    }
    
    .content-frame {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; border: none; 
      visibility: hidden; opacity: 0; pointer-events: none;
      background: transparent;
      transform: translate3d(0, 0, 0) scale(1);
      contain: layout paint size;
      backface-visibility: hidden;
      will-change: auto;
    }

      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      overflow: clip;

      isolation: isolate;
    }

    ::view-transition-new(alpha-tab-content) {

      backface-visibility: hidden;

    }

      animation-name: alpha-tab-snapshot-exit-left;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.alpha-tab-switch-right::view-transition-new(alpha-tab-content) {
      animation-name: alpha-tab-snapshot-enter-right;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html.alpha-tab-switch-left::view-transition-old(alpha-tab-content) {
      animation-name: alpha-tab-snapshot-exit-right;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }

    html.alpha-tab-switch-left::view-transition-new(alpha-tab-content) {

    .content-frame.enter-right,
    .content-frame.enter-left,
    .content-frame.enter-top,

     * 全屏 iframe 上的 filter:blur 会让 Chromium 为整张页面建立并反复
     * 栅格化离屏纹理。在浏览器标签页中尚可接受，但在 Electron 的透明/
     * Mica 窗口中代价会显著放大。Electron 仅保留 transform + opacity，
     * 网页端仍沿用原有视觉。
     */
    .electron-runtime #iframe-container {
      filter: none !important;
    }

    .electron-runtime::view-transition-old(alpha-tab-content),
    .electron-runtime::view-transition-new(alpha-tab-content) {
      filter: none !important;
    }

    .electron-runtime .content-frame,
    .electron-runtime .content-frame.enter-right,
    .electron-runtime .content-frame.enter-left,
    .electron-runtime .content-frame.enter-top,
    .electron-runtime .content-frame.exit-left,
    .electron-runtime .content-frame.exit-right,
    .electron-runtime .content-frame.exit-depth,

    .electron-runtime .content-frame.frame-transitioning,
    .electron-runtime .content-frame.enter-right,
    .electron-runtime .content-frame.enter-left,
    .electron-runtime .content-frame.enter-top,
    .electron-runtime .content-frame.exit-left,
    .electron-runtime .content-frame.exit-right,
    .electron-runtime .content-frame.exit-depth,
    .electron-runtime .content-frame.shared-switch-right,
    .electron-runtime .content-frame.shared-switch-left,
    .electron-runtime .content-frame.shared-switch-top {

    }

    html.alpha-tab-live-fallback-running .content-frame {

                  transform 0.34s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.34s cubic-bezier(0.16, 1, 0.3, 1),
                  visibility 0.34s !important;
    }

    html.alpha-tab-live-fallback-running .content-frame.enter-right,
    html.alpha-tab-live-fallback-running .content-frame.enter-left,
    html.alpha-tab-live-fallback-running .content-frame.enter-top,
    html.alpha-tab-live-fallback-running .content-frame.exit-left,
    html.alpha-tab-live-fallback-running .content-frame.exit-right,
    html.alpha-tab-live-fallback-running .content-frame.exit-depth {

    }

    /* Electron 中以位移、透明度和轻微缩放制造纵深，不对整张 iframe 逐帧模糊。 */
    .electron-runtime.alpha-tab-live-fallback-running .content-frame.enter-right,
    .electron-runtime.alpha-tab-live-fallback-running .content-frame.enter-left,
    .electron-runtime.alpha-tab-live-fallback-running .content-frame.enter-top,
    .electron-runtime.alpha-tab-live-fallback-running .content-frame.exit-left,
    .electron-runtime.alpha-tab-live-fallback-running .content-frame.exit-right,
    .electron-runtime.alpha-tab-live-fallback-running .content-frame.exit-depth {

    }

    }

                color 0.15s ease,
                transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);

        /* 展开时的优雅阶梯进场 (Staggered Cascade Entrance) */

  <script>
    const IS_ELECTRON_RUNTIME = !!window.electronAPI || /Electron\//i.test(navigator.userAgent);
    const FRAME_TRANSITION_TIMEOUT = IS_ELECTRON_RUNTIME ? 320 : 360;
    // 切换动画默认开启；用户的“减弱动态效果”设置仍具有最高优先级。
    const ENABLE_FRAME_TRANSITIONS = localStorage.getItem('alpha_enable_frame_transitions') !== 'false';
    // 完整 iframe 快照在透明 Electron 窗口中显存代价较高，仅保留为显式诊断选项。
    // 默认采用短时 transform/opacity 合成动画，不削弱视觉层次。
    const SUPPORTS_TAB_SNAPSHOT_TRANSITION =
      localStorage.getItem('alpha_enable_snapshot_transitions') === 'true' &&
      typeof document.startViewTransition === 'function';
    document.documentElement.classList.toggle('electron-runtime', IS_ELECTRON_RUNTIME);
    document.documentElement.classList.toggle('alpha-tab-snapshot-capable', SUPPORTS_TAB_SNAPSHOT_TRANSITION);

    let currentTabWidth = 120; // 缓存的全局标签宽度
    let tabVisibilityRafId = null;
    let trackedVisibleTabId = null;

    function ensureTabVisible(tab, trackingStartTime = null) {
        const wrapper = tabsContainer;
        if (!wrapper || !tab) return;

        // 1. 获取目标标签的真实数据层索引
        const tabId = tab.getAttribute('data-id');
        const index = tabs.findIndex(t => t.id === tabId);
        if (index === -1) {
          if (trackingStartTime !== null) {
            tabVisibilityRafId = null;
            trackedVisibleTabId = null;
          }
          return;
        }

        // 2. 获取动态计算的标准标签宽度 (使用 JS 缓存, 避免 getComputedStyle 导致的强制重排)
        const expectedWidth = currentTabWidth;
        
        // 3. 核心物理空间常数
        const GAP = 6;            
        // 与 .tabs-container 的水平内边距保持一致；它只用于阴影缓冲，
        // 外层负 margin 已抵消其布局占位。
        const PADDING_LEFT = 14;
        const MARGIN = 24;        

        // 4. 纯数学推算最终物理归宿坐标
        const finalLeft = PADDING_LEFT + index * (expectedWidth + GAP);
        const finalRight = finalLeft + expectedWidth;

        // 5. 获取当前视口状态
        const scrollLeft = wrapper.scrollLeft;
        // 使用最大可用物理宽度进行碰撞预测，彻底消除在弹性膨胀期间因宽度误判而导致的抽搐
        const maxWrapperWidth = window.innerWidth - 276;
        const effectiveWrapperWidth = Math.max(tabsContainerWidth || wrapper.clientWidth, maxWrapperWidth);
        
        const visibleLeft = scrollLeft;
        const visibleRight = scrollLeft + effectiveWrapperWidth;

        let targetLeft = null;

        // 6. 边缘碰撞检测
        if (finalLeft < visibleLeft + MARGIN) {
            targetLeft = Math.max(0, finalLeft - MARGIN);
        } else if (finalRight > visibleRight - MARGIN) {
            targetLeft = finalRight - effectiveWrapperWidth + MARGIN;
        }

        // 7. 是否处于高频追踪状态
        const isTracking = trackingStartTime !== null;

        if (targetLeft !== null && Math.abs(targetLeft - scrollLeft) > 0.5) {
            if (isTracking) {
                // CSS 已声明 scroll-behavior:smooth；scrollTo({behavior:'auto'}) 在部分
                // Chromium 版本仍会继承平滑行为，连续 400ms 重启滚动动画会明显掉帧。
                // 直接赋值可让跟踪帧即时贴合，普通点击仍保留原有 smooth 动画。
                wrapper.scrollLeft = targetLeft;
            } else {
                wrapper.scrollTo({ left: targetLeft, behavior: 'smooth' });
            }
        }

        // 8. 启动 rAF 动画帧循环, 完美贴合 CSS width 的 cubic-bezier 过渡周期 (400ms)
        if (isTracking) {
            const elapsed = performance.now() - trackingStartTime;
            if (elapsed < 400 && tab.isConnected && tab.getAttribute('data-id') === trackedVisibleTabId) {
                tabVisibilityRafId = requestAnimationFrame(() => ensureTabVisible(tab, trackingStartTime));
            } else {
                tabVisibilityRafId = null;
                trackedVisibleTabId = null;
            }
        }
    }

    function trackTabVisibility(tab) {
      if (!tab) return;
      if (tabVisibilityRafId !== null) {
        cancelAnimationFrame(tabVisibilityRafId);
        tabVisibilityRafId = null;
      }
      trackedVisibleTabId = tab.getAttribute('data-id');
      ensureTabVisible(tab, performance.now());
    }

    let tabs = [];
    let activeTabId = null;
    const tabElementMap = new Map();
    const iframeMap = new Map();
    const tabDataMap = new Map();
    // Multiple logical tabs may point at one physical iframe. Metadata lives on the physical
    // frame so duplicate tabs do not multiply renderer, timer and GPU costs.
    const frameMetaMap = new WeakMap();
    const reusableFrameIndex = new Map();
    const knownFrameSources = new WeakSet();
    let splashReadyNotified = false;

    // ===== 滚动位置持久化：根页面 + 内部滚动容器，按逻辑标签独立保存 =====
    // 很多子页面真正滚动的是 main/list 容器而不是 window。旧实现只记录 scrollY，
    // 因而窗口失焦再恢复时会把这类页面错误地送回顶部。
    const tabScrollSnapshot = new Map(); // tabId -> { pageKey, root:{x,y}, elements:Map }
    const tabScrollRestoreJobs = new Map();
    const scrollElementKeyCache = new WeakMap();
    const scrollRestoreFrames = new WeakMap();
    let tabScrollRestoreGeneration = 0;

    function escapeScrollSelector(value) {
      if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
      return String(value).replace(/[^a-zA-Z0-9_-]/g, ch => `\\${ch}`);
    }

    function getScrollElementKey(element, doc) {
      if (!element || element.nodeType !== 1 || !doc) return null;
      const cached = scrollElementKeyCache.get(element);
      if (cached && cached.doc === doc) return cached.key;
      let key = null;
      if (element.id) key = `#${escapeScrollSelector(element.id)}`;
      if (key) {
        scrollElementKeyCache.set(element, { doc, key });
        return key;
      }
      for (const attr of ['data-alpha-scroll-key', 'data-scroll-key', 'data-testid']) {
        const value = element.getAttribute(attr);
        if (value) {
          key = `[${attr}="${escapeScrollSelector(value)}"]`;
          scrollElementKeyCache.set(element, { doc, key });
          return key;
        }
      }
      const segments = [];
      let node = element;
      for (let depth = 0; node && node.nodeType === 1 && node !== doc.body && depth < 7; depth++) {
        let segment = node.tagName.toLowerCase();
        const parent = node.parentElement;
        if (parent) {
          const siblings = Array.from(parent.children).filter(child => child.tagName === node.tagName);
          if (siblings.length > 1) segment += `:nth-of-type(${siblings.indexOf(node) + 1})`;
        }
        segments.unshift(segment);
        node = parent;
      }
      key = segments.length ? `body>${segments.join('>')}` : null;
      if (key) scrollElementKeyCache.set(element, { doc, key });
      return key;
    }

    function getFrameScrollPageKey(frame, tabId) {
      return getPageInstanceKey(getIframePageRelativeUrl(frame) || tabDataMap.get(tabId)?.url || '');
    }

    function captureTabScroll(tabId, scrollTarget = null, options = {}) {
      if (!tabId) return;
      const frame = iframeMap.get(tabId);
      if (!frame) return;
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument || (win ? win.document : null);
        if (!win || !doc) return;
        const pageKey = getFrameScrollPageKey(frame, tabId);
        const previous = tabScrollSnapshot.get(tabId);
        const samePage = !!previous && (!previous.pageKey || !pageKey || previous.pageKey === pageKey);
        const snapshot = samePage ? previous : {
          pageKey,
          root: { x: 0, y: 0 },
          elements: new Map(),
          elementRefs: new Map()
        };
        if (!snapshot.root) snapshot.root = { x: snapshot.x || 0, y: snapshot.y || 0 };
        if (!(snapshot.elements instanceof Map)) snapshot.elements = new Map();
        if (!(snapshot.elementRefs instanceof Map)) snapshot.elementRefs = new Map();
        snapshot.pageKey = pageKey || snapshot.pageKey || null;

        const root = doc.scrollingElement || doc.documentElement || doc.body;
        let rootX = Number(win.scrollX || root?.scrollLeft || doc.body?.scrollLeft || 0);
        let rootY = Number(win.scrollY || root?.scrollTop || doc.body?.scrollTop || 0);
        const preserveZero = !!options.preserveExistingOnZero && rootX === 0 && rootY === 0 &&
          (snapshot.root.x !== 0 || snapshot.root.y !== 0);
        if (!preserveZero) snapshot.root = { x: rootX, y: rootY };

        const saveElement = (element, preserveExisting = false) => {
          if (!element || element === win || element === doc || element === doc.documentElement ||
              element === doc.body || element === root || element.nodeType !== 1) return;
          const key = getScrollElementKey(element, doc);
          if (!key) return;
          const position = { x: Number(element.scrollLeft || 0), y: Number(element.scrollTop || 0) };
          const oldPosition = snapshot.elements.get(key);
          if (preserveExisting && position.x === 0 && position.y === 0 && oldPosition &&
              (oldPosition.x !== 0 || oldPosition.y !== 0)) return;
          snapshot.elements.set(key, position);
          // 同一 document 的失焦恢复优先使用真实节点引用；选择器只负责跨文档历史恢复。
          snapshot.elementRefs.set(key, element);
        };

        saveElement(scrollTarget, !!options.preserveExistingOnZero);
        if (options.includeTracked) {
          for (const key of snapshot.elements.keys()) {
            let element = null;
            try { element = doc.querySelector(key); } catch (_) {}
            if (element) saveElement(element, !!options.preserveExistingOnZero);
          }
        }
        snapshot.capturedAt = performance.now();
        tabScrollSnapshot.set(tabId, snapshot);
      } catch (_) {}
    }

    function restoreTabScroll(frame, tabId) {
      if (!frame || !tabId || iframeMap.get(tabId) !== frame) return;
      const snapshot = tabScrollSnapshot.get(tabId);
      if (!snapshot) return;
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument || (win ? win.document : null);
        if (!win || !doc) return;
        const currentPageKey = getFrameScrollPageKey(frame, tabId);
        if (snapshot.pageKey && currentPageKey && snapshot.pageKey !== currentPageKey) return;
        const rootPosition = snapshot.root || { x: snapshot.x || 0, y: snapshot.y || 0 };
        const restoreInlineScrollBehavior = (element, callback) => {
          if (!element || !element.style) return callback();
          const value = element.style.getPropertyValue('scroll-behavior');
          const priority = element.style.getPropertyPriority('scroll-behavior');
          element.style.setProperty('scroll-behavior', 'auto', 'important');
          try { callback(); } finally {
            if (value) element.style.setProperty('scroll-behavior', value, priority);
            else element.style.removeProperty('scroll-behavior');
          }
        };
        const instantElementScroll = (element, x, y) => {
          if (!element) return;
          restoreInlineScrollBehavior(element, () => {
            try { element.scrollTo({ left: x, top: y, behavior: 'instant' }); }
            catch (_) { element.scrollLeft = x; element.scrollTop = y; }
            // 直接赋值作为旧 Chromium 以及自定义 scrollTo 覆盖的兜底。
            element.scrollLeft = x;
            element.scrollTop = y;
          });
        };

        scrollRestoreFrames.set(frame, performance.now() + 260);
        restoreInlineScrollBehavior(doc.documentElement, () => {
          restoreInlineScrollBehavior(doc.body, () => {
            try { win.scrollTo({ left: rootPosition.x, top: rootPosition.y, behavior: 'instant' }); }
            catch (_) { try { win.scrollTo(rootPosition.x, rootPosition.y); } catch (_) {} }
          });
        });
        const root = doc.scrollingElement || doc.documentElement;
        instantElementScroll(root, rootPosition.x, rootPosition.y);
        if (doc.body && doc.body !== root) instantElementScroll(doc.body, rootPosition.x, rootPosition.y);
        if (snapshot.elements instanceof Map) {
          for (const [key, position] of snapshot.elements) {
            let element = snapshot.elementRefs instanceof Map ? snapshot.elementRefs.get(key) : null;
            if (!element || !element.isConnected || element.ownerDocument !== doc) {
              element = null;
              try { element = doc.querySelector(key); } catch (_) {}
              if (element) {
                if (!(snapshot.elementRefs instanceof Map)) snapshot.elementRefs = new Map();
                snapshot.elementRefs.set(key, element);
              }
            }
            if (!element) continue;
            instantElementScroll(element, position.x, position.y);
          }
        }
      } catch (_) {}
    }

    function cancelTabScrollRestore(tabId) {
      const job = tabScrollRestoreJobs.get(tabId);
      if (!job) return;
      if (job.rafId !== null) cancelAnimationFrame(job.rafId);
      for (const timerId of job.timerIds) clearTimeout(timerId);
      tabScrollRestoreJobs.delete(tabId);
    }

    function scheduleRestoreTabScroll(frame, tabId, options = {}) {
      if (!frame || !tabId) return;
      cancelTabScrollRestore(tabId);
      const generation = ++tabScrollRestoreGeneration;
      const job = { generation, rafId: null, timerIds: [] };
      tabScrollRestoreJobs.set(tabId, job);
      const apply = () => {
        const current = tabScrollRestoreJobs.get(tabId);
        if (!current || current.generation !== generation || activeTabId !== tabId || iframeMap.get(tabId) !== frame) return;
        restoreTabScroll(frame, tabId);
      };
      apply();
      job.rafId = requestAnimationFrame(() => {
        job.rafId = null;
        apply();
      });
      // 失焦恢复时给响应式布局/虚拟列表三个校正点；任何真实用户输入都会取消作业，
      // 因而不会在用户已经开始滚动后又把页面拉回旧位置。
      const delays = options.extended ? [60, 180, 420] : [70];
      for (const delay of delays) {
        job.timerIds.push(setTimeout(() => {
          apply();
          if (delay === delays[delays.length - 1]) tabScrollRestoreJobs.delete(tabId);
        }, delay));
      }
    }
    // 在隐藏帧之前捕获当前活动标签的滚动，切换后恢复目标标签的滚动
    function flushActiveTabScroll() {
      if (activeTabId) captureTabScroll(activeTabId, null, { includeTracked: true });
    }

    // 缓存常用 DOM 元素（此时已解析完成, 可直接获取）
    const tabsContainer = document.getElementById('tabsContainer');
    const tabsWrapper = document.getElementById('tabsWrapper');
    const iframeContainer = document.getElementById('iframe-container');
    const addTabBtn = document.getElementById('addTabBtn');
    const titleBarElement = document.getElementById('title-bar');

    const GAP = 6;
    const MIN_TAB_WIDTH = 120;
    const MAX_TAB_WIDTH = 240;

    // 缓存上次实际写入的布局状态，避免 resize 期间重复触发样式失效。
    let lastWrapperWidthValue = '';
    let lastSaturatedState = null;
    let lastOverlayMaskClass = '';

    //缓存当前活动标签/iframe的 DOM 引用, 避免全量遍历
    let activeTabElCache = null;
    let activeFrameCache = null;
    const frameExitJobs = new WeakMap();
    const frameActivationJobs = new WeakMap();
    const sharedFrameSwitchJobs = new WeakMap();
    const titleUpdateTimers = new Map();
    const titleUpdateGenerations = new Map();
    const tabCloseTimers = new Map();

    function cancelFrameActivation(frame) {
      const job = frame && frameActivationJobs.get(frame);
      if (!job) return;
      cancelAnimationFrame(job.rafId);
      if (job.timerId !== null) clearTimeout(job.timerId);
      frame.removeEventListener('transitionend', job.onTransitionEnd);
      frame.classList.remove('frame-transitioning');
      frameActivationJobs.delete(frame);
    }

    function scheduleFrameActivation(frame, tabId, isHomeTransition) {
      cancelFrameActivation(frame);
      let finalized = false;
      const finalize = (event) => {
        if (finalized) return;
        if (event && event.target !== frame) return;

        finalized = true;
        const job = frameActivationJobs.get(frame);
        if (job) {
          if (job.timerId !== null) clearTimeout(job.timerId);
          frame.removeEventListener('animationend', job.onEnd);
          frame.removeEventListener('transitionend', job.onEnd);
          frameActivationJobs.delete(frame);
        }
        if (activeTabId !== tabId || !frame.isConnected) return;
        frame.classList.remove('enter-left', 'enter-right', 'enter-top', 'stationary', 'frame-transitioning');
        frame.classList.add('active');
      };

      frame.classList.add('frame-transitioning');
      const timerId = setTimeout(() => finalize(), FRAME_TRANSITION_TIMEOUT + 40);
      frameActivationJobs.set(frame, { timerId, onEnd: finalize });
      frame.addEventListener('animationend', finalize);
      frame.addEventListener('transitionend', finalize);
      try {
        if (frame.contentWindow) {
          frame.contentWindow.dispatchEvent(new CustomEvent('AlphaWake', { detail: { isHomeTransition } }));
        }
      } catch (_) {}
    }

    function cancelFrameExit(frame) {
      const job = frame && frameExitJobs.get(frame);
      if (!job) return;
      clearTimeout(job.timerId);
      if (job.onEnd) {
        frame.removeEventListener('animationend', job.onEnd);
        frame.removeEventListener('transitionend', job.onEnd);
      }
      frameExitJobs.delete(frame);
    }

    function scheduleFrameExit(frame, frameTabId) {
      if (!frame) return;
      cancelFrameExit(frame);

      let finalized = false;
      const finalize = (event) => {
        if (finalized) return;
        if (event && event.target !== frame) return;

        finalized = true;
        cancelFrameExit(frame);
        if (activeTabId === frameTabId || !frame.isConnected) return;

        frame.className = 'content-frame';
        frame.style.opacity = '';
        frame.style.display = 'none';
        frame.inert = true;
        frame.setAttribute('aria-hidden', 'true');
        notifyFrameSleep(frame);
      };

      const timerId = setTimeout(() => finalize(), FRAME_TRANSITION_TIMEOUT + 40);
      frameExitJobs.set(frame, { timerId, onEnd: finalize });
      frame.addEventListener('animationend', finalize);
      frame.addEventListener('transitionend', finalize);
    }

    // ======= 性能与节能自适应降载协同引擎 =======
    let currentThrottleState = {
      isWindowActive: true,
      cpuUsage: 0,
      pauseClockBreath: false,
      pauseBgMotion: false
    };

    function applyThrottleToIframe(iframeNode, throttle) {
      if (!iframeNode || !throttle) return;
      try {
        const doc = iframeNode.contentDocument || (iframeNode.contentWindow ? iframeNode.contentWindow.document : null);
        if (doc) {
          const docEl = doc.documentElement;
          const bodyEl = doc.body;
          if (throttle.pauseClockBreath) {
            if (docEl) docEl.classList.add('pause-clock-breath');
            if (bodyEl) bodyEl.classList.add('pause-clock-breath');
          } else {
            if (docEl) docEl.classList.remove('pause-clock-breath');
            if (bodyEl) bodyEl.classList.remove('pause-clock-breath');
          }

          if (throttle.pauseBgMotion) {
            if (docEl) docEl.classList.add('pause-bg-motion');
            if (bodyEl) bodyEl.classList.add('pause-bg-motion');
          } else {
            if (docEl) docEl.classList.remove('pause-bg-motion');
            if (bodyEl) bodyEl.classList.remove('pause-bg-motion');
          }
        }
        if (iframeNode.contentWindow) {
          try {
            iframeNode.contentWindow.dispatchEvent(new CustomEvent('AlphaPerformanceThrottle', { detail: throttle }));
          } catch (_) {}
        }
      } catch (_) {}
    }

    function syncThrottleStateToAllFrames(throttle) {
      if (!throttle) return;
      // 保留主进程未来可能扩展的字段，仅跳过完全相同的重复状态。
      const nextState = { ...currentThrottleState, ...throttle };
      const stateKeys = new Set([...Object.keys(currentThrottleState), ...Object.keys(nextState)]);
      if ([...stateKeys].every(key => Object.is(currentThrottleState[key], nextState[key]))) return;

      currentThrottleState = nextState;
      for (const frame of new Set(iframeMap.values())) {
        applyThrottleToIframe(frame, nextState);
      }
    }

    // 所有 iframe 共用一个 readyState 调度器，避免多标签各自维持高频计时器。
    const frameReadyProbes = new Map();
    let frameReadyTimer = null;
    let frameReadyTimerDueAt = 0;

    function getFrameProbeDelay(attempt) {
      if (attempt < 6) return 25;
      if (attempt < 18) return 60;
      return 150;
    }

    function scheduleFrameReadyPump(delay = 0) {
      const normalizedDelay = Math.max(0, delay);
      const dueAt = performance.now() + normalizedDelay;
      if (frameReadyTimer !== null) {
        if (dueAt >= frameReadyTimerDueAt - 1) return;
        clearTimeout(frameReadyTimer);
      }
      frameReadyTimerDueAt = dueAt;
      frameReadyTimer = setTimeout(runFrameReadyPump, normalizedDelay);
    }

    function cancelFrameReadyProbe(tabId) {
      frameReadyProbes.delete(tabId);
      if (!frameReadyProbes.size && frameReadyTimer !== null) {
        clearTimeout(frameReadyTimer);
        frameReadyTimer = null;
        frameReadyTimerDueAt = 0;
      }
    }

    function runFrameReadyPump() {
      frameReadyTimer = null;
      frameReadyTimerDueAt = 0;
      if (!frameReadyProbes.size) return;

      const now = performance.now();
      let nextDelay = 150;
      for (const [tabId, probe] of frameReadyProbes) {
        const { iframe, init } = probe;
        if (!iframe.isConnected || !tabDataMap.has(tabId) || now >= probe.deadline) {
          frameReadyProbes.delete(tabId);
          continue;
        }
        if (now < probe.nextAt) {
          nextDelay = Math.min(nextDelay, probe.nextAt - now);
          continue;
        }

        try {
          const doc = iframe.contentDocument || (iframe.contentWindow ? iframe.contentWindow.document : null);
          if (doc && doc.readyState !== 'loading' && doc.URL !== 'about:blank') {
            frameReadyProbes.delete(tabId);
            init();
            continue;
          }
        } catch (_) {
          frameReadyProbes.delete(tabId);
          continue;
        }

        probe.attempt++;
        const delay = getFrameProbeDelay(probe.attempt);
        probe.nextAt = now + delay;
        nextDelay = Math.min(nextDelay, delay);
      }

      if (frameReadyProbes.size) scheduleFrameReadyPump(Math.max(0, Math.ceil(nextDelay)));
    }

    function watchFrameReady(tabId, iframe, init) {
      const now = performance.now();
      frameReadyProbes.set(tabId, {
        iframe,
        init,
        attempt: 0,
        nextAt: now,
        deadline: now + 10000
      });
      scheduleFrameReadyPump(0);
    }

    // ResizeObserver 缓存容器尺寸, 避免 scroll 事件中强制回流
    let tabsContainerWidth = 0;

    // ================= 标签拖拽排序（与新增/删除动画完全解耦） =================
    let tabDragState = null;
    let suppressTabClickUntil = 0;
    let tabDragMoveRaf = null;
    let pendingTabDragX = 0;
    const tabFlipAnimations = new WeakMap();
    const TAB_DRAG_SCALE = 1.05;

    function stripSnapshotIdentity(root) {
      root.removeAttribute('id');
      root.removeAttribute('style');
      root.setAttribute('aria-hidden', 'true');
      root.inert = true;
      for (const element of root.querySelectorAll('[id]')) element.removeAttribute('id');
    }

    function updateTabDragFilterAlignment(state, deltaX = 0) {
      if (!state.dragFilterLayer) return;
      const strips = state.dragFilterLayer.querySelectorAll('.tab-drag-filter-strip');
      if (!strips.length) return;

      /*
       * 不在 pointermove 中调用 getBoundingClientRect()。拖拽标签的 scale 与
       * transform-origin 已知，可以直接算出它在屏幕上的外框；这样每帧只有
       * transform/left/top 写入，不会强制整条标签栏同步回流。
       */
      const draggedScreenLeft = state.initialLeft + deltaX - ((TAB_DRAG_SCALE - 1) * state.layoutWidth / 2);
      const draggedScreenTop = state.initialTop - ((TAB_DRAG_SCALE - 1) * state.layoutHeight / 2);
      const sourceScreenLeft = state.containerRect.left - tabsContainer.scrollLeft;
      const sourceScreenTop = state.containerRect.top;

      const left = `${(sourceScreenLeft - draggedScreenLeft) / TAB_DRAG_SCALE}px`;
      const top = `${(sourceScreenTop - draggedScreenTop) / TAB_DRAG_SCALE}px`;
      const inverseScale = `${1 / TAB_DRAG_SCALE}`;

      strips.forEach(strip => {
        strip.style.left = left;
        strip.style.top = top;
        strip.style.setProperty('--alpha-drag-filter-inverse-scale', inverseScale);
      });
    }

    function refreshTabDragFilterSnapshot(state) {
      if (!state.dragFilterLayer) return;

      const previousStrip = state.dragFilterStrip;
      const strip = tabsContainer.cloneNode(true);
      strip.className = 'tab-drag-filter-strip';
      strip.querySelectorAll('.dragging').forEach(element => element.remove());
      stripSnapshotIdentity(strip);
      strip.style.width = `${Math.max(tabsContainer.scrollWidth, tabsContainer.clientWidth)}px`;

      if (previousStrip && previousStrip.isConnected) {
        // 平滑交叉淡化过渡 (Cross-fade transition)，避免卡片底色/槽位重排时突兀硬切
        strip.style.opacity = '0';
        state.dragFilterLayer.appendChild(strip);
        state.dragFilterStrip = strip;
        updateTabDragFilterAlignment(state, pendingTabDragX - state.startX);

        // 触发重绘并平滑淡入新副本
        requestAnimationFrame(() => {
          strip.style.opacity = '1';
        });

        previousStrip.style.opacity = '0';
        setTimeout(() => {
          if (previousStrip.isConnected && previousStrip !== state.dragFilterStrip) {
            previousStrip.remove();
          }
        }, 200);
      } else {
        state.dragFilterLayer.replaceChildren(strip);
        state.dragFilterStrip = strip;
        updateTabDragFilterAlignment(state, pendingTabDragX - state.startX);
      }
    }

    function createTabDragFilterSnapshot(state) {
      const layer = document.createElement('div');
      layer.className = 'tab-drag-filter-layer';
      layer.setAttribute('aria-hidden', 'true');
      layer.inert = true;
      // 起始透明，通过下一帧移除内联样式触发 background 淡入，避免瞬切且不闪 Mica（底层保留原梯度）
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const transparentBg = isDark ? 'rgba(17,20,28,0)' : 'rgba(255,255,255,0)';
      layer.style.setProperty('background', transparentBg, 'important');
      state.dragFilterLayer = layer;
      state.tabEl.prepend(layer);
      void layer.offsetWidth;
      const raf1 = requestAnimationFrame(() => {
        const raf2 = requestAnimationFrame(() => {
          if (layer.isConnected) layer.style.removeProperty('background');
        });
        layer._fadeRaf = raf2;
      });
      layer._fadeRaf = raf1;
      refreshTabDragFilterSnapshot(state);
    }

    function removeTabDragFilterSnapshot(state) {
      const layer = state.dragFilterLayer;
      if (!layer || !layer.isConnected) {
        state.dragFilterLayer = null;
        state.dragFilterStrip = null;
        return;
      }
      if (layer._fadeRaf) {
        cancelAnimationFrame(layer._fadeRaf);
        layer._fadeRaf = null;
      }
      layer.remove();
      state.dragFilterLayer = null;
      state.dragFilterStrip = null;
    }

    function getTabPositions() {
      const positions = new Map();
      for (const el of tabsContainer.querySelectorAll('.tab:not(.closing)')) {
        positions.set(el, el.getBoundingClientRect().left);
      }
      return positions;
    }

    function playTabFlip(previousPositions) {
      for (const [el, previousLeft] of previousPositions) {
        if (!el.isConnected) continue;
        const previousAnimation = tabFlipAnimations.get(el);
        if (previousAnimation) previousAnimation.cancel();
        const delta = previousLeft - el.getBoundingClientRect().left;
        if (Math.abs(delta) < 0.5) continue;
        const animation = el.animate(
          [{ translate: `${delta}px 0` }, { translate: '0 0' }],
          { duration: 210, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' }
        );
        tabFlipAnimations.set(el, animation);
        animation.addEventListener('finish', () => {
          if (tabFlipAnimations.get(el) === animation) tabFlipAnimations.delete(el);
        }, { once: true });
        animation.addEventListener('cancel', () => {
          if (tabFlipAnimations.get(el) === animation) tabFlipAnimations.delete(el);
        }, { once: true });
      }
    }

    function syncTabOrderFromDom(state = null) {
      const orderedIds = [...tabsContainer.children]
        .filter(el => !el.classList.contains('closing'))
        .map(el => el === state?.placeholder
          ? state.tabEl.getAttribute('data-id')
          : el.getAttribute('data-id'))
        .filter(Boolean);

      const order = new Map(orderedIds.map((id, index) => [id, index]));
      tabs.sort((a, b) => (order.get(a.id) ?? Number.MAX_SAFE_INTEGER) - (order.get(b.id) ?? Number.MAX_SAFE_INTEGER));
    }

    function reorderTabPlaceholder(state, pointerX) {
      // 标签中心在拖拽开始时一次性缓存。移动帧只做数值比较，避免逐标签
      // getBoundingClientRect() 与随后 DOM 写入交替造成强制同步布局。
      const scrollLeft = tabsContainer.scrollLeft;
      let targetIndex = 0;
      let nearestDistance = Number.POSITIVE_INFINITY;
      for (let index = 0; index < state.slotCenters.length; index++) {
        const distance = Math.abs(pointerX - (state.slotCenters[index] - scrollLeft));
        if (distance < nearestDistance) {
          nearestDistance = distance;
          targetIndex = index;
        }
      }
      if (targetIndex === state.currentIndex) return;

      const orderedNodes = [...tabsContainer.children]
        .filter(el => !el.classList.contains('closing') && el !== state.tabEl);
      const currentIndex = orderedNodes.indexOf(state.placeholder);
      if (currentIndex === -1 || !orderedNodes.length) return;
      targetIndex = Math.max(0, Math.min(targetIndex, orderedNodes.length - 1));
      if (targetIndex === currentIndex) {
        state.currentIndex = currentIndex;
        return;
      }

      const previousPositions = getTabPositions();
      const targetNode = orderedNodes[targetIndex];
      if (targetIndex < currentIndex) targetNode.before(state.placeholder);
      else targetNode.after(state.placeholder);
      state.currentIndex = targetIndex;
      syncTabOrderFromDom(state);
      playTabFlip(previousPositions);
      refreshTabDragFilterSnapshot(state);
    }

    function beginTabDrag(state) {
      const placeholder = document.createElement('div');
      placeholder.className = 'tab-drag-placeholder';
      placeholder.style.width = `${state.layoutWidth}px`;
      state.placeholder = placeholder;
      state.dragging = true;

      const scrollLeft = tabsContainer.scrollLeft;
      const containerRect = tabsContainer.getBoundingClientRect();
      state.containerRect = containerRect;

      const draggableTabs = [...tabsContainer.querySelectorAll('.tab:not(.closing)')];
      state.slotCenters = draggableTabs.map(el => {
        const rect = el.getBoundingClientRect();
        return rect.left + rect.width / 2 + scrollLeft;
      });
      state.currentIndex = Math.max(0, draggableTabs.indexOf(state.tabEl));

      // 计算相对于 tabsContainer 滚动内容区域的绝对坐标
      const initialOffsetLeft = state.initialLeft - containerRect.left + scrollLeft;
      const initialOffsetTop = state.initialTop - containerRect.top;

      // 占位符置于原位置，拖拽中的标签置于 tabsContainer 最顶层（同一合成层以保障毛玻璃实时采样）
      tabsContainer.insertBefore(placeholder, state.tabEl);
      state.tabEl.classList.add('dragging');
      state.tabEl.style.width = `${state.layoutWidth}px`;
      state.tabEl.style.left = `${initialOffsetLeft}px`;
      state.tabEl.style.top = `${initialOffsetTop}px`;
      state.tabEl.style.setProperty('--alpha-tab-drag-x', '0px');
      tabsContainer.appendChild(state.tabEl);
      titleBarElement?.classList.add('tab-drag-active');
      pendingTabDragX = state.startX;
      createTabDragFilterSnapshot(state);

      try { state.tabEl.setPointerCapture(state.pointerId); } catch (_) {}
    }

    function finishTabDrag(event) {
      const state = tabDragState;
      if (!state || state.pointerId !== event.pointerId) return;
      tabDragState = null;
      if (tabDragMoveRaf !== null) {
        cancelAnimationFrame(tabDragMoveRaf);
        tabDragMoveRaf = null;
      }
      try { state.tabEl.releasePointerCapture(event.pointerId); } catch (_) {}
      if (!state.dragging) return;

      suppressTabClickUntil = performance.now() + 250;
      const floatingRect = state.tabEl.getBoundingClientRect();
      removeTabDragFilterSnapshot(state);
      if (state.placeholder?.isConnected) {
        state.placeholder.replaceWith(state.tabEl);
      }

      state.tabEl.classList.remove('dragging');
      state.tabEl.style.removeProperty('width');
      state.tabEl.style.removeProperty('left');
      state.tabEl.style.removeProperty('top');
      state.tabEl.style.removeProperty('--alpha-tab-drag-x');
      titleBarElement?.classList.remove('tab-drag-active');
      syncTabOrderFromDom();

      const finalRect = state.tabEl.getBoundingClientRect();
      const delta = floatingRect.left - finalRect.left;
      if (Math.abs(delta) > 0.5) {
        state.tabEl.animate(
          [{ translate: `${delta}px 0` }, { translate: '0 0' }],
          { duration: 180, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' }
        );
      }
      requestOverlayUpdate();
      ensureTabVisible(state.tabEl);
    }

    function installTabDrag(tabEl) {
      tabEl.addEventListener('pointerdown', (event) => {
        if (event.button !== undefined && event.button !== 0) return;
        if (event.target.closest('.tab-close') || tabEl.classList.contains('closing')) return;

        const rect = tabEl.getBoundingClientRect();
        const layoutWidth = tabEl.offsetWidth;
        const layoutHeight = tabEl.offsetHeight;
        const initialLeft = rect.left + (rect.width - layoutWidth) / 2;
        const initialTop = rect.top + (rect.height - layoutHeight) / 2;
        tabDragState = {
          tabEl,
          pointerId: event.pointerId,
          startX: event.clientX,
          grabOffset: event.clientX - initialLeft,
          initialLeft,
          initialTop,
          layoutWidth,
          placeholder: null,
          slotCenters: [],
          currentIndex: 0,
          dragFilterLayer: null,
          dragFilterStrip: null,
          dragging: false
        };
        try { tabEl.setPointerCapture(event.pointerId); } catch (_) {}
      });
    }

    document.addEventListener('pointermove', (event) => {
      const state = tabDragState;
      if (!state || state.pointerId !== event.pointerId) return;

      if (!state.dragging) {

        currentState.tabEl.style.setProperty('--alpha-tab-drag-x', `${deltaX}px`);
        reorderTabPlaceholder(currentState, pendingTabDragX);

        const containerRect = currentState.containerRect || tabsContainer.getBoundingClientRect();
        const edge = 36;
        if (pendingTabDragX < containerRect.left + edge) tabsContainer.scrollLeft -= 12;

    // 只允许应用目录内的 HTML 页面进入具有 Electron bridge 的标签页。
    // 这会拦截远程 URL、javascript:/data:、UNC/绝对路径和目录穿越。
    const APP_BASE_URL = new URL('./', window.location.href);
    const APP_BASE_PATH = decodeURIComponent(APP_BASE_URL.pathname).replace(/\/+$/, '') + '/';

    function normalizeLocalPageUrl(rawUrl) {
      if (typeof rawUrl !== 'string') return null;
      const value = rawUrl.trim();
      if (!value || value.length > 2048 || /[\u0000-\u001F\u007F\\]/.test(value)) return null;
      if (/^(?:[a-z][a-z0-9+.-]*:|\/\/|\/)/i.test(value)) return null;

        const resolved = new URL(value, APP_BASE_URL);
        const path = decodeURIComponent(resolved.pathname);

          (APP_BASE_URL.protocol === 'file:' || resolved.origin === APP_BASE_URL.origin) &&
          path.startsWith(APP_BASE_PATH);

        return path.slice(APP_BASE_PATH.length) + resolved.search + resolved.hash;
      } catch (_) {
        return null;
      }

      try {
        const win = iframeNode.contentWindow;
        if (!win || !win.location) return null;
        const loc = win.location;
        if (loc.href === 'about:blank' || !loc.pathname) return null;

        const path = decodeURIComponent(loc.pathname);
        if (path.startsWith(APP_BASE_PATH)) {
          const rel = path.slice(APP_BASE_PATH.length) + (loc.search || '') + (loc.hash || '');
          if (/\.html(?:[?#]|$)/i.test(rel)) return rel;

        const filenameMatch = path.match(/[^/\\]+\.html$/i);

    // 修复：原选择器遗漏大量实际弹窗实现（.sphere-modal、.flatpickr-calendar.open 等），

      try { candidates = doc.querySelectorAll(UI_STATE_SELECTOR); } catch (_) {}
      const limit = Math.min(candidates.length, 16);
      for (let i = 0; i < limit; i++) {
        const el = candidates[i];
        if (!el || el.hidden || el.inert || el.getAttribute('aria-hidden') === 'true') continue;
        const inlineStyle = (el.getAttribute('style') || '').replace(/\s+/g, '').toLowerCase();
        if (/display:none|visibility:hidden|opacity:0(?:;|$)/.test(inlineStyle)) continue;
        const relevantClasses = [...el.classList]
          .filter(name => /modal|popup|popover|drawer|overlay|sheet|toast|open|show|active|visible|sphere/i.test(name))
          .slice(0, 4).sort().join('.');
        parts.push(`${el.tagName}:${el.id || ''}:${relevantClasses}:${el.hasAttribute('open') ? 1 : 0}`);

      const body = doc.body;

          .filter(name => /modal|popup|dialog|drawer|overlay|open|locked|sphere/i.test(name))
          .slice(0, 6).sort().join('.');
        if (bodyState) parts.push(`body:${bodyState}`);
      }
      // 滚动由捕获阶段的专用监听器处理，不在 DOM 签名中重复读取，避免无谓布局查询。
      return parts.join('|');
    }

    function initializeForkedFrame(frame, fallbackUrl, probeTabId) {

          injectGlobalRuntime(doc, frame);

      frame.addEventListener('load', () => {

    function splitSharedFrameBeforeMutation(frame, reason) {

      const forkTabIds = linkedIds.filter(id => id !== keeperTabId && tabDataMap.has(id));
      if (!forkTabIds.length) {

      const currentUrl = getIframePageRelativeUrl(frame) || tabDataMap.get(keeperTabId)?.url;
      const safeUrl = normalizeLocalPageUrl(currentUrl || '');

        return;

      // All untouched siblings still have identical state and can share one newly loaded frame.
      unindexPhysicalFrame(frame, meta.key);

      meta.nonShareReason = reason || 'ui-diverged';

        if (!tabScrollSnapshot.has(tabId)) {

            pageKey: getPageInstanceKey(safeUrl),
            root: { x: 0, y: 0 },
            elements: new Map()
          });

      if (forkMeta.key) indexPhysicalFrame(fork, forkMeta.key);

      iframeContainer.appendChild(fork);
      if (fork.contentWindow) knownFrameSources.add(fork.contentWindow);
      initializeForkedFrame(fork, safeUrl, forkTabIds[0]);
    }

    function scheduleSharedUiStateCheck(frame, doc) {

      if (!meta || meta.uiCheckTimer !== null) return;
      // 使用 32ms 的轻量防抖，既能合并同一帧内的多次插入，又能避免 80ms 的明显延迟导致切换时仍共享

    function installSharedUiStateGuard(doc, frame) {

              }

        childList: true,
        attributes: true,

          path.startsWith(APP_BASE_PATH);

        }
        const meta = getFrameMeta(iframe);
        if (!meta || !meta.shareable) return;

              root: { x: 0, y: 0 },

      }
