// ================== 智能文本框伸缩 (离屏精准镜像计算引擎) ==================
let mirrorTextarea = null;
function getMirrorTextarea() {
    if (!mirrorTextarea || !document.body.contains(mirrorTextarea)) {
        mirrorTextarea = document.createElement('textarea');
        mirrorTextarea.setAttribute('tabindex', '-1');
        mirrorTextarea.setAttribute('aria-hidden', 'true');
        mirrorTextarea.style.cssText = `
            position: absolute !important;
            top: 0 !important;
            left: -9999px !important;
            visibility: hidden !important;
            pointer-events: none !important;
            overflow: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            max-height: none !important;
            transform: none !important;
            transition: none !important;
            animation: none !important;
            box-sizing: border-box !important;
        `;
        document.body.appendChild(mirrorTextarea);
    }
    return mirrorTextarea;
}

function calculateTextareaTargetHeight(el) {
    if (!el) return 0;
    const mirror = getMirrorTextarea();
    const cs = window.getComputedStyle(el);

    mirror.style.boxSizing = cs.boxSizing;
    mirror.style.width = cs.width;
    mirror.style.paddingTop = cs.paddingTop;
    mirror.style.paddingRight = cs.paddingRight;
    mirror.style.paddingBottom = cs.paddingBottom;
    mirror.style.paddingLeft = cs.paddingLeft;
    mirror.style.borderTopWidth = cs.borderTopWidth;
    mirror.style.borderRightWidth = cs.borderRightWidth;
    mirror.style.borderBottomWidth = cs.borderBottomWidth;
    mirror.style.borderLeftWidth = cs.borderLeftWidth;
    mirror.style.borderStyle = cs.borderStyle;

    mirror.style.fontFamily = cs.fontFamily;
    mirror.style.fontSize = cs.fontSize;
    mirror.style.fontWeight = cs.fontWeight;
    mirror.style.fontStyle = cs.fontStyle;
    mirror.style.letterSpacing = cs.letterSpacing;
    mirror.style.lineHeight = cs.lineHeight;
    mirror.style.textTransform = cs.textTransform;
    mirror.style.textIndent = cs.textIndent;
    mirror.style.wordBreak = cs.wordBreak;
    mirror.style.overflowWrap = cs.overflowWrap;
    mirror.style.whiteSpace = 'pre-wrap';

    mirror.value = el.value || '';
    mirror.style.height = '0px';

    const borderTop = parseFloat(cs.borderTopWidth) || 0;
    const borderBottom = parseFloat(cs.borderBottomWidth) || 0;
    const borderSize = (cs.boxSizing === 'border-box') ? (borderTop + borderBottom) : 0;

    return mirror.scrollHeight + borderSize;
}

function adjustTextareaHeight(el) {
    if (!el || el.dataset.userResized === 'true') return;
    const minHeight = 200;
    const maxHeight = 380;
    let targetHeight = calculateTextareaTargetHeight(el);

    if (targetHeight < minHeight) targetHeight = minHeight;

    if (targetHeight >= maxHeight) {
        el.style.height = maxHeight + 'px';
        el.style.overflowY = 'auto';
    } else {
        el.style.height = targetHeight + 'px';
        el.style.overflowY = 'hidden';
    }
}

// 保持兼容旧调用的别名
function applyTextareaHeight(el) {
    adjustTextareaHeight(el);
}

const pendingAdjustments = new Set();
function flushTextareaAdjustments() {
    for (const el of pendingAdjustments) {
        adjustTextareaHeight(el);
    }
    pendingAdjustments.clear();
}

// 使用 rAF 防抖: 同一帧内的多次 input 合并为一次布局计算
function scheduleTextareaAdjust(el) {
    pendingAdjustments.add(el);
    if (pendingAdjustments.size === 1) {
        requestAnimationFrame(flushTextareaAdjustments);
    }
}

document.addEventListener('input', (e) => {
    if (e.target.tagName === 'TEXTAREA') {
        scheduleTextareaAdjust(e.target);
    }
});

// 拖拽雷达 (保持不变)
document.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'TEXTAREA' && window.getComputedStyle(e.target).resize !== 'none') {
        e.target.dataset.startH = e.target.offsetHeight;
    }
});
document.addEventListener('mouseup', (e) => {
    if (e.target.tagName === 'TEXTAREA' && window.getComputedStyle(e.target).resize !== 'none') {
        if (e.target.dataset.startH && e.target.offsetHeight !== parseInt(e.target.dataset.startH)) {
            e.target.dataset.userResized = 'true';
        }
    }
});

document.addEventListener('wheel', function(e) {
    if (e.target.classList.contains('flatpickr-hour') || e.target.classList.contains('flatpickr-minute')) {
        e.preventDefault();
        
        // 向下滚(deltaY > 0)增加时间(变晚)；向上滚(deltaY < 0)减少时间(变早)
        const step = e.deltaY > 0 ? 1 : -1; 
        
        let max = e.target.classList.contains('flatpickr-hour') ? 23 : 59;
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 0;
        
        val += step;
        if (val > max) val = 0;
        if (val < 0) val = max;
        
        e.target.value = String(val).padStart(2, '0');
        e.target.__homeUserEdited = true;
        if (e.target.__homeTimeInstance) {
            e.target.__homeTimeInstance.__pickerEdited = true;
        }
        e.target.dispatchEvent(new Event('input', { bubbles: true })); 
    }
}, { passive: false });

// ================== Home <-> Focus 连续滚轮单时间轴 ==================
const focusTransition = (() => {
    const DURATION = 760;
    const GESTURE_DISTANCE = 360;
    let state = 'idle'; // idle | scrubbing | committing
    let targetProgress = 0;
    let renderedProgress = 0;
    let scrubRaf = 0;
    let settleRaf = 0;
    let layerSyncRaf = 0;
    let wheelTimeout = 0;
    let animations = [];
    let stageElements = null;
    let navigated = false;
    let direction = null; // to-focus | from-focus
    let returnStartedAt = 0;
    let reduceSinkActive = false;

    const clamp01 = value => Math.max(0, Math.min(1, value));
    const reduceMotionEnabled = () => {
        try { return localStorage.getItem('alpha_reduce_motion') === 'true'; } catch (_) { return false; }
    };
    const smoothstep = (from, to, value) => {
        const t = clamp01((value - from) / Math.max(0.0001, to - from));
        return t * t * (3 - 2 * t);
    };

    function makeStage(wallpaper, fullScreen = false, hasClock = true) {
        const rect = wallpaper.getBoundingClientRect();
        const style = getComputedStyle(wallpaper);
        const stage = document.createElement('div');
        stage.className = 'focus-transition-stage';
        stage.style.backgroundImage = document.documentElement.style.backgroundImage || style.backgroundImage;
        stage.style.backgroundPosition = style.backgroundPosition;
        const heroHeight = Math.max(1, Math.min(innerHeight, rect.height));
        stage.style.height = fullScreen ? '100vh' : `${heroHeight}px`;

        let scrim = null;
        if (hasClock) {
            scrim = document.createElement('div');
            scrim.className = 'focus-transition-scrim';
            scrim.style.opacity = fullScreen ? '0' : '1';
            stage.appendChild(scrim);
        }
        const edge = document.createElement('div');
        edge.className = 'focus-transition-edge';
        edge.style.opacity = fullScreen ? '0' : '1';

        stage.appendChild(edge);
        document.body.appendChild(stage);
        return { stage, scrim, edge, heroHeight };
    }

    function makeClockClone(clock, initiallyHidden = false) {
        if (!clock) return null;
        const rect = clock.getBoundingClientRect();
        const clone = clock.cloneNode(true);
        clone.removeAttribute('id');
        clone.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        clone.classList.add('focus-transition-clock-clone');
        Object.assign(clone.style, {
            left: `${rect.left}px`,
            top: `${rect.top}px`,
            width: `${rect.width}px`,
            height: `${rect.height}px`,
            opacity: initiallyHidden ? '0' : '1',
            filter: initiallyHidden ? 'blur(24px)' : 'blur(0px)',
            transform: initiallyHidden
                ? 'translate3d(0,32px,0) scale(0.92)'
                : 'translate3d(0,0,0) scale(1)',
            animation: 'none'
        });
        clock.style.visibility = 'hidden';
        document.body.appendChild(clone);
        return clone;
    }

    function makePanelGlasses(stage) {
        const homeLayout = document.querySelector('.home-layout');
        const stageStyle = getComputedStyle(stage);
        const stageVisual = {
            backgroundColor: stageStyle.backgroundColor,
            backgroundImage: stageStyle.backgroundImage,
            backgroundPosition: stageStyle.backgroundPosition,
            backgroundSize: stageStyle.backgroundSize
        };
        return Array.from(document.querySelectorAll('.home-layout .panel')).map(panel => {
            let animationHost = panel;
            while (animationHost.parentElement && animationHost.parentElement !== homeLayout) {
                animationHost = animationHost.parentElement;
            }
            const glass = document.createElement('div');
            glass.className = 'focus-transition-panel-glass';
            glass.style.borderRadius = getComputedStyle(panel).borderRadius;
            const blur = document.createElement('div');
            blur.className = 'focus-transition-panel-blur';
            Object.assign(blur.style, stageVisual);
            glass.appendChild(blur);
            document.body.appendChild(glass);
            return { panel, animationHost, glass, blur };
        });
    }

    function syncTransitionLayers() {
        layerSyncRaf = 0;
        const { stage, panelGlasses } = stageElements || {};
        if (!stage || !panelGlasses) return;
        const stageRect = stage.getBoundingClientRect();

        // 用同一进度驱动 真实面板 → 代理毛玻璃 的交接, 避免卡片过分鲜艳
        const transitionProgress = direction === 'from-focus' && returnStartedAt
            ? Math.min(1, (performance.now() - returnStartedAt) / DURATION)
            : renderedProgress;
        const handoff = direction === 'from-focus'
            ? 1 - smoothstep(0.5, 0.88, transitionProgress)
            : smoothstep(0.02, 0.3, transitionProgress);
        const sourceOpacity = 1 - handoff;

        /* 先集中读取布局，再集中写入样式，避免两个面板之间反复触发布局刷新。 */
        const layerFrames = panelGlasses.map(layer => ({
            ...layer,
            rect: layer.panel.getBoundingClientRect(),
            hostOpacity: Number.parseFloat(getComputedStyle(layer.animationHost).opacity) || 0
        }));

        layerFrames.forEach(({ panel, glass, blur, rect, hostOpacity }) => {
            Object.assign(glass.style, {
                left: `${rect.left}px`,
                top: `${rect.top}px`,
                width: `${rect.width}px`,
                height: `${rect.height}px`,
                opacity: String(hostOpacity * handoff)
            });
            panel.style.setProperty('--focus-panel-source-opacity', sourceOpacity.toFixed(3));
            panel.style.setProperty('backdrop-filter', `blur(${Math.round(40 * sourceOpacity)}px) saturate(${Math.round(100 + 30 * sourceOpacity)}%)`, 'important');
            panel.style.setProperty('-webkit-backdrop-filter', `blur(${Math.round(40 * sourceOpacity)}px) saturate(${Math.round(100 + 30 * sourceOpacity)}%)`, 'important');
            Object.assign(blur.style, {
                left: `${-rect.left}px`,
                top: `${-rect.top}px`,
                width: `${innerWidth}px`,
                height: `${stageRect.height}px`
            });
        });

        if (state !== 'idle') layerSyncRaf = requestAnimationFrame(syncTransitionLayers);
    }

    function startLayerSync() {
        if (!layerSyncRaf) layerSyncRaf = requestAnimationFrame(syncTransitionLayers);
    }

    function removeTransitionLayers() {
        if (layerSyncRaf) cancelAnimationFrame(layerSyncRaf);
        layerSyncRaf = 0;
        stageElements?.panelGlasses?.forEach(({ glass, panel }) => {
            glass.remove();
            panel.style.removeProperty('--focus-panel-source-opacity');
            panel.style.removeProperty('backdrop-filter');
            panel.style.removeProperty('-webkit-backdrop-filter');
        });
        stageElements?.clockClone?.remove();
        stageElements?.clock?.style.removeProperty('visibility');
    }

    function timeline(el, keyframes, customEasing = 'linear') {
        if (!el) return null;
        return el.animate(keyframes, {
            duration: DURATION,
            easing: customEasing,
            fill: 'both'
        });
    }

    function renderProgress(value) {
        const time = value * DURATION;
        animations.forEach(animation => { animation.currentTime = time; });
    }

    function tickScrub() {
        scrubRaf = 0;
        const distance = targetProgress - renderedProgress;
        renderedProgress = Math.abs(distance) < 0.001
            ? targetProgress
            : renderedProgress + distance * 0.24;
        renderProgress(renderedProgress);

        if (renderedProgress !== targetProgress && state === 'scrubbing') {
            scrubRaf = requestAnimationFrame(tickScrub);
        } else if (targetProgress === 0 && state === 'scrubbing') {
            cleanup();
        }
    }

    function setProgress(nextProgress) {
        targetProgress = clamp01(nextProgress);
        if (!scrubRaf) scrubRaf = requestAnimationFrame(tickScrub);
    }

    /* 用连续的 ease-out 数值收尾, 避免 commit 时 playbackRate 突然跳到 2.3 */
    function settleProgress(endProgress, onFinish) {
        if (settleRaf) cancelAnimationFrame(settleRaf);
        const startProgress = renderedProgress;
        const distance = Math.abs(endProgress - startProgress);
        const duration = 170 + distance * 330;
        const startedAt = performance.now();

        const tick = now => {
            const t = clamp01((now - startedAt) / duration);
            const eased = 1 - Math.pow(1 - t, 4);
            renderedProgress = startProgress + (endProgress - startProgress) * eased;
            targetProgress = renderedProgress;
            renderProgress(renderedProgress);
            if (t < 1) {
                settleRaf = requestAnimationFrame(tick);
            } else {
                settleRaf = 0;
                renderedProgress = targetProgress = endProgress;
                renderProgress(endProgress);
                onFinish();
            }
        };
        settleRaf = requestAnimationFrame(tick);
    }

    function begin() {
        if (localStorage.getItem('alpha_enable_focus') === 'false') return false;
        if (state !== 'idle') return state === 'scrubbing';
        const wallpaper = document.getElementById('heroWallpaper');
        const homeLayout = document.querySelector('.home-layout');
        if (!wallpaper) return false;

        state = 'scrubbing';
        direction = 'to-focus';

        /* 减弱动态效果: 简单下沉 —— 整页 transform 直落出屏 (手机负一屏式), 
           无壁纸舞台/模糊遮罩/时钟克隆/代理玻璃层, 也无逐帧图层同步 */
        if (reduceMotionEnabled()) {
            document.body.classList.add('focus-transitioning');
            reduceSinkActive = true;
            try {
                const bg = document.documentElement.style.backgroundImage
                    || getComputedStyle(wallpaper).backgroundImage;
                document.documentElement.style.backgroundImage = bg;
                document.documentElement.style.backgroundPosition = 'center';
                document.documentElement.style.backgroundSize = 'cover';
                document.documentElement.style.backgroundRepeat = 'no-repeat';
            } catch (_) {}
            const sink = document.body.animate([
                { transform: 'translate3d(0, 0, 0)' },
                { transform: 'translate3d(0, 100vh, 0)' }
            ], { duration: DURATION, easing: 'linear', fill: 'both' });
            sink.pause();
            animations = [sink];
            stageElements = null;
            targetProgress = renderedProgress = 0;
            renderProgress(0);
            return true;
        }

        document.body.classList.add('focus-transitioning');
        const hasClock = !wallpaper.classList.contains('no-clock') && localStorage.getItem('alpha_show_clock') !== 'false';
        const { stage, scrim, edge, heroHeight } = makeStage(wallpaper, false, hasClock);
        const clock = hasClock ? document.getElementById('homeClock') : null;
        const clockClone = makeClockClone(clock);
        const panelGlasses = makePanelGlasses(stage);

        animations = [
            timeline(clockClone, [
                { opacity: 1, filter: 'blur(0px)', transform: 'translate3d(0,0,0) scale(1)', offset: 0 },
                { opacity: 0.5, filter: 'blur(11px)', transform: 'translate3d(0,12px,0) scale(0.96)', offset: 0.12 },
                { opacity: 0, filter: 'blur(24px)', transform: 'translate3d(0,28px,0) scale(0.92)', offset: 0.24 },
                { opacity: 0, filter: 'blur(24px)', transform: 'translate3d(0,38px,0) scale(0.92)', offset: 1 }
            ]),
            hasClock && scrim ? timeline(scrim, [
                { opacity: 1, offset: 0 },
                { opacity: 0, offset: 0.32 },
                { opacity: 0, offset: 1 }
            ]) : null,
            timeline(edge, [
                { opacity: 1, offset: 0 },
                { opacity: 1, offset: 0.76 },
                { opacity: 0, offset: 1 }
            ]),
            ...Array.from(homeLayout.children).map(panel => timeline(panel, [
                { opacity: 1, transform: 'translate3d(0,0,0) scale(1)', offset: 0 },
                { opacity: 0, transform: 'translate3d(0,92px,0) scale(0.955)', offset: 0.48 },
                { opacity: 0, transform: 'translate3d(0,92px,0) scale(0.955)', offset: 1 }
            ])),
            timeline(stage, [
                { height: `${heroHeight}px`, offset: 0 },
                { height: `${heroHeight}px`, offset: 0.24 },
                { height: '100vh', offset: 0.76 },
                { height: '100vh', offset: 1 }
            ])
        ].filter(Boolean);
        animations.forEach(animation => animation.pause());
        stageElements = { stage, clock, clockClone, panelGlasses };
        targetProgress = renderedProgress = 0;
        renderProgress(0);
        syncTransitionLayers();
        startLayerSync();
        return true;
    }

    function cleanup() {
        if (scrubRaf) cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
        if (settleRaf) cancelAnimationFrame(settleRaf);
        settleRaf = 0;
        animations.forEach(animation => animation.cancel());
        animations = [];
        if (reduceSinkActive) {
            reduceSinkActive = false;
            document.documentElement.style.removeProperty('background-image');
        }
        removeTransitionLayers();
        stageElements?.stage?.remove();
        stageElements = null;
        targetProgress = renderedProgress = 0;
        state = 'idle';
        direction = null;
        returnStartedAt = 0;
        document.body.classList.remove('focus-transitioning');
    }

    function scrub(delta) {
        if (state === 'committing') return;
        if (state === 'idle' && delta <= 0) return;
        if (state === 'idle' && !begin()) return;
        setProgress(targetProgress + delta / GESTURE_DISTANCE);
        
        clearTimeout(wheelTimeout);
        wheelTimeout = setTimeout(() => {
            if (state === 'scrubbing') {
                if (targetProgress >= 0.5) commit();
                else abort();
            }
        }, 110);

        if (targetProgress >= 1) {
            commit();
        }
    }

    function abort() {
        if (state !== 'scrubbing') return;
        state = 'committing';
        if (scrubRaf) cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
        settleProgress(0, cleanup);
    }

    function commit() {
        if (state !== 'scrubbing') return;
        state = 'committing';
        if (scrubRaf) cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
        settleProgress(1, navigate);
    }

    function navigate() {
        if (navigated) return;
        navigated = true;
        sessionStorage.setItem('alpha_to_focus', 'true');
        /* 将 Home 转场最后一帧的壁纸交给 Focus 的同步根背景, 覆盖新文档首绘 */
        try {
            const wallpaper = document.getElementById('heroWallpaper');
            const transitionStage = stageElements?.stage;
            const source = transitionStage || wallpaper;
            if (source) {
                const bg = getComputedStyle(source).backgroundImage;
                sessionStorage.setItem('alpha_transition_wallpaper_css', bg);
                if (window.frameElement) {
                    window.frameElement.style.backgroundImage = bg;
                    window.frameElement.style.backgroundPosition = 'center';
                    window.frameElement.style.backgroundSize = 'cover';
                    window.frameElement.style.backgroundRepeat = 'no-repeat';
                }
            }
        } catch (_) { /* 大尺寸 data URL 超出 sessionStorage 时回退到 alpha_wallpaper */ }
        window.location.href = 'Focus.html';
    }

    async function returnFromFocus() {
        const wallpaper = document.getElementById('heroWallpaper');
        const homeLayout = document.querySelector('.home-layout');
        if (!wallpaper) return;

        /* 减弱动态效果: Focus 上滑离场后, Home 只做一次轻量整体上移进场,
           不再播放 760ms 的返回时间轴。
           alpha-rm-return 必须保留到文档销毁: 移除它会重启上移进场动画 */
        if (reduceMotionEnabled()) {
            sessionStorage.removeItem('alpha_from_focus');
            document.body.classList.remove('from-focus', 'focus-transitioning');
            document.documentElement.classList.remove('return-from-focus');
            document.documentElement.style.removeProperty('background-image');
            if (window.frameElement) {
                window.frameElement.style.removeProperty('background-image');
            }
            try { sessionStorage.removeItem('alpha_transition_wallpaper_css'); } catch (_) {}
            return;
        }

        state = 'committing';
        direction = 'from-focus';
        sessionStorage.removeItem('alpha_from_focus');
        document.body.classList.add('from-focus', 'focus-transitioning');
        const hasClock = !wallpaper.classList.contains('no-clock') && localStorage.getItem('alpha_show_clock') !== 'false';
        const clock = hasClock ? document.getElementById('homeClock') : null;
        const { stage, scrim, edge, heroHeight } = makeStage(wallpaper, true, hasClock);
        const clockClone = makeClockClone(clock, true);
        const panelGlasses = makePanelGlasses(stage);
        stageElements = { stage, clock, clockClone, panelGlasses };

        if (homeLayout) {
            Array.from(homeLayout.children).forEach(panel => {
                panel.style.opacity = '0';
                panel.style.transform = 'translate3d(0,92px,0) scale(0.955)';
            });
        }
        void document.body.offsetHeight; // Force layout to avoid FOUC
        
        const returnAnimations = [
            timeline(stage, [
                { height: '100vh', opacity: 1, offset: 0, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                { height: '100vh', opacity: 1, offset: 0.06, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                { height: `${heroHeight}px`, opacity: 1, offset: 0.74, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' },
                { height: `${heroHeight}px`, opacity: 0, offset: 1 }
            ]),
            hasClock && scrim ? timeline(scrim, [
                { opacity: 0, offset: 0 },
                { opacity: 0, offset: 0.56, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' },
                { opacity: 1, offset: 1 }
            ]) : null,
            timeline(edge, [
                { opacity: 0, offset: 0, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                { opacity: 1, offset: 0.38 },
                { opacity: 1, offset: 1 }
            ]),
            ...Array.from(homeLayout ? homeLayout.children : []).map(panel => timeline(panel, [
                { opacity: 0, transform: 'translate3d(0,92px,0) scale(0.955)', offset: 0, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                { opacity: 0, transform: 'translate3d(0,92px,0) scale(0.955)', offset: 0.08, easing: 'cubic-bezier(0.22, 0.72, 0.3, 1)' },
                { opacity: 1, transform: 'translate3d(0,0,0) scale(1)', offset: 0.76 },
                { opacity: 1, transform: 'translate3d(0,0,0) scale(1)', offset: 1 }
            ])),
            clockClone ? timeline(clockClone, [
                { opacity: 0, filter: 'blur(24px)', transform: 'translate3d(0,28px,0) scale(0.92)', offset: 0 },
                { opacity: 0, filter: 'blur(24px)', transform: 'translate3d(0,28px,0) scale(0.92)', offset: 0.64, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                { opacity: 0.55, filter: 'blur(9px)', transform: 'translate3d(0,10px,0) scale(0.97)', offset: 0.82, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' },
                { opacity: 1, filter: 'blur(0px)', transform: 'translate3d(0,0,0) scale(1)', offset: 1 }
            ]) : null
        ].filter(Boolean);

        returnAnimations.forEach(a => a && a.pause());

        // 立即执行初始计算并开始图层追踪，避免出现无样式帧
        syncTransitionLayers();
        startLayerSync();
        returnStartedAt = performance.now();
        returnAnimations.forEach(a => a && a.play());

        requestAnimationFrame(() => {
            document.documentElement.classList.remove('return-from-focus');
            document.body.style.visibility = 'visible';
        });

        try { await returnAnimations[0].finished; } catch (_) { /* 保证页面仍可恢复 */ }
        /* 保持 WAAPI 的最终帧覆盖, 先恢复 DOM 的自然样式, 再移除代理层和动画
           旧顺序会让首个（To Do）panel 短暂落回 opacity:0, 形成二次闪烁 */
        document.body.classList.add('focus-transition-cleanup');
        if (homeLayout) {
            Array.from(homeLayout.children).forEach(panel => {
                panel.style.removeProperty('opacity');
                panel.style.removeProperty('transform');
            });
        }
        removeTransitionLayers();
        stage.remove();
        returnAnimations.forEach(animation => animation.cancel());
        stageElements = null;
        document.body.classList.remove('focus-transitioning');
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        document.body.classList.remove('focus-transition-cleanup');
        document.documentElement.style.removeProperty('background-image');
        if (window.frameElement) {
            window.frameElement.style.removeProperty('background-image');
        }
        try { sessionStorage.removeItem('alpha_transition_wallpaper_css'); } catch (_) {}
        state = 'idle';
        direction = null;
        returnStartedAt = 0;
    }

    return { scrub, returnFromFocus };
})();

// Home: 第一下向下滚动即进入转场, 慢滚会停在当前位置, 只有反向滚回 0 才取消
window.addEventListener('wheel', (event) => {
    if (event.ctrlKey || event.target.closest?.('.flatpickr-calendar')) return;
    if (localStorage.getItem('alpha_enable_focus') === 'false') return;
    const unit = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16
        : event.deltaMode === WheelEvent.DOM_DELTA_PAGE ? innerHeight
        : 1;
    const delta = Math.sign(event.deltaY) * Math.min(Math.abs(event.deltaY * unit), 90);
    if (delta > 0 || document.body.classList.contains('focus-transitioning')) {
        event.preventDefault();
        focusTransition.scrub(delta);
    }
}, { passive: false });

// ================== 触屏手势支持 (Home → Focus) ==================
(() => {
    let touchStartY = 0;
    let touchLastY = 0;
    let touchActive = false;
    let touchTriggered = false;

    window.addEventListener('touchstart', (e) => {
        if (e.target.closest?.('.flatpickr-calendar')) return;
        if (localStorage.getItem('alpha_enable_focus') === 'false') return;
        touchStartY = e.touches[0].clientY;
        touchLastY = touchStartY;
        touchActive = true;
        touchTriggered = false;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!touchActive) return;
        if (localStorage.getItem('alpha_enable_focus') === 'false') return;
        const currentY = e.touches[0].clientY;
        const incrementDelta = touchLastY - currentY; // 正值 = 手指向上滑
        const totalDelta = touchStartY - currentY;

        // Home 页: 手指向上滑 = 进入 Focus（与鼠标向下滚动一致）
        if (!touchTriggered && totalDelta <= 0) {
            touchLastY = currentY;
            return;
        }

        // 一旦开始向上滑, 阻止浏览器默认滚动
        if (totalDelta > 0 || document.body.classList.contains('focus-transitioning')) {
            e.preventDefault();
        }

        touchTriggered = true;
        touchLastY = currentY;

        // 传递增量 delta, 与 wheel 事件保持一致
        focusTransition.scrub(incrementDelta);
    }, { passive: false });

    window.addEventListener('touchend', () => {
        if (!touchActive) return;
        touchActive = false;
        touchTriggered = false;
        // scrub 内部的 wheelTimeout 会自动处理 commit/abort
    }, { passive: true });

    window.addEventListener('touchcancel', () => {
        touchActive = false;
        touchTriggered = false;
    }, { passive: true });
})();

if (sessionStorage.getItem('alpha_from_focus') === 'true') {
    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', focusTransition.returnFromFocus, { once: true });
    } else {
        focusTransition.returnFromFocus();
    }
}

// ================== 首次启动版权提示 ==================
function checkFirstLaunch() {
    // 检查是否已经显示过
    if (localStorage.getItem('alpha_welcome_shown')) return;

    // 直接唤出新的毛玻璃欢迎弹窗
    const welcomeModal = document.getElementById('welcomeModal');
    if (welcomeModal) {
        welcomeModal.classList.remove('hidden');
    }

    // 标记已显示, 下次不再弹出
    localStorage.setItem('alpha_welcome_shown', 'true');
}

// 在页面加载完成后执行检测（不干扰其他初始化）
document.addEventListener('DOMContentLoaded', checkFirstLaunch);

// ================== 层叠卡片 z-index 更新引擎 (rAF 防抖) ==================
(function initCardStacking() {
    const stackItemSelector = '.task-card, .side-card, .task-card-wrap';
    /* Home 当前没有层叠任务卡；不为一组不存在的元素监听整棵 DOM。 */
    if (!document.querySelector(stackItemSelector)) return;
    let stackingRafPending = false;
    function updateStacking() {
        const stackContainers = new Set();
        document.querySelectorAll(stackItemSelector).forEach(item => {
            if (item.parentElement) stackContainers.add(item.parentElement);
        });
        stackContainers.forEach(container => {
            const children = Array.from(container.children).filter(el => el.matches(stackItemSelector));
            if (children.length > 0) {
                const total = children.length;
                children.forEach((child, index) => {
                    child.style.setProperty('--card-z', total - index);
                });
            }
        });
    }
    
    function requestUpdateStacking(mutations) {
        /* 时钟数字等无关 DOM 变化不再触发全页卡片扫描。 */
        if (mutations && !mutations.some(mutation =>
            [...mutation.addedNodes, ...mutation.removedNodes].some(node =>
                node.nodeType === Node.ELEMENT_NODE
                && (node.matches?.(stackItemSelector) || node.querySelector?.(stackItemSelector))
            )
        )) return;
        if (!stackingRafPending) {
            stackingRafPending = true;
            requestAnimationFrame(() => {
                updateStacking();
                stackingRafPending = false;
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateStacking);
    } else {
        updateStacking();
    }
    const observer = new MutationObserver(requestUpdateStacking);
    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

<!-- ==========================================
     文本框溢出与横向滚动状态监听
     ========================================== -->
<script>
(function() {
    const pendingOverflowChecks = new Set();
    let overflowCheckRaf = 0;

    function updateInputOverflowState(el) {
        if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
        if (['radio', 'checkbox', 'file', 'hidden'].includes(el.type)) return;
        if (el.closest('.flatpickr-time') || el.closest('.flatpickr-calendar')) return;

        const isOverflowing = el.scrollWidth > el.clientWidth;
        const isScrolledRight = el.scrollLeft > 2;

        if (!isOverflowing) {
            el.classList.remove('input-overflowing', 'input-scrolled-right');
        } else {
            el.classList.add('input-overflowing');
            if (isScrolledRight) {
                el.classList.add('input-scrolled-right');
            } else {
                el.classList.remove('input-scrolled-right');
            }
        }
    }

    function scheduleInputOverflowCheck(el) {
        pendingOverflowChecks.add(el);
        if (overflowCheckRaf) return;
        overflowCheckRaf = requestAnimationFrame(() => {
            overflowCheckRaf = 0;
            pendingOverflowChecks.forEach(updateInputOverflowState);
            pendingOverflowChecks.clear();
        });
    }

    function initInputOverflowMonitor() {
        const events = ['input', 'scroll', 'keyup', 'focusin', 'focusout'];
        events.forEach(evt => {
            document.addEventListener(evt, (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
                    scheduleInputOverflowCheck(e.target);
                }
            }, true);
        });

        const scanInputs = () => {
            document.querySelectorAll('input[type="text"], input[type="number"], .pop-input-fx').forEach(scheduleInputOverflowCheck);
        };

        scanInputs();
        document.fonts?.ready.then(scanInputs).catch(() => {});
        window.addEventListener('resize', scanInputs, { passive: true });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initInputOverflowMonitor);
    } else {
        initInputOverflowMonitor();
    }
})();

// ======= 自适应节能与性能降载联动引擎 (Adaptive Activity & Power Throttler) =======
(function initPerformanceThrottle() {
    let isSleeping = false;
    let isIdle = false;
    let idleTimer = null;
    const IDLE_TIMEOUT_MS = 2500;
    let lastActivityAt = performance.now();

    /* pointermove 可能每秒触发上百次。只保留一个计时器；到期时再根据
       最后活动时间补足剩余等待，避免不停 clearTimeout/setTimeout。 */
    function scheduleIdleCheck(delay = IDLE_TIMEOUT_MS) {
        if (idleTimer || isSleeping) return;
        idleTimer = setTimeout(() => {
            idleTimer = null;
            if (isSleeping) return;
            const remaining = IDLE_TIMEOUT_MS - (performance.now() - lastActivityAt);
            if (remaining > 0) {
                scheduleIdleCheck(remaining);
                return;
            }
            isIdle = true;
            applyVisualFreeze(true);
        }, Math.max(0, delay));
    }

    function applyVisualFreeze(freeze) {
        const docEl = document.documentElement;
        const bodyEl = document.body;
        if (!docEl) return;
        if (freeze) {
            docEl.classList.add('pause-bg-motion', 'pause-clock-breath');
            if (bodyEl) bodyEl.classList.add('pause-bg-motion', 'pause-clock-breath');
        } else {
            docEl.classList.remove('pause-bg-motion', 'pause-clock-breath');
            if (bodyEl) bodyEl.classList.remove('pause-bg-motion', 'pause-clock-breath');
        }
    }

    function onUserActive() {
        if (isSleeping) return;
        lastActivityAt = performance.now();
        if (isIdle) {
            isIdle = false;
            applyVisualFreeze(false);
            if (typeof resumeHomeClockScheduler === 'function') resumeHomeClockScheduler();
        }
        scheduleIdleCheck();
    }

    function onSleep() {
        isSleeping = true;
        document.documentElement.classList.add('alpha-sleep');
        if (idleTimer) {
            clearTimeout(idleTimer);
            idleTimer = null;
        }
        if (typeof pauseHomeClockScheduler === 'function') pauseHomeClockScheduler();
        applyVisualFreeze(true);
        try {
            if (window.AlphaCardGlow && typeof window.AlphaCardGlow.sleep === 'function') {
                window.AlphaCardGlow.sleep(document);
            }
            if (window.AlphaInputGlow && typeof window.AlphaInputGlow.sleep === 'function') {
                window.AlphaInputGlow.sleep(document);
            }
            if (window.AlphaLiquidGlass && typeof window.AlphaLiquidGlass.releaseAll === 'function') {
                window.AlphaLiquidGlass.releaseAll();
            }
        } catch (_) {}
    }

    function onWake() {
        isSleeping = false;
        isIdle = false;
        lastActivityAt = performance.now();
        document.documentElement.classList.remove('alpha-sleep');
        applyVisualFreeze(false);
        try {
            if (window.AlphaCardGlow && typeof window.AlphaCardGlow.wake === 'function') {
                window.AlphaCardGlow.wake(document);
            }
            if (window.AlphaInputGlow && typeof window.AlphaInputGlow.wake === 'function') {
                window.AlphaInputGlow.wake(document);
            }
        } catch (_) {}
        if (typeof resumeHomeClockScheduler === 'function') resumeHomeClockScheduler();
        scheduleIdleCheck();
    }

    const activityEvents = ['pointermove', 'pointerdown', 'keydown', 'scroll', 'wheel', 'touchstart'];
    activityEvents.forEach(evt => {
        window.addEventListener(evt, onUserActive, { passive: true, capture: true });
    });

    window.addEventListener('AlphaSleep', onSleep);
    window.addEventListener('AlphaWake', onWake);
    window.addEventListener('focus', onUserActive);
    window.addEventListener('blur', () => {
        if (idleTimer) {
            clearTimeout(idleTimer);
            idleTimer = null;
        }
        isIdle = true;
        applyVisualFreeze(true);
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) onSleep();
        else onWake();
    });

    onUserActive();

    function applyThrottle(throttle) {
        if (!throttle) return;
        if (throttle.pauseBgMotion || throttle.pauseClockBreath) {
            applyVisualFreeze(true);
        } else if (!isIdle && !isSleeping) {
            applyVisualFreeze(false);
            if (typeof resumeHomeClockScheduler === 'function') resumeHomeClockScheduler();
        }
    }

    window.addEventListener('AlphaPerformanceThrottle', (e) => applyThrottle(e.detail));
    const api = window.electronAPI || window.top?.electronAPI || window.parent?.electronAPI;
    if (api && typeof api.onPerformanceThrottleChanged === 'function') {
        api.onPerformanceThrottleChanged(applyThrottle);
    }
    if (api && typeof api.getPerformanceThrottleState === 'function') {
        api.getPerformanceThrottleState().then(applyThrottle).catch(() => {});
    }
})();

// 禁止通过 F11 快捷键切换全屏
window.addEventListener('keydown', (e) => {
    if (e.key === 'F11' || e.keyCode === 122 || e.code === 'F11') {
        e.preventDefault();
        e.stopPropagation();
    }
}, true);
</script>
