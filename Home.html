<!-- 在任何外部样式加载前先铺好返回转场底图, 避免文档切换首帧露出白底 -->
<style id="focus-return-boot-style">
html { background-position: center; background-size: cover; background-repeat: no-repeat; }
/* 首绘阶段禁用主题色补间，并以中性玻璃边缘接管卡片，避免壁纸取色完成前出现紫色描边闪烁。 */
html.theme-booting {
    transition: none !important;
    --dyn-panel-border: rgba(255, 255, 255, 0.42);
    --dyn-card-border: rgba(255, 255, 255, 0.42);
    --dyn-border-top: rgba(255, 255, 255, 0.72);
    --dyn-border-left: rgba(255, 255, 255, 0.52);
    --dyn-border-right: rgba(255, 255, 255, 0.28);
    --dyn-border-bottom: rgba(255, 255, 255, 0.20);
    --dyn-border-ring: rgba(255, 255, 255, 0.10);
    --dyn-shadow: rgba(15, 23, 42, 0.04);
}
html.theme-booting body {
    transition: none !important;
}
html.return-from-focus body { visibility: hidden; }
</style>
<script>
(function prepareFocusReturnFrame() {
    try {
        const root = document.documentElement;
        root.classList.add('theme-booting');

        /* 优先复用上一次完成取色后的主题；旧版本没有缓存时使用中性首帧。 */
        let bootTheme = { hue: 220, sat: 8, light: 91, glowOpacity: 0.65 };
        try {
            const cachedTheme = JSON.parse(localStorage.getItem('alpha_theme_snapshot') || 'null');
            if (cachedTheme
                && Number.isFinite(cachedTheme.hue)
                && Number.isFinite(cachedTheme.sat)
                && Number.isFinite(cachedTheme.light)
                && Number.isFinite(cachedTheme.glowOpacity)) {
                bootTheme = cachedTheme;
            }
        } catch (_) { /* 损坏的旧缓存直接回退到中性首帧 */ }
        root.style.setProperty('--theme-hue', String(Math.max(0, Math.min(360, bootTheme.hue))));
        root.style.setProperty('--theme-sat', `${Math.max(0, Math.min(100, bootTheme.sat))}%`);
        root.style.setProperty('--theme-light', `${Math.max(0, Math.min(100, bootTheme.light))}%`);
        root.style.setProperty('--wp-glow-opacity', String(Math.max(0, Math.min(1, bootTheme.glowOpacity))));

        function isDefaultWallpaper(wp) {
            if (!wp) return true;
            const clean = wp.trim().replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
            return clean === './background.png' || clean === 'background.png' || clean === './background_dark.png' || clean === 'background_dark.png' || clean.endsWith('/background.png') || clean.endsWith('\\background.png') || clean.endsWith('/background_dark.png') || clean.endsWith('\\background_dark.png');
        }
        function getDefaultWallpaper() {
            try {
                const isDark = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                return isDark ? './background_dark.png' : './background.png';
            } catch (_) {
                return './background.png';
            }
        }
        function getEffectiveWallpaper() {
            const saved = localStorage.getItem('alpha_wallpaper');
            if (!saved || isDefaultWallpaper(saved)) {
                return getDefaultWallpaper();
            }
            return saved;
        }

        const transitionWallpaper = sessionStorage.getItem('alpha_transition_wallpaper_css');
        const effectiveWp = getEffectiveWallpaper();
        const bg = (transitionWallpaper && transitionWallpaper !== 'none')
            ? transitionWallpaper
            : `url("${effectiveWp}")`;

        if (window.frameElement) {
            window.frameElement.style.backgroundImage = bg;
            window.frameElement.style.backgroundPosition = 'center';
            window.frameElement.style.backgroundSize = 'cover';
            window.frameElement.style.backgroundRepeat = 'no-repeat';
        }

        let reduceMotionReturn = false;
        try { reduceMotionReturn = localStorage.getItem('alpha_reduce_motion') === 'true'; } catch (_) {}
        if (sessionStorage.getItem('alpha_from_focus') === 'true') {
            if (reduceMotionReturn) {
                /* 减弱动态效果: Focus 已整体滑走, Home 直接静态呈现, 不隐藏正文也不播入场级联 */
                root.classList.add('alpha-rm-return');
            } else {
                root.classList.add('return-from-focus');
                root.style.backgroundImage = bg;
                root.style.backgroundPosition = 'center';
                root.style.backgroundSize = 'cover';
                root.style.backgroundRepeat = 'no-repeat';
            }
        }
        if (localStorage.getItem('alpha_show_clock') === 'false') {
            const style = document.createElement('style');
            style.id = 'early-no-clock-style';
            style.textContent = '.hero-clock-scrim { opacity: 0 !important; } .home-clock { opacity: 0 !important; }';
            document.head.appendChild(style);
        }
    } catch (_) {
        document.documentElement.classList.add('return-from-focus');
    }
})();
</script>

<style>
@font-face {
  font-family: 'OPPO Sans 4.0';
  src: url('local-font://OPPO%20Sans%204.0.ttf') format('truetype'),
       url('./fonts/OPPO Sans 4.0.ttf') format('truetype');
  font-weight: 1 999;
  font-style: normal;
  font-display: block;
}

/* ================== 全局与动态色彩体系 ================== */
@property --theme-hue {
    syntax: '<number>';
    inherits: true;
    initial-value: 270;
}
@property --theme-sat {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 24%;
}
@property --theme-light {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 90%;
}

:root {
    transition: 
        --theme-hue 0.8s cubic-bezier(0.22, 1, 0.36, 1), 
        --theme-sat 0.8s cubic-bezier(0.22, 1, 0.36, 1), 
        --theme-light 0.8s cubic-bezier(0.22, 1, 0.36, 1);

    /* 默认主题色 (动态取色) */
    --theme-hue: 270;
    --theme-sat: 24%;
    --theme-light: 90%;
    --wp-glow-opacity: 1;
    
    --text: #0f172a; 
    --text-sub: #313651;
    --sub: #64748b;
    
    /* 根据主题色生成的动态 Liquid Glass 颜色 */
    --dyn-bg: hsl(var(--theme-hue, 270), var(--theme-sat, 24%), 96%);
    --dyn-panel: hsla(var(--theme-hue, 270), var(--theme-sat, 24%), 98%, 0.45);
    /* 亮度极高、近似于白但不等于白色的壁纸取色动态描边体系（全层级内置安全 Fallback，杜绝加载瞬间 currentColor 闪烁） */
    --dyn-panel-border: hsla(var(--theme-hue, 270), 30%, 96%, 0.55);
    --dyn-card-border: hsla(var(--theme-hue, 270), 30%, 96%, 0.55);
    --dyn-border-top: hsla(var(--theme-hue, 270), 36%, 96%, 0.88);
    --dyn-border-left: hsla(var(--theme-hue, 270), 30%, 95%, 0.68);
    --dyn-border-right: hsla(var(--theme-hue, 270), 26%, 94%, 0.35);
    --dyn-border-bottom: hsla(var(--theme-hue, 270), 22%, 93%, 0.25);
    --dyn-border-ring: hsla(var(--theme-hue, 270), 32%, 96%, 0.14);
    --dyn-primary: linear-gradient(135deg, hsla(calc(var(--theme-hue, 270) - 8), 34%, 93%, 0.88) 0%, hsla(var(--theme-hue, 270), 38%, 88%, 0.85) 50%, hsla(calc(var(--theme-hue, 270) + 12), 42%, 86%, 0.87) 100%);
    --dyn-primary-hover: linear-gradient(135deg, hsla(calc(var(--theme-hue, 270) - 8), 38%, 94%, 0.95) 0%, hsla(var(--theme-hue, 270), 42%, 89%, 0.93) 50%, hsla(calc(var(--theme-hue, 270) + 12), 46%, 87%, 0.94) 100%);
    --dyn-shadow: hsla(var(--theme-hue, 270), 25%, 55%, 0.08);
    /* 柔和、低饱和的 Material You / 莫奈风格强调色 */
    --theme-icon: hsl(var(--theme-hue, 270), 30%, 62%);

    --glass: var(--dyn-panel);
    --glass-border: var(--dyn-panel-border);

    --shadow-xl: 0 40px 80px rgba(15,23,42,.08);
    --shadow-sm: 0 8px 20px rgba(15,23,42,.04);

    --spacing-main: 32px;   /* Panel 级内边距 */
    --spacing-card: 24px;   /* Card 级内边距 */
    --spacing-inside: 16px; /* 元素级内边距 */
    
    /* 4 级同心圆角体系 (Concentric Radius System) */
    --radius-panel: 32px;   /* L1: 主面板、侧边栏、全局弹窗 (原 main) */
    --radius-card: 24px;    /* L2: 任务卡片、图表容器、侧边小卡 */
    --radius-element: 16px; /* L3: 按钮、输入框、视图切换器 (独立出来) */
    --radius-sm: 10px;      /* L4: 内部小标签、日历箭头、下拉项 */

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'OPPO Sans 4.0', -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    outline: none !important; -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html {
    scroll-behavior: smooth;
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    /* Body 在 Focus 返回的首帧会暂时隐藏；由 html 承接壁纸, 避免露出浏览器默认白底 */
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    background-color: var(--dyn-bg, #f7f6fa);
}

input, textarea, select, [contenteditable="true"], [contenteditable] {
    user-select: text !important;
    -webkit-user-select: text !important;
}

::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
/* 自适应的选中文字颜色 */
::selection { background-color: hsla(var(--theme-hue), 60%, 80%, 0.6); color: #0f172a; }
::-moz-selection { background-color: hsla(var(--theme-hue), 60%, 80%, 0.6); color: #0f172a; }

body {
    min-height: 100vh; color: var(--text);
    background: var(--dyn-bg);
    transition: background 1s ease;
    display: flex; flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    scrollbar-width: none; -ms-overflow-style: none;
}



body.from-focus > *:not(script):not(style):not(link):not(.sphere-modal):not(.flatpickr-calendar):not(#alphaTooltip):not(.focus-transition-stage),
html.return-from-focus body > *:not(script):not(style):not(link):not(.sphere-modal):not(.flatpickr-calendar):not(#alphaTooltip):not(.focus-transition-stage) {
    animation: none !important;
}

/* 减弱动态效果模式: 从 Focus 返回时不播放入场级联,
   只做一次轻量的整体上移进场, 与 Focus 上滑离场的方向衔接 */
html.alpha-rm-return body > *:not(script):not(style):not(link):not(.sphere-modal):not(.flatpickr-calendar):not(#alphaTooltip):not(.focus-transition-stage) {
    animation: alphaRmRiseFromFocus 0.26s cubic-bezier(0.2, 0.8, 0.4, 1) both;
}

@keyframes alphaRmRiseFromFocus {
    0% { opacity: 0; transform: translate3d(0, 42px, 0); }
    100% { opacity: 1; transform: translate3d(0, 0, 0); }
}

/* 跨页转场只使用这一组独立合成层, 避免改动 Home 的实际布局高度 */
html.return-from-focus body {
    visibility: hidden;
}

.focus-transition-stage {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 5;
    overflow: hidden;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    pointer-events: none;
    transform: translateZ(0);
    contain: strict;
    will-change: height, opacity;
}

.focus-transition-scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0) 100%);
    backdrop-filter: blur(40px) saturate(120%);
    -webkit-backdrop-filter: blur(40px) saturate(120%);
    -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 80%);
    mask-image: linear-gradient(135deg, #000 0%, transparent 80%);
    opacity: 1;
    pointer-events: none;
    will-change: opacity;
}

.focus-transition-edge {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(to bottom, transparent 40%, var(--dyn-bg) 100%);
    opacity: 1;
    pointer-events: none;
    will-change: opacity;
}

body.focus-transitioning {
    overflow: hidden !important;
}

/* 转场最后一帧做图层交接时禁止 panel 自身的 0.8s transition 二次启动 */
body.focus-transition-cleanup .panel {
    transition: none !important;
}

/* 转场时由独立玻璃代理层渲染壁纸模糊, 避免 Chromium 跨合成层采样失效 */
body.focus-transitioning .panel {
    position: relative;
    will-change: backdrop-filter;
    /* 先保留原面板, 再与代理玻璃层交叉淡化, 消除进入 Focus 时突兀的色调跳变 */
    background: linear-gradient(135deg,
        hsla(var(--theme-hue), var(--theme-sat), 96%, calc(0.75 * var(--focus-panel-source-opacity, 1))) 0%,
        hsla(var(--theme-hue), var(--theme-sat), 96%, calc(0.5 * var(--focus-panel-source-opacity, 1))) 100%) !important;
}

.focus-transition-panel-glass {
    position: fixed;
    z-index: 9;
    overflow: hidden;
    pointer-events: none;
    contain: strict;
    will-change: left, top, width, height, opacity;
    opacity: 0;
}

.focus-transition-panel-blur {
    position: absolute;
    z-index: 0;
    background-repeat: no-repeat;
    filter: blur(40px) saturate(1.3);
    -webkit-filter: blur(40px) saturate(1.3);
    pointer-events: none;
    will-change: left, top, width, height;
}

.focus-transition-panel-glass::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(135deg,
        hsla(var(--theme-hue), var(--theme-sat), 96%, 0.75) 0%,
        hsla(var(--theme-hue), var(--theme-sat), 96%, 0.5) 100%);
    pointer-events: none;
}

.focus-transition-clock-clone {
    position: fixed !important;
    margin: 0 !important;
    z-index: 1001 !important;
    pointer-events: none !important;
    transition: none !important;
    transform-origin: center center;
    backface-visibility: hidden;
    will-change: opacity, filter, transform;
    animation: none !important;
}

.focus-transition-panel-glass {
    animation: none !important;
}

/* ================== 上半部分: 动态壁纸区 ================== */
.hero-wallpaper {
    position: relative; width: 100%; height: 45vh; min-height: 300px;
    background-color: var(--dyn-bg, #f7f6fa); background-image: url('./background.png'); background-size: cover; background-position: center;
    /* 裁切壁纸副本的 blur 外溢，并建立独立堆叠上下文。这样浏览器窗口失焦/
       标签页拖动时不会把时钟衬底的合成纹理错误地回绘到视口左上角。 */
    overflow: hidden;
    isolation: isolate;

    /* 让壁纸本体保持完整，由底部覆盖层负责过渡。避免「元素蒙版 + 覆盖层」
       同时渐隐时发生双重透明混合，从而在卡片上方形成一道发灰的分界。 */
    transition: background-image 0.5s ease;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 40px 40px 80px 40px; 
}
.hero-clock-scrim {
    position: absolute;
    inset: 0;
    /* 模糊副本与 Hero 使用完全相同的画布尺寸，避免 cover 在较小元素中
       重新取景，造成左上角的模糊与原壁纸错位、看起来像没有生效。 */
    z-index: 1; /* 盖在壁纸图层上, 置于时钟图层之下 */
    pointer-events: none;
    contain: layout paint;
    backface-visibility: hidden;
    /* 将遮罩退场改为 0.4s, 与时钟的 0.5s 形成 0.1s 的景深错落感 */
    transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

/*
   时钟衬底不用 backdrop-filter，避免 Chromium 偶发生成半透明灰色矩形。
   三张与 Hero 同源、同尺寸的壁纸副本按「轻 -> 中 -> 强」叠放：
   - 左上角由强模糊完整接管；
   - 向右下移动时，强层先羽化露出中层，中层再露出轻层；
   - 轻层最后羽化露出清晰壁纸。
   因此衰减的不只是透明度，实际可见的模糊半径也会连续变小。
*/
.hero-clock-blur {
    position: absolute;
    /* 与 Hero 一比一重合，使两层的 cover 计算、裁切中心和每个像素都一致。 */
    inset: 0;
    background-image: var(--clock-scrim-image, url('./background.png'));
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transform-origin: center;
    pointer-events: none;
    backface-visibility: hidden;
    /* 轻微放大只用于给 blur 提供边缘采样余量，防止视口左上角混入透明像素；
       各层模糊量足以吸收这 4% 的取景差，不会形成可辨识重影。 */
    transform: translateZ(0);
    opacity: 1;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
}

/*
   三层共用「宽而长」的连续羽化带：每一层在下一层仍接近满强度时才开始退场。
   这样模糊半径会在重叠区内渐次交棒，不会在某个环形边界突然从 64px 跳到
   38px／18px。遮罩、滤镜均为静态合成层；不新增图层或逐帧计算。
*/
.hero-clock-blur--soft {
    z-index: 1;
    filter: blur(18px) saturate(108%);
    -webkit-filter: blur(18px) saturate(108%);
    transform: translateZ(0) scale(1.025);
    -webkit-mask-image: radial-gradient(ellipse 80% 126% at 0% 0%,
        #000 0%,
        #000 28%,
        rgba(0, 0, 0, 0.98) 38%,
        rgba(0, 0, 0, 0.88) 48%,
        rgba(0, 0, 0, 0.66) 59%,
        rgba(0, 0, 0, 0.42) 70%,
        rgba(0, 0, 0, 0.20) 81%,
        rgba(0, 0, 0, 0.065) 91%,
        rgba(0, 0, 0, 0.012) 97%,
        transparent 100%);
    mask-image: radial-gradient(ellipse 80% 126% at 0% 0%,
        #000 0%,
        #000 28%,
        rgba(0, 0, 0, 0.98) 38%,
        rgba(0, 0, 0, 0.88) 48%,
        rgba(0, 0, 0, 0.66) 59%,
        rgba(0, 0, 0, 0.42) 70%,
        rgba(0, 0, 0, 0.20) 81%,
        rgba(0, 0, 0, 0.065) 91%,
        rgba(0, 0, 0, 0.012) 97%,
        transparent 100%);
}

.hero-clock-blur--medium {
    z-index: 2;
    filter: blur(38px) saturate(118%);
    -webkit-filter: blur(38px) saturate(118%);
    transform: translateZ(0) scale(1.045);
    -webkit-mask-image: radial-gradient(ellipse 64% 102% at 0% 0%,
        #000 0%,
        #000 20%,
        rgba(0, 0, 0, 0.98) 31%,
        rgba(0, 0, 0, 0.87) 43%,
        rgba(0, 0, 0, 0.65) 55%,
        rgba(0, 0, 0, 0.39) 67%,
        rgba(0, 0, 0, 0.17) 79%,
        rgba(0, 0, 0, 0.045) 90%,
        rgba(0, 0, 0, 0.008) 97%,
        transparent 100%);
    mask-image: radial-gradient(ellipse 64% 102% at 0% 0%,
        #000 0%,
        #000 20%,
        rgba(0, 0, 0, 0.98) 31%,
        rgba(0, 0, 0, 0.87) 43%,
        rgba(0, 0, 0, 0.65) 55%,
        rgba(0, 0, 0, 0.39) 67%,
        rgba(0, 0, 0, 0.17) 79%,
        rgba(0, 0, 0, 0.045) 90%,
        rgba(0, 0, 0, 0.008) 97%,
        transparent 100%);
}

/* 核心圈：在时钟背后保持最大模糊，并以较长羽化带交给中间圈。 */
.hero-clock-blur--strong {
    z-index: 3;
    filter: blur(64px) saturate(128%);
    -webkit-filter: blur(64px) saturate(128%);
    transform: translateZ(0) scale(1.065);
    -webkit-mask-image: radial-gradient(ellipse 50% 80% at 0% 0%,
        #000 0%,
        #000 14%,
        rgba(0, 0, 0, 0.98) 23%,
        rgba(0, 0, 0, 0.86) 32%,
        rgba(0, 0, 0, 0.64) 42%,
        rgba(0, 0, 0, 0.38) 53%,
        rgba(0, 0, 0, 0.16) 67%,
        rgba(0, 0, 0, 0.045) 81%,
        rgba(0, 0, 0, 0.008) 94%,
        transparent 100%);
    mask-image: radial-gradient(ellipse 50% 80% at 0% 0%,
        #000 0%,
        #000 14%,
        rgba(0, 0, 0, 0.98) 23%,
        rgba(0, 0, 0, 0.86) 32%,
        rgba(0, 0, 0, 0.64) 42%,
        rgba(0, 0, 0, 0.38) 53%,
        rgba(0, 0, 0, 0.16) 67%,
        rgba(0, 0, 0, 0.045) 81%,
        rgba(0, 0, 0, 0.008) 94%,
        transparent 100%);
}

/* 颜色深度与模糊范围同心衰减；普通半透明合成不会触发背景采样。 */
.hero-clock-scrim::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(ellipse 84% 130% at 0% 0%,
        hsla(var(--theme-hue, 270), 32%, 24%, 0.16) 0%,
        hsla(var(--theme-hue, 270), 28%, 28%, 0.12) 26%,
        hsla(var(--theme-hue, 270), 24%, 34%, 0.072) 48%,
        hsla(var(--theme-hue, 270), 20%, 40%, 0.028) 70%,
        transparent 100%);
}
.hero-wallpaper.no-clock .hero-clock-scrim {
    opacity: 0;
}
.hero-wallpaper::after {
    content: ''; position: absolute; inset: 0;
    z-index: 2;
    /* 卡片的起点约位于 Hero 高度的 80% 附近；在此前已与页面底色充分混合，
       使壁纸、留白和卡片成为一段连续过渡，而非在负 margin 位置硬切。 */
    background: linear-gradient(to bottom,
        transparent 22%,
        color-mix(in srgb, var(--dyn-bg) 18%, transparent) 46%,
        color-mix(in srgb, var(--dyn-bg) 62%, transparent) 68%,
        var(--dyn-bg) 88%,
        var(--dyn-bg) 100%);
    box-shadow: inset 0 -2px 0 var(--dyn-bg);
    pointer-events: none;
}

/* 不支持 color-mix 的浏览器仍采用同样拉长的四段透明度过渡。 */
@supports not (background: color-mix(in srgb, white 50%, transparent)) {
    .hero-wallpaper::after {
        background: linear-gradient(to bottom,
            transparent 22%,
            hsla(var(--theme-hue), var(--theme-sat), 96%, 0.18) 46%,
            hsla(var(--theme-hue), var(--theme-sat), 96%, 0.62) 68%,
            var(--dyn-bg) 88%,
            var(--dyn-bg) 100%);
    }
}


/* ================== 下半部分: 功能区 ================== */
.home-layout {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-main);
    width: 100%; max-width: 1600px; margin: -60px auto 40px auto; padding: 0 40px;
    position: relative; z-index: 10;
}
/* ==========================================
   统一 TaskFlow 响应式布局规范 (1050px / 768px)
   ========================================== */
@media (max-width: 1050px) {
    .hero-wallpaper { padding: 32px 32px 70px 32px !important; }
    .home-layout {
        grid-template-columns: 1fr !important;
        padding: 0 !important;
        margin: -50px auto 32px auto !important;
        gap: 32px !important;
        max-width: 1600px !important;
    }
    .panel { padding: 32px !important; gap: 20px !important; }
    .nav-card { padding: 24px 20px !important; }
    .alarm-item { padding: 16px 20px !important; }
    .home-clock { padding: 16px 24px !important; }
}

@media (max-width: 768px) {
    .hero-wallpaper {
        padding: 24px 16px 50px 16px !important;
        height: auto !important;
        min-height: 220px !important;
    }
    .home-layout {
        padding: 0 16px !important;
        margin: -30px auto 24px auto !important;
        gap: 16px !important;
    }
    .panel { padding: 24px !important; gap: 16px !important; }
    .nav-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 16px !important; }
    .nav-card { padding: 20px 16px !important; }
    .alarm-item { padding: 14px 16px !important; }
    .home-clock { padding: 14px 20px !important; }
    textarea#todoInput { padding: 14px 16px !important; }
}

/* paint containment/独立 transform 会截断 panel 对背后壁纸的采样, 导致
   backdrop-filter 看起来像完全失效Panel 保留布局隔离, 但允许真实毛玻璃取样 */
.panel {
  contain: layout;
}

#todoPanel {
  transform: translateZ(0);
  contain: paint layout;
}

.panel {
    background: linear-gradient(135deg, hsla(var(--theme-hue, 270), var(--theme-sat, 24%), 96%, 0.75) 0%, hsla(var(--theme-hue, 270), var(--theme-sat, 24%), 96%, 0.5) 100%) !important;

    box-shadow:
        0 0 0 1px var(--dyn-border-ring, hsla(270, 32%, 96%, 0.14)),
        0 8px 24px rgba(15, 23, 42, 0.038),
        0 20px 48px rgba(15, 23, 42, 0.030),
        inset 0 2px 6px hsla(var(--theme-hue, 270), 32%, 96%, 0.40),
        inset 0 1px 1px hsla(var(--theme-hue, 270), 36%, 96%, 0.80),
        inset 1.5px 0 2px hsla(var(--theme-hue, 270), 28%, 96%, 0.12) !important;

    backdrop-filter: blur(40px) saturate(130%) !important; -webkit-backdrop-filter: blur(40px) saturate(130%) !important;
    /* 采用更具液态光泽的渐变半透明, 代替单一的纯色 */
    
    border-top: 1.5px solid var(--dyn-border-top, hsla(270, 36%, 96%, 0.88));
    border-left: 1px solid var(--dyn-border-left, hsla(270, 30%, 95%, 0.68));
    border-right: 1px solid var(--dyn-border-right, hsla(270, 26%, 94%, 0.35));
    border-bottom: 1px solid var(--dyn-border-bottom, hsla(270, 22%, 93%, 0.25));
                
    border-radius: var(--radius-panel); 
    padding: 32px;
    transition: background 0.8s ease, transform 0.8s ease, box-shadow 0.8s ease;
    display: flex; 
    flex-direction: column; 
    gap: 20px;
}
.section-title { font-size: 24px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 10px; }
.section-title > span[aria-hidden="true"] { color: var(--theme-icon); display: inline-flex; align-items: center; }
.section-title > span[aria-hidden="true"] > svg { display: block; transform: translateY(1px); }

.home-layout > .panel:first-child {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    height: 100%; /* 强迫左侧卡片物理高度与右侧 Grid 轨道保持绝对一致 */
}

/* ================== 文本框/输入框公共属性 ================== */
textarea, textarea#todoInput, input[type="text"] {
    width: 100%;
    border-radius: var(--radius-element);
    color: #0f172a; 
    font-size: 15px; 
    font-weight: 600; 
    line-height: 1.6;
    resize: none;
    transition: background 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}

/* ================== 隔离 精准控制两层描边 ================== */

/* 左侧「方法指南」文本框: 让它独自继承完美的2层白色光学描边, 作为动画过渡起点 */
textarea#todoInput {
    /* 剥除 flex-grow, 防止过度拉伸吃掉低于剩余空间的回弹动画 */
    flex: 0 0 auto; 
    /* 让下外边距自动吸收父级的剩余高度, 彻底解放文本框自身的物理高度限制 */
    margin-bottom: auto; 
    
    height: 200px; 

    transition: height 0.4s cubic-bezier(0.34, 1.45, 0.64, 1), background 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease) !important;

    padding: 16px 20px; 
    background: rgba(255, 255, 255, 0.40);
    overflow-y: hidden; 

    /* 彻底剥除 4px 的白色软包常驻外圈, 仅保留内阴影, 把双圈效果留给 focus 状态 */
    border-top: 2px solid var(--dyn-border-top, hsla(270, 36%, 96%, 0.88)) !important;
      border-left: 1px solid var(--dyn-border-left, hsla(270, 30%, 95%, 0.68)) !important;
      border-right: 1px solid var(--dyn-border-right, hsla(270, 26%, 94%, 0.35)) !important;
      border-bottom: 1px solid var(--dyn-border-bottom, hsla(270, 22%, 93%, 0.25)) !important;
    box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.05), inset 0 -1px 1.5px hsla(var(--theme-hue, 270), 30%, 96%, 0.45) !important;
}

/* 2 右侧「普通单行输入框」: 彻底删除多余的白色软包, 保持 Liquid Glass 干净隐形状态 */
input[type="text"] {
    height: 50px;
    padding: 0 20px;
    background: rgba(255, 255, 255, 0.30);

    /* 剥除白色软包, 隐形状态 */
    border: 1px solid transparent !important;
    box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.05), inset 0 -1px 1.5px rgba(255, 255, 255, 0.45) !important;
    transition: background 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
}

input::placeholder, textarea::placeholder { color: #748091; font-weight: 500; }
input:hover, textarea:hover, textarea#todoInput:hover { background: rgba(255, 255, 255, 0.48); }
input:focus, textarea:focus {
    background-color: #ffffff !important;
    border-color: rgba(157, 210, 255, 0.4) !important;
    box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 1), 
        inset 0 -1px 2px rgba(157, 210, 255, 0.1),
        0 0 0 1px rgba(157, 210, 255, 0.2), 
        0 0 8px 3px rgba(157, 210, 255, 0.15),
        0 8px 20px rgba(157, 210, 255, 0.1),
        0 12px 24px rgba(15, 23, 42, 0.08) !important;
}

/* 聚焦状态: 双圈随动变色系统 */
input:focus, textarea:focus, textarea#todoInput:focus { 
    background-color: #ffffff !important;
    border-color: hsla(var(--theme-hue, 270), 50%, 75%, 0.4) !important;
    box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 1), 
        inset 0 -1px 2px hsla(var(--theme-hue, 270), 50%, 75%, 0.1),
        0 0 0 1px hsla(var(--theme-hue, 270), 50%, 75%, 0.2), 
        0 0 8px 3px hsla(var(--theme-hue, 270), 50%, 75%, 0.15), 
        0 8px 20px hsla(var(--theme-hue, 270), 50%, 75%, 0.1),
        0 12px 24px var(--dyn-shadow) !important; 
}

/* ================== 按钮动效系统升级 ================== */
button, upload-label {
    position: relative; overflow: hidden; display: inline-flex; height: 52px; border: none;
    align-items: center; justify-content: center; padding: 0 24px;
    border-radius: var(--radius-element); cursor: pointer; font-size: 16px !important; font-weight: 700 !important; 
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; 
    outline: none; letter-spacing: 0.5px;
    will-change: transform; 
}

/* ================== 桌面时钟引擎 (极限玻璃压榨版) ================== */
.home-clock {
    position: absolute; left: 24px; top: 24px;
    display: flex; align-items: center; justify-content: flex-start;
    font-variant-numeric: tabular-nums; 
    gap: 1.4px; 
    z-index: 1000;
    padding: 16px 24px; 
    border-radius: 24px;
    
    /* 移除 transform-origin, 让容器从中心自然呼吸缩放, 告别「从左进来」的错觉 */
    
    /* 确保剔除任何隐形背景, 与 settings.html 材质 100% 同步 */
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    
    /* 统一绑定 0.6s 物理阻尼曲线 */
    transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: opacity, filter, transform;
}

.hero-wallpaper.no-clock .home-clock { 
    opacity: 0; 
    filter: blur(40px); 
    /* 隐藏时退居右侧 32px 处, 出现时便会从偏右侧向左顺滑回弹进入 */
    transform: translateX(32px) scale(0.9); 
    pointer-events: none;
}

.home-clock .clock-digit-slot {
    position: relative; 
    /* 移除 overflow: hidden, 改为 visible, 允许上下退出时的文字和发光溢出容器边界 */
    overflow: visible; 
    display: flex; justify-content: center; align-items: center;
    font-size: 2.4rem; 
    font-weight: 700;
    /* 预留物理空间, 防止 absolute 后父容器塌陷 */
    width: 0.65em; 
    height: 1.1em;
}

.home-clock .clock-time-node {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;

    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent; 
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.20); 
    
    /* 让元素的消散（opacity/filter）与位移（transform）完美同频 0.6s */
    transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity, filter; 
}

.home-clock .hour-node {
    background-image: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(255, 255, 255, 0.40) 100%);
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.40); 
    text-shadow: 0 4px 16px rgba(255, 255, 255, 0.25); 
}

.home-clock .minute-node {
    background-image: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255, 255, 255, 0.10) 100%);
    -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.20); 
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.28);
}

.home-clock .colon {
    background-image: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.1));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0; 
    margin-top: -0.25em;
    width: 0.55em; /* 缩小冒号专属容器宽度 */
    font-size: 1.8rem;
    font-weight: 600;
    will-change: transform, opacity;
    transform: translate3d(0, 0, 0) scale(1);
    transform-origin: center center;
    contain: layout paint;
    backface-visibility: hidden;
    animation: pulse-colon 2s infinite ease-in-out;
}
body.pause-clock-breath .home-clock .colon,

.alarm-item {
    display: flex; justify-content: space-between; align-items: center;
    background: hsla(var(--theme-hue), var(--theme-sat), 97%, 0.75);
    border: 1px solid var(--dyn-card-border);
    border-top: 1.5px solid var(--dyn-border-top);
    padding: 16px 20px;
    box-shadow: 0 4px 12px rgba(15,23,42,0.06), inset 0 2px 4px hsla(var(--theme-hue), calc(var(--theme-sat) + 16%), 96%, 0.90);
    border-radius: var(--radius-element);
    margin-bottom: 12px; 
    
    /* 改用 ease-out, 用关键帧的物理尺寸溢出（Overshoot）来带 Panel */
    animation: alarmPopIn 0.5s ease-out forwards;
}
.alarm-item:last-child {
    margin-bottom: 0; 
}

.alarm-item.removing {
    animation: alarmPopOut 0.4s ease-in-out forwards;
    pointer-events: none;
}

/* 进场动画 */
@keyframes alarmPopIn {
    0% { 
        opacity: 0; transform: translateX(-16px) scale(0.95); 
        max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0; overflow: hidden;
    }
    /* 55% 阶段, 内边距和外边距被撑得比最终还要大, 把外层 Panel 顶长一点点 */
    55% { 
        opacity: 1; transform: translateX(4px) scale(1.01); 
        max-height: 100px; padding-top: 24px; padding-bottom: 24px; margin-bottom: 20px; border-width: 1px;
    }
    100% { 
        opacity: 1; transform: translateX(0) scale(1); 
        max-height: 80px; padding-top: 16px; padding-bottom: 16px; margin-bottom: 12px; border-width: 1px; overflow: hidden;
    }
}

/* 离场动画 */
@keyframes alarmPopOut {
    0% { 
        opacity: 1; transform: scale(1) translateX(0); 
        max-height: 80px; padding-top: 16px; padding-bottom: 16px; margin-bottom: 12px; border-width: 1px; overflow: hidden;
    }
    /* 在被删除前, 膨胀一下, 带动 Panel 伸长, 再塌陷 */
    30% {
        opacity: 1; transform: scale(1.02) translateX(-2px); 
        max-height: 100px; padding-top: 20px; padding-bottom: 20px; margin-bottom: 18px; border-width: 1px;
    }
    100% { 
        opacity: 0; transform: scale(0.9) translateX(16px); 
        max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0; overflow: hidden;
    }
}

.alarm-item.ringing { animation: ringShake 0.5s ease infinite alternate; background: #fff3f3; border-color: #ffcaca; }
@keyframes ringShake { 0% { transform: translateX(-2px); } 100% { transform: translateX(2px); } }
.alarm-time { font-size: 18px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

}

.alarm-del:hover {

    background-color: rgba(239, 68, 68, 0.12);
    transform: translateZ(0) scale(1.18);
}

.alarm-del:active {

    background-color: rgba(239, 68, 68, 0.22);

/* 全局弹窗引擎 */
.sphere-modal {
    position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
    background-color: rgba(148, 163, 184, 0.4);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%);
    opacity: 1; visibility: visible; 
    
    /* 显式接管 backdrop-filter 过渡, 防止 GPU 盲目重绘 */
    transition: opacity 0.3s var(--ease), 
                backdrop-filter 0.3s var(--ease),
                -webkit-backdrop-filter 0.3s var(--ease),
                visibility 0s 0s;
                
    /* 提前宣告模糊度的变化, 并强制开启底层硬件加速 */
    will-change: opacity;
    transform: translateZ(0);
}

.sphere-modal.hidden {
    display: flex !important; 
    opacity: 0; 
    visibility: hidden; 
    pointer-events: none;
    
    /* 退出时将模糊度归零, 彻底释放底层渲染压力 */
    backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
    
    transition: opacity 0.3s var(--ease), 
                backdrop-filter 0.3s var(--ease),
                -webkit-backdrop-filter 0.3s var(--ease),
                visibility 0s 0.3s;
}

.sphere-modal .modal-content,
.custom-alarm, .custom-alarm-modal, .custom-alarm-content {
    background: hsla(var(--theme-hue), var(--theme-sat), 97%, 0.80); 
    backdrop-filter: blur(40px) saturate(130%); -webkit-backdrop-filter: blur(40px) saturate(130%);
    border-top: 2px solid var(--dyn-border-top);
    border-left: 1px solid var(--dyn-border-left);
    border-right: 1px solid var(--dyn-border-right);
    border-bottom: 1px solid var(--dyn-border-bottom);
    
    border-radius: var(--radius-panel); /* 保持卡片级圆角比例 */
    
    /* 升级为全局最高级留白 (32px), 让内容彻底呼吸 */
    padding: var(--spacing-main);
    
    /* 略微拓宽整体容器宽度, 补偿文字可用空间 */

<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-card').forEach(card => {
        // 意图/悬停预热：当鼠标划入卡片瞬间 (提前 100~300ms) 触发高优先级预热与 V8 JIT 预编译
        const triggerPrewarm = () => {
            const href = card.getAttribute('href');
            if (href) {
                try {
                    if (window.parent && window.parent.ALPHA && typeof window.parent.ALPHA.prewarm === 'function') {
                        window.parent.ALPHA.prewarm(href);
                    } else if (window.ALPHA && typeof window.ALPHA.prewarm === 'function') {
                        window.ALPHA.prewarm(href);
                    }
                } catch (_) {}
            }
        };
        card.addEventListener('pointerenter', triggerPrewarm, { passive: true });
        card.addEventListener('mouseenter', triggerPrewarm, { passive: true });

        card.addEventListener('click', function(e) {
            e.preventDefault();
            const href = this.getAttribute('href');
            if (!href) return;
            sessionStorage.setItem('nav_from_home', 'true');
            triggerPrewarm();
            
            // 播放卡片弹性轻触反馈, 随后交由 wrapper 全局动效引擎执行丝滑跨页转场
            this.classList.remove('anim-bounce');
            void this.offsetWidth;
            this.classList.add('anim-bounce');
            
            setTimeout(() => {
                try {
                    if (window.parent && window.parent.ALPHA && typeof window.parent.ALPHA.navigate === 'function') {
                        window.parent.ALPHA.navigate(href, 'auto', { transition: 'forward' });
                        return;
                    }
                } catch (_) {}
                window.location.href = href;
            }, 80);
        });
    });
});
</script>

function setClockScrimWallpaper(url) {

    const cssUrl = url.startsWith('url(') ? url : `url("${url}")`;
    heroWallpaper.style.setProperty('--clock-scrim-image', cssUrl);
}

function isDefaultWallpaper(wp) {
    if (!wp) return true;
    const clean = wp.trim().replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
    return clean === './background.png' || clean === 'background.png' || clean === './background_dark.png' || clean === 'background_dark.png' || clean.endsWith('/background.png') || clean.endsWith('\\background.png') || clean.endsWith('/background_dark.png') || clean.endsWith('\\background_dark.png');
}

function getDefaultWallpaper() {
    try {
        const isDark = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        return isDark ? './background_dark.png' : './background.png';
    } catch (_) {
        return './background.png';
    }
}

function getEffectiveWallpaper() {
    const saved = localStorage.getItem('alpha_wallpaper');
    if (!saved || isDefaultWallpaper(saved)) {
        return getDefaultWallpaper();
    }
    return saved;
}

// 使用内存变量记录当前壁纸

// 3D 景深过渡引擎 (双层 rAF)
function runIOSBlurTransition(oldBgStr, newUrl, parentEl) {
    if (!parentEl) return;
    
    const container = document.createElement('div');
    // z-index: 0 保证位于内容之下但完美遮挡原来的背景图
    container.style = `position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; border-radius:inherit;`;
    
    const oldLayer = document.createElement('div');
    oldLayer.style = `position:absolute; inset:0; background:${oldBgStr} center/cover; opacity:1; filter:blur(0px); transform:scale(1); transition:opacity 0.6s ease, filter 0.6s ease, transform 0.8s cubic-bezier(0.22,1,0.36,1); z-index:1;`;
    
    const newLayer = document.createElement('div');
    newLayer.style = `position:absolute; inset:0; background:url("${newUrl}") center/cover; opacity:0; filter:blur(40px); transform:scale(1.08); transition:opacity 0.6s ease, filter 0.6s ease, transform 0.8s cubic-bezier(0.22,1,0.36,1); z-index:2;`;

    container.appendChild(oldLayer); container.appendChild(newLayer);
    parentEl.insertBefore(container, parentEl.firstChild);

    const originalIsolation = parentEl.style.isolation || '';
    parentEl.style.isolation = 'isolate';
    
    // 动画期间暂时清空父级原有背景, 由 container 接管展示
    parentEl.style.backgroundImage = 'none';

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            oldLayer.style.opacity = '0'; oldLayer.style.filter = 'blur(40px)'; oldLayer.style.transform = 'scale(0.96)';
            newLayer.style.opacity = '1'; newLayer.style.filter = 'blur(0px)'; newLayer.style.transform = 'scale(1)';
        });
    });

    setTimeout(() => {
        parentEl.style.backgroundImage = `url("${newUrl}")`;
        setClockScrimWallpaper(newUrl);
        // 利用双重 rAF 等待浏览器真正把 backgroundImage 渲染上主屏幕后, 再卸载动画涂层, 彻底告别闪烁
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                parentEl.style.isolation = originalIsolation;
                container.remove();
            });
        });
    }, 850); 
}

// 默认壁纸（background.png）精准调校的主题色体系预设
const DEFAULT_WP_THEME = {
    hue: 270,
    sat: 24.1,
    light: 90.4,
    glowOpacity: 1.0
};

// 默认深色壁纸（background_dark.png）精准调校的主题色体系预设
const DARK_WP_THEME = {
    hue: 260,
    sat: 18.0,
    light: 25.0,
    glowOpacity: 0.35
};

function applyThemeVariables(hue, sat, light, glowOpacity) {
    const root = document.documentElement;
    const normalizedSat = typeof sat === 'number' ? sat : Number.parseFloat(sat);
    const normalizedLight = typeof light === 'number' ? light : Number.parseFloat(light);
    const normalizedGlow = typeof glowOpacity === 'number' ? glowOpacity : Number.parseFloat(glowOpacity);
    root.style.setProperty('--theme-hue', hue);
    root.style.setProperty('--theme-sat', `${normalizedSat.toFixed(1)}%`);
    root.style.setProperty('--theme-light', `${normalizedLight.toFixed(1)}%`);
    root.style.setProperty('--wp-glow-opacity', normalizedGlow.toFixed(2));
    try {
        localStorage.setItem('alpha_theme_snapshot', JSON.stringify({
            hue: Number(hue),
            sat: normalizedSat,
            light: normalizedLight,
            glowOpacity: normalizedGlow
        }));
    } catch (_) { /* 缓存不可用不影响主题应用 */ }

    /* theme-booting 期间属性无补间，先落到正确颜色，再开放后续动态主题动画。 */
    requestAnimationFrame(() => root.classList.remove('theme-booting'));
}

function extractColorFromBase64(imageSrc) {
    if (!imageSrc || imageSrc === './background.png' || imageSrc === 'background.png' || imageSrc.endsWith('/background.png') || imageSrc.endsWith('\\background.png')) {
        applyThemeVariables(DEFAULT_WP_THEME.hue, DEFAULT_WP_THEME.sat, DEFAULT_WP_THEME.light, DEFAULT_WP_THEME.glowOpacity);
        return;
    }
    if (imageSrc === './background_dark.png' || imageSrc === 'background_dark.png' || imageSrc.endsWith('/background_dark.png') || imageSrc.endsWith('\\background_dark.png')) {
        applyThemeVariables(DARK_WP_THEME.hue, DARK_WP_THEME.sat, DARK_WP_THEME.light, DARK_WP_THEME.glowOpacity);
        return;
    }
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    let themeExtracted = false;
    const extractOnce = () => {
        if (themeExtracted) return;
        themeExtracted = true;
        extractThemeColor(img);
    };
    img.onload = extractOnce;
    img.onerror = () => {
        applyThemeVariables(DEFAULT_WP_THEME.hue, DEFAULT_WP_THEME.sat, DEFAULT_WP_THEME.light, DEFAULT_WP_THEME.glowOpacity);
    };
    img.src = imageSrc;
    if (img.complete && img.naturalWidth !== 0) {
        extractOnce();
    }
}

function extractThemeColor(img) {
    requestAnimationFrame(() => {
        try {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            canvas.width = 100;
            canvas.height = 100;
            ctx.drawImage(img, 0, 0, 100, 100);
            const data = ctx.getImageData(0, 0, 100, 100).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) {
                if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) continue;
                if (data[i] < 20 && data[i+1] < 20 && data[i+2] < 20) continue;
                r += data[i]; g += data[i+1]; b += data[i+2]; count++;
            }
            if (count === 0) {
                for (let i = 0; i < data.length; i += 4) {
                    r += data[i]; g += data[i+1]; b += data[i+2]; count++;
                }
            }
            if (count === 0) {
                applyThemeVariables(DEFAULT_WP_THEME.hue, DEFAULT_WP_THEME.sat, DEFAULT_WP_THEME.light, DEFAULT_WP_THEME.glowOpacity);
                return;
            }
            r = Math.floor(r / count) / 255;
            g = Math.floor(g / count) / 255;
            b = Math.floor(b / count) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            
            const hue = Math.round(h * 360);
            const rawSat = s * 100;
            let monetSat = 15 + (rawSat * 0.25); 
            if (monetSat > 35) monetSat = 35;
            
            const rawLight = l * 100;
            let monetLight = 86 + ((rawLight - 50) * 0.15);
            if (monetLight < 86) monetLight = 86;
            if (monetLight > 94) monetLight = 94;

            // 亮度感知
            let glowOpacity = (rawLight - 25) / 50; 
            if (glowOpacity < 0) glowOpacity = 0;
            if (glowOpacity > 1) glowOpacity = 1;

            applyThemeVariables(hue, monetSat, monetLight, glowOpacity);
        } catch (e) {
            applyThemeVariables(DEFAULT_WP_THEME.hue, DEFAULT_WP_THEME.sat, DEFAULT_WP_THEME.light, DEFAULT_WP_THEME.glowOpacity);
        }
    });
}

function syncWallpaper(animate = false) {
    const effectiveWp = getEffectiveWallpaper();

    // 清理可能遗留的预加载遮罩
    const tempStyle = document.getElementById('temp-preload-wp');
    if (tempStyle) tempStyle.remove();

    // 只有在明确需要动画, 且新壁纸与「内存旧壁纸」不一样时, 才触发丝滑过渡
    if (animate && currentDisplayedWp && currentDisplayedWp !== effectiveWp) {
        const oldBgStr = currentDisplayedWp.startsWith('url(') ? currentDisplayedWp : `url("${currentDisplayedWp}")`;
        runIOSBlurTransition(oldBgStr, effectiveWp, heroWallpaper);
    } else {
        // 无动画硬加载（首次打开网页时触发, 杜绝闪烁）
        heroWallpaper.style.backgroundImage = `url("${effectiveWp}")`;
        setClockScrimWallpaper(effectiveWp);
    }
    
    // 更新内存状态锁
    currentDisplayedWp = effectiveWp;

    try {
        if (window.frameElement) {
            window.frameElement.style.backgroundImage = `url("${effectiveWp}")`;
            window.frameElement.style.backgroundPosition = 'center';
            window.frameElement.style.backgroundSize = 'cover';
            window.frameElement.style.backgroundRepeat = 'no-repeat';
        }
    } catch (_) {}
    
    if (typeof extractColorFromBase64 === 'function') {
        extractColorFromBase64(effectiveWp);
    }
}

// 1. 初始化插槽式 DOM 结构
homeClock.innerHTML = `
    <div class="clock-digit-slot" id="home-slot-h1"></div>
    <div class="clock-digit-slot" id="home-slot-h2"></div>
    <div class="clock-digit-slot colon">
        <div class="clock-time-node" style="position: relative; opacity: 1; filter: blur(0px); transform: none;">:</div>
    </div>
    <div class="clock-digit-slot" id="home-slot-m1"></div>
    <div class="clock-digit-slot" id="home-slot-m2"></div>
`;

// 独立的状态树, 追踪时间变更, 避免无效重排
let homeDigitsState = {
    'home-slot-h1': '', 'home-slot-h2': '',
    'home-slot-m1': '', 'home-slot-m2': ''
};

function updateHomeClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    
    // 映射当前时间到对应的 DOM 插槽
    const timeMappings = [
        { id: 'home-slot-h1', val: h[0], typeClass: 'hour-node' },
        { id: 'home-slot-h2', val: h[1], typeClass: 'hour-node' },
        { id: 'home-slot-m1', val: m[0], typeClass: 'minute-node' },
        { id: 'home-slot-m2', val: m[1], typeClass: 'minute-node' }
    ];

    const isReduceMotion = (typeof localStorage !== 'undefined' && localStorage.getItem('alpha_reduce_motion') === 'true');

    timeMappings.forEach(item => {
        if (homeDigitsState[item.id] !== item.val) {
            const slot = document.getElementById(item.id);
            if (!slot) return;
            
            // 减弱动态效果开启时：新数字直接替换，旧数字瞬间消失，0ms 瞬切
            if (isReduceMotion) {
                slot.innerHTML = '';
                const newNode = document.createElement('div');
                newNode.textContent = item.val;
                newNode.className = `clock-time-node ${item.typeClass}${item.val === '1' ? ' digit-1' : ''}`;
                slot.appendChild(newNode);
                homeDigitsState[item.id] = item.val;
                return;
            }

            const isInitialRender = homeDigitsState[item.id] === '';

            // 1. 处理旧数字节点: 打上离场标签 (上浮并高斯模糊消散)
            if (!isInitialRender) {
                const oldNodes = slot.querySelectorAll('.clock-time-node');
                oldNodes.forEach(node => {
                    node.classList.remove('clock-enter-active', 'clock-enter');
                    node.classList.add('clock-exit');
                    // 等待 600ms (动画结束后) 从物理 DOM 树中销毁
                    setTimeout(() => node.remove(), 600);
                });
            }

            // 2. 创建新数字节点
            const newNode = document.createElement('div');
            newNode.textContent = item.val;
            newNode.className = `clock-time-node ${item.typeClass}${item.val === '1' ? ' digit-1' : ''}`;
            
            if (isInitialRender) {
                // 首屏渲染: 拒绝任何附加类与延迟, 直接物理降落到终态, 清爽无动画
                slot.appendChild(newNode);
            } else {
                // 状态更新: 赋予右侧初始隐藏态
                newNode.classList.add('clock-enter');
                slot.appendChild(newNode);

                // 强行触发浏览器重排 (Reflow), 剥离连续渲染帧
                void newNode.offsetWidth;

                // 移除初始态, 触发向左物理回弹动画
                newNode.classList.remove('clock-enter');
                newNode.classList.add('clock-enter-active');
            }
            
            homeDigitsState[item.id] = item.val;
        }
    });
}

// 2. 启动引擎
let homeClockTimeout = null;
function scheduleNextClockUpdate() {
    if (document.hidden) return;
    const now = new Date();
    // 精确计算到下一分钟 00 秒所需要的毫秒数, 防止轮询, 直接对接下一次分钟切换的完美节点
    const msUntilNextMinute = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
    homeClockTimeout = setTimeout(() => {
        updateHomeClock();
        checkAlarms();
        scheduleNextClockUpdate();
    }, msUntilNextMinute);
}

function pauseHomeClockScheduler() {
    if (homeClockTimeout) clearTimeout(homeClockTimeout);
    homeClockTimeout = null;
}

function resumeHomeClockScheduler() {
    pauseHomeClockScheduler();
    updateHomeClock();
    checkAlarms();
    scheduleNextClockUpdate();
}
// 初始加载时立即执行一次以展示当前时间, 然后再开始进入精准定时

function checkAlarms() {
    const now = new Date();
    const currentHM = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const todayStr = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
    if (!alarms) return;
    alarms.forEach(al => {
        if (al.time === currentHM && al.triggeredDay !== todayStr) {
            al.triggeredDay = todayStr;
            localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
            if (typeof syncAlarmsToMain === 'function') syncAlarmsToMain();
            
            const itemEl = document.getElementById(`alarm-${al.id}`);
            if (itemEl) itemEl.classList.add('ringing');
            
            alarmPlayCount = 1; 
            const audio = getAlarmAudio();
            audio.currentTime = 0;

            if (electronAPI && electronAPI.showAlarmNotification) {
                electronAPI.showAlarmNotification({
                    title: `日程提醒: ${al.time} 到了!`,

                });
            }
            
            customAlert(`<b>${al.time}</b> 到了!<br><br>${al.name}`, "日程提醒", "Rocket", () => {

}

// ================= 强制时间格式化与焦点引擎 =================
function forceTimeFormat(instance, val) {
    if (!val || !instance) return false;
    let raw = val.replace(/\D/g, ""); 
    if (raw.length < 3) return false; 
    
    let h = null, m = null;
    if (raw.length === 3) { h = raw.slice(0, 1); m = raw.slice(1, 3); } 
    else if (raw.length >= 4) { h = raw.slice(0, 2); m = raw.slice(2, 4); }
    
    if (h !== null && m !== null) {
        let hi = parseInt(h, 10), mi = parseInt(m, 10);
        if (hi <= 23 && mi <= 59) {
            let formatted = `${String(hi).padStart(2, "0")}:${String(mi).padStart(2, "0")}`;
            
            // 比对状态锁
            // 拦截由于 input 失去焦点(blur)导致的无效重绘, 保护 CSS 退出动画不被打断
            if (instance.input.value !== formatted) {
                instance.input.value = formatted;
                instance.setDate(formatted, true);
            }
            return true;
        }
    }
    return false;
}

const alarmTimeInput = DOM.alarmTime;
const alarmNameInput = DOM.alarmName;

function showEmptyTimeParts(instance) {
    if (instance.input.value) return;

    if (instance.hourElement) {
        instance.hourElement.value = "";
        instance.hourElement.placeholder = "--";
    }

    if (instance.minuteElement) {
        instance.minuteElement.value = "";
        instance.minuteElement.placeholder = "--";
    }
}

function normalizePickerPart(value, max) {
    const raw = String(value || "").replace(/\D/g, "");

    if (!raw) return null;

    const number = Number(raw);

    if (!Number.isInteger(number) || number < 0 || number > max) {
        return null;
    }

    return String(number).padStart(2, "0");
}

function commitPickerParts(instance, triggerChange = true, draft = null) {
    // Closing Flatpickr blurs the active number input before onClose runs.
    // Use the pre-blur snapshot when available so a typed minute is not
    // normalized back to "00" before it can be committed.
    const hour = normalizePickerPart(
        draft?.hour ?? instance.hourElement?.value,
        23
    );
    const minute = normalizePickerPart(
        draft?.minute ?? instance.minuteElement?.value,
        59
    );

    if (hour === null || minute === null) {
        return false;
    }

    const formatted = `${hour}:${minute}`;
    const valueChanged = instance.input.value !== formatted;

    instance.hourElement.value = hour;
    instance.minuteElement.value = minute;
    instance.setDate(formatted, triggerChange && valueChanged, "H:i");
    return true;
}

function restorePickerValue(instance, originalValue) {
    if (originalValue) {
        instance.setDate(originalValue, false, "H:i");
    } else {
        instance.clear(false);
        showEmptyTimeParts(instance);
    }
}

const fpInstance = flatpickr("#alarmTimeWrap", {

        queueMicrotask(() => {
            // Prefer the values captured on outside pointerdown. Flatpickr's
            // blur handler may already have overwritten the minute by now.
            if (commitPickerParts(instance, true, closingDraft)) {
                return;
            }

            restorePickerValue(instance, originalValue);
        });
    },
    
    onReady: function(selectedDates, dateStr, instance) {
        instance.__rawTimeValue = "";
        instance.__openTimeValue = instance.input.value;
        instance.__pickerEdited = false;
        instance.__mainInputEdited = false;

        const hourInput = instance.hourElement;
        const minuteInput = instance.minuteElement;
        const calendar = instance.calendarContainer;

        /*
         * Flatpickr closes on an outside mouse action. Capture both visible
         * fields on pointerdown, before the focused minute input blurs and
         * Flatpickr normalizes it. onClose then commits this exact snapshot.
         */
        document.addEventListener('pointerdown', function(e) {
            if (!instance.isOpen || calendar.contains(e.target)) return;

            instance.__closingTimeDraft = {
                hour: hourInput?.value ?? "",
                minute: minuteInput?.value ?? ""
            };
        }, true);

        [hourInput, minuteInput].filter(Boolean).forEach(part => {
            part.placeholder = "--";
            part.__homeTimeInstance = instance;
            part.__homeUserEdited = false;

            part.addEventListener("input", function(e) {
                if (!e.isTrusted) return;

                part.__homeUserEdited = true;
                instance.__pickerEdited = true;
            }, true);

            part.addEventListener("keydown", function(e) {
                if (
                    e.isTrusted &&
                    (e.key === "ArrowUp" || e.key === "ArrowDown")
                ) {
                    part.__homeUserEdited = true;
                    instance.__pickerEdited = true;
                }
            }, true);
        });

        const blockEmptyNormalization = function(e) {
            const isTimePart =
                e.target === hourInput ||
                e.target === minuteInput;

            if (!isTimePart) return;

            e.stopPropagation();
            e.stopImmediatePropagation();
        };

        calendar.addEventListener("blur", blockEmptyNormalization, true);
        calendar.addEventListener("change", blockEmptyNormalization, true);

        /*
         * Home uses one alarm picker and Flatpickr's own capture-phase blur
         * handler is registered before onReady.  Therefore a later blur
         * listener alone cannot prevent the library from briefly writing
         * 00:00 while focus moves between the two empty number inputs.
         *
         * Snapshot the real main value before every internal pointer action
         * and restore only that main value after Flatpickr's default focus
         * processing.  Do not reset the hour/minute drafts: genuine user
         * input can still be committed by Home's existing close/Enter flow.
         */
        const protectMainValueDuringPickerClick = function(e) {
            const target = e.target;
            const isInsideTimeControl =
                target === calendar ||
                Boolean(target?.closest?.('.flatpickr-time'));

            if (!isInsideTimeControl) return;

            const protectedValue = instance.__openTimeValue || "";

            queueMicrotask(() => {
                if (!instance.isOpen) return;

                if (instance.input.value !== protectedValue) {
                    instance.input.value = protectedValue;
                }
            });
        };

        calendar.addEventListener(
            'pointerdown',
            protectMainValueDuringPickerClick,
            true
        );

        // A click on the one-pixel input frame targets numInputWrapper rather
        // than the number input. Treat that frame as part of the input and
        // stop Flatpickr from interpreting it as an increment/normalization.
        const redirectTimeFrameClick = function(e) {
            const target = e.target;
            const wrapper = target?.closest?.('.numInputWrapper');

            if (
                !wrapper ||
                !calendar.contains(wrapper) ||
                target === hourInput ||
                target === minuteInput
            ) {
                return;
            }

            const part = wrapper.querySelector(
                'input.flatpickr-hour, input.flatpickr-minute'
            );

            if (!part) return;

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            if (e.type === 'pointerdown') {
                part.focus({ preventScroll: true });
                part.select();
            }
        };

        // Padding between the fields and the outer glass frame has no action.
        // Prevent it from blurring the active input.
        const blockTimeChromeClick = function(e) {
            const target = e.target;
            const isTimeChrome =
                target === calendar ||
                Boolean(target?.closest?.('.flatpickr-time'));

            if (!isTimeChrome) return;
            if (target.closest?.('input.flatpickr-hour, input.flatpickr-minute')) return;
            if (target.closest?.('.numInputWrapper')) return;

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
        };

        ['pointerdown', 'mousedown', 'click'].forEach(eventName => {
            calendar.addEventListener(eventName, redirectTimeFrameClick, true);
            calendar.addEventListener(eventName, blockTimeChromeClick, true);
        });

        calendar.addEventListener("keydown", function(e) {
            const target = e.target;

            if (
                e.key !== "Enter" ||
                (target !== hourInput && target !== minuteInput)
            ) {
                return;
            }

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            if (target === hourInput) {
                const hour = normalizePickerPart(hourInput.value, 23);

                if (hourInput.value && hour === null) {
                    hourInput.select();
                    return;
                }

                if (hour !== null) {
                    hourInput.value = hour;
                    hourInput.__homeUserEdited = true;
                    instance.__pickerEdited = true;
                }

                minuteInput.focus();
                minuteInput.select();
                return;
            }

            const minute = normalizePickerPart(minuteInput.value, 59);

            if (minuteInput.value && minute === null) {
                minuteInput.select();
                return;
            }

            if (minute !== null) {
                minuteInput.value = minute;
                minuteInput.__homeUserEdited = true;
                instance.__pickerEdited = true;
            }

            commitPickerParts(instance, true);
            instance.close();

            setTimeout(() => alarmNameInput.focus(), 60);
        }, true);

        showEmptyTimeParts(instance);

        const flatpickrEnterHook = function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                e.stopImmediatePropagation();

                if (e.target.value) {
                    forceTimeFormat(instance, e.target.value);
                }

                instance.close();

                if (e.ctrlKey || e.metaKey) {
                    setTimeout(() => addAlarm(), 60);
                } else {
                    setTimeout(() => alarmNameInput.focus(), 60);
                }
            } else if (e.key !== "Tab") {
                e.stopImmediatePropagation();
            }
        };

        instance.input.addEventListener("keydown", flatpickrEnterHook, true);

        instance.input.addEventListener("input", function () {
            instance.__rawTimeValue = this.value;
            instance.__mainInputEdited = true;
        }, true);

        instance.input.addEventListener('blur', function() {
            const raw = instance.__rawTimeValue;

            if (/^\d{3,4}$/.test(raw)) {
                forceTimeFormat(instance, raw);
            } else {
                forceTimeFormat(instance, this.value);
            }

            instance.__rawTimeValue = "";
        }, true);
    }
});

        alarmAudio.addEventListener('ended', () => {

                alarmPlayCount++;
                alarmAudio.currentTime = 0; // 强制重置播放进度, 防止部分音频格式后续 play() 失败

            } else {

        });
    }
    return alarmAudio;
}

        alarmAudio.currentTime = 0;

// ================== Microsoft To Do 智能解析引擎 (Web Worker 驱动) ==================
let dataWorkerInstance = null;
let workerTaskId = 0;
const workerPromises = new Map();

function getDataWorker() {
  if (!dataWorkerInstance) {
    dataWorkerInstance = new Worker('data_worker.js');
    dataWorkerInstance.onmessage = function(e) {
      const { taskId, success, result, error } = e.data;
      if (workerPromises.has(taskId)) {
        const { resolve, reject } = workerPromises.get(taskId);
        workerPromises.delete(taskId);
        if (success) resolve(result);
        else reject(new Error(error));
      }
    };
  }
  return dataWorkerInstance;
}

function runWebWorker(worker, action, payload = {}) {
  return new Promise((resolve, reject) => {
    const taskId = ++workerTaskId;
    workerPromises.set(taskId, { resolve, reject });
    worker.postMessage({ taskId, action, payload });
  });
}

async function parseToDo() {
    const text = DOM.todoInput.value.trim();
    if (!text) { customAlert("请先粘贴 To Do 列表文本!", "内容为空", "Write_In"); return; }

    const existingHubData = JSON.parse(localStorage.getItem('taskhub_data') || '[]');
    const existingFlowData = JSON.parse(localStorage.getItem('taskflow_data') || '{}');
    const existingMapping = JSON.parse(localStorage.getItem('alpha_task_mapping') || '{}');

    try {
        const res = await runWebWorker(getDataWorker(), 'parse_todo', {
            text,
            existingHubData,
            existingFlowData,
            existingMapping
        });

        if (res.error) {
            customAlert(res.error, "内容为空", "Write_In");
            return;
        }

        const { hubData, flowData, mapping, addedHub, addedFlow } = res;

        localStorage.setItem('taskhub_data', JSON.stringify(hubData));
        localStorage.setItem('taskflow_data', JSON.stringify(flowData));
        if (mapping) {
            localStorage.setItem('alpha_task_mapping', JSON.stringify(mapping));
        }

        DOM.todoInput.value = '';
        DOM.todoInput.style.height = '200px'; 
        delete DOM.todoInput.dataset.userResized; 
        delete DOM.todoInput.dataset.lastTargetHeight;
        
        customAlert(`解析完成!<br><br>新增待办计划 (Hub): <b>${addedHub}</b> 项<br>新增已完结记录 (Flow): <b>${addedFlow}</b> 项`, "导入成功", "Congratulations");
    } catch (e) {
        console.error("To-Do Web Worker 解析失败", e);
        customAlert("解析失败: " + (e.message || e), "解析异常", "Error");
    }
}

function renderAlarms() {
    const list = DOM.alarmList;
    // 确保列表时间排序正确
    alarms.sort((a, b) => a.time.localeCompare(b.time));
    
    // 增量 DOM 渲染: 不销毁已有元素, 防止已存在的闹钟重新播放入场动画
    
    // 1. 安全移除已不存在的数据节点
    Array.from(list.children).forEach(child => {
        const id = child.id.replace('alarm-', '');
        if (!alarms.find(a => String(a.id) === String(id)) && !child.classList.contains('removing')) {
            child.remove();
        }
    });

    // 2. 插入新闹钟并校准排序
    alarms.forEach((al, index) => {
        let itemEl = document.getElementById(`alarm-${al.id}`);
        if (!itemEl) {
            itemEl = document.createElement('div');
            itemEl.className = 'alarm-item';
            itemEl.id = `alarm-${al.id}`;
            itemEl.innerHTML = `
                <div class="alarm-time">${al.time}</div>
                <div class="alarm-name">${al.name}</div>
                <button type="button" class="alarm-del" onclick="deleteAlarm('${al.id}')" title="删除日程" aria-label="删除日程">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x" style="pointer-events: none; display: block;"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            `;
            list.appendChild(itemEl);
        }
        // 若当前 DOM 排序不正确, 则通过 insertBefore 强制触发浏览器重排
        if (list.children[index] !== itemEl) {
            list.insertBefore(itemEl, list.children[index]);
        }
    });
}

function addAlarm() {
    // 传入正确的 fpInstance 对象, 而不是 DOM 节点
    forceTimeFormat(fpInstance, alarmTimeInput.value);
    
    const time = alarmTimeInput.value;
    const name = alarmNameInput.value.trim() || "日程提醒";
    if (!time) { customAlert("请先选择或输入闹钟时间!", "缺失时间", "Warning"); return; }
    
    alarms.push({ id: String(Date.now()), time, name, triggeredDay: '' });
    localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
    syncAlarmsToMain();
    alarmNameInput.value = '';
    
    // 添加成功后, 把焦点还给时间输入框, 方便连续添加
    fpInstance.clear();
    alarmTimeInput.focus();
    
    renderAlarms();
}

function deleteAlarm(id) {
    const itemEl = document.getElementById(`alarm-${id}`);
    if (itemEl) {
        itemEl.classList.add('removing');
        // 等待 400ms (与更新后的 CSS 离场动画时长对齐)
        setTimeout(() => {
            alarms = alarms.filter(a => String(a.id) !== String(id));
            localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
            syncAlarmsToMain();
            itemEl.remove(); 
        }, 400); 
    } else {
        alarms = alarms.filter(a => String(a.id) !== String(id));
        localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
        syncAlarmsToMain();
        renderAlarms();
    }
}
