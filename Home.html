<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>主页</title>
<link rel="icon" href="Icon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<base href="./">
<style>
/* ================== 全局与动态色彩体系 ================== */
@property --theme-hue {
    syntax: '<number>';
    inherits: true;
    initial-value: 210;
}
@property --theme-sat {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 20%;
}
@property --theme-light {
    syntax: '<percentage>';
    inherits: true;
    initial-value: 85%;
}

:root {
    transition: 
        --theme-hue 0.8s cubic-bezier(0.22, 1, 0.36, 1), 
        --theme-sat 0.8s cubic-bezier(0.22, 1, 0.36, 1), 
        --theme-light 0.8s cubic-bezier(0.22, 1, 0.36, 1);

    /* 默认主题色 (动态取色) */
    --theme-hue: 210;
    --theme-sat: 20%;
    --theme-light: 85%;
    
    --text: #0f172a; 
    --text-sub: #313651;
    --sub: #64748b;
    
    /* 根据主题色生成的动态 Liquid Glass 颜色 */
    --dyn-bg: hsl(var(--theme-hue), var(--theme-sat), 96%);
    --dyn-panel: hsla(var(--theme-hue), var(--theme-sat), 98%, 0.45);
    --dyn-panel-border: hsla(var(--theme-hue), var(--theme-sat), 100%, 0.6);
    --dyn-primary: linear-gradient(135deg, hsla(var(--theme-hue), 50%, 85%, 0.85), hsla(var(--theme-hue), 60%, 88%, 0.85));
    --dyn-primary-hover: linear-gradient(135deg, hsla(var(--theme-hue), 50%, 90%, 0.95), hsla(var(--theme-hue), 60%, 93%, 0.95));
    --dyn-shadow: hsla(var(--theme-hue), 25%, 55%, 0.12);

    --glass: var(--dyn-panel);
    --glass-border: var(--dyn-panel-border);

    --shadow-xl: 0 40px 80px rgba(15,23,42,.08);
    --shadow-sm: 0 8px 20px rgba(15,23,42,.04);

    --spacing-main: 32px;   /* Panel 级内边距 */
    --spacing-card: 24px;   /* Card 级内边距 */
    --spacing-inside: 16px; /* 元素级内边距 */
    
    /* 4 级同心圆角体系 (Concentric Radius System) */
    --radius-panel: 32px;   /* L1: 主面板、侧边栏、全局弹窗 (原 main) */
    --radius-card: 24px;    /* L2: 任务卡片、图表容器、侧边小卡 */
    --radius-element: 16px; /* L3: 按钮、输入框、视图切换器 (独立出来) */
    --radius-sm: 10px;      /* L4: 内部小标签、日历箭头、下拉项 */

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'OPPO Sans 4.0', -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    outline: none !important; -webkit-tap-highlight-color: transparent;
}

html { scroll-behavior: smooth; overflow-y: auto; overflow-x: hidden; }

::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
/* 自适应的选中文字颜色 */
::selection { background-color: hsla(var(--theme-hue), 60%, 80%, 0.6); color: #0f172a; }
::-moz-selection { background-color: hsla(var(--theme-hue), 60%, 80%, 0.6); color: #0f172a; }

body {
    min-height: 100vh; color: var(--text);
    background: var(--dyn-bg);
    transition: background 1s ease;
    display: flex; flex-direction: column;
    scrollbar-width: none; -ms-overflow-style: none;
}

body > *:not(script):not(style):not(link):not(.sphere-modal):not(.flatpickr-calendar):not(#alphaTooltip) {
    animation: alphaPageIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes alphaPageIn {
    0% {
        opacity: 0;
        /* 改成负值 (-120px), 让界面从屏幕顶部优雅降落下来 */
        transform: translateY(-120px) scale(0.96); 
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ================== 上半部分: 动态壁纸区 ================== */
.hero-wallpaper {
    position: relative; width: 100%; height: 45vh; min-height: 300px;
    background-color: #e2e8f0; background-size: cover; background-position: center;
    
    /* 使用线性渐变蒙版, 让壁纸底部 35% 的区域平滑渐隐至完全透明 */
    -webkit-mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
    
    /* 接入动态透明度变量, 防止深色壁纸边缘出现廉价的突兀泛白 */
    box-shadow: inset 0 -40px 100px -20px hsla(var(--theme-hue), var(--theme-sat), 96%, var(--wp-glow-opacity, 1));
    transition: box-shadow 1s ease, background-image 0.5s ease;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 40px 40px 80px 40px; 
}
.hero-wallpaper::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1; /* 盖在壁纸图层上, 置于时钟图层之下 */
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0) 100%);
    backdrop-filter: blur(40px) saturate(120%);
    -webkit-backdrop-filter: blur(40px) saturate(120%);
    -webkit-mask-image: linear-gradient(135deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
    mask-image: linear-gradient(135deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 80%);
    pointer-events: none;
    /* 将遮罩退场改为 0.4s, 与时钟的 0.5s 形成 0.1s 的景深错落感 */
    transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.hero-wallpaper.no-clock::before { 
    opacity: 0; 
    backdrop-filter: blur(0px) saturate(100%);
    -webkit-backdrop-filter: blur(0px) saturate(100%);
}
.hero-wallpaper::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 40%, var(--dyn-bg) 100%);
    pointer-events: none;
}


/* ================== 下半部分: 功能区 ================== */
.home-layout {
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-main);
    width: 100%; max-width: 1600px; margin: -60px auto 40px auto; padding: 0 40px;
    position: relative; z-index: 10;
}
/* ==========================================
   统一 TaskFlow 响应式布局规范 (1050px / 768px)
   ========================================== */
@media (max-width: 1050px) {
    .hero-wallpaper { padding: 32px 32px 70px 32px !important; }
    .home-layout {
        grid-template-columns: 1fr !important;
        padding: 0 !important;
        margin: -50px auto 32px auto !important;
        gap: 32px !important;
        max-width: 1600px !important;
    }
    .panel { padding: 32px !important; gap: 20px !important; }
    .nav-card { padding: 24px 20px !important; }
    .alarm-item { padding: 16px 20px !important; }
    .home-clock { padding: 16px 24px !important; }
}

@media (max-width: 768px) {
    .hero-wallpaper {
        padding: 24px 16px 50px 16px !important;
        height: auto !important;
        min-height: 220px !important;
    }
    .home-layout {
        padding: 0 16px !important;
        margin: -30px auto 24px auto !important;
        gap: 16px !important;
    }
    .panel { padding: 24px !important; gap: 16px !important; }
    .nav-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 16px !important; }
    .nav-card { padding: 20px 16px !important; }
    .alarm-item { padding: 14px 16px !important; }
    .home-clock { padding: 14px 20px !important; }
    textarea#todoInput { padding: 14px 16px !important; }
}

.panel, .nav-card, #todoPanel {
  will-change: transform, opacity;
  transform: translateZ(0); /* 迫使显卡在独立缓存区渲染 blur(50px), 不参与主线程布局计算 */
  contain: paint, layout;   /* 局限化重绘边界, 防止渲染溢出 */
}

.panel {
    background: linear-gradient(135deg, hsla(var(--theme-hue), var(--theme-sat), 96%, 0.75) 0%, hsla(var(--theme-hue), var(--theme-sat), 96%, 0.5) 100%) !important;

    box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.18),
        0 18px 52px rgba(255, 255, 255, 0.22),
        0 24px 64px rgba(15, 23, 42, 0.045),
        inset 0 2px 7px rgba(255, 255, 255, 0.48),
        inset 0 1px 1px rgba(255, 255, 255, 0.92),
        inset 1.5px 0 2px rgba(255, 255, 255, 0.12) !important;

    backdrop-filter: blur(40px) saturate(130%) !important; -webkit-backdrop-filter: blur(40px) saturate(130%) !important;
    /* 采用更具液态光泽的渐变半透明, 代替单一的纯色 */
    
    border-top: 1.5px solid var(--glass-border);
    border-left: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    border-bottom: 1px solid var(--glass-border);
                
    border-radius: var(--radius-panel); 
    padding: 32px;
    transition: background 0.8s ease, transform 0.8s ease, backdrop-filter 0.8s ease, box-shadow 0.8s ease; will-change: backdrop-filter, transform;
    display: flex; 
    flex-direction: column; 
    gap: 20px;
}
.section-title { font-size: 24px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 10px; }

.home-layout > .panel:first-child {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    height: 100%; /* 强迫左侧卡片物理高度与右侧 Grid 轨道保持绝对一致 */
}

/* ================== 文本框/输入框公共属性 ================== */
textarea, textarea#todoInput, input[type="text"] {
    width: 100%;
    border-radius: var(--radius-element);
    color: #0f172a; 
    font-size: 15px; 
    font-weight: 600; 
    line-height: 1.6;
    resize: none;
    transition: background 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}

/* ================== 隔离 精准控制两层描边 ================== */

/* 左侧「方法指南」文本框: 让它独自继承完美的2层白色光学描边, 作为动画过渡起点 */
textarea#todoInput {
    /* 剥除 flex-grow, 防止过度拉伸吃掉低于剩余空间的回弹动画 */
    flex: 0 0 auto; 
    /* 让下外边距自动吸收父级的剩余高度, 彻底解放文本框自身的物理高度限制 */
    margin-bottom: auto; 
    
    height: 200px; 

    transition: height 0.4s cubic-bezier(0.34, 1.45, 0.64, 1), background 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease) !important;

    padding: 16px 20px; 
    background: rgba(255, 255, 255, 0.40);
    overflow-y: hidden; 

    /* 彻底剥除 4px 的白色软包常驻外圈, 仅保留内阴影, 把双圈效果留给 focus 状态 */
    border-top: 2px solid rgba(255, 255, 255, 0.95) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.8) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.35) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25) !important;
    box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.05), inset 0 -1px 1.5px rgba(255, 255, 255, 0.45) !important;
}

/* 2 右侧「普通单行输入框」: 彻底删除多余的白色软包, 保持 Liquid Glass 干净隐形状态 */
input[type="text"] {
    height: 50px;
    padding: 0 20px;
    background: rgba(255, 255, 255, 0.30);

    /* 剥除白色软包, 隐形状态 */
    border: 1px solid transparent !important;
    box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.05), inset 0 -1px 1.5px rgba(255, 255, 255, 0.45) !important;
    transition: background 0.35s var(--ease), border-color 0.35s var(--ease), box-shadow 0.35s var(--ease);
}

input::placeholder, textarea::placeholder { color: #748091; font-weight: 500; }
input:hover, textarea:hover, textarea#todoInput:hover { background: rgba(255, 255, 255, 0.9); }
input:focus, textarea:focus {
    background-color: #ffffff !important;
    border-color: rgba(157, 210, 255, 0.4) !important;
    box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 1), 
        inset 0 -1px 2px rgba(157, 210, 255, 0.1),
        0 0 0 1px rgba(157, 210, 255, 0.2), 
        0 0 8px 3px rgba(157, 210, 255, 0.15),
        0 8px 20px rgba(157, 210, 255, 0.1),
        0 12px 24px rgba(15, 23, 42, 0.08) !important;
}

/* 聚焦状态: 双圈随动变色系统 */
input:focus, textarea:focus, textarea#todoInput:focus { 
    background-color: #ffffff !important;
    border-color: hsla(var(--theme-hue), 60%, 75%, 0.4) !important;
    box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 1), 
        inset 0 -1px 2px hsla(var(--theme-hue), 60%, 75%, 0.1),
        0 0 0 1px hsla(var(--theme-hue), 60%, 75%, 0.2), 
        0 0 8px 3px hsla(var(--theme-hue), 60%, 75%, 0.15), 
        0 8px 20px hsla(var(--theme-hue), 60%, 75%, 0.1),
        0 12px 24px var(--dyn-shadow) !important; 
}

/* ================== 按钮动效系统升级 ================== */
button, upload-label {
    position: relative; overflow: hidden; display: inline-flex; height: 52px; border: none;
    align-items: center; justify-content: center; padding: 0 24px;
    border-radius: var(--radius-element); cursor: pointer; font-size: 16px !important; font-weight: 700 !important; 
    /* 极致顺滑的过渡: 使用弹性阻尼曲线, 保留 transform 硬件加速 */
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s ease, box-shadow 0.3s ease; 
    outline: none; letter-spacing: 0.5px;
    will-change: transform, box-shadow; 
}

/* 废弃原先粗暴的 ::before 伪元素高光, 改用更优雅的多重 background */
button::before { display: none; }
button:active { transform: scale(0.96) !important; }

/* ------------------------------------------------
   1. Primary (同色边缘折射版 - 动态取色适配)
------------------------------------------------ */
.primary {
    border: 1px solid rgba(217, 237, 254, 0.85);
    background: 
        radial-gradient(circle at 85% 15%, rgba(255, 250, 240, 0.35) 0%, transparent 60%),
        linear-gradient(135deg, hsla(var(--theme-hue), 71%, 88%, 0.75) 0%, hsla(var(--theme-hue), 80%, 72%, 0.45) 100%);
    color: #0f172a; 
    box-shadow: 
        0 6px 20px hsla(var(--theme-hue), 70%, 68%, 0.2), 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.75), 
        inset -1px -1px 2px rgba(255, 255, 255, 0.3), 
        0 0 0 0.5px hsla(var(--theme-hue), 92%, 97%, 0.85); 
    backdrop-filter: blur(16px) saturate(180%); 
    -webkit-backdrop-filter: blur(16px) saturate(180%);
}

.primary:hover { 
    background: 
        radial-gradient(circle at 85% 15%, rgba(255, 250, 240, 0.55) 0%, transparent 65%),
        linear-gradient(135deg, hsla(var(--theme-hue), 80%, 84%, 0.95) 0%, hsla(var(--theme-hue), 80%, 78%, 0.55) 100%);
    transform: translateY(-2px); 
    
    box-shadow: 
        0 12px 24px hsla(var(--theme-hue), 70%, 68%, 0.3), 
        inset 0 2px 3px rgba(255, 255, 255, 1), 
        inset -1px -1px 2px rgba(255, 255, 255, 0.30),
        /* 悬浮时呈现带有一点点主题色调的高透霜白色 */
        0 0 0 1.5px hsla(var(--theme-hue), 90%, 96%, 0.9); 
}

.primary:active {
    background: 
        radial-gradient(circle at 85% 15%, rgba(255, 250, 240, 0.2) 0%, transparent 40%),
        /* 点击时渐变色稍稍加深, 模拟手指按压遮光效果 */
        linear-gradient(135deg, hsla(var(--theme-hue), 80%, 76%, 0.75) 0%, hsla(var(--theme-hue), 80%, 70%, 0.35) 100%);
    
    /* 回弹动画 */
    transform: translateY(0px) scale(0.98); 
    
    box-shadow: 
        0 2px 6px hsla(var(--theme-hue), 70%, 68%, 0.1), 
        inset 0 3px 6px rgba(15, 23, 42, 0.08), 
        inset 0 1px 1px rgba(255, 255, 255, 0.30),
        /* 按下时高透边缘折射环跟随同步变暗, 贴合物理深陷阴影 */
        0 0 0 1px hsla(var(--theme-hue), 80%, 78%, 0.6);
}

/* ------------------------------------------------
   2. Secondary (清透玻璃) - 微调适配
------------------------------------------------ */
.secondary {
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.11) 45%, transparent 75%) !important;
    border-top: 2px solid rgba(255, 255, 255, 0.95) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.8) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.35) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25) !important;
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 2px 3px 10px rgba(255, 255, 255, 0.35), inset -2px -3px 10px rgba(0, 0, 0, 0.03), inset 4px 6px 20px rgba(255, 255, 255, 0.15) !important;
    backdrop-filter: blur(40px) saturate(130%) !important; -webkit-backdrop-filter: blur(40px) saturate(130%) !important;
    color: var(--monet-text, #2F354F);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), background 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
}

.secondary:hover {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.3) 100%) !important;
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.40); border-width: 1.5px;
    box-shadow: 
        0 12px 28px rgba(15, 23, 42, 0.07), 
        inset 0 2px 3.5px rgba(255, 255, 255, 1), 
        inset 0 -1px 2px rgba(255, 255, 255, 0.20), 
        0 0 0 1.25px rgba(255, 255, 255, 0.95);
}

.secondary:active { background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.3) 100%);
    transform: scale(0.96) translateY(0px);
    box-shadow: 
        0 2px 6px rgba(15, 23, 42, 0.03), 
        inset 0 3px 6px rgba(15, 23, 42, 0.05), 
        inset 0 1px 1px rgba(255, 255, 255, 0.30),
        0 0 0 1px rgba(226, 232, 240, 0.6);
}

/* ------------------------------------------------
   3. Danger (警示红) - 同色边缘折射版
------------------------------------------------ */
.danger {
    background: 
        radial-gradient(circle at 85% 15%, rgba(255, 235, 230, 0.2) 0%, transparent 50%),
        linear-gradient(135deg, rgba(250, 66, 62, 0.75) 0%, rgba(220, 38, 38, 0.45) 100%); 
    color: #ffffffeb; 
    box-shadow: 
        0 6px 20px rgba(174, 46, 46, 0.2), 
        inset 0 1.5px 2px rgba(255, 255, 255, 0.5), 
        inset -1px -1px 2px rgba(0, 0, 0, 0.08),
        0 0 0 0.5px rgba(255, 199, 199, 0.75); 
    backdrop-filter: blur(16px) saturate(180%); 
    -webkit-backdrop-filter: blur(16px) saturate(180%);
}

.danger:hover { 
    background: 
        radial-gradient(circle at 85% 15%, rgba(255, 235, 230, 0.45) 0%, transparent 65%),
        linear-gradient(135deg, rgba(248, 113, 113, 0.95) 0%, rgba(239, 68, 68, 0.7) 100%); 
    transform: translateY(-2px); 
    box-shadow: 
        0 10px 24px rgba(239, 68, 68, 0.3), 
        inset 0 2px 3px rgba(255, 255, 255, 0.75), 
        inset -1px -1px 2px rgba(0, 0, 0, 0.12),
        /* 将刺眼的亮红边, 改为带有一丝微粉的珍珠白 */
        0 0 0 1.5px rgba(255, 240, 240, 0.9); 
}

.danger:active {
    background: 
        linear-gradient(135deg, rgba(220, 38, 38, 0.75) 0%, rgba(185, 28, 28, 0.45) 100%);
    box-shadow: 
        0 2px 6px rgba(239, 68, 68, 0.1), 
        inset 0 3px 6px rgba(0, 0, 0, 0.15), 
        inset 0 1px 1px rgba(255, 255, 255, 0.10),
        /* 按下时压暗边缘红色 */
        0 0 0 1px rgba(220, 38, 38, 0.5);
}

/* ================== 桌面时钟引擎 (极限玻璃压榨版) ================== */
.home-clock {
    position: absolute; left: 24px; top: 24px;
    display: flex; align-items: center; justify-content: flex-start;
    font-variant-numeric: tabular-nums; 
    gap: 1.4px; 
    z-index: 1000;
    padding: 16px 24px; 
    border-radius: 24px;
    
    /* 移除 transform-origin, 让容器从中心自然呼吸缩放, 告别「从左进来」的错觉 */
    
    /* 确保剔除任何隐形背景, 与 settings.html 材质 100% 同步 */
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    
    /* 统一绑定 0.6s 物理阻尼曲线 */
    transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.hero-wallpaper.no-clock .home-clock { 
    opacity: 0; 
    filter: blur(40px); 
    /* 隐藏时退居右侧 32px 处, 出现时便会从偏右侧向左顺滑回弹进入 */
    transform: translateX(32px) scale(0.9); 
    pointer-events: none;
}

.home-clock .clock-digit-slot {
    position: relative; 
    /* 移除 overflow: hidden, 改为 visible, 允许上下退出时的文字和发光溢出容器边界 */
    overflow: visible; 
    display: flex; justify-content: center; align-items: center;
    font-size: 2.4rem; 
    font-weight: 700;
    /* 预留物理空间, 防止 absolute 后父容器塌陷 */
    width: 0.65em; 
    height: 1.1em;
}

.home-clock .clock-time-node {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: flex; justify-content: center; align-items: center;

    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent; 
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.20); 
    
    /* 让元素的消散（opacity/filter）与位移（transform）完美同频 0.6s */
    transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform, opacity, filter; 
}

.home-clock .hour-node {
    background-image: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(255, 255, 255, 0.40) 100%);
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.40); 
    text-shadow: 0 4px 16px rgba(255, 255, 255, 0.25); 
}

.home-clock .minute-node {
    background-image: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(255, 255, 255, 0.10) 100%);
    -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.20); 
    text-shadow: 0 2px 12px rgba(255, 255, 255, 0.28);
}

.home-clock .colon {
    background-image: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(255,255,255,0.1));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0; 
    margin-top: -0.25em;
    width: 0.55em; /* 缩小冒号专属容器宽度 */
    font-size: 1.8rem;
    font-weight: 600;
    animation: pulse-colon 2s infinite ease-in-out;
}

/* ================== 弹性动画 ================== */
/* 进入前: 在右侧 40px 处待命并缩小 */
.home-clock .clock-time-node.clock-enter { 
    opacity: 0; transform: translateY(80%) scale(0.9); filter: blur(40px);
}
/* 进场态: 回归中心点, 触发 cubic-bezier 回弹 */
.home-clock .clock-time-node.clock-enter-active { 
    opacity: 1; transform: translateY(0) scale(1); filter: blur(0px);
}
/* 离场态: 旧数字向正上方 80% 退出消散上浮 */
.home-clock .clock-time-node.clock-exit { 
    opacity: 0; transform: translateY(-80%) scale(0.9); filter: blur(40px);
}

@keyframes pulse-colon {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 0.2; transform: scale(0.85); }
}

/* ================== Flatpickr & Time 控件深度定制 ================== */

.flatpickr-calendar {

    border-top: 2px solid rgba(255, 255, 255, 0.95) !important;

    backdrop-filter: blur(40px) saturate(130%) !important; -webkit-backdrop-filter: blur(40px) saturate(130%) !important;
    /* 彻底锁定绝对定位与顶级图层, 防止计算坐标时发生弹跳 (滚哪里去了) */
    position: absolute !important;

    transform: translateY(-12px) scale(0.95) translateZ(0) !important;

    /* 移除容易导致图层崩溃的 will-change, 回归纯粹的阻尼过渡 */
    transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),

.flatpickr-calendar.open, .flatpickr-calendar.inline {

}

/* ================== 导航卡片区 ================== */
.nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 12px; }
.nav-card {
    background: linear-gradient(135deg, hsla(var(--theme-hue), var(--theme-sat), 100%, 0.70) 0%, hsla(var(--theme-hue), var(--theme-sat), 98%, 0.45) 100%);
    border: 1px solid hsla(var(--theme-hue), var(--theme-sat), 100%, 0.7);
    border-radius: var(--radius-card); 
    padding: 24px 20px; 
    text-decoration: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    transition: background 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
    will-change: transform;
    cursor: pointer;
    
    /* 补齐缺失的毛玻璃滤镜, 使其拥有真实的物理透视感 */
    backdrop-filter: blur(40px) saturate(130%);
    -webkit-backdrop-filter: blur(40px) saturate(130%);
    
    box-shadow: var(--shadow-sm), 
                inset 0 2px 4px hsla(var(--theme-hue), var(--theme-sat), 100%, 0.95), 
                inset 0 -2px 4px hsla(var(--theme-hue), var(--theme-sat), 100%, 0.4);
}
.nav-card:hover {

    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 16px 32px var(--dyn-shadow), 0 0 0 1px rgba(255, 255, 255, 1);
}
.nav-card:active {
    transform: translateY(0) scale(0.94) !important;
    transition: transform 0.08s ease-out !important;
}
@keyframes navCardBounce {
    0% { transform: translateY(0) scale(0.94); }
    50% { transform: translateY(-6px) scale(1.06); }
    100% { transform: translateY(-4px) scale(1.02); }
}
.nav-card.anim-bounce {
    animation: navCardBounce 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
}
.nav-card .icon { font-size: 36px; margin-bottom: 12px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }

.alarm-item {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.75); border: 0.5px solid rgba(255, 255, 255, 0.40);
    padding: 16px 20px; box-shadow: 0 4px 12px rgba(15,23,42,0.06), inset 0 2px 4px rgba(255,255,255,0.9);
    border-radius: var(--radius-element);
    margin-bottom: 12px; 
    
    /* 改用 ease-out, 用关键帧的物理尺寸溢出（Overshoot）来带 Panel */
    animation: alarmPopIn 0.5s ease-out forwards;
}
.alarm-item:last-child {
    margin-bottom: 0; 
}

.alarm-item.removing {
    animation: alarmPopOut 0.4s ease-in-out forwards;
    pointer-events: none;
}

/* 进场动画 */
@keyframes alarmPopIn {
    0% { 
        opacity: 0; transform: translateX(-16px) scale(0.95); 
        max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0; overflow: hidden;
    }
    /* 55% 阶段, 内边距和外边距被撑得比最终还要大, 把外层 Panel 顶长一点点 */
    55% { 
        opacity: 1; transform: translateX(4px) scale(1.01); 
        max-height: 100px; padding-top: 24px; padding-bottom: 24px; margin-bottom: 20px; border-width: 1px;
    }
    100% { 
        opacity: 1; transform: translateX(0) scale(1); 
        max-height: 80px; padding-top: 16px; padding-bottom: 16px; margin-bottom: 12px; border-width: 1px; overflow: hidden;
    }
}

/* 离场动画 */
@keyframes alarmPopOut {
    0% { 
        opacity: 1; transform: scale(1) translateX(0); 
        max-height: 80px; padding-top: 16px; padding-bottom: 16px; margin-bottom: 12px; border-width: 1px; overflow: hidden;
    }
    /* 在被删除前，膨胀一下, 带动 Panel 伸长, 再塌陷 */
    30% {
        opacity: 1; transform: scale(1.02) translateX(-2px); 
        max-height: 100px; padding-top: 20px; padding-bottom: 20px; margin-bottom: 18px; border-width: 1px;
    }
    100% { 
        opacity: 0; transform: scale(0.9) translateX(16px); 
        max-height: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; border-width: 0; overflow: hidden;
    }
}

.alarm-item.ringing { animation: ringShake 0.5s ease infinite alternate; background: #fff3f3; border-color: #ffcaca; }
@keyframes ringShake { 0% { transform: translateX(-2px); } 100% { transform: translateX(2px); } }
.alarm-time { font-size: 18px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.alarm-name { font-size: 14px; font-weight: 600; color: var(--sub); flex: 1; margin: 0 16px; }
.alarm-del { cursor: pointer; color: #cbd5e1; font-weight: 800; transition: 0.2s; font-size: 18px; }
.alarm-del:hover { color: #f17875; transform: scale(1.1); }

/* 全局弹窗引擎 */
.sphere-modal {
    position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.25);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 1; visibility: visible; 
    
    /* 显式接管 backdrop-filter 过渡, 防止 GPU 盲目重绘 */
    transition: opacity 0.3s var(--ease), 
                backdrop-filter 0.3s var(--ease),
                -webkit-backdrop-filter 0.3s var(--ease),
                visibility 0s 0s;
                
    /* 提前宣告模糊度的变化, 并强制开启底层硬件加速 */
    will-change: opacity, backdrop-filter;
    transform: translateZ(0);
}

.sphere-modal.hidden {
    display: flex !important; 
    opacity: 0; 
    visibility: hidden; 
    pointer-events: none;
    
    /* 退出时将模糊度归零, 彻底释放底层渲染压力 */
    backdrop-filter: blur(0px); -webkit-backdrop-filter: blur(0px);
    
    transition: opacity 0.3s var(--ease), 
                backdrop-filter 0.3s var(--ease),
                -webkit-backdrop-filter 0.3s var(--ease),
                visibility 0s 0.3s;
}

.sphere-modal .modal-content,
.custom-alarm, .custom-alarm-modal, .custom-alarm-content {
    background: rgba(255, 255, 255, 0.75); 
    backdrop-filter: blur(40px) saturate(130%); -webkit-backdrop-filter: blur(40px) saturate(130%);
    border: 1px solid rgba(255, 255, 255, 0.85); 
    
    border-radius: var(--radius-panel); /* 保持卡片级圆角比例 */
    
    /* 升级为全局最高级留白 (32px), 让内容彻底呼吸 */
    padding: var(--spacing-main);
    
    /* 略微拓宽整体容器宽度, 补偿文字可用空间 */
    width: 360px; 
    max-width: calc(100vw - 32px);
    
    box-shadow: 0 24px 64px rgba(15,23,42,0.12), inset 0 2px 5px rgba(255, 255, 255, 0.85), inset 0 -1.5px 3px rgba(255, 255, 255, 0.10);
    
    will-change: transform, opacity;
    transform: translateY(0) scale(1) translateZ(0); 
    opacity: 1;
    
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.sphere-modal.hidden .modal-content {
    transform: translateY(24px) scale(0.92) translateZ(0); 
    opacity: 0;
    transition: transform 0.3s var(--ease),
                opacity 0.3s var(--ease);
}

/* Card Elements Glass Override */
.task-card, .side-card, .nav-card, .chart-card, .chart-wrap, .stats-card, .sphere-modal, .form-container, .alpha-menu, .flatpickr-calendar, .flatpickr-innerContainer, .alarm-modal, .modal, .dropdown, .context-menu, .progress-card, .info-card {
    background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.08) 45%, transparent 75%) !important;
    
      border-top: 2px solid rgba(255, 255, 255, 0.95) !important;
      border-left: 1px solid rgba(255, 255, 255, 0.8) !important;

<script>
// DOM 引用缓存 (减少重复查询) 
const DOM = {

    get dialogIcon()     { return this._dialogIcon  || (this._dialogIcon  = document.getElementById('dialogIcon')); },

    get alarmList()      { return this._alarmList    || (this._alarmList   = document.getElementById('alarmList')); },
    get alarmTime()      { return this._alarmTime    || (this._alarmTime   = document.getElementById('alarmTime')); },
    get alarmName()      { return this._alarmName    || (this._alarmName   = document.getElementById('alarmName')); },
    get ringtoneBtn()    { return this._ringtoneBtn  || (this._ringtoneBtn = document.getElementById('ringtoneBtn')); },
    get ringtoneInput()  { return this._ringtoneInput|| (this._ringtoneInput= document.getElementById('ringtoneInput')); },
    get wpInput()        { return this._wpInput      || (this._wpInput     = document.getElementById('wpInput')); },
    get heroWallpaper()  { return this._heroWallpaper|| (this._heroWallpaper= document.getElementById('heroWallpaper')); },
    get userAvatarPreview(){ return this._userAvatar  || (this._userAvatar  = document.getElementById('userAvatarPreview')); },
    _dialog: null, _dialogIcon: null, _dialogTitle: null, _dialogMsg: null,
    _dialogCancel: null, _dialogConfirm: null, _todoInput: null, _alarmList: null,
    _alarmTime: null, _alarmName: null, _ringtoneBtn: null, _ringtoneInput: null,
    _wpInput: null, _heroWallpaper: null, _userAvatar: null
};

// ================== 全局弹窗引擎 ==================
window.dialogConfirmCallback = null;
function customAlert(msg, title = "提示", icon = "💡", onClose = null) {
    DOM.dialogIcon.textContent = icon;
    DOM.dialogTitle.textContent = title;
    DOM.dialogMessage.innerHTML = msg;
    DOM.dialogCancelBtn.style.display = 'none';
    const confirmBtn = DOM.dialogConfirmBtn;
    confirmBtn.textContent = "我知道了";
    window.dialogConfirmCallback = () => {
        DOM.dialog.classList.add('hidden');
        if (onClose) onClose(); 
    };
    DOM.dialog.classList.remove('hidden');
}

// ================== 桌面时钟同步与壁纸引擎 ==================
const heroWallpaper = DOM.heroWallpaper;
const homeClock = document.getElementById('homeClock');

// 使用内存变量记录当前壁纸
let currentDisplayedWp = localStorage.getItem('alpha_wallpaper') || '';

// 3D 景深过渡引擎 (双层 rAF)
function runIOSBlurTransition(oldBgStr, newUrl, parentEl) {
    if (!parentEl) return;
    
    const container = document.createElement('div');
    // z-index: 0 保证位于内容之下但完美遮挡原来的背景图
    container.style = `position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; border-radius:inherit;`;
    
    const oldLayer = document.createElement('div');
    oldLayer.style = `position:absolute; inset:0; background:${oldBgStr} center/cover; opacity:1; filter:blur(0px); transform:scale(1); transition:opacity 0.6s ease, filter 0.6s ease, transform 0.8s cubic-bezier(0.22,1,0.36,1); z-index:1;`;
    
    const newLayer = document.createElement('div');
    newLayer.style = `position:absolute; inset:0; background:url("${newUrl}") center/cover; opacity:0; filter:blur(40px); transform:scale(1.08); transition:opacity 0.6s ease, filter 0.6s ease, transform 0.8s cubic-bezier(0.22,1,0.36,1); z-index:2;`;

    container.appendChild(oldLayer); container.appendChild(newLayer);
    parentEl.insertBefore(container, parentEl.firstChild);

    const originalIsolation = parentEl.style.isolation || '';
    parentEl.style.isolation = 'isolate';
    
    // 动画期间暂时清空父级原有背景, 由 container 接管展示
    parentEl.style.backgroundImage = 'none';

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            oldLayer.style.opacity = '0'; oldLayer.style.filter = 'blur(40px)'; oldLayer.style.transform = 'scale(0.96)';
            newLayer.style.opacity = '1'; newLayer.style.filter = 'blur(0px)'; newLayer.style.transform = 'scale(1)';
        });
    });

    setTimeout(() => {
        parentEl.style.backgroundImage = `url("${newUrl}")`;
        // 利用双重 rAF 等待浏览器真正把 backgroundImage 渲染上主屏幕后, 再卸载动画涂层, 彻底告别闪烁
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                parentEl.style.isolation = originalIsolation;
                container.remove();
            });
        });
    }, 850); 
}

function extractColorFromBase64(base64) {
    const img = new Image();
    img.onload = () => extractThemeColor(img);
    img.src = base64;
}

function extractThemeColor(img) {
    requestAnimationFrame(() => {
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
        canvas.width = 100; canvas.height = 100; ctx.drawImage(img, 0, 0, 100, 100);
        const data = ctx.getImageData(0, 0, 100, 100).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 4) {
            if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) continue;
            if (data[i] < 20 && data[i+1] < 20 && data[i+2] < 20) continue;
            r += data[i]; g += data[i+1]; b += data[i+2]; count++;
        }
        if (count === 0) return;
        r = Math.floor(r/count)/255; g = Math.floor(g/count)/255; b = Math.floor(b/count)/255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; } else {
            const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) { case r: h = (g - b) / d + (g < b ? 6 : 0); break; case g: h = (b - r) / d + 2; break; case b: h = (r - g) / d + 4; break; }
            h /= 6;
        }
        
        const hue = Math.round(h * 360);
        const rawSat = s * 100;
        let monetSat = 15 + (rawSat * 0.25); 
        if (monetSat > 35) monetSat = 35;
        
        const rawLight = l * 100;
        let monetLight = 86 + ((rawLight - 50) * 0.15);
        if (monetLight < 86) monetLight = 86;
        if (monetLight > 94) monetLight = 94;

        // 亮度感知
        let glowOpacity = (rawLight - 25) / 50; 
        if (glowOpacity < 0) glowOpacity = 0;
        if (glowOpacity > 1) glowOpacity = 1;

        document.documentElement.style.setProperty('--theme-hue', hue);
        document.documentElement.style.setProperty('--theme-sat', `${monetSat.toFixed(1)}%`);
        document.documentElement.style.setProperty('--theme-light', `${monetLight.toFixed(1)}%`);
        
        // 动态分发泛白抑制率
        document.documentElement.style.setProperty('--wp-glow-opacity', glowOpacity.toFixed(2));
    });
}

function syncWallpaper(animate = false) {
    const savedWp = localStorage.getItem('alpha_wallpaper');
    if (!savedWp) {
        document.documentElement.style.setProperty('--theme-hue', '210');
        return;
    }

    // 清理可能遗留的预加载遮罩
    const tempStyle = document.getElementById('temp-preload-wp');
    if (tempStyle) tempStyle.remove();

    // 只有在明确需要动画, 且新壁纸与「内存旧壁纸」不一样时, 才触发丝滑过渡
    if (animate && currentDisplayedWp && currentDisplayedWp !== savedWp) {
        runIOSBlurTransition(`url("${currentDisplayedWp}")`, savedWp, heroWallpaper);
    } else {
        // 无动画硬加载（首次打开网页时触发, 杜绝闪烁）
        heroWallpaper.style.backgroundImage = `url("${savedWp}")`;
    }
    
    // 更新内存状态锁
    currentDisplayedWp = savedWp;
    
    if (typeof extractColorFromBase64 === 'function') {
        extractColorFromBase64(savedWp);
    }
}

// ================== 桌面时钟渲染逻辑 ==================
// 1. 初始化插槽式 DOM 结构
homeClock.innerHTML = `
    <div class="clock-digit-slot" id="home-slot-h1"></div>
    <div class="clock-digit-slot" id="home-slot-h2"></div>
    <div class="clock-digit-slot colon">
        <div class="clock-time-node" style="position: relative; opacity: 1; filter: blur(0px); transform: none;">:</div>
    </div>
    <div class="clock-digit-slot" id="home-slot-m1"></div>
    <div class="clock-digit-slot" id="home-slot-m2"></div>
`;

// 独立的状态树, 追踪时间变更, 避免无效重排
let homeDigitsState = {
    'home-slot-h1': '', 'home-slot-h2': '',
    'home-slot-m1': '', 'home-slot-m2': ''
};

function updateHomeClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    
    // 映射当前时间到对应的 DOM 插槽
    const timeMappings = [
        { id: 'home-slot-h1', val: h[0], typeClass: 'hour-node' },
        { id: 'home-slot-h2', val: h[1], typeClass: 'hour-node' },
        { id: 'home-slot-m1', val: m[0], typeClass: 'minute-node' },
        { id: 'home-slot-m2', val: m[1], typeClass: 'minute-node' }
    ];

    timeMappings.forEach(item => {
        if (homeDigitsState[item.id] !== item.val) {
            const slot = document.getElementById(item.id);
            if (!slot) return;
            
            const isInitialRender = homeDigitsState[item.id] === '';

            // 1. 处理旧数字节点: 打上离场标签 (上浮并高斯模糊消散)
            if (!isInitialRender) {
                const oldNodes = slot.querySelectorAll('.clock-time-node');
                oldNodes.forEach(node => {
                    node.classList.remove('clock-enter-active', 'clock-enter');
                    node.classList.add('clock-exit');
                    // 等待 600ms (动画结束后) 从物理 DOM 树中销毁
                    setTimeout(() => node.remove(), 600);
                });
            }

            // 2. 创建新数字节点
            const newNode = document.createElement('div');
            newNode.textContent = item.val;
            newNode.className = `clock-time-node ${item.typeClass}`;
            
            if (isInitialRender) {
                // 首屏渲染: 拒绝任何附加类与延迟, 直接物理降落到终态, 清爽无动画
                slot.appendChild(newNode);
            } else {
                // 状态更新: 赋予右侧初始隐藏态
                newNode.classList.add('clock-enter');
                slot.appendChild(newNode);

                // 强行触发浏览器重排 (Reflow), 剥离连续渲染帧
                void newNode.offsetWidth;

                // 移除初始态, 触发向左物理回弹动画
                newNode.classList.remove('clock-enter');
                newNode.classList.add('clock-enter-active');
            }
            
            homeDigitsState[item.id] = item.val;

        }
    });
}

// 2. 启动引擎
let homeClockTimeout = null;
function scheduleNextClockUpdate() {
    const now = new Date();
    // 精确计算到下一分钟 00 秒所需要的毫秒数，防止轮询，直接对接下一次分钟切换的完美节点
    const msUntilNextMinute = 60000 - (now.getSeconds() * 1000 + now.getMilliseconds());
    homeClockTimeout = setTimeout(() => {
        updateHomeClock();
        checkAlarms();
        scheduleNextClockUpdate();
    }, msUntilNextMinute);
}
// 初始加载时立即执行一次以展示当前时间，然后再开始进入精准定时
updateHomeClock();
scheduleNextClockUpdate();

function checkAlarms() {
    const now = new Date();
    const currentHM = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const todayStr = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
    if (!alarms) return;
    alarms.forEach(al => {
        if (al.time === currentHM && al.triggeredDay !== todayStr) {
            al.triggeredDay = todayStr;
            localStorage.setItem('alpha_alarms', JSON.stringify(alarms));

// ================= 强制时间格式化与焦点引擎 =================
function forceTimeFormat(instance, val) {
    if (!val || !instance) return false;
    let raw = val.replace(/\D/g, ""); 
    if (raw.length < 3) return false; 
    
    let h = null, m = null;
    if (raw.length === 3) { h = raw.slice(0, 1); m = raw.slice(1, 3); } 
    else if (raw.length >= 4) { h = raw.slice(0, 2); m = raw.slice(2, 4); }
    
    if (h !== null && m !== null) {
        let hi = parseInt(h, 10), mi = parseInt(m, 10);
        if (hi <= 23 && mi <= 59) {
            let formatted = `${String(hi).padStart(2, "0")}:${String(mi).padStart(2, "0")}`;
            
            // 比对状态锁
            // 拦截由于 input 失去焦点(blur)导致的无效重绘, 保护 CSS 退出动画不被打断
            if (instance.input.value !== formatted) {
                instance.input.value = formatted;
                instance.setDate(formatted, true);
            }
            return true;
        }
    }
    return false;
}

const alarmTimeInput = DOM.alarmTime;
const alarmNameInput = DOM.alarmName;

function showEmptyTimeParts(instance) {
    if (instance.input.value) return;

    if (instance.hourElement) {
        instance.hourElement.value = "";
        instance.hourElement.placeholder = "--";
    }

    if (instance.minuteElement) {
        instance.minuteElement.value = "";
        instance.minuteElement.placeholder = "--";
    }
}

function normalizePickerPart(value, max) {
    const raw = String(value || "").replace(/\D/g, "");

    if (!raw) return null;

    const number = Number(raw);

    if (!Number.isInteger(number) || number < 0 || number > max) {
        return null;
    }

    return String(number).padStart(2, "0");
}

function commitPickerParts(instance, triggerChange = true) {
    const hour = normalizePickerPart(instance.hourElement?.value, 23);
    const minute = normalizePickerPart(instance.minuteElement?.value, 59);

    if (hour === null || minute === null) {
        return false;
    }

    const formatted = `${hour}:${minute}`;
    const valueChanged = instance.input.value !== formatted;

    instance.hourElement.value = hour;
    instance.minuteElement.value = minute;
    instance.setDate(formatted, triggerChange && valueChanged, "H:i");
    return true;
}

function restorePickerValue(instance, originalValue) {
    if (originalValue) {
        instance.setDate(originalValue, false, "H:i");
    } else {
        instance.clear(false);
        showEmptyTimeParts(instance);
    }
}

const fpInstance = flatpickr("#alarmTimeWrap", {
    enableTime: true,
    noCalendar: true,
    dateFormat: "H:i",
    time_24hr: true,
    wrap: true,
    clickOpens: false, 
    allowInput: true,
    minuteIncrement: 1,

    onOpen: function(selectedDates, dateStr, instance) {
        instance.__openTimeValue = instance.input.value;
        instance.__pickerEdited = false;
        instance.__mainInputEdited = false;

        if (instance.hourElement) {
            instance.hourElement.__homeUserEdited = false;
        }

        if (instance.minuteElement) {
            instance.minuteElement.__homeUserEdited = false;
        }

        requestAnimationFrame(() => {
            if (!instance.isOpen) return;

            if (!instance.input.value) {
                showEmptyTimeParts(instance);
            }

            if (instance.hourElement) {
                instance.hourElement.focus();
                instance.hourElement.select();
            }
        });
    },

    onClose: function(selectedDates, dateStr, instance) {
        const originalValue = instance.__openTimeValue || "";

        if (instance.__mainInputEdited) {
            return;
        }

        queueMicrotask(() => {
            if (
                instance.__pickerEdited &&
                commitPickerParts(instance, true)
            ) {
                return;
            }

            restorePickerValue(instance, originalValue);
        });
    },
    
    onReady: function(selectedDates, dateStr, instance) {
        instance.__rawTimeValue = "";
        instance.__openTimeValue = instance.input.value;
        instance.__pickerEdited = false;
        instance.__mainInputEdited = false;

        const hourInput = instance.hourElement;
        const minuteInput = instance.minuteElement;
        const calendar = instance.calendarContainer;

        [hourInput, minuteInput].filter(Boolean).forEach(part => {
            part.placeholder = "--";
            part.__homeTimeInstance = instance;
            part.__homeUserEdited = false;

            part.addEventListener("input", function(e) {
                if (!e.isTrusted) return;

                part.__homeUserEdited = true;
                instance.__pickerEdited = true;
            }, true);

            part.addEventListener("keydown", function(e) {
                if (
                    e.isTrusted &&
                    (e.key === "ArrowUp" || e.key === "ArrowDown")
                ) {
                    part.__homeUserEdited = true;
                    instance.__pickerEdited = true;
                }
            }, true);
        });

        const blockEmptyNormalization = function(e) {
            const isTimePart =
                e.target === hourInput ||
                e.target === minuteInput;

            if (!isTimePart) return;

            e.stopPropagation();
            e.stopImmediatePropagation();
        };

        calendar.addEventListener("blur", blockEmptyNormalization, true);
        calendar.addEventListener("change", blockEmptyNormalization, true);

        calendar.addEventListener("keydown", function(e) {
            const target = e.target;

            if (
                e.key !== "Enter" ||
                (target !== hourInput && target !== minuteInput)
            ) {
                return;
            }

            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            if (target === hourInput) {
                const hour = normalizePickerPart(hourInput.value, 23);

                if (hourInput.value && hour === null) {
                    hourInput.select();
                    return;
                }

                if (hour !== null) {
                    hourInput.value = hour;
                    hourInput.__homeUserEdited = true;
                    instance.__pickerEdited = true;
                }

                minuteInput.focus();
                minuteInput.select();
                return;
            }

            const minute = normalizePickerPart(minuteInput.value, 59);

            if (minuteInput.value && minute === null) {
                minuteInput.select();
                return;
            }

            if (minute !== null) {
                minuteInput.value = minute;
                minuteInput.__homeUserEdited = true;
                instance.__pickerEdited = true;
            }

            commitPickerParts(instance, true);
            instance.close();

            setTimeout(() => alarmNameInput.focus(), 60);
        }, true);

        showEmptyTimeParts(instance);

        const flatpickrEnterHook = function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                e.stopImmediatePropagation();

                if (e.target.value) {
                    forceTimeFormat(instance, e.target.value);
                }

                instance.close();

                if (e.ctrlKey || e.metaKey) {
                    setTimeout(() => addAlarm(), 60);
                } else {
                    setTimeout(() => alarmNameInput.focus(), 60);
                }
            } else if (e.key !== "Tab") {
                e.stopImmediatePropagation();
            }
        };

        instance.input.addEventListener("keydown", flatpickrEnterHook, true);

        instance.input.addEventListener("input", function () {
            instance.__rawTimeValue = this.value;
            instance.__mainInputEdited = true;
        }, true);

        instance.input.addEventListener('blur', function() {
            const raw = instance.__rawTimeValue;

            if (/^\d{3,4}$/.test(raw)) {
                forceTimeFormat(instance, raw);
            } else {
                forceTimeFormat(instance, this.value);
            }

            instance.__rawTimeValue = "";
        }, true);
    }
});

// ================== Microsoft To Do 智能解析引擎 ==================
function getTargetDateStr(keyword) {
    const d = new Date();
    if (keyword === '明天') d.setDate(d.getDate() + 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function parseToDo() {
    const text = DOM.todoInput.value.trim();
    if (!text) { customAlert("请先粘贴 To Do 列表文本!", "内容为空", "📋"); return; }

    let lines = text.split('\n').filter(l => l.trim() !== '');
    if (lines.length === 0) return;

    const listCategory = lines[0].trim();
    let isCompletedSection = false;
    let parentTaskName = "";
    
    let hubData = JSON.parse(localStorage.getItem('taskhub_data') || '[]');
    let flowData = JSON.parse(localStorage.getItem('taskflow_data') || '{}');
    let addedHub = 0, addedFlow = 0;

    for (let i = 1; i < lines.length; i++) {
        let line = lines[i];
        if (line.trim() === '已完成') { isCompletedSection = true; continue; }

        const isPending = line.includes('⬜');
        const isDone = line.includes('✅');
        
        if (!isPending && !isDone) continue; 
        
        const isSubtask = line.startsWith(' ') || line.startsWith('\t') || line.startsWith(' ');
        let taskName = line.replace(/⬜|✅/g, '').trim();
        let priority = 'Medium';
        let deadline = '无截止日期';

        if (taskName.includes('★')) { priority = 'High'; taskName = taskName.replace('★', '').trim(); }
        
        const dateMatch = taskName.match(/- 截止 (今天|明天)/);
        if (dateMatch) {
            deadline = getTargetDateStr(dateMatch[1]);
            taskName = taskName.replace(dateMatch[0], '').trim();
        }

        if (isSubtask && parentTaskName) { taskName = `${parentTaskName} - ${taskName}`; } 
        else { parentTaskName = taskName; }

        let taskObj = {
            id: window.crypto?.randomUUID?.() || String(Date.now() + i),
            name: taskName,
            subject: [listCategory],
            priority: priority,
            remark: "从 To Do 导入",
            start: "", end: "",
            isCompleted: isCompletedSection || isDone
        };

        if (taskObj.isCompleted) {
            const todayStr = getTargetDateStr('今天');
            if (!flowData[todayStr]) flowData[todayStr] = [];
            flowData[todayStr].push({
                id: taskObj.id, name: taskObj.name, category: taskObj.subject,
                duration: 25, date: todayStr, remark: taskObj.remark, createdAt: Date.now()
            });
            addedFlow++;
        } else {
            hubData.push(taskObj);
            addedHub++;
            let mapping = JSON.parse(localStorage.getItem('alpha_task_mapping') || '{}');
            mapping[taskObj.id] = ['default'];
            localStorage.setItem('alpha_task_mapping', JSON.stringify(mapping));
        }
    }

localStorage.setItem('taskhub_data', JSON.stringify(hubData));
    localStorage.setItem('taskflow_data', JSON.stringify(flowData));
    
    DOM.todoInput.value = '';
    
    // 彻底重置输入框的自适应高度与用户拖拽状态, 配合 CSS 触发回弹阻尼动画
    DOM.todoInput.style.height = '200px'; 
    delete DOM.todoInput.dataset.userResized; 
    delete DOM.todoInput.dataset.lastTargetHeight;
    
    customAlert(`✅ 解析完成!<br><br>新增待办计划 (Hub): <b>${addedHub}</b> 项<br>新增已完结记录 (Flow): <b>${addedFlow}</b> 项`, "导入成功", "🎉");
}

DOM.todoInput.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        parseToDo();
    }
});

// ================== 日程闹钟引擎 ==================
let alarms = JSON.parse(localStorage.getItem('alpha_alarms') || '[]');

function renderAlarms() {
    const list = DOM.alarmList;
    // 确保列表时间排序正确
    alarms.sort((a, b) => a.time.localeCompare(b.time));
    
    // 增量 DOM 渲染: 不销毁已有元素, 防止已存在的闹钟重新播放入场动画
    
    // 1. 安全移除已不存在的数据节点
    Array.from(list.children).forEach(child => {
        const id = child.id.replace('alarm-', '');
        if (!alarms.find(a => a.id === id) && !child.classList.contains('removing')) {
            child.remove();
        }
    });

    // 2. 插入新闹钟并校准排序
    alarms.forEach((al, index) => {
        let itemEl = document.getElementById(`alarm-${al.id}`);
        if (!itemEl) {
            itemEl = document.createElement('div');
            itemEl.className = 'alarm-item';
            itemEl.id = `alarm-${al.id}`;
            itemEl.innerHTML = `
                <div class="alarm-time">${al.time}</div>
                <div class="alarm-name">${al.name}</div>
                <div class="alarm-del" onclick="deleteAlarm('${al.id}')">✕</div>
            `;
            list.appendChild(itemEl);
        }
        // 若当前 DOM 排序不正确, 则通过 insertBefore 强制触发浏览器重排
        if (list.children[index] !== itemEl) {
            list.insertBefore(itemEl, list.children[index]);
        }
    });
}

function addAlarm() {
    // 传入正确的 fpInstance 对象, 而不是 DOM 节点
    forceTimeFormat(fpInstance, alarmTimeInput.value);
    
    const time = alarmTimeInput.value;
    const name = alarmNameInput.value.trim() || "日程提醒";
    if (!time) { customAlert("请先选择或输入闹钟时间!", "缺失时间", "⏰"); return; }
    
    alarms.push({ id: String(Date.now()), time, name, triggeredDay: '' });
    localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
    alarmNameInput.value = '';
    
    // 添加成功后, 把焦点还给时间输入框, 方便连续添加
    fpInstance.clear();
    alarmTimeInput.focus();
    
    renderAlarms();
}

function deleteAlarm(id) {
    const itemEl = document.getElementById(`alarm-${id}`);
    if (itemEl) {
        itemEl.classList.add('removing');
        // 等待 400ms (与更新后的 CSS 离场动画时长对齐)
        setTimeout(() => {
            alarms = alarms.filter(a => a.id !== id);
            localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
            itemEl.remove(); 
        }, 400); 
    } else {
        alarms = alarms.filter(a => a.id !== id);
        localStorage.setItem('alpha_alarms', JSON.stringify(alarms));
        renderAlarms();
    }
}

renderAlarms();

// ================== 智能文本框伸缩 (rAF 防抖) ==================
let ghostTextarea = null;
const pendingAdjustments = new Set();

function flushTextareaAdjustments() {
    // 批量处理所有待调整的 textarea
    for (const el of pendingAdjustments) {
        applyTextareaHeight(el);
    }
    pendingAdjustments.clear();
}

function applyTextareaHeight(el) {
    if (el.dataset.userResized === 'true') return;

    if (!ghostTextarea) {
        ghostTextarea = document.createElement('textarea');
        ghostTextarea.style.cssText = `
            position: absolute !important;
            top: -9999px !important;
            visibility: hidden !important;
            overflow: hidden !important;
            box-sizing: border-box !important;
        `;
        document.body.appendChild(ghostTextarea);
    }

    const computedStyle = window.getComputedStyle(el);
    ghostTextarea.style.width = computedStyle.width;
    ghostTextarea.style.font = computedStyle.font;
    ghostTextarea.style.lineHeight = computedStyle.lineHeight;
    ghostTextarea.style.padding = computedStyle.padding;
    ghostTextarea.style.border = computedStyle.border;
    ghostTextarea.style.wordWrap = 'break-word';

    ghostTextarea.value = el.value;
    ghostTextarea.style.height = '0px';
    let targetHeight = ghostTextarea.scrollHeight;

    if (targetHeight < 200) targetHeight = 200;
    const maxHeight = 380;

    if (el.dataset.lastTargetHeight === String(targetHeight)) return;
    el.dataset.lastTargetHeight = String(targetHeight);

    if (targetHeight >= maxHeight) {
        el.style.height = maxHeight + 'px';
        setTimeout(() => {
            if (parseInt(el.style.height) >= maxHeight) {
                el.style.overflowY = 'auto';
            }
        }, 400);
    } else {
        if (el.style.overflowY === 'auto') {
            el.style.overflowY = 'hidden';
            void el.offsetHeight;
        }
        el.style.height = targetHeight + 'px';
        el.style.overflowY = 'hidden';
    }
}

// 使用 rAF 防抖: 同一帧内的多次 input 合并为一次布局计算
function scheduleTextareaAdjust(el) {
    pendingAdjustments.add(el);
    if (pendingAdjustments.size === 1) {
        requestAnimationFrame(flushTextareaAdjustments);
    }
}

document.addEventListener('input', (e) => {
    if (e.target.tagName === 'TEXTAREA') {
        scheduleTextareaAdjust(e.target);
    }
});

// 拖拽雷达 (保持不变)
document.addEventListener('mousedown', (e) => {
    if (e.target.tagName === 'TEXTAREA' && window.getComputedStyle(e.target).resize !== 'none') {
        e.target.dataset.startH = e.target.offsetHeight;
    }
});
document.addEventListener('mouseup', (e) => {
    if (e.target.tagName === 'TEXTAREA' && window.getComputedStyle(e.target).resize !== 'none') {
        if (e.target.dataset.startH && e.target.offsetHeight !== parseInt(e.target.dataset.startH)) {
            e.target.dataset.userResized = 'true';
        }
    }
});

document.addEventListener('wheel', function(e) {
    if (e.target.classList.contains('flatpickr-hour') || e.target.classList.contains('flatpickr-minute')) {
        e.preventDefault();
        
        // 向下滚(deltaY > 0)增加时间(变晚)；向上滚(deltaY < 0)减少时间(变早)
        const step = e.deltaY > 0 ? 1 : -1; 
        
        let max = e.target.classList.contains('flatpickr-hour') ? 23 : 59;
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 0;
        
        val += step;
        if (val > max) val = 0;
        if (val < 0) val = max;
        
        e.target.value = String(val).padStart(2, '0');
        e.target.__homeUserEdited = true;
        if (e.target.__homeTimeInstance) {
            e.target.__homeTimeInstance.__pickerEdited = true;
        }
        e.target.dispatchEvent(new Event('input', { bubbles: true })); 
    }
}, { passive: false });

// ================== "负一屏" (TaskNote) 无缝切入引擎 (rAF 节流版) ==================
let isTransitioningToNote = false;
let wheelRafPending = false;
let lastWheelDeltaY = 0;

window.addEventListener('wheel', (e) => {
    lastWheelDeltaY = e.deltaY;
    if (!wheelRafPending && !isTransitioningToNote) {
        wheelRafPending = true;
        requestAnimationFrame(() => {
            wheelRafPending = false;
            if (isTransitioningToNote) return;

            const isAtBottom = Math.ceil(window.innerHeight + window.scrollY) >= document.body.scrollHeight;
            if (isAtBottom && lastWheelDeltaY > 40) {
                isTransitioningToNote = true;

                const pageElements = document.querySelectorAll('body > *:not(script):not(style):not(link):not(.sphere-modal):not(.flatpickr-calendar)');
                pageElements.forEach(el => {
                    el.style.animation = 'none';
                    void el.offsetHeight;
                    el.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease';
                    el.style.transform = 'translateY(-100vh) scale(0.95)';
                    el.style.opacity = '0';
                });

                setTimeout(() => {
                    window.location.href = 'Focus.html';
                }, 500);
            }
        });
    }
}, { passive: true });

// ================== 首次启动版权提示 ==================
function checkFirstLaunch() {
    // 检查是否已经显示过
    if (localStorage.getItem('alpha_welcome_shown')) return;

    // 直接唤出新的毛玻璃欢迎弹窗
    const welcomeModal = document.getElementById('welcomeModal');
    if (welcomeModal) {
        welcomeModal.classList.remove('hidden');
    }

    // 标记已显示, 下次不再弹出
    localStorage.setItem('alpha_welcome_shown', 'true');
}

// 在页面加载完成后执行检测（不干扰其他初始化）
document.addEventListener('DOMContentLoaded', checkFirstLaunch);

// ================== 层叠卡片 z-index 更新引擎 (rAF 防抖) ==================
(function initCardStacking() {
    let stackingRafPending = false;
    function updateStacking() {
        document.querySelectorAll('.task-list, .side-list, .card-group, .task-container, .sidebar, .panel, main, section, div').forEach(container => {
            const children = Array.from(container.children).filter(el => 
                el.classList.contains('task-card') || el.classList.contains('side-card') || el.classList.contains('task-card-wrap')
            );
            if (children.length > 0) {
                const total = children.length;
                children.forEach((child, index) => {
                    child.style.setProperty('--card-z', total - index);
                });
            }
        });
    }
    
    function requestUpdateStacking() {
        if (!stackingRafPending) {
            stackingRafPending = true;
            requestAnimationFrame(() => {
                updateStacking();
                stackingRafPending = false;
            });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updateStacking);
    } else {
        updateStacking();
    }
    const observer = new MutationObserver(requestUpdateStacking);
    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
