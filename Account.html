<!-- ==========================================
     文本框溢出与横向滚动状态监听
     ========================================== -->
<script>
(function() {
    const pendingInputs = new Set();
    let overflowFrame = 0;

    function isTrackableInput(el) {
        if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return false;
        if (['radio', 'checkbox', 'file', 'hidden'].includes(el.type)) return false;
        if (el.closest('.flatpickr-time') || el.closest('.flatpickr-calendar')) return false;
        return true;
    }

    function flushInputOverflowUpdates() {
        overflowFrame = 0;
        const inputs = Array.from(pendingInputs).filter(isTrackableInput);
        pendingInputs.clear();

        // 先批量读取尺寸, 再批量写 class, 避免连续强制布局
        const measurements = inputs.map(el => ({
            el,
            isOverflowing: el.scrollWidth > el.clientWidth,
            isScrolledRight: el.scrollLeft > 2
        }));

        measurements.forEach(({ el, isOverflowing, isScrolledRight }) => {
            el.classList.toggle('input-overflowing', isOverflowing);
            el.classList.toggle('input-scrolled-right', isOverflowing && isScrolledRight);
        });
    }

    function scheduleInputOverflowUpdate(el) {
        if (!isTrackableInput(el)) return;
        pendingInputs.add(el);
        if (!overflowFrame) overflowFrame = requestAnimationFrame(flushInputOverflowUpdates);
    }

    function initInputOverflowMonitor() {
        const events = ['input', 'scroll', 'focus', 'blur'];
        const handleInputEvent = event => scheduleInputOverflowUpdate(event.target);
        events.forEach(evt => {
            document.addEventListener(evt, handleInputEvent, true);
        });

        const scanInputs = () => {
            document.querySelectorAll('input[type="text"], input[type="number"], textarea, .pop-input-fx')
                .forEach(scheduleInputOverflowUpdate);
        };

        scanInputs();
        setTimeout(scanInputs, 500);
        setTimeout(scanInputs, 1500);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initInputOverflowMonitor);
    } else {
        initInputOverflowMonitor();
    }
})();

// ======= 自适应节能与性能降载联动引擎 (Adaptive Activity & Power Throttler) =======
(function initPerformanceThrottle() {
    let isSleeping = false;
    let isIdle = false;
    let idleTimer = null;
    const IDLE_TIMEOUT_MS = 2500;

    function applyVisualFreeze(freeze) {
        const docEl = document.documentElement;
        const bodyEl = document.body;
        if (!docEl) return;
        if (freeze) {
            docEl.classList.add('pause-bg-motion', 'pause-clock-breath');
            if (bodyEl) bodyEl.classList.add('pause-bg-motion', 'pause-clock-breath');
        } else {
            docEl.classList.remove('pause-bg-motion', 'pause-clock-breath');
            if (bodyEl) bodyEl.classList.remove('pause-bg-motion', 'pause-clock-breath');
        }
    }

    function onUserActive() {
        if (isSleeping) return;
        if (isIdle) {
            isIdle = false;
            applyVisualFreeze(false);
        }
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            isIdle = true;
            applyVisualFreeze(true);
        }, IDLE_TIMEOUT_MS);
    }

    function onSleep() {
        isSleeping = true;
        document.documentElement.classList.add('alpha-sleep');
        if (idleTimer) {
            clearTimeout(idleTimer);
            idleTimer = null;
        }
        applyVisualFreeze(true);
        try {
            if (window.AlphaCardGlow && typeof window.AlphaCardGlow.sleep === 'function') {
                window.AlphaCardGlow.sleep(document);
            }
            if (window.AlphaInputGlow && typeof window.AlphaInputGlow.sleep === 'function') {
                window.AlphaInputGlow.sleep(document);
            }
            if (window.AlphaLiquidGlass && typeof window.AlphaLiquidGlass.releaseAll === 'function') {
                window.AlphaLiquidGlass.releaseAll();
            }
        } catch (_) {}
    }

    function onWake() {
        isSleeping = false;
        isIdle = false;
        document.documentElement.classList.remove('alpha-sleep');
        applyVisualFreeze(false);
        try {
            if (window.AlphaCardGlow && typeof window.AlphaCardGlow.wake === 'function') {
                window.AlphaCardGlow.wake(document);
            }
            if (window.AlphaInputGlow && typeof window.AlphaInputGlow.wake === 'function') {
                window.AlphaInputGlow.wake(document);
            }
        } catch (_) {}
        onUserActive();
    }

    const activityEvents = ['pointermove', 'pointerdown', 'keydown', 'scroll', 'wheel', 'touchstart'];
    activityEvents.forEach(evt => {
        window.addEventListener(evt, onUserActive, { passive: true, capture: true });
    });

    window.addEventListener('AlphaSleep', onSleep);
    window.addEventListener('AlphaWake', onWake);
    window.addEventListener('focus', onUserActive);
    window.addEventListener('blur', () => {
        if (idleTimer) {
            clearTimeout(idleTimer);
            idleTimer = null;
        }
        isIdle = true;
        applyVisualFreeze(true);
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) onSleep();
        else onWake();
    });

    onUserActive();

    function applyThrottle(throttle) {
        if (!throttle) return;
        if (throttle.pauseBgMotion || throttle.pauseClockBreath) {
            applyVisualFreeze(true);
        } else if (!isIdle && !isSleeping) {
            applyVisualFreeze(false);
        }
    }

    window.addEventListener('AlphaPerformanceThrottle', (e) => applyThrottle(e.detail));
    const api = window.electronAPI || window.top?.electronAPI || window.parent?.electronAPI;
    if (api && typeof api.onPerformanceThrottleChanged === 'function') {
        api.onPerformanceThrottleChanged(applyThrottle);
    }
    if (api && typeof api.getPerformanceThrottleState === 'function') {
        api.getPerformanceThrottleState().then(applyThrottle).catch(() => {});
    }
    function applyBgMotionSetting(enabled) {
        const isEnabled = (typeof enabled === 'boolean') ? enabled : (localStorage.getItem('alpha_bg_motion') === 'true');
        const docEl = document.documentElement;
        const bodyEl = document.body;
        if (docEl) docEl.classList.toggle('enable-bg-motion', isEnabled);
        if (bodyEl) bodyEl.classList.toggle('enable-bg-motion', isEnabled);
    }
    applyBgMotionSetting();
    window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'alpha_bg_motion') {
            applyBgMotionSetting(!!e.data.value);
        }
    });
    window.addEventListener('storage', (e) => {
        if (e.key === 'alpha_bg_motion') {
            applyBgMotionSetting(e.newValue === 'true');
        }
    });
})();

// ======= 壁纸与背景颜色深度自动检测联动 =======
function checkBackgroundDepth() {
    try {
        const savedWp = localStorage.getItem('alpha_wallpaper');
        if (savedWp && savedWp !== './background.png') {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 40; canvas.height = 40;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 40, 40);
                    const data = ctx.getImageData(0, 0, 40, 40).data;
                    let totalLuma = 0;
                    const count = data.length / 4;
                    for (let i = 0; i < data.length; i += 4) {
                        totalLuma += (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
                    }
                    const isDark = (totalLuma / count) < 160;
                    document.body.classList.toggle('dark-wp', isDark);
                    if (typeof updateToastStackPositions === 'function') {
                        updateToastStackPositions();
                    }
                } catch (err) {}
            };
            img.src = savedWp;
        } else {
            document.body.classList.remove('dark-wp');
            if (typeof updateToastStackPositions === 'function') {
                updateToastStackPositions();
            }
        }
    } catch (e) {}
}
window.addEventListener('storage', (e) => {
    if (e.key === 'alpha_wallpaper') checkBackgroundDepth();
});
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', checkBackgroundDepth, { once: true });
} else {
    checkBackgroundDepth();
}

// 禁止通过 F11 快捷键切换全屏
window.addEventListener('keydown', (e) => {
    if (e.key === 'F11' || e.keyCode === 122 || e.code === 'F11') {

        e.stopPropagation();

<script id="account-gender-overlap-controller-v1">
(function initAccountGenderOverlapFusion() {
    'use strict';

    const EDGE_CLASSES = [
        'account-gender-overlap-left',
        'account-gender-overlap-right',
        'account-gender-overlap-top',
        'account-gender-overlap-bottom'
    ];
    const tracked = new Map();
    let hoverSurface = null;
    let activeSurface = null;
    let activePointerId = null;
    let pointerIsDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let dragLightSuppressed = false;
    let currentPeer = null;
    let currentGroup = null;
    let frameId = 0;

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const svgElement = name => document.createElementNS(SVG_NS, name);
    const union = svgElement('svg');
    union.classList.add('account-gender-tag-union-surface');
    union.setAttribute('aria-hidden', 'true');

    const defs = svgElement('defs');
    const materialGradient = svgElement('linearGradient');
    materialGradient.id = 'accountGenderUnionMaterialV4';
    materialGradient.setAttribute('gradientUnits', 'userSpaceOnUse');
    const materialStops = [0, 0.42, 0.58, 1].map(offset => {
        const stop = svgElement('stop');
        stop.setAttribute('offset', String(offset));
        materialGradient.appendChild(stop);
        return stop;
    });
    const unionMask = svgElement('mask');
    unionMask.id = 'accountGenderUnionMaskV4';
    unionMask.setAttribute('maskUnits', 'userSpaceOnUse');
    unionMask.setAttribute('maskContentUnits', 'userSpaceOnUse');
    unionMask.style.maskType = 'luminance';
    const maskPath = svgElement('path');
    maskPath.setAttribute('fill', 'white');
    maskPath.setAttribute('fill-rule', 'nonzero');
    const notchNegative = svgElement('circle');
    const notchPositive = svgElement('circle');
    notchNegative.setAttribute('fill', 'black');
    notchPositive.setAttribute('fill', 'black');
    unionMask.append(maskPath, notchNegative, notchPositive);

    /* Build the rim from the alpha of the already-masked combined silhouette.
       Eroding that alpha creates one continuous inner outline, with no seam
       around either original pill and with both liquid notches included. */
    const outlineFilter = svgElement('filter');
    outlineFilter.id = 'accountGenderUnionOutlineV4';
    outlineFilter.setAttribute('color-interpolation-filters', 'sRGB');
    const outlineErode = svgElement('feMorphology');
    outlineErode.setAttribute('in', 'SourceAlpha');
    outlineErode.setAttribute('operator', 'erode');
    outlineErode.setAttribute('radius', '0.82');
    outlineErode.setAttribute('result', 'accountGenderUnionInner');
    const outlineEdge = svgElement('feComposite');
    outlineEdge.setAttribute('in', 'SourceAlpha');
    outlineEdge.setAttribute('in2', 'accountGenderUnionInner');
    outlineEdge.setAttribute('operator', 'out');
    outlineEdge.setAttribute('result', 'accountGenderUnionEdge');
    const outlineFlood = svgElement('feFlood');
    outlineFlood.setAttribute('flood-color', 'rgb(255,255,255)');
    outlineFlood.setAttribute('flood-opacity', '0.70');
    outlineFlood.setAttribute('result', 'accountGenderUnionRimColor');
    const outlinePaint = svgElement('feComposite');
    outlinePaint.setAttribute('in', 'accountGenderUnionRimColor');
    outlinePaint.setAttribute('in2', 'accountGenderUnionEdge');
    outlinePaint.setAttribute('operator', 'in');
    outlineFilter.append(outlineErode, outlineEdge, outlineFlood, outlinePaint);

    defs.append(materialGradient, unionMask, outlineFilter);

    const materialGroup = svgElement('g');
    materialGroup.setAttribute('fill', 'url(#accountGenderUnionMaterialV4)');
    materialGroup.setAttribute('mask', 'url(#accountGenderUnionMaskV4)');
    const materialPath = svgElement('path');
    materialPath.setAttribute('fill-rule', 'nonzero');
    materialGroup.append(materialPath);
    /* Keep the material unfiltered: its separate outline is generated from the
       final union alpha rather than from either original tag. */
    materialGroup.style.filter = 'none';

    const outlineGroup = svgElement('g');
    outlineGroup.setAttribute('filter', 'url(#accountGenderUnionOutlineV4)');
    outlineGroup.setAttribute('pointer-events', 'none');
    const outlineMaskedGroup = svgElement('g');
    outlineMaskedGroup.setAttribute('mask', 'url(#accountGenderUnionMaskV4)');
    const outlineSource = svgElement('path');
    outlineSource.setAttribute('fill', 'white');
    outlineSource.setAttribute('fill-rule', 'nonzero');
    outlineMaskedGroup.append(outlineSource);
    outlineGroup.append(outlineMaskedGroup);

    union.append(defs, materialGroup, outlineGroup);

    function surfaceFrom(target) {
        if (!(target instanceof Element)) return null;
        const item = target.closest('.gender-item');
        if (!item || item.parentElement?.id !== 'genderBox') return null;
        return item.querySelector(':scope > span');
    }

    function clearEdge(surface) {
        if (surface) surface.classList.remove(
            ...EDGE_CLASSES,
            'account-gender-union-member',
            'account-gender-selected-union-member'
        );
    }

    function markFacingEdges(a, b, ux, uy, useUnifiedSelectedOutline) {
        clearEdge(a);
        clearEdge(b);
        a.classList.add('account-gender-union-member');
        b.classList.add('account-gender-union-member');
        if (useUnifiedSelectedOutline) {
            a.classList.add('account-gender-selected-union-member');
            b.classList.add('account-gender-selected-union-member');
        }
        if (Math.abs(ux) >= Math.abs(uy)) {
            a.classList.add(ux >= 0 ? 'account-gender-overlap-right' : 'account-gender-overlap-left');
            b.classList.add(ux >= 0 ? 'account-gender-overlap-left' : 'account-gender-overlap-right');
        } else {
            a.classList.add(uy >= 0 ? 'account-gender-overlap-bottom' : 'account-gender-overlap-top');
            b.classList.add(uy >= 0 ? 'account-gender-overlap-top' : 'account-gender-overlap-bottom');
        }
    }

    function fusionColor(surface) {
        const value = getComputedStyle(surface).getPropertyValue('--account-gender-fusion-color').trim();
        return value || 'rgba(255,255,255,.38)';
    }

    function suppressSharedTagBridge(suppress) {
        document.querySelectorAll('.__lq-fusion-bridge.__lq-fusion-tag-pair').forEach(bridge => {
            bridge.classList.toggle('account-gender-union-suppressed', suppress);
        });
    }

    function isSelectedSurface(surface) {
        const input = surface?.parentElement?.querySelector(':scope > input');
        return Boolean(input && input.checked);
    }

    function colorWithAlpha(color, alpha) {
        const match = String(color).match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+))?\s*\)/i);
        return match
            ? `rgba(${match[1]}, ${match[2]}, ${match[3]}, ${alpha})`
            : color;
    }

    function setStopColor(stop, color) {
        const match = String(color).match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:\s*[,/]\s*([\d.]+))?\s*\)/i);
        if (match) {
            stop.style.stopColor = `rgb(${match[1]}, ${match[2]}, ${match[3]})`;
            stop.style.stopOpacity = match[4] === undefined ? '1' : match[4];
        } else {
            stop.style.stopColor = color;
            stop.style.stopOpacity = '1';
        }
    }

    function roundedRectPath(rect, originX, originY, radius) {
        const x = rect.left - originX;
        const y = rect.top - originY;
        const w = rect.width;
        const h = rect.height;
        const r = Math.max(0, Math.min(radius, w * 0.5, h * 0.5));
        return [
            `M ${(x + r).toFixed(2)} ${y.toFixed(2)}`,
            `H ${(x + w - r).toFixed(2)}`,
            `Q ${(x + w).toFixed(2)} ${y.toFixed(2)} ${(x + w).toFixed(2)} ${(y + r).toFixed(2)}`,
            `V ${(y + h - r).toFixed(2)}`,
            `Q ${(x + w).toFixed(2)} ${(y + h).toFixed(2)} ${(x + w - r).toFixed(2)} ${(y + h).toFixed(2)}`,
            `H ${(x + r).toFixed(2)}`,
            `Q ${x.toFixed(2)} ${(y + h).toFixed(2)} ${x.toFixed(2)} ${(y + h - r).toFixed(2)}`,
            `V ${(y + r).toFixed(2)}`,
            `Q ${x.toFixed(2)} ${y.toFixed(2)} ${(x + r).toFixed(2)} ${y.toFixed(2)}`,
            'Z'
        ].join(' ');
    }

    function boundaryDistance(rect, ux, uy) {
        const tx = Math.abs(ux) > 0.0001 ? rect.width * 0.5 / Math.abs(ux) : Infinity;
        const ty = Math.abs(uy) > 0.0001 ? rect.height * 0.5 / Math.abs(uy) : Infinity;
        return Math.min(tx, ty);
    }

    function buildUnionNeck(a, best, originX, originY, minEdge, eased) {
        const tA = boundaryDistance(a, best.ux, best.uy);
        const tB = boundaryDistance(best.b, best.ux, best.uy);
        const centerDistance = Math.hypot(best.bcx - (a.left + a.width * 0.5), best.bcy - (a.top + a.height * 0.5));
        const axialOverlap = Math.max(0, tA + tB - centerDistance);
        const visibleIntersection = Math.min(best.intersectionWidth, best.intersectionHeight);
        const joinDepth = Math.max(axialOverlap, visibleIntersection * 0.72);
        const extension = joinDepth + 2.5;
        const acx = a.left + a.width * 0.5;
        const acy = a.top + a.height * 0.5;
        const edgeAX = acx + best.ux * tA;
        const edgeAY = acy + best.uy * tA;
        const edgeBX = best.bcx - best.ux * tB;
        const edgeBY = best.bcy - best.uy * tB;
        const start = { x: edgeAX - best.ux * extension, y: edgeAY - best.uy * extension };
        const end = { x: edgeBX + best.ux * extension, y: edgeBY + best.uy * extension };
        let dx = end.x - start.x;
        let dy = end.y - start.y;
        let length = Math.hypot(dx, dy);
        if (length < 1) {
            end.x = start.x + best.ux;
            end.y = start.y + best.uy;
            dx = end.x - start.x;
            dy = end.y - start.y;
            length = Math.hypot(dx, dy);
        }
        const sux = dx / length;
        const suy = dy / length;
        const nx = -suy;
        const ny = sux;
        const contactHalf = minEdge * (0.30 + eased * 0.14);
        const waistHalf = contactHalf * (0.72 + eased * 0.20);
        const mid = { x: (start.x + end.x) * 0.5, y: (start.y + end.y) * 0.5 };
        const shoulder = length * 0.22;
        const waistControl = length * 0.15;
        const point = (p, normal, axis) => ({
            x: p.x + nx * normal + sux * axis - originX,
            y: p.y + ny * normal + suy * axis - originY
        });
        const f = p => p.x.toFixed(2) + ' ' + p.y.toFixed(2);
        const topA = point(start, -contactHalf, 0);
        const topB = point(end, -contactHalf, 0);
        const bottomB = point(end, contactHalf, 0);
        const bottomA = point(start, contactHalf, 0);
        const topMid = point(mid, -waistHalf, 0);
        const bottomMid = point(mid, waistHalf, 0);
        return [
            'M ' + f(topA),
            'C ' + f(point(start, -contactHalf, shoulder)) + ' ' + f(point(mid, -waistHalf, -waistControl)) + ' ' + f(topMid),
            'C ' + f(point(mid, -waistHalf, waistControl)) + ' ' + f(point(end, -contactHalf, -shoulder)) + ' ' + f(topB),
            'L ' + f(bottomB),
            'C ' + f(point(end, contactHalf, -shoulder)) + ' ' + f(point(mid, waistHalf, waistControl)) + ' ' + f(bottomMid),
            'C ' + f(point(mid, waistHalf, -waistControl)) + ' ' + f(point(start, contactHalf, shoulder)) + ' ' + f(bottomA),
            'Z'
        ].join(' ');
    }

    function hideLens() {
        union.classList.remove('is-visible');
        union.style.opacity = '0';
        suppressSharedTagBridge(false);
        if (currentGroup) currentGroup.classList.remove('account-gender-union-active');
        clearEdge(activeSurface);
        clearEdge(currentPeer);
        currentPeer = null;
        currentGroup = null;
    }

    function updateLens(surface) {
        const item = surface?.closest('.gender-item');
        const group = item?.parentElement;
        if (!group || group.id !== 'genderBox') {
            hideLens();
            return false;
        }

        const a = surface.getBoundingClientRect();
        if (!a.width || !a.height) {
            hideLens();
            return false;
        }
        const acx = a.left + a.width * 0.5;
        const acy = a.top + a.height * 0.5;
        let best = null;

        group.querySelectorAll(':scope > .gender-item > span').forEach(candidate => {
            if (candidate === surface) return;
            const b = candidate.getBoundingClientRect();
            if (!b.width || !b.height) return;
            const bcx = b.left + b.width * 0.5;
            const bcy = b.top + b.height * 0.5;
            const intersectionWidth = Math.min(a.right, b.right) - Math.max(a.left, b.left);
            const intersectionHeight = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
            if (intersectionWidth <= 0.35 || intersectionHeight <= 0.35) return;
            const dx = bcx - acx;
            const dy = bcy - acy;
            const distance = Math.hypot(dx, dy);
            if (distance < 0.01) return;
            const ux = dx / distance;
            const uy = dy / distance;
            const halfA = Math.abs(ux) * a.width * 0.5 + Math.abs(uy) * a.height * 0.5;
            const halfB = Math.abs(ux) * b.width * 0.5 + Math.abs(uy) * b.height * 0.5;
            const overlap = halfA + halfB - distance;
            if (overlap <= 0.35) return;
            if (!best || overlap > best.overlap) {
                best = { candidate, b, bcx, bcy, ux, uy, halfA, halfB, overlap, intersectionWidth, intersectionHeight };
            }
        });

        if (!best) {
            hideLens();
            return false;
        }

        if (currentPeer && currentPeer !== best.candidate) clearEdge(currentPeer);
        currentPeer = best.candidate;
        const minEdge = Math.min(a.width, a.height, best.b.width, best.b.height);
        const normalized = Math.max(0, Math.min(1, best.overlap / Math.max(4, minEdge * 0.56)));
        const eased = normalized * normalized * (3 - 2 * normalized);
        const groupRect = group.getBoundingClientRect();
        /* Reserve enough real SVG viewport for both drop shadows. `overflow`
           alone is not reliable for filtered root SVGs in Electron/Chromium. */
        const padding = 112;
        const originX = Math.min(a.left, best.b.left) - padding;
        const originY = Math.min(a.top, best.b.top) - padding;
        const maxX = Math.max(a.right, best.b.right) + padding;
        const maxY = Math.max(a.bottom, best.b.bottom) + padding;
        const svgWidth = Math.max(1, maxX - originX);
        const svgHeight = Math.max(1, maxY - originY);
        const radiusA = Math.min(a.height * 0.5, parseFloat(getComputedStyle(surface).borderTopLeftRadius) || a.height * 0.5);
        const radiusB = Math.min(best.b.height * 0.5, parseFloat(getComputedStyle(best.candidate).borderTopLeftRadius) || best.b.height * 0.5);
        const neckPath = buildUnionNeck(a, best, originX, originY, minEdge, eased);
        const mixStart = 43 - eased * 17;
        const mixEnd = 57 + eased * 17;
        let colorA = fusionColor(surface);
        let colorB = fusionColor(best.candidate);
        const selectedA = isSelectedSurface(surface);
        const selectedB = isSelectedSurface(best.candidate);
        const hasSelectedMember = selectedA || selectedB;
        if (hasSelectedMember) {
            /* Selection belongs to the merged liquid volume, not to one half.
               Use the selected member's hue across all four gradient stops and
               keep it deliberately pale so text/icon contrast remains intact. */
            const selectedColor = colorWithAlpha(selectedA ? colorA : colorB, 0.34);
            colorA = selectedColor;
            colorB = selectedColor;
        }

        if (union.parentNode !== group) group.insertBefore(union, group.firstChild);
        currentGroup = group;
        group.classList.add('account-gender-union-active');
        suppressSharedTagBridge(true);
        markFacingEdges(surface, best.candidate, best.ux, best.uy, hasSelectedMember);
        union.style.left = (originX - groupRect.left).toFixed(2) + 'px';
        union.style.top = (originY - groupRect.top).toFixed(2) + 'px';
        union.style.width = svgWidth.toFixed(2) + 'px';
        union.style.height = svgHeight.toFixed(2) + 'px';
        union.setAttribute('width', svgWidth.toFixed(2));
        union.setAttribute('height', svgHeight.toFixed(2));
        union.setAttribute('viewBox', '0 0 ' + svgWidth.toFixed(2) + ' ' + svgHeight.toFixed(2));

        const unionPathData = [
            roundedRectPath(a, originX, originY, radiusA),
            roundedRectPath(best.b, originX, originY, radiusB),
            neckPath
        ].join(' ');
        materialPath.setAttribute('d', unionPathData);
        maskPath.setAttribute('d', unionPathData);
        outlineSource.setAttribute('d', unionPathData);
        unionMask.setAttribute('x', '0');
        unionMask.setAttribute('y', '0');
        unionMask.setAttribute('width', svgWidth.toFixed(2));
        unionMask.setAttribute('height', svgHeight.toFixed(2));

        /* Reference-like concave cusps: carve two shallow circular bites from
           the shared outline along the normal of the joining axis. They get
           slightly shallower as penetration grows, so deep overlap approaches
           one continuous capsule instead of retaining a rigid hourglass. */
        const normalX = -best.uy;
        const normalY = best.ux;
        const jointX = (Math.max(a.left, best.b.left) + Math.min(a.right, best.b.right)) * 0.5;
        const jointY = (Math.max(a.top, best.b.top) + Math.min(a.bottom, best.b.bottom)) * 0.5;
        const notchRadius = minEdge * (0.22 - eased * 0.05);
        const notchOffset = minEdge * 0.5 + notchRadius * 0.36;
        const setNotch = (node, direction) => {
            node.setAttribute('cx', (jointX + normalX * notchOffset * direction - originX).toFixed(2));
            node.setAttribute('cy', (jointY + normalY * notchOffset * direction - originY).toFixed(2));
            node.setAttribute('r', notchRadius.toFixed(2));
        };
        setNotch(notchNegative, -1);
        setNotch(notchPositive, 1);

        materialGradient.setAttribute('x1', (acx - originX).toFixed(2));
        materialGradient.setAttribute('y1', (acy - originY).toFixed(2));
        materialGradient.setAttribute('x2', (best.bcx - originX).toFixed(2));
        materialGradient.setAttribute('y2', (best.bcy - originY).toFixed(2));
        materialStops[0].setAttribute('offset', '0');
        materialStops[1].setAttribute('offset', (mixStart / 100).toFixed(3));
        materialStops[2].setAttribute('offset', (mixEnd / 100).toFixed(3));
        materialStops[3].setAttribute('offset', '1');
        setStopColor(materialStops[0], colorA);
        setStopColor(materialStops[1], colorA);
        setStopColor(materialStops[2], colorB);
        setStopColor(materialStops[3], colorB);
        materialGroup.style.filter = 'none';
        union.classList.toggle('has-selected-member', hasSelectedMember);

        union.style.opacity = (0.86 + eased * 0.14).toFixed(3);
        union.classList.add('is-visible');
        return true;
    }

    function ensureLoop() {
        if (!frameId) frameId = requestAnimationFrame(runFrame);
    }

    function runFrame(now) {
        frameId = 0;
        tracked.forEach((until, surface) => {
            if (!surface.isConnected || (until !== Infinity && now >= until)) {
                clearEdge(surface);
                tracked.delete(surface);
                return;
            }
        });

        if (activeSurface && tracked.has(activeSurface)) {
            updateLens(activeSurface);
        } else {
            hideLens();
            activeSurface = null;
        }

        if (tracked.size || union.classList.contains('is-visible')) ensureLoop();
    }

    document.addEventListener('pointerover', event => {
        const surface = surfaceFrom(event.target);
        if (!surface || (event.relatedTarget instanceof Node && surface.contains(event.relatedTarget))) return;
        if (hoverSurface && hoverSurface !== surface && hoverSurface !== activeSurface) {
            tracked.set(hoverSurface, performance.now() + 420);
        }
        hoverSurface = surface;
        tracked.set(surface, Infinity);
        ensureLoop();
    }, true);

    document.addEventListener('pointerout', event => {
        const surface = surfaceFrom(event.target);
        if (!surface || (event.relatedTarget instanceof Node && surface.contains(event.relatedTarget))) return;
        if (hoverSurface === surface) hoverSurface = null;
        if (surface !== activeSurface || !pointerIsDown) {
            tracked.set(surface, performance.now() + 520);
        }
        ensureLoop();
    }, true);

    document.addEventListener('pointerdown', event => {
        if (event.button !== undefined && event.button !== 0) return;
        const surface = surfaceFrom(event.target);
        if (!surface) return;
        activeSurface = surface;
        activePointerId = event.pointerId;
        pointerIsDown = true;
        pointerStartX = Number.isFinite(event.clientX) ? event.clientX : 0;
        pointerStartY = Number.isFinite(event.clientY) ? event.clientY : 0;
        dragLightSuppressed = false;
        tracked.set(surface, Infinity);
        ensureLoop();
    }, true);

    document.addEventListener('pointermove', event => {
        if (!pointerIsDown || !activeSurface || dragLightSuppressed) return;
        if (event.pointerId !== undefined && activePointerId !== null && event.pointerId !== activePointerId) return;
        const x = Number.isFinite(event.clientX) ? event.clientX : pointerStartX;
        const y = Number.isFinite(event.clientY) ? event.clientY : pointerStartY;
        if (Math.hypot(x - pointerStartX, y - pointerStartY) < 2.5) return;
        dragLightSuppressed = true;
        activeSurface.classList.add('account-gender-drag-no-top-light');
    }, true);

    function release(event) {
        if (!activeSurface) return;
        if (event?.pointerId !== undefined && activePointerId !== null && event.pointerId !== activePointerId) return;
        const releasedSurface = activeSurface;
        pointerIsDown = false;
        activePointerId = null;
        releasedSurface.classList.remove('account-gender-drag-no-top-light');
        dragLightSuppressed = false;
        /* Keep only the fusion geometry alive for the liquid return tail. Text
           now follows the surface directly, exactly as in Account. */
        tracked.set(releasedSurface, performance.now() + 430);
        ensureLoop();
    }

    document.addEventListener('pointerup', release, true);
    document.addEventListener('pointercancel', release, true);
    window.addEventListener('blur', () => {
        pointerIsDown = false;
        activePointerId = null;
        dragLightSuppressed = false;
        tracked.forEach((_, surface) => {
            surface.classList.remove('account-gender-drag-no-top-light');
            clearEdge(surface);
        });
        tracked.clear();
        hoverSurface = null;
        activeSurface = null;
        hideLens();
    });
})();
</script>
</body>
</html>
