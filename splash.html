<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>启动</title>
<style>
/* ================== 全局与色彩体系 ================== */
:root {
    --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    
    /* 贴合 PNG 图标边缘的多层半透明白色贴纸描边体系 (严格参考 TaskHub.html custom alarm 样式) */
    --logo-filter: 
        drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.90)) 
        drop-shadow(0 0 3.5px rgba(255, 255, 255, 0.75)) 
        drop-shadow(0 0 6.5px rgba(255, 255, 255, 0.45)) 
        drop-shadow(0 8px 18px rgba(15, 23, 42, 0.14));
}

@media (prefers-color-scheme: dark) {
    :root {
        --logo-filter: 
            drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.85)) 
            drop-shadow(0 0 3.5px rgba(255, 255, 255, 0.65)) 
            drop-shadow(0 0 6.5px rgba(255, 255, 255, 0.35)) 
            drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
    }
}

*, *::before, *::after {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    /* 窗口全透明, 完整呈现系统原生的 Tabbed / Mica 材质 */
    background-color: transparent; 
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ================== 迎风飘扬的 Logo 容器与退场隔离层 ================== */
.exit-wrapper {
    opacity: 0;
    animation: logoFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
    transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                filter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: transform, opacity, filter;
    display: flex;
    justify-content: center;
    align-items: center;
}

@keyframes logoFadeIn {
    0% {
        opacity: 0;
        transform: scale(0.92) translateY(6px);
    }
    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

.logo-container {
    position: relative;
    height: 50px;
    animation: flutter 4s ease-in-out infinite;
    will-change: transform;
}

.logo-img {
    height: 100%;
    width: auto;
    object-fit: contain;
    /* 贴合 PNG 像素轮廓边缘的多级白色半透明描边与投影 */
    filter: var(--logo-filter);
    display: block;
}

/* ================== 模拟阳光拂过 ================== */
.light-sweep {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(
        135deg, 
        transparent 35%, 
        rgba(255, 245, 220, 0.65) 50%, 
        transparent 65%
    );
    background-size: 250% 250%;
    animation: sweep 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    mask-image: url('./Icon.png');
    -webkit-mask-image: url('./Icon.png');
    mask-size: contain;
    -webkit-mask-size: contain;
    mask-position: center;
    -webkit-mask-position: center;
    mask-repeat: no-repeat;
    -webkit-mask-repeat: no-repeat;
    pointer-events: none;
    z-index: 2;
}

/* ================== 关键帧动效 ================== */
@keyframes flutter {
    0% { transform: scale(1) rotate(0deg) translateY(0px); }
    50% { transform: scale(1.03) rotate(0.8deg) translateY(-3px); }
    100% { transform: scale(1) rotate(0deg) translateY(0px); }
}
@keyframes sweep {
    0% { background-position: 150% 150%; }
    100% { background-position: -50% -50%; }
}

/* ================== 退场状态类 ================== */
.exit-state .exit-wrapper {
    opacity: 0;
    transform: scale(0.85) translateY(45px); /* 沉入水底的效果, 向下沉降并轻微缩小 */
    filter: blur(28px) saturate(0.2) contrast(0.85); /* 水中晕染溶解 */
}

.exit-state .logo-container {
    animation-play-state: paused !important;
}
</style>
</head>
<body>
    <div class="exit-wrapper">
        <div class="logo-container">
            <img src="./Icon.png" class="logo-img" alt="Tasks Logo" />
            <div class="light-sweep"></div>
        </div>
    </div>

<script>
    // 监听主界面 wrapper.html 下达的退场指令
    window.addEventListener('message', (event) => {
        if (event.data === 'start-exit') {
            document.body.classList.add('exit-state');
        }
    });

    // 禁止通过 F11 快捷键切换全屏
    window.addEventListener('keydown', (e) => {
        if (e.key === 'F11' || e.keyCode === 122 || e.code === 'F11') {
            e.preventDefault();
            e.stopPropagation();
        }
    }, true);
</script>
</body>
</html>
